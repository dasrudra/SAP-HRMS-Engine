<!--
  App.html — all browser-side JavaScript.

  Remember the two worlds: nothing in this file can touch a spreadsheet. When it
  needs data it asks the server through google.script.run, and the server
  replies by calling the success handler.

  This file reads the .xlsx files, works out which report each one is,
  normalises every row, merges them, sends them up in batches, and draws every
  screen. Parsing happens here rather than on the server because a 20,000-row
  workbook would run straight into Apps Script's 6-minute execution ceiling.
-->

<!--
  SheetJS reads .xlsx in the browser. Pinned to an exact version on purpose —
  "latest" means your app can break overnight because someone else shipped.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- Chart.js, pinned for the same reason as SheetJS. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<script>
(function () {
  'use strict';

  /** Everything the page currently knows. The single source of truth. */
  const state = {
    view: 'kpi1',
    month: null,
    boot: null,
    kpi: null,        // the month on screen, kept so filters redraw without a
                      // server call
    compare: null,
    busy: false,

    // TRUE once a comparison has actually been run, so a refresh knows to
    // re-run it instead of dropping you on an empty panel.
    compareRan: false,

    // Filter values read back from the URL before the dropdowns they belong to
    // exist. Applied once the data lands and the options are built.
    pending: null,
    restoring: false
  };

  const BATCH_SIZE = 400;
  const DETAILS_LIMIT = 300;
  const MAX_COMPARE = 4;


  // =========================================================================
  // STARTUP
  // =========================================================================

  document.addEventListener('DOMContentLoaded', function () {
    wireSidebar();
    wireNavigation();
    wireFilters();
    wireCompare();
    wireUploads();

    google.script.run
      .withSuccessHandler(onBootstrap)
      .withFailureHandler(onError)
      .getBootstrap();
  });


  function onBootstrap(boot) {
    state.boot = boot;
    hide('loader');

    if (!boot.configured) {
      show('notConfigured');
      return;
    }

    fillMonthPicker(boot.availableMonths);
    fillCompareMonths(boot.availableMonths);
    fillSettings(boot);

    restoreState(function () {
      showView(state.view, { skipSave: true });
    });
  }


  function onError(err) {
    hide('loader');
    document.getElementById('errorText').textContent =
      (err && err.message) ? err.message : String(err);
    show('errorBox');
    setLive(false);
  }


  /**
   * Wraps google.script.run in a Promise.
   *
   * The native API is callback-based, which gets unreadable once you need
   * twenty batches strictly in order. Promises let that be a loop with `await`.
   */
  function callServer(fnName) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject);
      runner[fnName].apply(runner, args);
    });
  }


  // =========================================================================
  // SIDEBAR
  // =========================================================================

  function wireSidebar() {
    const button = document.getElementById('collapseBtn');
    const root = document.getElementById('appRoot');
    if (!button || !root) return;

    // Remember the choice per browser, so it survives a refresh.
    try {
      if (localStorage.getItem('easSidebar') === 'collapsed') {
        root.classList.add('is-collapsed');
      }
    } catch (e) { /* storage blocked — start expanded */ }

    button.addEventListener('click', function () {
      const collapsed = root.classList.toggle('is-collapsed');
      button.title = collapsed ? 'Expand sidebar' : 'Minimise sidebar';
      try {
        localStorage.setItem('easSidebar', collapsed ? 'collapsed' : 'expanded');
      } catch (e) { /* not fatal */ }
    });
  }


  // =========================================================================
  // NAVIGATION
  // =========================================================================

  function wireNavigation() {
    document.querySelectorAll('.nav-item').forEach(function (button) {
      button.addEventListener('click', function () {
        showView(button.dataset.view);
      });
    });

    const picker = document.getElementById('monthPicker');
    if (picker) {
      picker.addEventListener('change', function () {
        state.month = picker.value;
        saveState();
        loadKpi1();
      });
    }

    const refresh = document.getElementById('refreshKpi1');
    if (refresh) refresh.addEventListener('click', function () { loadKpi1(); });
  }


  function showView(name, options) {
    options = options || {};
    if (!document.getElementById('view-' + name)) name = 'kpi1';

    document.querySelectorAll('.view').forEach(function (el) { el.hidden = true; });
    const target = document.getElementById('view-' + name);
    if (target) target.hidden = false;

    document.querySelectorAll('.nav-item').forEach(function (button) {
      button.classList.toggle('is-active', button.dataset.view === name);
    });

    const labels = {
      kpi1: 'KPI 1 · ITSM',
      kpi2: 'KPI 2 · Training',
      compare: 'Comparison',
      uploads: 'Data Uploads',
      settings: 'Settings'
    };
    document.getElementById('viewLabel').textContent = labels[name] || name;

    state.view = name;
    if (!options.skipSave) saveState();

    if (name === 'kpi1') loadKpi1();
    if (name === 'uploads') loadUploads();

    // A comparison that was on screen before the refresh gets rebuilt. Guarded
    // on state.compare being empty so this costs a server call once and not
    // every time you tab back — the rendered tables are still in the DOM,
    // hidden rather than destroyed.
    if (name === 'compare' && state.compareRan && !state.compare) runComparison();
  }


  // =========================================================================
  // STATE PERSISTENCE  —  the refresh fix
  // =========================================================================

  /**
   * Everything a refresh has to survive.
   *
   * Persisting only the view and month was not enough: filters and the
   * comparison selection live in the same throwaway browser memory, so a
   * reload silently reset them — the exact complaint the whole URL-state
   * mechanism exists to prevent.
   */
  const TRACKED_CONTROLS = [
    'fSection', 'fDelayPerson', 'fDelayName', 'fAllPerson', 'fAllName',
    'cmpKpi', 'cmpM1', 'cmpM2', 'cmpM3', 'cmpM4'
  ];

  function saveState() {
    if (state.restoring) return;      // don't overwrite what we're restoring

    const params = { view: state.view };
    if (state.month) params.month = state.month;

    TRACKED_CONTROLS.forEach(function (id) {
      // A control belonging to a screen that has not been drawn yet reads back
      // as empty, but its restored value is still waiting in state.pending.
      // Without this fallback, saving from the comparison screen would quietly
      // wipe the KPI 1 filters before KPI 1 ever had a chance to apply them.
      const value = getValue(id) || (state.pending && state.pending[id]) || '';
      if (value) params[id] = value;  // omit empties to keep the URL short
    });

    if (state.compareRan) params.ran = '1';

    try {
      if (window.google && google.script && google.script.history) {
        google.script.history.replace(null, params);
      }
    } catch (e) { /* iframe restrictions — fall through to storage */ }

    try {
      sessionStorage.setItem('easKpiState', JSON.stringify(params));
    } catch (e) { /* private mode or blocked storage — not fatal */ }
  }


  /**
   * Puts saved values back into controls, once those controls exist.
   *
   * Split out because the two groups of controls become ready at different
   * times. The comparison dropdowns are filled from the bootstrap, so they can
   * be restored immediately; the section and individual dropdowns are built
   * from the selected month's tickets, which have not arrived yet.
   *
   * Each id is CONSUMED on the way through. Restoring is a one-time event —
   * leaving the values in state.pending would make an old filter reappear
   * every time the month changed.
   *
   * @param {string[]} ids  control ids to restore
   */
  function applyPendingTo(ids) {
    if (!state.pending) return;

    ids.forEach(function (id) {
      const saved = state.pending[id];
      if (saved === undefined) return;
      delete state.pending[id];

      const el = document.getElementById(id);
      if (!el) return;

      // A <select> silently refuses a value it has no <option> for and lands
      // on ''. That is the correct outcome: the month now on screen simply has
      // no such section or person, so the table falls back to showing all.
      el.value = saved;
    });

    const outstanding = TRACKED_CONTROLS.some(function (id) {
      return state.pending[id] !== undefined;
    });
    if (!outstanding) state.pending = null;
  }


  function restoreState(done) {
    let settled = false;

    function finish(params) {
      if (settled) return;
      settled = true;

      // Writing to a control does not fire its change event, but the callers
      // further down this chain do save. Hold them off until we are done, or
      // a half-restored page would overwrite the state we are reading.
      state.restoring = true;

      if (params) {
        if (params.view) state.view = params.view;
        if (params.month) {
          state.month = params.month;
          const picker = document.getElementById('monthPicker');
          if (picker) picker.value = params.month;
        }
        state.compareRan = params.ran === '1';

        // The section and individual dropdowns are not populated yet — their
        // options come from the month's data. Hold those until renderKpi1 has
        // built them; the comparison dropdowns are ready now.
        state.pending = params;
        applyPendingTo(['cmpKpi', 'cmpM1', 'cmpM2', 'cmpM3', 'cmpM4']);
      }

      state.restoring = false;
      done();
    }

    try {
      if (window.google && google.script && google.script.url) {
        google.script.url.getLocation(function (location) {
          const p = (location && location.parameter) || {};
          if (p.view || p.month) return finish(p);
          finish(readStorage());
        });
        setTimeout(function () { finish(readStorage()); }, 1500);
        return;
      }
    } catch (e) { /* fall through */ }

    finish(readStorage());
  }


  function readStorage() {
    try {
      const raw = sessionStorage.getItem('easKpiState');
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }


  // =========================================================================
  // READING .xlsx FILES
  // =========================================================================

  function readWorkbook(file) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();

      reader.onerror = function () {
        reject(new Error('Could not read ' + file.name));
      };

      reader.onload = function (event) {
        try {
          const workbook = XLSX.read(new Uint8Array(event.target.result), { type: 'array' });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];

          // header:1 gives arrays instead of objects. The two reports order
          // their columns differently, so we map by header NAME, never index.
          const grid = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', blankrows: false });
          if (!grid.length) throw new Error(file.name + ' looks empty');

          resolve({
            fileName: file.name,
            headers: grid[0].map(function (h) { return String(h == null ? '' : h).trim(); }),
            rows: grid.slice(1)
          });
        } catch (err) {
          reject(new Error(file.name + ': ' + err.message));
        }
      };

      reader.readAsArrayBuffer(file);
    });
  }


  /**
   * Which of the two ITSM reports is this?
   *
   * The Personal Performance export carries three man-hour columns the
   * Service/Part export does not. That structural test beats trusting a
   * filename somebody might rename.
   */
  function detectReportType(headers) {
    return headers.indexOf('Man*Hour') !== -1 ? 'INDIVIDUAL' : 'OVERALL';
  }


  /** Which EAS section, judged from the filename. */
  function detectSection(fileName) {
    const lower = String(fileName).toLowerCase();
    const sections = (state.boot && state.boot.departments) || [];
    for (let i = 0; i < sections.length; i++) {
      if (lower.indexOf(sections[i].match) !== -1) return sections[i].name;
    }
    return '';
  }


  function normalizeRows(file, type, section) {
    const columns = state.boot.ticketColumns;

    const position = {};
    file.headers.forEach(function (name, i) {
      if (name && position[name] === undefined) position[name] = i;
    });

    const idIndex = position['Ticket ID'];
    if (idIndex === undefined) {
      throw new Error(file.fileName + ' has no "Ticket ID" column — is it an ITSM export?');
    }

    const out = [];

    file.rows.forEach(function (raw) {
      const ticketId = String(raw[idIndex] == null ? '' : raw[idIndex]).trim();
      if (!ticketId) return;

      const row = columns.map(function (columnName) {
        switch (columnName) {
          case 'Department':        return type === 'INDIVIDUAL' ? section : '';
          case 'In Overall Report': return type === 'OVERALL';
          case 'In Dept Report':    return type === 'INDIVIDUAL';
          case 'Source Files':      return file.fileName;
          case 'Last Updated':      return '';
        }

        const at = position[columnName];
        if (at === undefined) return '';

        let value = raw[at];
        if (value === null || value === undefined) return '';

        if (columnName === 'Details') {
          value = String(value);
          return value.length > DETAILS_LIMIT ? value.slice(0, DETAILS_LIMIT) + '…' : value;
        }
        if (value instanceof Date) return formatDate(value);

        return typeof value === 'number' ? value : String(value);
      });

      out.push(row);
    });

    return out;
  }


  function mergeFiles(perFile, columns) {
    const idAt        = columns.indexOf('Ticket ID');
    const overallAt   = columns.indexOf('In Overall Report');
    const deptAt      = columns.indexOf('In Dept Report');
    const sourceAt    = columns.indexOf('Source Files');
    const sectionAt   = columns.indexOf('Department');

    const byId = {};
    const order = [];

    perFile.forEach(function (rows) {
      rows.forEach(function (row) {
        const id = row[idAt];

        if (!byId[id]) {
          byId[id] = row.slice();
          order.push(id);
          return;
        }

        const kept = byId[id];

        for (let i = 0; i < columns.length; i++) {
          if (i === overallAt || i === deptAt || i === sourceAt) continue;
          if (isBlank(kept[i]) && !isBlank(row[i])) kept[i] = row[i];
        }

        // A ticket can legitimately appear in both reports. OR the flags so
        // the ones appearing in only one stay countable.
        kept[overallAt] = Boolean(kept[overallAt]) || Boolean(row[overallAt]);
        kept[deptAt]    = Boolean(kept[deptAt])    || Boolean(row[deptAt]);

        // A section export is authoritative about which section owns it.
        if (isBlank(kept[sectionAt]) && !isBlank(row[sectionAt])) {
          kept[sectionAt] = row[sectionAt];
        }

        const sources = String(kept[sourceAt] || '').split(' | ')
          .concat(String(row[sourceAt] || '').split(' | '))
          .filter(function (s) { return s.trim() !== ''; });
        kept[sourceAt] = sources.filter(function (s, i) {
          return sources.indexOf(s) === i;
        }).join(' | ');
      });
    });

    return order.map(function (id) { return byId[id]; });
  }


  // =========================================================================
  // UPLOADING
  // =========================================================================

  function wireUploads() {
    const zone = document.getElementById('dropzone');
    const input = document.getElementById('fileInput');
    if (!zone || !input) return;

    zone.addEventListener('click', function () { if (!state.busy) input.click(); });

    ['dragenter', 'dragover'].forEach(function (type) {
      zone.addEventListener(type, function (event) {
        event.preventDefault();
        if (!state.busy) zone.classList.add('is-over');
      });
    });

    ['dragleave', 'drop'].forEach(function (type) {
      zone.addEventListener(type, function (event) {
        event.preventDefault();
        zone.classList.remove('is-over');
      });
    });

    zone.addEventListener('drop', function (event) {
      if (!state.busy) handleFiles(event.dataTransfer.files);
    });

    input.addEventListener('change', function () {
      if (!state.busy) handleFiles(input.files);
      input.value = '';
    });
  }


  function handleFiles(fileList) {
    if (!fileList || !fileList.length) return;
    if (!state.boot || !state.boot.configured) {
      return setStatus('The database is not connected yet.', 'error');
    }

    const files = Array.prototype.slice.call(fileList).filter(function (f) {
      return /\.xlsx$/i.test(f.name);
    });

    if (!files.length) return setStatus('No .xlsx files in that selection.', 'error');

    state.busy = true;
    runUpload(files)
      .catch(function (err) {
        setStatus('Upload failed: ' + (err && err.message ? err.message : err), 'error');
      })
      .then(function () { state.busy = false; });
  }


  async function runUpload(files) {
    const columns = state.boot.ticketColumns;

    setStatus('Reading ' + files.length + ' file(s)…');

    const perFile = [];
    const meta = { fileNames: [], reportTypes: [], departments: [], totalRows: 0 };
    const summary = [];

    for (let i = 0; i < files.length; i++) {
      const parsed = await readWorkbook(files[i]);
      const type = detectReportType(parsed.headers);
      const section = type === 'INDIVIDUAL' ? detectSection(parsed.fileName) : '';

      if (type === 'INDIVIDUAL' && !section) {
        throw new Error('Cannot tell which section "' + parsed.fileName +
                        '" belongs to. Expected the section name in the filename.');
      }

      const rows = normalizeRows(parsed, type, section);
      perFile.push(rows);

      meta.fileNames.push(parsed.fileName);
      meta.reportTypes.push(type);
      if (section) meta.departments.push(section);
      meta.totalRows += rows.length;

      summary.push({ name: parsed.fileName, type: type, dept: section, rows: rows.length });
      setStatus('Read ' + (i + 1) + ' of ' + files.length + ' file(s)…', null, summary);
    }

    const merged = mergeFiles(perFile, columns);

    const dateAt = columns.indexOf('Request Date');
    const dates = merged.map(function (r) { return String(r[dateAt] || '').slice(0, 10); })
                        .filter(Boolean).sort();
    meta.dateFrom = dates[0] || '';
    meta.dateTo = dates[dates.length - 1] || '';

    setStatus('Merged ' + meta.totalRows + ' rows into ' + merged.length +
              ' unique tickets (' + meta.dateFrom + ' to ' + meta.dateTo + '). Uploading…',
              null, summary);

    const begun = await callServer('beginUpload', meta);

    for (let start = 0; start < merged.length; start += BATCH_SIZE) {
      await callServer('appendTicketBatch', begun.uploadId, merged.slice(start, start + BATCH_SIZE));
      const done = Math.min(start + BATCH_SIZE, merged.length);
      setStatus('Uploading… ' + done + ' of ' + merged.length + ' tickets (' +
                Math.round((done / merged.length) * 100) + '%)', null, summary);
    }

    setStatus('Consolidating and recomputing KPI figures…', null, summary);
    const result = await callServer('finishUpload', begun.uploadId);

    setStatus('Done. ' + result.kept + ' tickets stored' +
              (result.merged ? ', ' + result.merged + ' duplicate rows collapsed' : '') + '.',
              'ok', summary);

    await refreshAfterChange();
  }


  /** Re-reads what exists after any change to the stored data. */
  async function refreshAfterChange() {
    const boot = await callServer('getBootstrap');
    state.boot = boot;
    fillMonthPicker(boot.availableMonths);
    fillCompareMonths(boot.availableMonths);
    fillSettings(boot);
    loadUploads();
    if (state.view === 'kpi1') loadKpi1();
  }


  function setStatus(message, kind, files) {
    const box = document.getElementById('uploadStatus');
    if (!box) return;

    box.hidden = false;

    let colour = 'var(--text-dim)';
    if (kind === 'error') colour = 'var(--red)';
    if (kind === 'ok') colour = 'var(--green)';

    let html = '<strong style="color:' + colour + '">' + escapeHtml(message) + '</strong>';

    if (files && files.length) {
      html += '<div style="margin-top:8px" class="muted">';
      files.forEach(function (f) {
        html += escapeHtml(f.name) + ' — ' + f.type +
                (f.dept ? ' · ' + escapeHtml(f.dept) : '') + ' · ' + f.rows + ' rows<br>';
      });
      html += '</div>';
    }

    box.innerHTML = html;
  }


  function loadUploads() {
    if (!state.boot || !state.boot.configured) return;

    callServer('getUploadHistory').then(function (history) {
      const body = document.querySelector('#uploadTable tbody');
      if (!body) return;

      if (!history || !history.length) {
        body.innerHTML = '<tr><td colspan="8" class="empty">Nothing uploaded yet.</td></tr>';
        return;
      }

      body.innerHTML = '';
      history.forEach(function (h) {
        const deleted = /^deleted/.test(h.notes || '');
        const tr = document.createElement('tr');

        tr.innerHTML =
          '<td>' + escapeHtml(String(h.uploadedAt).slice(0, 16).replace('T', ' ')) + '</td>' +
          '<td style="max-width:340px">' + escapeHtml(h.fileName) + '</td>' +
          '<td>' + escapeHtml(h.reportType) + '</td>' +
          '<td>' + escapeHtml(h.department) + '</td>' +
          '<td class="r">' + h.rowsInFile + '</td>' +
          '<td class="r">' + h.rowsKept + '</td>' +
          '<td>' + escapeHtml(h.dateFrom + ' → ' + h.dateTo) + '</td>' +
          '<td>' + (deleted
            ? '<span class="pill a">' + escapeHtml(h.notes) + '</span>'
            : rowActions(h.uploadId)) + '</td>';

        body.appendChild(tr);
      });

      wireRowActions();
    }).catch(onError);
  }


  function rowActions(uploadId) {
    const id = escapeHtml(uploadId);
    return '<div class="row-actions">' +
      '<button class="btn-open" data-open="' + id + '">Open Dashboard</button>' +
      '<button class="btn-icon is-primary" data-download="' + id + '" title="Download CSV">' +
        '<svg viewBox="0 0 16 16"><path d="M8 2v8M5 7l3 3 3-3M3 13h10"/></svg></button>' +
      '<button class="btn-icon is-danger" data-delete="' + id + '" title="Delete this upload">' +
        '<svg viewBox="0 0 16 16"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.6 9.5h6.8L12 4"/></svg></button>' +
      '</div>';
  }


  function wireRowActions() {
    document.querySelectorAll('[data-open]').forEach(function (button) {
      button.addEventListener('click', function () {
        const row = button.closest('tr');
        // The range cell holds 'YYYY-MM-DD → YYYY-MM-DD'; its first seven
        // characters are the month this upload covers.
        const range = row ? row.children[6].textContent.trim() : '';
        const month = range.slice(0, 7);
        if (month && /^\d{4}-\d{2}$/.test(month)) {
          state.month = month;
          syncMonthPicker();
        }
        showView('kpi1');
      });
    });

    document.querySelectorAll('[data-download]').forEach(function (button) {
      button.addEventListener('click', function () {
        button.disabled = true;
        callServer('getUploadCsv', button.dataset.download)
          .then(function (file) {
            downloadText(file.fileName, file.csv);
            button.disabled = false;
          })
          .catch(function (err) {
            button.disabled = false;
            onError(err);
          });
      });
    });

    document.querySelectorAll('[data-delete]').forEach(function (button) {
      button.addEventListener('click', function () {
        const id = button.dataset.delete;
        if (!window.confirm(
              'Delete upload ' + id + '?\n\n' +
              'Tickets that came only from this upload are removed. Tickets ' +
              'another upload also supplied are kept. The log entry stays as ' +
              'audit evidence.')) return;

        button.disabled = true;
        callServer('deleteUpload', id)
          .then(function (result) {
            setStatus('Deleted ' + id + ' — ' + result.removed +
                      ' tickets removed, ' + result.kept + ' kept.', 'ok');
            return refreshAfterChange();
          })
          .catch(function (err) {
            button.disabled = false;
            onError(err);
          });
      });
    });
  }


  /**
   * Hands the browser a file to save.
   *
   * A Blob URL rather than a data: URI — data: URIs have length limits that a
   * few thousand ticket rows would blow straight past.
   */
  function downloadText(fileName, text) {
    try {
      const blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) {
      window.alert('Could not start the download: ' + e.message);
    }
  }


  // =========================================================================
  // KPI 1
  // =========================================================================

  function fillMonthPicker(months) {
    const picker = document.getElementById('monthPicker');
    if (!picker) return;

    if (!months || !months.length) {
      picker.innerHTML = '<option value="">No data loaded</option>';
      picker.disabled = true;
      return;
    }

    if (!state.month || months.indexOf(state.month) === -1) state.month = months[0];

    picker.innerHTML = '';
    picker.disabled = false;
    months.forEach(function (month) {
      const option = document.createElement('option');
      option.value = month;
      option.textContent = formatMonth(month);
      picker.appendChild(option);
    });
    picker.value = state.month;
  }


  function syncMonthPicker() {
    const picker = document.getElementById('monthPicker');
    if (picker && picker.value !== state.month) picker.value = state.month;
    saveState();
  }


  function loadKpi1() {
    if (!state.boot || !state.boot.configured || !state.month) return;
    callServer('getKpi1', state.month).then(renderKpi1).catch(onError);
  }


  function renderKpi1(k) {
    state.kpi = k;

    const basisBox = document.getElementById('kpi1Basis');
    const hero = document.getElementById('kpi1Hero');

    if (!k || !k.hasData) {
      basisBox.hidden = true;
      hero.innerHTML = '<div class="hero-empty">No data for this month</div>';
      hero.style.removeProperty('--hero-accent');
      emptyTable('#kpi1Table tbody', 9, 'Upload an ITSM export to see results.');
      emptyTable('#kpi1People tbody', 7, 'Nothing to show yet.');
      emptyTable('#kpi1AllPeople tbody', 8, 'Nothing to show yet.');
      fillSectionFilters([]);
      return;
    }

    renderBasis(k, basisBox);
    renderHero(k, hero);
    drawRateChart(k);
    drawDelayChart(k);
    fillSectionFilters(k.departments);
    fillPersonFilters(k);

    // The options exist now, so a filter saved before the refresh can finally
    // be put back. Has to happen here, between building the dropdowns and
    // drawing the tables — any earlier and the <select> has nothing to match.
    applyPendingTo(['fSection', 'fDelayPerson', 'fDelayName', 'fAllPerson', 'fAllName']);

    applySectionFilter();
    applyDelayFilter();
    applyAllFilter();

    // The settings rings show the selected month's figure, so they follow it.
    updateGaugeCentres();
  }


  /**
   * Warns when the month was scored from the wrong population.
   *
   * There is deliberately NO message for the healthy case. A banner that is on
   * screen every single time gets tuned out within a week, and then the one
   * month it turns into a warning gets tuned out with it. Silence means the
   * scope is right; the panel only speaks when something is off.
   */
  function renderBasis(k, box) {
    if (!k.basis || k.basis.source === 'DEPARTMENT') {
      box.hidden = true;
      return;
    }

    box.hidden = false;
    box.className = 'notice notice-warn';
    box.innerHTML =
      '<h3>Scored from the overall report</h3>' +
      '<p>No section exports loaded for this month, so all ' + k.basis.total +
      ' tickets were counted — including work by individuals outside EAS. ' +
      'Upload the section files for the accurate departmental figure.</p>';
  }


  /**
   * The hero panel.
   *
   * One large figure, because there is one question: did the month clear the
   * target? Six equal tiles gave "Received" the same visual weight as the rate
   * the KPI is actually about, so the answer had to be hunted for.
   *
   * The meter underneath is the delay BUDGET, not the rate.
   *
   * A meter of the percentage itself is useless here: every plausible value
   * sits in the last 1% of the scale, so the bar is always full. What the rate
   * cannot say is how close the month came to the edge. At a 99.50% target,
   * 2,640 completed tickets buy exactly 13 delays; August used 11 of them.
   * That is the same fact as "headroom +2", drawn to scale.
   *
   * The arithmetic needs no extra server field: headroom is defined as
   * successful − ceil(target% × completed), so delayed + headroom is the
   * permitted count.
   */
  function renderHero(k, container) {
    const t = k.total;
    const cls = bandClass(t.band);

    container.style.setProperty('--hero-accent', bandColour(t.band));

    const allowed = t.delayed + t.headroom;
    const used = t.delayed;
    // Over budget still fills the bar — you cannot use 110% of a track.
    const usedPct = allowed > 0 ? Math.min(100, (used / allowed) * 100)
                                : (used > 0 ? 100 : 0);

    let budgetNote;
    if (allowed <= 0) {
      budgetNote = 'This month is too small for any delay to be permitted at ' +
                   k.target + '%.';
    } else if (t.headroom > 0) {
      budgetNote = used + ' of ' + allowed + ' permitted delay' +
                   (allowed === 1 ? '' : 's') + ' used';
    } else if (t.headroom === 0) {
      budgetNote = 'all ' + allowed + ' permitted delay' +
                   (allowed === 1 ? '' : 's') + ' used — on the edge';
    } else {
      budgetNote = used + ' delays against ' + allowed + ' permitted — ' +
                   Math.abs(t.headroom) + ' over';
    }

    let headroomNote;
    if (t.headroom > 0) {
      headroomNote = t.headroom + ' more delay' + (t.headroom === 1 ? '' : 's') +
                     ' before the band drops';
    } else if (t.headroom === 0) {
      headroomNote = 'on the edge — one more delay drops the band';
    } else {
      headroomNote = Math.abs(t.headroom) + ' fewer delays needed to reach target';
    }

    const gap = round2(t.rate - k.target);
    const gapText = gap >= 0
      ? '+' + fmt(gap) + ' points above target'
      : fmt(Math.abs(gap)) + ' points below target';

    container.innerHTML =
      '<div class="hero-main">' +
        '<div class="hero-label">Actual success rate · ' +
          escapeHtml(formatMonth(k.month || state.month || '')) + '</div>' +
        '<div class="hero-figure-row">' +
          '<span class="hero-figure">' + fmt(t.rate) + '%</span>' +
          '<span class="chip ' + cls + '">' + escapeHtml(t.band) + '</span>' +
        '</div>' +
        '<p class="hero-sub"><b>' + fmt(t.achievement) + '%</b> KPI achievement · ' +
          escapeHtml(gapText) + '</p>' +

        '<div class="meter">' +
          '<div class="meter-head">' +
            '<span>Delay budget</span>' +
            '<span>' + escapeHtml(budgetNote) + '</span>' +
          '</div>' +
          '<div class="meter-track">' +
            '<div class="meter-fill" style="width:' + usedPct.toFixed(2) + '%"></div>' +
          '</div>' +
          '<div class="meter-scale">' +
            '<span>0 delays</span>' +
            '<span>' + (allowed > 0 ? allowed + ' permitted at ' + k.target + '%' : '') + '</span>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="hero-side">' +
        heroCell('Headroom', (t.headroom > 0 ? '+' : '') + t.headroom, headroomNote,
                 t.headroom > 0 ? 'g' : (t.headroom === 0 ? 'a' : 'r')) +
        heroCell('Delayed', t.delayed,
                 t.successful + ' completed on time', t.delayed ? 'a' : 'g') +
        heroCell('Completed', t.completed,
                 Math.max(0, t.received - t.completed) + ' still open', '') +
        heroCell('Received', t.received, 'tickets this month', '') +
      '</div>';
  }


  function heroCell(label, value, note, cls) {
    return '<div class="hero-cell">' +
             '<div class="k">' + escapeHtml(label) + '</div>' +
             '<div class="v' + (cls ? ' ' + cls : '') + '">' + value + '</div>' +
             '<div class="n">' + escapeHtml(note) + '</div>' +
           '</div>';
  }


  // ---- filters: each table owns its own ----

  /**
   * Every handler here redraws its table AND saves.
   *
   * The save is what makes a filter survive refresh. applySectionFilter and
   * friends deliberately do NOT save themselves — they are also called during
   * restore and after every render, and saving from there would write the
   * state back before it had finished being read.
   */
  function wireFilters() {
    bind('fSection', 'change', function () { applySectionFilter(); saveState(); });
    bind('fSectionReset', 'click', function () {
      setValue('fSection', ''); applySectionFilter(); saveState();
    });

    bind('fDelayPerson', 'change', function () { applyDelayFilter(); saveState(); });
    bind('fDelayName', 'input', function () { applyDelayFilter(); saveState(); });
    bind('fDelayReset', 'click', function () {
      setValue('fDelayPerson', ''); setValue('fDelayName', '');
      applyDelayFilter(); saveState();
    });

    bind('fAllPerson', 'change', function () { applyAllFilter(); saveState(); });
    bind('fAllName', 'input', function () { applyAllFilter(); saveState(); });
    bind('fAllReset', 'click', function () {
      setValue('fAllPerson', ''); setValue('fAllName', '');
      applyAllFilter(); saveState();
    });
  }


  /** The section table filters by section. */
  function fillSectionFilters(sections) {
    fillSelect('fSection', 'All sections',
      sections.map(function (s) { return s.name; }));
  }


  /**
   * The two individuals tables filter by individual, so their dropdowns list
   * people — the delays table only the people actually in it, the full table
   * everyone.
   */
  function fillPersonFilters(k) {
    const flagged = k.people
      .filter(function (p) { return p.delayed > 0 || p.band !== 'GREEN'; })
      .map(function (p) { return p.name; })
      .sort();

    const everyone = k.people.map(function (p) { return p.name; }).sort();

    fillSelect('fDelayPerson', 'All individuals', flagged);
    fillSelect('fAllPerson', 'All individuals', everyone);
  }


  /** Rebuilds a dropdown, keeping the current choice when it still exists. */
  function fillSelect(id, allLabel, values) {
    const select = document.getElementById(id);
    if (!select) return;

    const previous = select.value;
    select.innerHTML = '<option value="">' + escapeHtml(allLabel) + '</option>';

    values.forEach(function (value) {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    });

    select.value = previous;
    if (select.value !== previous) select.value = '';
  }


  function applySectionFilter() {
    const k = state.kpi;
    if (!k || !k.hasData) return;

    const useSections = k.departments.length > 0;
    const all = useSections ? k.departments : k.parts;

    document.getElementById('kpi1BreakdownHead').textContent =
      useSections ? 'By section' : 'By service / part';
    document.getElementById('kpi1BreakdownCol').textContent =
      useSections ? 'Section' : 'Service / Part';

    const wanted = getValue('fSection');
    const rows = wanted ? all.filter(function (r) { return r.name === wanted; }) : all;

    setCount('cSection', rows.length, all.length, useSections ? 'sections' : 'parts');

    if (!rows.length) return emptyTable('#kpi1Table tbody', 9, 'No rows match.');

    fillRows('#kpi1Table tbody', rows, function (r) {
      return '<td class="name">' + escapeHtml(r.name) + '</td>' +
             num(r.received) + num(r.completed) + num(r.delayed) + num(r.successful) +
             '<td class="r">' + fmt(r.rate) + '%</td>' +
             '<td class="r">' + fmt(r.achievement) + '%</td>' +
             '<td>' + pill(r.band) + '</td>' +
             '<td class="r">' + (r.headroom > 0 ? '+' : '') + r.headroom + '</td>';
    });
  }


  /**
   * Only individuals with a delay or below target.
   *
   * Listing all 35 would bury the three that matter. In August 2026, 32 of 35
   * finished at 100% with zero delays.
   */
  function applyDelayFilter() {
    const k = state.kpi;
    if (!k || !k.hasData) return;

    const flagged = k.people.filter(function (p) {
      return p.delayed > 0 || p.band !== 'GREEN';
    });

    const rows = filterPeople(flagged, 'fDelayPerson', 'fDelayName')
                   .sort(function (a, b) { return a.rate - b.rate; });

    setCount('cDelay', rows.length, flagged.length, 'individuals');

    if (!rows.length) {
      return emptyTable('#kpi1People tbody', 7,
        flagged.length ? 'No individuals match the filters.'
                       : 'Every individual at or above target, with no delays.');
    }

    fillRows('#kpi1People tbody', rows, function (p) {
      return '<td class="name">' + escapeHtml(p.name) + '</td>' +
             '<td>' + escapeHtml(p.department) + '</td>' +
             num(p.received) + num(p.completed) + num(p.delayed) +
             '<td class="r">' + fmt(p.rate) + '%</td>' +
             '<td>' + pill(p.band) + '</td>';
    });
  }


  /** Everyone, busiest first. */
  function applyAllFilter() {
    const k = state.kpi;
    if (!k || !k.hasData) return;

    const rows = filterPeople(k.people, 'fAllPerson', 'fAllName')
                   .sort(function (a, b) { return b.received - a.received; });

    setCount('cAll', rows.length, k.people.length, 'individuals');

    if (!rows.length) {
      return emptyTable('#kpi1AllPeople tbody', 8, 'No individuals match the filters.');
    }

    fillRows('#kpi1AllPeople tbody', rows, function (p) {
      return '<td class="name">' + escapeHtml(p.name) + '</td>' +
             '<td>' + escapeHtml(p.department) + '</td>' +
             num(p.received) + num(p.completed) + num(p.delayed) + num(p.successful) +
             '<td class="r">' + fmt(p.rate) + '%</td>' +
             '<td>' + pill(p.band) + '</td>';
    });
  }


  /**
   * The dropdown picks one exact individual; the box does partial matching.
   * They AND together, so choosing a name and typing something that does not
   * match it correctly yields nothing.
   */
  function filterPeople(people, personId, nameId) {
    const exact = getValue(personId);
    const term = getValue(nameId).trim().toLowerCase();

    return people.filter(function (p) {
      if (exact && p.name !== exact) return false;
      if (term && p.name.toLowerCase().indexOf(term) === -1) return false;
      return true;
    });
  }


  // =========================================================================
  // CHARTS
  // =========================================================================
  //
  // Two small inline Chart.js plugins rather than pulling in two more CDN
  // dependencies for a target line and value labels.

  /** Draws a solid reference line with a label, e.g. the 99.50% target. */
  const targetLinePlugin = {
    id: 'targetLine',
    afterDatasetsDraw: function (chart, args, opts) {
      if (!opts || typeof opts.value !== 'number') return;
      const y = chart.scales.y;
      if (!y || opts.value < y.min || opts.value > y.max) return;

      const ctx = chart.ctx;
      const at = y.getPixelForValue(opts.value);
      const left = chart.chartArea.left;
      const right = chart.chartArea.right;

      ctx.save();
      ctx.strokeStyle = opts.color || '#1e3a5f';
      ctx.lineWidth = 1.5;                     // solid: dashes read as noise
      ctx.beginPath();
      ctx.moveTo(left, at);
      ctx.lineTo(right, at);
      ctx.stroke();

      if (opts.label) {
        // Drawn in the gutter reserved by layout.padding.right, so the badge
        // can never sit on top of a bar. Overlapping the data would be worse
        // than having no label at all.
        ctx.font = '700 9.5px -apple-system, "Segoe UI", Roboto, sans-serif';
        const width = ctx.measureText(opts.label).width + 14;
        ctx.fillStyle = opts.color || '#1e3a5f';
        ctx.beginPath();
        ctx.roundRect(right + 8, at - 9, width, 18, 9);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(opts.label, right + 8 + width / 2, at);
      }
      ctx.restore();
    }
  };

  /**
   * Prints each value above its bar.
   *
   * Not decoration — the aqua series sits below 3:1 contrast on white, so the
   * palette's relief rule requires visible labels or a table view. We ship both.
   */
  const valueLabelPlugin = {
    id: 'valueLabels',
    afterDatasetsDraw: function (chart, args, opts) {
      if (!opts || !opts.enabled) return;
      const ctx = chart.ctx;
      const decimals = opts.decimals || 0;
      const suffix = opts.suffix || '';

      ctx.save();
      // Text tokens, never the series colour: a label wearing the mark's hue
      // is unreadable the moment that hue is a light one.
      ctx.font = '700 10.5px -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = '#14202e';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';

      chart.data.datasets.forEach(function (dataset, i) {
        const meta = chart.getDatasetMeta(i);
        if (meta.hidden) return;
        meta.data.forEach(function (bar, j) {
          const value = dataset.data[j];
          if (value === null || value === undefined) return;
          ctx.fillText(Number(value).toFixed(decimals) + suffix, bar.x, bar.y - 4);
        });
      });
      ctx.restore();
    }
  };


  const charts = {};

  /** Replaces a chart, destroying the old one so canvases are not leaked. */
  function drawChart(canvasId, config) {
    const canvas = document.getElementById(canvasId);
    if (!canvas || typeof Chart === 'undefined') return;

    if (charts[canvasId]) charts[canvasId].destroy();
    charts[canvasId] = new Chart(canvas.getContext('2d'), config);
  }


  /**
   * Fill colours for chart marks.
   *
   * Yellow is a true yellow here, not the dark amber the text pills use.
   * #b45309 has to be dark enough to read as text on a pale chip; as a large
   * solid fill it just looks brown. A filled arc has no such constraint, and
   * these are the reserved status hues — they always ship with a label, which
   * every chart here does.
   */
  function bandColour(band) {
    if (band === 'GREEN') return '#0ca30c';
    if (band === 'YELLOW') return '#fab219';
    if (band === 'RED') return '#d03b3b';
    return '#8496a8';
  }

  const SERIES = ['#2a78d6', '#eb6834', '#1baf7a', '#4a3aa7'];

  /**
   * Mark specs, applied to every bar in the app.
   *
   * 24px is a cap, not a width: a bar that fills its slot reads as a solid
   * block of colour rather than as a measurement, and four sections across a
   * wide card were rendering 64px slabs. The leftover space is deliberate.
   */
  const BAR = {
    borderRadius: { topLeft: 4, topRight: 4, bottomLeft: 0, bottomRight: 0 },
    borderSkipped: false,
    maxBarThickness: 24
  };

  const AXIS_FONT = { size: 11, family: '-apple-system, "Segoe UI", Roboto, sans-serif' };

  /** Shared axis/grid styling — hairline and recessive, so the data reads first. */
  function gridStyle() {
    return {
      border: { display: false },
      grid: { color: '#eaeff5', drawTicks: false, lineWidth: 1 },
      ticks: { color: '#7b8b9d', font: AXIS_FONT, padding: 8 }
    };
  }

  /** X axis: no grid at all — the bars sit on the baseline, that is enough. */
  function categoryAxis() {
    return {
      border: { display: false },
      grid: { display: false },
      ticks: { color: '#5a6b7d', font: AXIS_FONT, padding: 6 }
    };
  }

  /** Tooltip styling, shared so every chart behaves the same on hover. */
  function tooltipStyle(callbacks) {
    return {
      backgroundColor: '#14202e',
      titleFont: { size: 12, weight: '600' },
      bodyFont: { size: 12 },
      padding: 10,
      cornerRadius: 6,
      displayColors: false,
      callbacks: callbacks
    };
  }


  /**
   * Shows a message in place of a chart.
   *
   * Needed because an axis auto-scaled to all-zero data draws 0.1 … 1.0 ticks
   * for a count that can only be a whole number. It looks broken, and it says
   * nothing — where "no delays at all" is the best news the month has.
   */
  function chartMessage(canvasId, html) {
    const box = document.getElementById(canvasId + 'Empty');
    const canvas = document.getElementById(canvasId);

    if (html) {
      if (charts[canvasId]) { charts[canvasId].destroy(); delete charts[canvasId]; }
      if (canvas) canvas.hidden = true;
      if (box) { box.innerHTML = html; box.hidden = false; }
      return true;
    }

    if (canvas) canvas.hidden = false;
    if (box) box.hidden = true;
    return false;
  }


  /**
   * Success rate by section.
   *
   * The y-axis does NOT start at zero. Every section sits between 98 and 100,
   * so a zero baseline renders four identical bars carrying no information.
   * The window is stated in the subtitle and every bar is labelled with its
   * exact value, so the compression is disclosed rather than hidden.
   */
  function drawRateChart(k) {
    const rows = k.departments.length ? k.departments : k.parts;
    const note = document.getElementById('chartRateNote');

    if (!rows.length) {
      chartMessage('chartRate',
        '<p>No section data for this month. Upload the section exports to see ' +
        'the breakdown.</p>');
      if (note) note.textContent = 'No section data for this month.';
      return;
    }
    chartMessage('chartRate', null);

    const lowest = Math.min.apply(null, rows.map(function (r) { return r.rate; })
                                             .concat([k.target]));
    const floor = Math.max(0, Math.floor(lowest) - 1);

    if (note) {
      note.textContent = 'Against the ' + k.target + '% target. Axis starts at ' +
                         floor + '% — the sections sit close together, so the ' +
                         'differences are small by design.';
    }

    drawChart('chartRate', {
      type: 'bar',
      data: {
        labels: rows.map(function (r) { return shortLabel(r.name); }),
        datasets: [Object.assign({
          label: 'Success rate',
          data: rows.map(function (r) { return round2(r.rate); }),
          backgroundColor: rows.map(function (r) { return bandColour(r.band); })
        }, BAR)]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 24, right: 74 } },   // gutter for the target badge
        scales: {
          y: Object.assign({ min: floor, max: 100.4 }, gridStyle()),
          x: categoryAxis()
        },
        plugins: {
          legend: { display: false },          // one series — the title names it
          tooltip: tooltipStyle({
            label: function (item) {
              const row = rows[item.dataIndex];
              return [
                'Success rate: ' + fmt(row.rate) + '%',
                'Band: ' + row.band,
                'Completed: ' + row.completed + ' · delayed: ' + row.delayed
              ];
            }
          }),
          targetLine: { value: k.target, label: 'Target ' + k.target + '%' },
          valueLabels: { enabled: true, decimals: 2, suffix: '%' }
        }
      },
      plugins: [targetLinePlugin, valueLabelPlugin]
    });
  }


  /** Delayed tickets by section — a genuine count, so a zero baseline. */
  function drawDelayChart(k) {
    const rows = k.departments.length ? k.departments : k.parts;

    if (!rows.length) {
      chartMessage('chartDelay', '<p>No section data for this month.</p>');
      return;
    }

    // Every section at zero. Plotting that draws four invisible bars under a
    // fractional axis; saying it plainly is both truer and better news.
    const worst = Math.max.apply(null, rows.map(function (r) { return r.delayed; }));
    if (worst === 0) {
      chartMessage('chartDelay',
        '<div class="big">0</div>' +
        '<p>No ticket in any section was completed past its due date this month.</p>');
      return;
    }
    chartMessage('chartDelay', null);

    drawChart('chartDelay', {
      type: 'bar',
      data: {
        labels: rows.map(function (r) { return shortLabel(r.name); }),
        datasets: [Object.assign({
          label: 'Delayed tickets',
          data: rows.map(function (r) { return r.delayed; }),
          backgroundColor: SERIES[0]
        }, BAR)]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 24 } },
        scales: {
          // suggestedMax keeps a lone delay from filling the card, and
          // stepSize 1 stops Chart.js subdividing a count into halves.
          y: Object.assign({
            beginAtZero: true,
            suggestedMax: Math.max(4, worst + 1),
            ticks: { precision: 0, stepSize: 1, color: '#7b8b9d', font: AXIS_FONT, padding: 8 }
          }, { border: { display: false }, grid: { color: '#eaeff5', drawTicks: false } }),
          x: categoryAxis()
        },
        plugins: {
          legend: { display: false },
          tooltip: tooltipStyle({
            label: function (item) {
              const row = rows[item.dataIndex];
              return row.delayed + ' delayed of ' + row.completed + ' completed';
            }
          }),
          valueLabels: { enabled: true, decimals: 0 }
        }
      },
      plugins: [valueLabelPlugin]
    });
  }


  /** Grouped bars: sections across, one colour per month. */
  function drawCompareChart(c) {
    const card = document.getElementById('cmpChartCard');
    if (!c.sections.length) {
      if (card) card.hidden = true;
      return;
    }
    if (card) card.hidden = false;

    const labels = ['EAS overall'].concat(c.sections.map(shortLabel));

    let lowest = c.target;
    c.months.forEach(function (month) {
      const total = c.totals[month];
      if (total) lowest = Math.min(lowest, total.rate);
      c.sections.forEach(function (section) {
        const entry = (c.bySection[section] || {})[month];
        if (entry) lowest = Math.min(lowest, entry.rate);
      });
    });
    const floor = Math.max(0, Math.floor(lowest) - 1);

    const note = document.getElementById('cmpChartNote');
    if (note) {
      note.textContent = 'Against the ' + c.target + '% target. Axis starts at ' +
                         floor + '%.';
    }

    const datasets = c.months.map(function (month, index) {
      const total = c.totals[month];
      const data = [total ? round2(total.rate) : null].concat(
        c.sections.map(function (section) {
          const entry = (c.bySection[section] || {})[month];
          return entry ? round2(entry.rate) : null;
        })
      );

      // Colour follows the month, never its position in the sorted result —
      // dropping a month must not repaint the ones that remain.
      return Object.assign({
        label: formatMonth(month),
        data: data,
        backgroundColor: SERIES[index % SERIES.length],
        // The months of one section belong together, so they sit side by side
        // with a hairline of surface between them; the air goes BETWEEN the
        // sections instead. Left at the defaults the pair drifts apart and
        // reads as two unrelated bars.
        categoryPercentage: 0.55,
        barPercentage: 0.9
      }, BAR, { maxBarThickness: 22 });
    });

    drawChart('chartCompare', {
      type: 'bar',
      data: { labels: labels, datasets: datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 22, right: 74 } },   // gutter for the target badge
        scales: {
          y: Object.assign({ min: floor, max: 100.4 }, gridStyle()),
          x: categoryAxis()
        },
        plugins: {
          // Two or more series, so a legend is required.
          legend: {
            position: 'bottom',
            labels: { boxWidth: 8, boxHeight: 8, usePointStyle: true, padding: 16,
                      pointStyle: 'circle', color: '#5a6b7d', font: AXIS_FONT }
          },
          tooltip: Object.assign(tooltipStyle({
            label: function (item) {
              return item.dataset.label + ': ' +
                     (item.raw === null ? 'no data' : fmt(item.raw) + '%');
            }
          }), { displayColors: true, usePointStyle: true }),
          targetLine: { value: c.target, label: 'Target ' + c.target + '%' },
          valueLabels: { enabled: false }      // too dense with 4 months x 5 groups
        }
      },
      plugins: [targetLinePlugin]
    });
  }


  /**
   * One ring per KPI showing its green / yellow / red bands, drawn to scale.
   *
   * The bands are plotted on a WINDOWED axis, not 0-100. On a full scale the
   * red band swallows the ring — for Incident Management red is everything
   * below 99.50, which is 99.5% of the circle, and the green band that
   * actually matters becomes an invisible sliver. The window starts a little
   * below the red boundary so all three bands stay legible, and the exact
   * numbers are printed underneath so the compression cannot mislead.
   *
   * Where a KPI has a figure for the selected month, it sits in the middle
   * coloured by the band it falls in.
   */
  function drawThresholdGauges(boot) {
    const grid = document.getElementById('gaugeGrid');
    if (!grid) return;

    const list = boot.kpiList || [];
    grid.innerHTML = '';

    list.forEach(function (kpi, index) {
      const cell = document.createElement('div');
      cell.className = 'gauge-cell';
      cell.innerHTML =
        '<h3>' + escapeHtml(kpi.shortName || kpi.name) + '</h3>' +
        '<span class="gauge-layer">' + escapeHtml(kpi.slaLayer) + '</span>' +
        '<div class="gauge-canvas">' +
          '<canvas id="gauge' + index + '"></canvas>' +
          '<div class="gauge-centre" id="gaugeCentre' + index + '"></div>' +
        '</div>' +
        // A swatch beside each row, so the band a number belongs to is
        // readable without matching it back to a slice by colour alone.
        '<div class="gauge-bands">' +
          '<span><i style="background:' + bandColour('GREEN') + '"></i>' +
            '<b>&ge; ' + kpi.target + kpi.unit + '</b> green</span>' +
          '<span><i style="background:' + bandColour('YELLOW') + '"></i>' +
            '<b>' + kpi.yellowFloor + ' – ' + (round2(kpi.target - 0.01)) +
            kpi.unit + '</b> yellow</span>' +
          '<span><i style="background:' + bandColour('RED') + '"></i>' +
            '<b>&lt; ' + kpi.yellowFloor + kpi.unit + '</b> red</span>' +
        '</div>';
      grid.appendChild(cell);

      const span = kpi.target - kpi.yellowFloor;
      const floor = Math.max(0, kpi.yellowFloor - span * 0.35);

      const redWidth = kpi.yellowFloor - floor;
      const yellowWidth = kpi.target - kpi.yellowFloor;
      const greenWidth = 100 - kpi.target;

      drawChart('gauge' + index, {
        type: 'doughnut',
        data: {
          labels: ['Red — below ' + kpi.yellowFloor + kpi.unit,
                   'Yellow — ' + kpi.yellowFloor + ' to ' + kpi.target + kpi.unit,
                   'Green — ' + kpi.target + kpi.unit + ' and above'],
          datasets: [{
            data: [redWidth, yellowWidth, greenWidth],
            backgroundColor: [bandColour('RED'), bandColour('YELLOW'), bandColour('GREEN')],
            borderColor: '#ffffff',
            borderWidth: 2,           // 2px surface gap between segments
            circumference: 270,       // a gauge, opening at the bottom
            rotation: 225
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '70%',
          plugins: {
            legend: { display: false },   // the numbers below are the legend
            tooltip: {
              callbacks: {
                label: function (item) { return item.label; }
              }
            }
          }
        }
      });

    });

    updateGaugeCentres();
  }


  /**
   * Writes the reading in the middle of each ring.
   *
   * Split out of drawThresholdGauges because the two run at different times:
   * the rings are built once from the bootstrap, before any month has loaded,
   * so every centre would sit on "no month loaded" forever. This runs again
   * whenever KPI 1 data arrives, and only rewrites four small divs rather than
   * destroying and rebuilding four canvases.
   */
  function updateGaugeCentres() {
    const list = (state.boot && state.boot.kpiList) || [];

    list.forEach(function (kpi, index) {
      const centre = document.getElementById('gaugeCentre' + index);
      if (!centre) return;

      const actual = currentValueFor(kpi);

      if (actual === null) {
        centre.innerHTML = '<strong style="color:var(--text-mut)">—</strong>' +
                           '<span>' + (kpi.active ? 'no month loaded' : 'awaiting data') + '</span>';
        return;
      }

      const band = actual >= kpi.target ? 'GREEN'
                 : (actual >= kpi.yellowFloor ? 'YELLOW' : 'RED');
      centre.innerHTML =
        '<strong style="color:' + bandColour(band) + '">' + fmt(actual) + kpi.unit + '</strong>' +
        '<span>' + escapeHtml(formatMonth(state.month || '')) + '</span>';
    });
  }


  /**
   * The selected month's figure for a KPI, or null.
   * Only KPI 1 has an ingest pipeline today.
   */
  function currentValueFor(kpi) {
    if (kpi.id === 'KPI1' && state.kpi && state.kpi.hasData && state.kpi.total) {
      return state.kpi.total.rate;
    }
    return null;
  }


  /** 'Manufacturing Applications' -> 'Manufacturing', so axis labels fit. */
  function shortLabel(name) {
    return String(name).replace(/\s+Applications$/, '');
  }

  function round2(n) {
    return Math.round((Number(n) || 0) * 100) / 100;
  }


  // =========================================================================
  // COMPARISON
  // =========================================================================

  const CMP_SELECTS = ['cmpM1', 'cmpM2', 'cmpM3', 'cmpM4'];


  /**
   * Fills the "which KPI" dropdown.
   *
   * KPIs without an ingest pipeline are listed but disabled, so it is obvious
   * they exist and equally obvious why they cannot be compared yet.
   */
  function fillKpiSelector(boot) {
    const select = document.getElementById('cmpKpi');
    if (!select) return;

    const previous = select.value;
    select.innerHTML = '';

    (boot.kpiList || []).forEach(function (kpi) {
      const option = document.createElement('option');
      option.value = kpi.id;
      option.textContent = kpi.name + (kpi.active ? '' : '  — awaiting data');
      select.appendChild(option);
    });

    const active = (boot.kpiList || []).filter(function (k) { return k.active; });
    select.value = previous || (active[0] ? active[0].id : '');
    if (!select.value && active[0]) select.value = active[0].id;
  }


  function selectedKpi() {
    const id = getValue('cmpKpi');
    const list = (state.boot && state.boot.kpiList) || [];
    for (let i = 0; i < list.length; i++) {
      if (list[i].id === id) return list[i];
    }
    return list[0] || null;
  }



  function wireCompare() {
    bind('cmpRun', 'click', runComparison);

    // Changing a month or the KPI without pressing Run still gets saved, so a
    // refresh mid-selection does not throw the choices away.
    bind('cmpKpi', 'change', saveState);
    CMP_SELECTS.forEach(function (id) { bind(id, 'change', saveState); });

    bind('cmpClear', 'click', function () {
      CMP_SELECTS.forEach(function (id, index) {
        // The first two are required, so clearing resets them to the two most
        // recent months rather than to nothing.
        setValue(id, index < 2 ? defaultMonthFor(index) : '');
      });
      document.getElementById('cmpChartCard').hidden = true;
      document.getElementById('cmpOverallCard').hidden = true;
      document.getElementById('cmpSectionCard').hidden = true;

      // Put the prompt back. showComparisonPending() rewrites this box, so
      // without this you would clear the results and be left staring at a
      // stale "no data yet" warning.
      const empty = document.getElementById('cmpEmpty');
      empty.hidden = false;
      empty.className = 'notice notice-info';
      empty.innerHTML =
        '<h3>Nothing compared yet</h3>' +
        '<p>Choose two or more months above and press Compare Dashboards.</p>';

      state.compare = null;
      state.compareRan = false;
      saveState();
    });
  }


  function defaultMonthFor(index) {
    const months = (state.boot && state.boot.availableMonths) || [];
    return months[index] || '';
  }


  function fillCompareMonths(months) {
    const list = months || [];

    CMP_SELECTS.forEach(function (id, index) {
      const select = document.getElementById(id);
      if (!select) return;

      const previous = select.value;
      const optional = index >= 2;

      select.innerHTML = optional
        ? '<option value="">— none —</option>'
        : '<option value="">— select a month —</option>';

      list.forEach(function (month) {
        const option = document.createElement('option');
        option.value = month;
        option.textContent = formatMonth(month);
        select.appendChild(option);
      });

      select.disabled = !list.length;

      if (previous && list.indexOf(previous) !== -1) {
        select.value = previous;
      } else if (!optional) {
        select.value = list[index] || '';        // newest two by default
      } else {
        select.value = '';
      }
    });
  }


  function runComparison() {
    const picked = [];

    CMP_SELECTS.forEach(function (id) {
      const value = getValue(id);
      // Selecting the same month twice would produce duplicate columns, so
      // ignore repeats rather than rendering them.
      if (value && picked.indexOf(value) === -1) picked.push(value);
    });

    if (picked.length < 2) {
      return window.alert('Choose at least two different months to compare.');
    }
    if (picked.length > MAX_COMPARE) {
      return window.alert('Choose at most ' + MAX_COMPARE + ' months.');
    }

    const kpi = selectedKpi();

    // Remembered so a refresh lands back on the results rather than on the
    // empty prompt. Saved before the server call, not after, so it survives
    // even if you reload while the comparison is still loading.
    state.compareRan = true;
    saveState();

    // Every KPI is selectable — a disabled option tells you nothing about why.
    // Picking one without data shows an explanation instead.
    if (kpi && !kpi.active) return showComparisonPending(kpi);

    callServer('getKpiComparison', picked).then(renderComparison).catch(onError);
  }


  /** Explains why a KPI cannot be compared yet, in place of the results. */
  function showComparisonPending(kpi) {
    const empty = document.getElementById('cmpEmpty');
    document.getElementById('cmpChartCard').hidden = true;
    document.getElementById('cmpOverallCard').hidden = true;
    document.getElementById('cmpSectionCard').hidden = true;

    empty.hidden = false;
    empty.className = 'notice notice-warn';
    empty.innerHTML =
      '<h3>' + escapeHtml(kpi.name) + ' has no data yet</h3>' +
      '<p>Its definition is loaded — target &ge; ' + kpi.target + kpi.unit +
      ', ' + escapeHtml(kpi.slaLayer) + ' — but nothing has been uploaded ' +
      'against it, so there is nothing to compare. Formula: ' +
      escapeHtml(kpi.formula || '') + '</p>';
  }


  function renderComparison(c) {
    const empty = document.getElementById('cmpEmpty');
    empty.className = 'notice notice-info';
    document.getElementById('cmpChartCard').hidden = false;

    state.compare = c;

    document.getElementById('cmpEmpty').hidden = true;
    document.getElementById('cmpOverallCard').hidden = false;
    document.getElementById('cmpSectionCard').hidden = false;

    drawCompareChart(c);

    // ---- overall, one row per month, with month-on-month change ----
    const body = document.querySelector('#cmpOverall tbody');
    body.innerHTML = '';

    let previous = null;
    c.months.forEach(function (month) {
      const t = c.totals[month];
      const tr = document.createElement('tr');

      if (!t) {
        tr.innerHTML = '<td>' + escapeHtml(formatMonth(month)) + '</td>' +
                       '<td colspan="9" class="empty">No data</td>';
        body.appendChild(tr);
        return;
      }

      let change = '—';
      if (previous !== null) {
        const delta = t.rate - previous;
        const arrow = delta > 0 ? '▲' : (delta < 0 ? '▼' : '=');
        const colour = delta > 0 ? 'var(--green)' : (delta < 0 ? 'var(--red)' : 'var(--text-mut)');
        change = '<span style="color:' + colour + '">' + arrow + ' ' +
                 fmt(Math.abs(delta)) + '</span>';
      }
      previous = t.rate;

      tr.innerHTML =
        '<td class="name">' + escapeHtml(formatMonth(month)) + '</td>' +
        num(t.received) + num(t.completed) + num(t.delayed) + num(t.successful) +
        '<td class="r">' + fmt(t.rate) + '%</td>' +
        '<td class="r">' + fmt(t.achievement) + '%</td>' +
        '<td>' + pill(t.band) + '</td>' +
        '<td class="r">' + (t.headroom > 0 ? '+' : '') + t.headroom + '</td>' +
        '<td class="r">' + change + '</td>';
      body.appendChild(tr);
    });

    // ---- sections down the side, months across the top ----
    const head = document.querySelector('#cmpSections thead tr');
    head.innerHTML = '<th>Section</th>' + c.months.map(function (m) {
      return '<th class="r">' + escapeHtml(formatMonth(m)) + '</th>';
    }).join('');

    const sectionBody = document.querySelector('#cmpSections tbody');
    sectionBody.innerHTML = '';

    if (!c.sections.length) {
      sectionBody.innerHTML = '<tr><td colspan="' + (c.months.length + 1) +
        '" class="empty">No section data in the selected months.</td></tr>';
      return;
    }

    c.sections.forEach(function (section) {
      const tr = document.createElement('tr');
      let html = '<td>' + escapeHtml(section) + '</td>';

      c.months.forEach(function (month) {
        const entry = (c.bySection[section] || {})[month];
        html += entry
          ? '<td class="r">' + fmt(entry.rate) + '% ' + pill(entry.band) + '</td>'
          : '<td class="r muted">—</td>';
      });

      tr.innerHTML = html;
      sectionBody.appendChild(tr);
    });
  }


  // =========================================================================
  // SETTINGS
  // =========================================================================

  function fillSettings(boot) {
    const body = document.querySelector('#settingsTable tbody');
    if (body) {
      body.innerHTML = '';
      (boot.kpiList || []).forEach(function (kpi) {
        const row = document.createElement('tr');
        row.innerHTML =
          '<td>' + escapeHtml(kpi.name) + '</td>' +
          '<td style="font-size:11.5px;color:var(--text-dim)">' + escapeHtml(kpi.formula || '') + '</td>' +
          '<td>&ge; ' + kpi.target + kpi.unit + '</td>' +
          '<td>' + kpi.yellowFloor + '&ndash;' + kpi.target + kpi.unit + '</td>' +
          '<td>&lt; ' + kpi.yellowFloor + kpi.unit + '</td>' +
          '<td>' + escapeHtml(kpi.slaLayer) + '</td>' +
          '<td>' + (kpi.active
            ? '<span class="pill g">LIVE</span>'
            : '<span class="pill a">PENDING</span>') + '</td>';
        body.appendChild(row);
      });
    }

    drawThresholdGauges(boot);
    fillKpiSelector(boot);

    const info = document.getElementById('dbInfo');
    if (info) {
      const stats = boot.stats || { tickets: 0, uploads: 0 };
      info.innerHTML =
        '<dt>Version</dt><dd>' + escapeHtml(boot.appVersion) + '</dd>' +
        '<dt>Sections</dt><dd>' + boot.departments.length + '</dd>' +
        '<dt>Tickets stored</dt><dd>' + stats.tickets + '</dd>' +
        '<dt>Uploads logged</dt><dd>' + stats.uploads + '</dd>';
    }
  }


  // =========================================================================
  // HELPERS
  // =========================================================================

  function show(id) { const el = document.getElementById(id); if (el) el.hidden = false; }
  function hide(id) { const el = document.getElementById(id); if (el) el.hidden = true; }

  function bind(id, event, handler) {
    const el = document.getElementById(id);
    if (el) el.addEventListener(event, handler);
  }

  function getValue(id) {
    const el = document.getElementById(id);
    return el ? (el.value || '') : '';
  }

  function setValue(id, value) {
    const el = document.getElementById(id);
    if (el) el.value = value;
  }

  /**
   * A numeric table cell.
   *
   * Zeros are dimmed. In a healthy month almost every Delayed column is zero,
   * and a wall of full-strength zeros makes the two rows that matter harder to
   * find, not easier.
   */
  function num(value) {
    return '<td class="r' + (Number(value) === 0 ? ' zero' : '') + '">' + value + '</td>';
  }


  function setCount(id, shown, total, noun) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = shown === total
      ? total + ' ' + noun
      : shown + ' of ' + total + ' ' + noun;
  }

  function fillRows(selector, rows, toHtml) {
    const body = document.querySelector(selector);
    if (!body) return;
    body.innerHTML = '';
    rows.forEach(function (row) {
      const tr = document.createElement('tr');
      tr.innerHTML = toHtml(row);
      body.appendChild(tr);
    });
  }

  function setLive(isLive) {
    const dot = document.getElementById('liveDot');
    const text = document.getElementById('liveText');
    if (dot) dot.classList.toggle('is-busy', !isLive);
    if (text) text.textContent = isLive ? 'Live' : 'Error';
  }

  function pill(band) {
    return '<span class="pill ' + bandClass(band) + '">' + escapeHtml(band) + '</span>';
  }

  function bandClass(band) {
    if (band === 'GREEN') return 'g';
    if (band === 'YELLOW') return 'a';
    if (band === 'RED') return 'r';
    return '';
  }

  /** Two decimals, matching how the policy states its thresholds. */
  function fmt(n) {
    return (Math.round((Number(n) || 0) * 100) / 100).toFixed(2);
  }

  function emptyTable(selector, columns, message) {
    const body = document.querySelector(selector);
    if (body) {
      body.innerHTML = '<tr><td colspan="' + columns + '" class="empty">' +
                       escapeHtml(message) + '</td></tr>';
    }
  }

  function formatMonth(key) {
    const names = ['January', 'February', 'March', 'April', 'May', 'June',
                   'July', 'August', 'September', 'October', 'November', 'December'];
    const parts = String(key).split('-');
    const index = parseInt(parts[1], 10) - 1;
    return (names[index] || key) + ' ' + parts[0];
  }

  /** Date -> 'YYYY-MM-DD HH:MM:SS', matching how the ITSM writes them. */
  function formatDate(d) {
    function pad(n) { return String(n).padStart(2, '0'); }
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
           ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  /**
   * Escapes text before it goes into innerHTML.
   *
   * Ticket titles and requestor names come from the ITSM, which means they can
   * contain < and & and quotes. Without this a stray character breaks the
   * layout, and untrusted text in innerHTML is how script injection happens.
   */
  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /**
   * Is this value effectively empty?
   *
   * The trim is the whole point. Some Completion Date cells in the ITSM export
   * hold a single space. Testing only for '' treats that space as real, the
   * merge keeps it, and the genuine date from the other report never replaces
   * it — one ticket silently becomes incomplete.
   */
  function isBlank(value) {
    return value === null || value === undefined || String(value).trim() === '';
  }

})();
</script>
