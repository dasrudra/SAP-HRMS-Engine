<!--
  App.html — all browser-side JavaScript.

  Remember the two worlds: nothing in this file can touch a spreadsheet. When it
  needs data it asks the server through google.script.run, and the server
  replies by calling the success handler.

  This file reads the .xlsx files, works out which report each one is,
  normalises every row, merges them, sends them up in batches, and draws every
  screen. Parsing happens here rather than on the server because a 20,000-row
  workbook would run straight into Apps Script's 6-minute execution ceiling.
-->

<!--
  SheetJS reads .xlsx in the browser. Pinned to an exact version on purpose —
  "latest" means your app can break overnight because someone else shipped.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- Chart.js, pinned for the same reason as SheetJS. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<script>
(function () {
  'use strict';

  /** Everything the page currently knows. The single source of truth. */
  const state = {
    view: 'kpi1',
    month: null,
    boot: null,
    kpi: null,        // the month on screen, kept so filters redraw without a
                      // server call
    compare: null,
    busy: false,

    // TRUE once a comparison has actually been run, so a refresh knows to
    // re-run it instead of dropping you on an empty panel.
    compareRan: false,

    // Every month, for the trend chart. Fetched once — it only changes when
    // something is uploaded, and the uploads screen reloads the page anyway.
    trend: null,

    // The By Individuals table scopes itself, independently of the month
    // picker. Holds the getKpi1() result for the chosen quarter, or null when
    // that table is simply following the page.
    scopePeople: null,
    scopeKey: '',

    // Which section of the organisation chart is open on Settings, '' for
    // none. Deliberately NOT saved to the URL: it is a look at the team, not
    // a filter on anything, so a refresh should land on the whole chart.
    orgOpen: '',

    // KPI 2's own result, kept so its filters redraw without a server call.
    kpi2: null,

    // Filter values read back from the URL before the dropdowns they belong to
    // exist. Applied once the data lands and the options are built.
    pending: null,
    restoring: false
  };

  /**
   * The month picker's "every month" value. Must match ALL_MONTHS in Kpi.gs —
   * the string travels to the server as the month argument.
   */
  const ALL_MONTHS = 'ALL';

  const BATCH_SIZE = 400;
  const DETAILS_LIMIT = 300;
  const MAX_COMPARE = 4;


  // =========================================================================
  // STARTUP
  // =========================================================================

  document.addEventListener('DOMContentLoaded', function () {
    wireSidebar();
    wireNavigation();
    wireFilters();
    wireCompare();
    wireUploads();
    wireOrg();

    google.script.run
      .withSuccessHandler(onBootstrap)
      .withFailureHandler(onError)
      .getBootstrap();
  });


  function onBootstrap(boot) {
    state.boot = boot;
    hide('loader');

    if (!boot.configured) {
      show('notConfigured');
      return;
    }

    fillMonthPicker(boot.availableMonths);
    fillScopeFilter(boot.availableMonths);
    fillFeedbackQuarters(boot.feedbackQuarters);
    // After fillSettings, not before: it populates the KPI selector, and which
    // months the comparison may offer depends on which KPI is selected.
    fillSettings(boot);
    fillComparePeriods(comparePeriodList());

    restoreState(function () {
      showView(state.view, { skipSave: true });
    });
  }


  function onError(err) {
    hide('loader');
    document.getElementById('errorText').textContent =
      (err && err.message) ? err.message : String(err);
    show('errorBox');
    setLive(false);
  }


  /**
   * Wraps google.script.run in a Promise.
   *
   * The native API is callback-based, which gets unreadable once you need
   * twenty batches strictly in order. Promises let that be a loop with `await`.
   */
  function callServer(fnName) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject);
      runner[fnName].apply(runner, args);
    });
  }


  /**
   * Gives up waiting after a while.
   *
   * google.script.run has no timeout: when Apps Script kills a run for
   * exceeding its six-minute ceiling, neither handler is ever called and the
   * promise hangs forever. On screen that looks exactly like the button
   * having done nothing at all — which is how a delete that had in fact
   * half-run could be pressed again and again.
   *
   * @param {Promise} promise
   * @param {number} ms
   * @param {string} what  named in the error the user is shown
   */
  function withTimeout(promise, ms, what) {
    let timer;
    return Promise.race([
      promise.then(function (v) { clearTimeout(timer); return v; },
                   function (e) { clearTimeout(timer); throw e; }),
      new Promise(function (_, reject) {
        timer = setTimeout(function () {
          reject(new Error(what + ' did not finish in ' + Math.round(ms / 1000) +
                           ' seconds. It may still have worked — the list ' +
                           'below has been re-read from the database.'));
        }, ms);
      })
    ]);
  }


  // =========================================================================
  // SIDEBAR
  // =========================================================================

  function wireSidebar() {
    const button = document.getElementById('collapseBtn');
    const root = document.getElementById('appRoot');
    if (!button || !root) return;

    // Remember the choice per browser, so it survives a refresh.
    try {
      if (localStorage.getItem('easSidebar') === 'collapsed') {
        root.classList.add('is-collapsed');
      }
    } catch (e) { /* storage blocked — start expanded */ }

    button.addEventListener('click', function () {
      const collapsed = root.classList.toggle('is-collapsed');
      button.title = collapsed ? 'Expand sidebar' : 'Minimise sidebar';
      try {
        localStorage.setItem('easSidebar', collapsed ? 'collapsed' : 'expanded');
      } catch (e) { /* not fatal */ }

      // The charts are sized to their container, and the container just
      // changed width. Chart.js only notices on a window resize, so without
      // this the plots keep their old width until something else redraws them.
      resizeCharts();
    });
  }


  /**
   * Closing the org section, from the button or from Escape.
   *
   * Wired once at startup rather than per render, because renderOrg replaces
   * the cards and a listener bound to them would go with them.
   */
  function wireOrg() {
    bind('orgClose', 'click', closeOrgSection);

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape' || !state.orgOpen) return;
      // The dialog owns Escape while it is up — it is in front of this.
      const backdrop = document.getElementById('modalBackdrop');
      if (backdrop && !backdrop.hidden) return;
      closeOrgSection();
    });
  }


  /** Nudges every live chart to remeasure its container. */
  function resizeCharts() {
    if (!window.Chart || !window.Chart.instances) return;
    Object.keys(window.Chart.instances).forEach(function (key) {
      const chart = window.Chart.instances[key];
      if (chart && typeof chart.resize === 'function') chart.resize();
    });
  }


  // =========================================================================
  // NAVIGATION
  // =========================================================================

  function wireNavigation() {
    document.querySelectorAll('.nav-item').forEach(function (button) {
      button.addEventListener('click', function () {
        showView(button.dataset.view);
      });
    });

    const picker = document.getElementById('monthPicker');
    if (picker) {
      picker.addEventListener('change', function () {
        state.month = picker.value;
        saveState();
        loadKpi1();
      });
    }

    const refresh = document.getElementById('refreshKpi1');
    if (refresh) refresh.addEventListener('click', function () { loadKpi1(); });
  }


  function showView(name, options) {
    options = options || {};
    if (!document.getElementById('view-' + name)) name = 'kpi1';

    document.querySelectorAll('.view').forEach(function (el) { el.hidden = true; });
    const target = document.getElementById('view-' + name);
    if (target) target.hidden = false;

    document.querySelectorAll('.nav-item').forEach(function (button) {
      button.classList.toggle('is-active', button.dataset.view === name);
    });

    const labels = {
      kpi1: 'KPI 1 · ITSM',
      kpi2: 'KPI 2 · Training',
      compare: 'Comparison',
      uploads: 'Data Uploads',
      settings: 'Settings'
    };
    document.getElementById('viewLabel').textContent = labels[name] || name;

    state.view = name;
    if (!options.skipSave) saveState();

    if (name === 'kpi1') loadKpi1();
    if (name === 'kpi2') loadKpi2();
    if (name === 'uploads') loadUploads();

    // A comparison that was on screen before the refresh gets rebuilt. Guarded
    // on state.compare being empty so this costs a server call once and not
    // every time you tab back — the rendered tables are still in the DOM,
    // hidden rather than destroyed.
    if (name === 'compare' && state.compareRan && !state.compare) runComparison();

    // The trend is not part of the comparison and does not wait for the
    // Compare button: it is the backdrop the comparison sits against.
    if (name === 'compare') loadTrend();

    // The organisation stage quotes KPI 1's section figures. Landing straight
    // on Settings — which a refresh does, since the view is in the URL — means
    // KPI 1 never loaded, so every card read "no figure" on a database full of
    // tickets. Fetched once, and only if nothing is held already.
    if (name === 'settings' && !state.kpi) loadKpi1();
  }


  // =========================================================================
  // STATE PERSISTENCE  —  the refresh fix
  // =========================================================================

  /**
   * Everything a refresh has to survive.
   *
   * Persisting only the view and month was not enough: filters and the
   * comparison selection live in the same throwaway browser memory, so a
   * reload silently reset them — the exact complaint the whole URL-state
   * mechanism exists to prevent.
   */
  const TRACKED_CONTROLS = [
    'fSection', 'fModuleK1', 'fModuleK1Name', 'fAllScope', 'fAllPerson', 'fAllName',
    'kpi2Month', 'fModule', 'fZone',
    'cmpKpi', 'cmpM1', 'cmpM2', 'cmpM3', 'cmpM4'
  ];

  function saveState() {
    if (state.restoring) return;      // don't overwrite what we're restoring

    const params = { view: state.view };
    if (state.month) params.month = state.month;

    TRACKED_CONTROLS.forEach(function (id) {
      // A control belonging to a screen that has not been drawn yet reads back
      // as empty, but its restored value is still waiting in state.pending.
      // Without this fallback, saving from the comparison screen would quietly
      // wipe the KPI 1 filters before KPI 1 ever had a chance to apply them.
      const value = getValue(id) || (state.pending && state.pending[id]) || '';
      if (value) params[id] = value;  // omit empties to keep the URL short
    });

    if (state.compareRan) params.ran = '1';

    try {
      if (window.google && google.script && google.script.history) {
        google.script.history.replace(null, params);
      }
    } catch (e) { /* iframe restrictions — fall through to storage */ }

    try {
      sessionStorage.setItem('easKpiState', JSON.stringify(params));
    } catch (e) { /* private mode or blocked storage — not fatal */ }
  }


  /**
   * Puts saved values back into controls, once those controls exist.
   *
   * Split out because the two groups of controls become ready at different
   * times. The comparison dropdowns are filled from the bootstrap, so they can
   * be restored immediately; the section and individual dropdowns are built
   * from the selected month's tickets, which have not arrived yet.
   *
   * Each id is CONSUMED on the way through. Restoring is a one-time event —
   * leaving the values in state.pending would make an old filter reappear
   * every time the month changed.
   *
   * @param {string[]} ids  control ids to restore
   */
  function applyPendingTo(ids) {
    if (!state.pending) return;

    ids.forEach(function (id) {
      const saved = state.pending[id];
      if (saved === undefined) return;
      delete state.pending[id];

      const el = document.getElementById(id);
      if (!el) return;

      // A <select> silently refuses a value it has no <option> for and lands
      // on ''. That is the correct outcome: the month now on screen simply has
      // no such section or person, so the table falls back to showing all.
      el.value = saved;
    });

    const outstanding = TRACKED_CONTROLS.some(function (id) {
      return state.pending[id] !== undefined;
    });
    if (!outstanding) state.pending = null;
  }


  function restoreState(done) {
    let settled = false;

    function finish(params) {
      if (settled) return;
      settled = true;

      // Writing to a control does not fire its change event, but the callers
      // further down this chain do save. Hold them off until we are done, or
      // a half-restored page would overwrite the state we are reading.
      state.restoring = true;

      if (params) {
        if (params.view) state.view = params.view;
        if (params.month) {
          state.month = params.month;
          const picker = document.getElementById('monthPicker');
          if (picker) picker.value = params.month;
        }
        state.compareRan = params.ran === '1';

        // The section and individual dropdowns are not populated yet — their
        // options come from the month's data. Hold those until renderKpi1 has
        // built them; the comparison dropdowns are ready now.
        state.pending = params;
        // cmpKpi first and alone: the month dropdowns are refilled from it,
        // and refilling would otherwise wipe the months restored beside it.
        applyPendingTo(['cmpKpi']);
        fillComparePeriods(comparePeriodList());
        applyPendingTo(['cmpM1', 'cmpM2', 'cmpM3', 'cmpM4', 'kpi2Month']);
      }

      state.restoring = false;
      done();
    }

    try {
      if (window.google && google.script && google.script.url) {
        google.script.url.getLocation(function (location) {
          const p = (location && location.parameter) || {};
          if (p.view || p.month) return finish(p);
          finish(readStorage());
        });
        setTimeout(function () { finish(readStorage()); }, 1500);
        return;
      }
    } catch (e) { /* fall through */ }

    finish(readStorage());
  }


  function readStorage() {
    try {
      const raw = sessionStorage.getItem('easKpiState');
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }


  // =========================================================================
  // READING .xlsx FILES
  // =========================================================================

  function readWorkbook(file) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();

      reader.onerror = function () {
        reject(new Error('Could not read ' + file.name));
      };

      reader.onload = function (event) {
        try {
          // cellDates is not optional here. The ITSM exports store dates as
          // TEXT, so they parse either way — but the feedback form stores them
          // as real date cells, and without this SheetJS hands back the Excel
          // serial number instead. '2026-05-20' arrives as 46162, no month can
          // be read from it, and the KPI 2 screen goes blank while the data
          // sits in the sheet perfectly well.
          const workbook = XLSX.read(new Uint8Array(event.target.result),
                                     { type: 'array', cellDates: true });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];

          // header:1 gives arrays instead of objects. The two reports order
          // their columns differently, so we map by header NAME, never index.
          const grid = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', blankrows: false });
          if (!grid.length) throw new Error(file.name + ' looks empty');

          resolve({
            fileName: file.name,
            headers: grid[0].map(function (h) { return String(h == null ? '' : h).trim(); }),
            rows: grid.slice(1)
          });
        } catch (err) {
          reject(new Error(file.name + ': ' + err.message));
        }
      };

      reader.readAsArrayBuffer(file);
    });
  }


  /**
   * Which of the two ITSM reports is this?
   *
   * The Personal Performance export carries three man-hour columns the
   * Service/Part export does not. That structural test beats trusting a
   * filename somebody might rename.
   */
  /**
   * What kind of file is this?
   *
   * Decided from the HEADERS, never the filename. A file can be renamed;
   * its columns are what it is.
   *
   *   FEEDBACK   — a training feedback form export. Routed to KPI 2.
   *   INDIVIDUAL — an ITSM Individual Performance export. KPI 1, with the
   *                per-engineer man-hour columns.
   *   OVERALL    — the ITSM Service/Part export. KPI 1, no man-hours.
   *
   * FEEDBACK is tested first because it shares nothing with either ITSM
   * export: no Ticket ID, and its questions are unmistakable.
   */
  function detectReportType(headers) {
    if (findFeedbackQuestions(headers).length >= 4) return 'FEEDBACK';
    return headers.indexOf('Man*Hour') !== -1 ? 'INDIVIDUAL' : 'OVERALL';
  }


  /**
   * Which columns are the seven scored questions?
   *
   * Matched on a distinctive phrase rather than on position or exact text.
   * The forms carry a Bangla translation inside brackets and the wording has
   * drifted between batches, so 'How would you rate the overall training
   * session? [সামগ্রিক...]' has to resolve on 'overall training session'
   * alone. Order follows the survey, not the spreadsheet.
   */
  const FEEDBACK_QUESTIONS = [
    { key: 'Q1', needle: 'overall training session' },
    { key: 'Q2', needle: 'relevant and useful for your job' },
    { key: 'Q3', needle: 'knowledge and expertise' },
    { key: 'Q4', needle: 'explain concepts' },
    { key: 'Q5', needle: 'training materials' },
    { key: 'Q6', needle: 'more confident' },
    { key: 'Q7', needle: 'duration and pace' }
  ];

  function findFeedbackQuestions(headers) {
    const lower = headers.map(function (h) { return String(h || '').toLowerCase(); });

    return FEEDBACK_QUESTIONS.map(function (q) {
      let at = -1;
      for (let i = 0; i < lower.length; i++) {
        if (lower[i].indexOf(q.needle) !== -1) { at = i; break; }
      }
      return { key: q.key, at: at };
    }).filter(function (q) { return q.at !== -1; });
  }


  /**
   * Pulls the module, session title and trainer out of a filename.
   *
   * The feedback form has no field for any of the three, so the filename is
   * the only source. Everything before the first separator is dropped as
   * boilerplate ('Trainee Feedback'), the trailing extension goes, and what
   * is left is split on the last underscore or dash into title and trainer.
   *
   * A guess, and labelled as one on screen — the stored Session Title lets a
   * human check it against the real training record.
   */
  function describeFeedbackFile(fileName) {
    let text = String(fileName || '').replace(/\.(xlsx|xlsm|csv)$/i, '');

    // Drop the 'Trainee Feedback' / 'Training Feedback' prefix and whatever
    // punctuation follows it.
    text = text.replace(/^\s*train(ee|ing)[ _-]*feedback[ _–—-]*/i, '').trim();
    text = text.replace(/^[_\-–—\s]+/, '').trim();

    // The trainer tends to sit last, after an underscore or a dash.
    let title = text;
    let trainer = '';
    const split = text.match(/^(.*?)[ _]*[-–—_][ _]*([A-Za-z .&']{2,40})$/);
    if (split) {
      title = split[1].trim();
      trainer = split[2].trim();
    }

    return {
      title: title || String(fileName || ''),
      trainer: trainer,
      fileName: String(fileName || '')
    };
  }


  /**
   * Turns a feedback export into TRAINING rows — one per respondent.
   *
   * The seven answers are stored as the RAW TEXT the attendee chose. Deciding
   * positive from average happens at scoring time, so the classification in
   * Config.gs can be corrected and everything re-scored without re-uploading
   * a single file.
   */
  function normalizeFeedback(file, columns) {
    const found = findFeedbackQuestions(file.headers);
    if (found.length < 4) {
      throw new Error(file.fileName + ' looks like a feedback form but only ' +
                      found.length + ' of the 7 questions were recognised.');
    }

    const position = {};
    file.headers.forEach(function (name, i) {
      const key = String(name || '').toLowerCase();
      if (key.indexOf('employee id') !== -1 && position.empId === undefined) position.empId = i;
      if (key.indexOf('employee name') !== -1 && position.empName === undefined) position.empName = i;
      if (key.indexOf('plant') !== -1 && position.plant === undefined) position.plant = i;
      // From this quarter the form asks which zone the training was held in,
      // and a Module question is being added the same way. Older exports have
      // neither column and simply leave them blank — which is the truth about
      // them, not a gap to be guessed at. Both are then resolved at scoring
      // time, so the filename remains a fallback and Config stays the place
      // where the mapping can be corrected.
      if (key.indexOf('zone') !== -1 && position.zone === undefined) position.zone = i;
      if (key.indexOf('module') !== -1 && position.module === undefined) position.module = i;
      if (key.indexOf('date') !== -1 && key.indexOf('time') !== -1 &&
          position.when === undefined) position.when = i;
      if (key === 'id' && position.rowId === undefined) position.rowId = i;
      if (key === 'completion time' && position.completed === undefined) position.completed = i;
    });

    const meta = describeFeedbackFile(file.fileName);
    const at = function (name) { return columns.indexOf(name); };
    const out = [];

    // ONE FILE MAY HOLD MANY SESSIONS.
    // A single session's export is all one date; a combined quarterly export
    // is not. Lumping a quarter under one session name would make the By
    // session table useless, so the dates are counted first and the date is
    // appended to the title only when there is more than one. A single-session
    // file keeps its plain name, so re-uploading one never changes its rows.
    const sessionDates = {};
    file.rows.forEach(function (raw) {
      const d = feedbackDate(raw, position);
      if (d) sessionDates[d.slice(0, 10)] = true;
    });
    const manySessions = Object.keys(sessionDates).length > 1;

    // Counted so the upload can report how many typed dates it had to
    // overrule, rather than silently rewriting them.
    let corrected = 0;

    file.rows.forEach(function (raw, index) {
      // A respondent is real if they answered at least one scored question.
      const answers = FEEDBACK_QUESTIONS.map(function (q) {
        const hit = found.filter(function (f) { return f.key === q.key; })[0];
        if (!hit) return '';
        const value = raw[hit.at];
        return value === null || value === undefined ? '' : String(value).trim();
      });
      if (!answers.some(function (a) { return a !== ''; })) return;

      const parts = feedbackDateParts(raw, position);
      const date = parts.date;
      if (parts.corrected) corrected++;
      const month = (date.match(/^(\d{4})-(\d{2})/) || []).slice(1, 3).join('-');
      const title = manySessions && date
        ? meta.title + ' · ' + date.slice(0, 10)
        : meta.title;

      const rowId = position.rowId !== undefined && raw[position.rowId] !== undefined
        ? String(raw[position.rowId]).trim()
        : String(index + 1);

      const row = columns.map(function () { return ''; });
      row[at('Response ID')]   = meta.fileName + '#' + rowId;
      row[at('Session Date')]  = date.slice(0, 10);
      row[at('Month')]         = month;
      // ONLY what the form itself said. Left blank, the module is worked out
      // at scoring time from the filename and, failing that, the trainer —
      // which means a mapping fixed in Config re-files the responses already
      // stored. Writing a guess in here froze it, and a file the filename
      // could not place stayed '(unassigned)' for good.
      row[at('Module')]        = position.module !== undefined
        ? String(raw[position.module] || '').trim() : '';
      row[at('Session Title')] = title;
      row[at('Trainer')]       = meta.trainer;
      row[at('Plant')]         = position.plant !== undefined ? String(raw[position.plant] || '') : '';
      row[at('Employee ID')]   = position.empId !== undefined ? String(raw[position.empId] || '') : '';
      row[at('Employee Name')] = position.empName !== undefined ? String(raw[position.empName] || '') : '';

      const qCols = ['Q1 Overall', 'Q2 Relevance', 'Q3 Trainer Knowledge', 'Q4 Explanation',
                     'Q5 Materials', 'Q6 Confidence', 'Q7 Duration'];
      qCols.forEach(function (name, i) { row[at(name)] = answers[i]; });

      row[at('Source File')] = meta.fileName;
      row[at('Zone')] = position.zone !== undefined ? String(raw[position.zone] || '').trim() : '';
      out.push(row);
    });

    out.corrected = corrected;
    out.moduleFound = detectModule(file.fileName) !== '';
    return out;
  }


  /**
   * When did this attendee's session run?
   *
   * TWO SOURCES, AND ONLY ONE OF THEM IS TRUSTWORTHY ON ITS OWN.
   * 'Date & Time' is typed by the attendee, so it carries whatever they wrote
   * and whatever Excel then made of it — a session held in June 2026 came
   * through as January 1974, June 1984, March 1993 and September 2003 across
   * the real files, because a two-digit year typed into a text box is read as
   * a date by Excel when the sheet is opened and saved. 'Completion time' is
   * stamped by the form when the response is submitted and cannot be typed
   * wrong.
   *
   * So the typed date is used only when it agrees with the submission to
   * within FEEDBACK_DATE_TOLERANCE_DAYS — feedback is filled in at the session
   * or within days of it — and the submission timestamp is used otherwise.
   * That is self-calibrating: no hardcoded earliest year to maintain, and it
   * catches a date typed wrong in either direction.
   *
   * @return {Object} { date, submitted, corrected }
   */
  function feedbackDateParts(raw, position) {
    const typed = position.when !== undefined ? asDate(raw[position.when]) : '';
    const submitted = position.completed !== undefined
      ? asDate(raw[position.completed]) : '';

    if (!typed) return { date: submitted, submitted: submitted, corrected: false };
    if (!submitted) return { date: typed, submitted: '', corrected: false };

    const gap = Math.abs(Date.parse(typed.slice(0, 10)) - Date.parse(submitted.slice(0, 10)));
    const days = gap / 86400000;

    if (isFinite(days) && days > FEEDBACK_DATE_TOLERANCE_DAYS) {
      return { date: submitted, submitted: submitted, corrected: true };
    }
    return { date: typed, submitted: submitted, corrected: false };
  }


  /** Feedback is filled in at the session, not years later. */
  const FEEDBACK_DATE_TOLERANCE_DAYS = 120;


  function feedbackDate(raw, position) {
    return feedbackDateParts(raw, position).date;
  }


  /** A cell as 'YYYY-MM-DD…', whether it arrived as a Date or as text. */
  function asDate(value) {
    if (value instanceof Date) return formatDate(value);
    const text = String(value === null || value === undefined ? '' : value).trim();
    return /^\d{4}-\d{2}-\d{2}/.test(text) ? text : '';
  }


  /**
   * Which SAP module, from the filename? Mirrors moduleFor() in Config.gs.
   *
   * Duplicated rather than round-tripped to the server: the browser needs it
   * while parsing, and a server call per file would add a round trip to every
   * upload for a string match.
   */
  function detectModule(fileName) {
    const text = String(fileName || '').toLowerCase();
    const modules = (state.boot && state.boot.trainingModules) || [];

    for (let i = 0; i < modules.length; i++) {
      for (let j = 0; j < modules[i].match.length; j++) {
        const pattern = modules[i].match[j].replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        if (new RegExp('(^|[^a-z0-9])' + pattern + '([^a-z0-9]|$)').test(text)) {
          return modules[i].name;
        }
      }
    }

    // Last resort: some files are named only after the trainer who ran the
    // session. Mirrors moduleForResponse in Config.gs — this copy exists only
    // so the upload summary can name the module while parsing, without a
    // round trip to the server per file.
    const trainers = (state.boot && state.boot.trainerModules) || [];
    for (let i = 0; i < trainers.length; i++) {
      if (new RegExp('(^|[^a-z0-9])' + trainers[i].match + '([^a-z0-9]|$)').test(text)) {
        return trainers[i].name;
      }
    }
    return '';
  }


  /** Which EAS section, judged from the filename. */
  /**
   * Guesses a section from the filename.
   *
   * A hint, not the answer — the section that ends up on the dashboard comes
   * from the roster, keyed on who handled each ticket. This only matters for
   * an individual the org chart does not list, where the filename is the last
   * thing left to go on.
   *
   * Returns '' for a combined export, which is expected and fine.
   */
  function detectSection(fileName) {
    const lower = String(fileName).toLowerCase();
    const sections = (state.boot && state.boot.departments) || [];

    // Matched at a word boundary, not as a bare substring: 'eas' is three
    // letters and sits inside 'release', 'measure' and plenty more. Longest
    // match wins too, so 'Financial_...' cannot be claimed by a shorter
    // pattern that happens to appear inside it.
    let best = '';
    let bestLength = 0;
    sections.forEach(function (s) {
      if (!s.match || s.match.length <= bestLength) return;
      const bounded = new RegExp('(^|[^a-z])' + s.match + '([^a-z]|$)');
      if (bounded.test(lower)) {
        best = s.name;
        bestLength = s.match.length;
      }
    });
    return best;
  }


  function normalizeRows(file, type, section) {
    const columns = state.boot.ticketColumns;

    const position = {};
    file.headers.forEach(function (name, i) {
      if (name && position[name] === undefined) position[name] = i;
    });

    const idIndex = position['Ticket ID'];
    if (idIndex === undefined) {
      throw new Error(file.fileName + ' has no "Ticket ID" column — is it an ITSM export?');
    }

    const out = [];

    file.rows.forEach(function (raw) {
      const ticketId = String(raw[idIndex] == null ? '' : raw[idIndex]).trim();
      if (!ticketId) return;

      const row = columns.map(function (columnName) {
        switch (columnName) {
          case 'Department':        return type === 'INDIVIDUAL' ? section : '';
          case 'In Overall Report': return type === 'OVERALL';
          case 'In Dept Report':    return type === 'INDIVIDUAL';
          case 'Source Files':      return file.fileName;
          case 'Last Updated':      return '';
        }

        const at = position[columnName];
        if (at === undefined) return '';

        let value = raw[at];
        if (value === null || value === undefined) return '';

        if (columnName === 'Details') {
          value = String(value);
          return value.length > DETAILS_LIMIT ? value.slice(0, DETAILS_LIMIT) + '…' : value;
        }
        if (value instanceof Date) return formatDate(value);

        return typeof value === 'number' ? value : String(value);
      });

      out.push(row);
    });

    return out;
  }


  function mergeFiles(perFile, columns) {
    const idAt        = columns.indexOf('Ticket ID');
    const overallAt   = columns.indexOf('In Overall Report');
    const deptAt      = columns.indexOf('In Dept Report');
    const sourceAt    = columns.indexOf('Source Files');
    const sectionAt   = columns.indexOf('Department');

    const byId = {};
    const order = [];

    perFile.forEach(function (rows) {
      rows.forEach(function (row) {
        const id = row[idAt];

        if (!byId[id]) {
          byId[id] = row.slice();
          order.push(id);
          return;
        }

        const kept = byId[id];

        for (let i = 0; i < columns.length; i++) {
          if (i === overallAt || i === deptAt || i === sourceAt) continue;
          if (isBlank(kept[i]) && !isBlank(row[i])) kept[i] = row[i];
        }

        // A ticket can legitimately appear in both reports. OR the flags so
        // the ones appearing in only one stay countable.
        kept[overallAt] = Boolean(kept[overallAt]) || Boolean(row[overallAt]);
        kept[deptAt]    = Boolean(kept[deptAt])    || Boolean(row[deptAt]);

        // A section export is authoritative about which section owns it.
        if (isBlank(kept[sectionAt]) && !isBlank(row[sectionAt])) {
          kept[sectionAt] = row[sectionAt];
        }

        const sources = String(kept[sourceAt] || '').split(' | ')
          .concat(String(row[sourceAt] || '').split(' | '))
          .filter(function (s) { return s.trim() !== ''; });
        kept[sourceAt] = sources.filter(function (s, i) {
          return sources.indexOf(s) === i;
        }).join(' | ');
      });
    });

    return order.map(function (id) { return byId[id]; });
  }


  // =========================================================================
  // UPLOADING
  // =========================================================================

  function wireUploads() {
    const zone = document.getElementById('dropzone');
    const input = document.getElementById('fileInput');
    if (!zone || !input) return;

    zone.addEventListener('click', function () { if (!state.busy) input.click(); });

    ['dragenter', 'dragover'].forEach(function (type) {
      zone.addEventListener(type, function (event) {
        event.preventDefault();
        if (!state.busy) zone.classList.add('is-over');
      });
    });

    ['dragleave', 'drop'].forEach(function (type) {
      zone.addEventListener(type, function (event) {
        event.preventDefault();
        zone.classList.remove('is-over');
      });
    });

    zone.addEventListener('drop', function (event) {
      if (!state.busy) handleFiles(event.dataTransfer.files);
    });

    input.addEventListener('change', function () {
      if (!state.busy) handleFiles(input.files);
      input.value = '';
    });
  }


  function handleFiles(fileList) {
    if (!fileList || !fileList.length) return;
    if (!state.boot || !state.boot.configured) {
      return setStatus('The database is not connected yet.', 'error');
    }

    const files = Array.prototype.slice.call(fileList).filter(function (f) {
      return /\.xlsx$/i.test(f.name);
    });

    if (!files.length) return setStatus('No .xlsx files in that selection.', 'error');

    state.busy = true;
    runUpload(files)
      .catch(function (err) {
        setStatus('Upload failed: ' + (err && err.message ? err.message : err), 'error');
      })
      .then(function () { state.busy = false; });
  }


  /**
   * Reads every dropped file, then sends each kind down its own pipeline.
   *
   * ONE DROPZONE, TWO KPIs. A ticket export scores KPI 1 and a training
   * feedback form scores KPI 2, and the two share nothing — different sheets,
   * different merge keys, different maths. Rather than ask which is which,
   * the headers are read and each file is routed on what it actually is. Drop
   * both kinds together and both land correctly.
   */
  async function runUpload(files) {
    setStatus('Reading ' + files.length + ' file(s)…');

    const read = [];
    const summary = [];

    for (let i = 0; i < files.length; i++) {
      const parsed = await readWorkbook(files[i]);
      const type = detectReportType(parsed.headers);
      read.push({ parsed: parsed, type: type });
      summary.push({ name: parsed.fileName, type: type, dept: '', rows: parsed.rows.length });
      setStatus('Read ' + (i + 1) + ' of ' + files.length + ' file(s)…', null, summary);
    }

    const tickets = read.filter(function (f) { return f.type !== 'FEEDBACK'; });
    const feedback = read.filter(function (f) { return f.type === 'FEEDBACK'; });

    if (feedback.length) await uploadFeedback(feedback, summary);
    if (tickets.length)  await uploadTickets(tickets, summary);

    await refreshAfterChange();
  }


  /** KPI 2 — training feedback forms. */
  async function uploadFeedback(files, summary) {
    const columns = state.boot.trainingColumns;
    const meta = { fileNames: [], reportTypes: [], departments: [], totalRows: 0,
                   kind: 'FEEDBACK' };
    const rows = [];

    // Files the filename could not place, and responses whose typed session
    // date had to be overruled. Both are reported rather than quietly
    // absorbed: an unplaced file lands in the '(unassigned)' module and a
    // wrong date lands in the wrong month, and neither is visible afterwards
    // unless the upload says so.
    const unnamed = [];
    let corrected = 0;

    files.forEach(function (f) {
      const parsed = normalizeFeedback(f.parsed, columns);
      rows.push.apply(rows, parsed);
      corrected += parsed.corrected || 0;

      const detected = detectModule(f.parsed.fileName);
      if (!detected) unnamed.push(f.parsed.fileName);

      const module = detected || 'Unrecognised module';
      meta.fileNames.push(f.parsed.fileName);
      meta.reportTypes.push('FEEDBACK');
      meta.departments.push(module);
      meta.totalRows += parsed.length;

      // Overwrite this file's line in the shared summary with what we learned.
      summary.forEach(function (s) {
        if (s.name === f.parsed.fileName) { s.dept = module; s.rows = parsed.length; }
      });
    });

    if (!rows.length) {
      throw new Error('No feedback responses found in those files.');
    }

    state.lastFeedbackNotes = { unnamed: unnamed, corrected: corrected };

    const monthAt = columns.indexOf('Month');
    const dateAt = columns.indexOf('Session Date');
    const dates = rows.map(function (r) { return String(r[dateAt] || ''); })
                      .filter(Boolean).sort();
    meta.dateFrom = dates[0] || '';
    meta.dateTo = dates[dates.length - 1] || '';

    const months = {};
    rows.forEach(function (r) { if (r[monthAt]) months[r[monthAt]] = true; });

    setStatus('Read ' + rows.length + ' feedback responses across ' +
              Object.keys(months).length + ' month(s). Uploading…', null, summary);

    const begun = await callServer('beginUpload', meta);

    for (let start = 0; start < rows.length; start += BATCH_SIZE) {
      await callServer('appendFeedbackBatch', begun.uploadId,
                       rows.slice(start, start + BATCH_SIZE));
      const done = Math.min(start + BATCH_SIZE, rows.length);
      setStatus('Uploading… ' + done + ' of ' + rows.length + ' responses (' +
                Math.round((done / rows.length) * 100) + '%)', null, summary);
    }

    const result = await callServer('finishFeedbackUpload', begun.uploadId);

    const notes = [];
    if (corrected) {
      notes.push(' ' + corrected + ' response' + (corrected === 1 ? ' had its' : 's had their') +
                 ' typed session date replaced with the submission date — see below.');
    }
    if (unnamed.length) {
      notes.push(' ' + unnamed.length + ' file' + (unnamed.length === 1 ? '' : 's') +
                 ' could not be placed in a module — see below.');
    }

    setStatus('Done. ' + result.kept + ' feedback responses stored for KPI 2' +
              (result.merged ? ', ' + result.merged + ' duplicates collapsed' : '') + '.' +
              notes.join(''),
              'ok', summary);
  }


  /** KPI 1 — ITSM ticket exports. Unchanged behaviour, now behind a router. */
  async function uploadTickets(files, summary) {
    const columns = state.boot.ticketColumns;

    const perFile = [];
    const meta = { fileNames: [], reportTypes: [], departments: [], totalRows: 0 };

    for (let i = 0; i < files.length; i++) {
      const parsed = files[i].parsed;
      const type = files[i].type;
      const section = type === 'INDIVIDUAL' ? detectSection(parsed.fileName) : '';

      // A filename with no section in it is no longer an error. Every section
      // is resolved from the individual who handled the ticket (see
      // sectionFor in Config.gs), so one combined export of all four sections
      // works exactly as well as four separate ones — and the filename is
      // only ever a hint for people who are not on the org chart.

      const rows = normalizeRows(parsed, type, section);
      perFile.push(rows);

      meta.fileNames.push(parsed.fileName);
      meta.reportTypes.push(type);
      // 'All sections' rather than a blank, so the upload log says plainly
      // that this file was not one section's export.
      const label = type === 'INDIVIDUAL' ? (section || 'All sections') : '';
      if (label) meta.departments.push(label);
      meta.totalRows += rows.length;

      summary.forEach(function (sm) {
        if (sm.name === parsed.fileName) { sm.dept = label; sm.rows = rows.length; }
      });
    }

    const merged = mergeFiles(perFile, columns);

    const dateAt = columns.indexOf('Request Date');
    const dates = merged.map(function (r) { return String(r[dateAt] || '').slice(0, 10); })
                        .filter(Boolean).sort();
    meta.dateFrom = dates[0] || '';
    meta.dateTo = dates[dates.length - 1] || '';

    setStatus('Merged ' + meta.totalRows + ' rows into ' + merged.length +
              ' unique tickets (' + meta.dateFrom + ' to ' + meta.dateTo + '). Uploading…',
              null, summary);

    const begun = await callServer('beginUpload', meta);

    for (let start = 0; start < merged.length; start += BATCH_SIZE) {
      await callServer('appendTicketBatch', begun.uploadId, merged.slice(start, start + BATCH_SIZE));
      const done = Math.min(start + BATCH_SIZE, merged.length);
      setStatus('Uploading… ' + done + ' of ' + merged.length + ' tickets (' +
                Math.round((done / merged.length) * 100) + '%)', null, summary);
    }

    // Two calls, not one. Consolidating and re-scoring together used to run
    // past the server's six-minute ceiling on a large upload, and the run was
    // killed part-way through rewriting the sheet.
    setStatus('Consolidating ' + merged.length + ' tickets…', null, summary);
    const result = await callServer('finishUpload', begun.uploadId);

    setStatus('Stored ' + result.kept + ' tickets. Recomputing KPI 1…', null, summary);
    await callServer('recomputeAfterUpload');

    setStatus('Done. ' + result.kept + ' tickets stored' +
              (result.merged ? ', ' + result.merged + ' duplicate rows collapsed' : '') + '.',
              'ok', summary);
  }


  /** Re-reads what exists after any change to the stored data. */
  /**
   * Re-reads everything after data has been added or removed.
   *
   * Every cached answer is dropped, not just the screen in front of you. A
   * delete used to leave state.trend and state.compare holding figures for
   * rows that no longer existed, so the Comparison screen went on drawing
   * deleted data until the tab was reloaded.
   */
  async function refreshAfterChange() {
    const boot = await callServer('getBootstrap');
    state.boot = boot;

    state.kpi2 = null;
    state.trend = null;
    state.compare = null;

    fillMonthPicker(boot.availableMonths);
    fillScopeFilter(boot.availableMonths);
    fillFeedbackQuarters(boot.feedbackQuarters);
    fillComparePeriods(comparePeriodList());
    fillSettings(boot);
    loadUploads();

    if (state.view === 'kpi1') loadKpi1();
    if (state.view === 'kpi2') loadKpi2();
    if (state.view === 'compare') {
      loadTrend();
      if (state.compareRan) runComparison();
    }
  }


  function setStatus(message, kind, files) {
    const box = document.getElementById('uploadStatus');
    if (!box) return;

    box.hidden = false;

    let colour = 'var(--text-dim)';
    if (kind === 'error') colour = 'var(--red)';
    if (kind === 'ok') colour = 'var(--green)';

    let html = '<strong style="color:' + colour + '">' + escapeHtml(message) + '</strong>';

    if (files && files.length) {
      html += '<div style="margin-top:8px" class="muted">';
      files.forEach(function (f) {
        html += escapeHtml(f.name) + ' — ' + f.type +
                (f.dept ? ' · ' + escapeHtml(f.dept) : '') + ' · ' + f.rows + ' rows<br>';
      });
      html += '</div>';
    }

    box.innerHTML = html;
  }


  /**
   * Offers to clear responses whose upload no longer exists.
   *
   * These are the wreckage of the old delete, which removed the log row and
   * the tickets and left the TRAINING tab alone. They cannot be seen in the
   * upload history — there is nothing left to see — but KPI 2 still counts
   * them, which is why a deleted feedback file went on showing attendees.
   *
   * Drawn on both the KPI 2 and Data Uploads screens: one is where the wrong
   * number shows, the other is where data is managed.
   */
  function renderOrphans() {
    const n = (state.boot && state.boot.orphanedFeedback) || 0;

    ['kpi2Orphans', 'uploadOrphans'].forEach(function (id) {
      const box = document.getElementById(id);
      if (!box) return;

      if (!n) { box.hidden = true; return; }

      box.hidden = false;
      box.innerHTML =
        '<h3>' + count(n) + ' training response' + (n === 1 ? '' : 's') +
        ' left over from a deleted upload</h3>' +
        '<p>' + (n === 1 ? 'It belongs' : 'They belong') + ' to a feedback file ' +
        'that is no longer in the upload history, so ' +
        (n === 1 ? 'it is' : 'they are') + ' still being counted in KPI 2 with ' +
        'no way to see where ' + (n === 1 ? 'it' : 'they') + ' came from. ' +
        'Earlier versions removed the history entry without removing the ' +
        'responses; that is fixed, but what was already orphaned is still here.</p>' +
        '<p><button class="btn btn-danger" data-purge="1">' +
        'Remove ' + count(n) + ' orphaned response' + (n === 1 ? '' : 's') +
        '</button></p>';
    });

    document.querySelectorAll('[data-purge]').forEach(function (button) {
      button.addEventListener('click', function () { askThenPurge(button); });
    });
  }


  function askThenPurge(button) {
    const n = (state.boot && state.boot.orphanedFeedback) || 0;

    confirmDialog({
      title: 'Remove the orphaned responses?',
      subtitle: count(n) + ' response' + (n === 1 ? '' : 's'),
      body:
        '<p>Only responses whose upload is <strong>no longer in the ' +
        'history</strong> are removed. Everything belonging to an upload you ' +
        'can still see is kept, untouched.</p>' +
        '<p>KPI 2 is scored live, so its figures correct themselves as soon ' +
        'as this finishes.</p>' +
        '<p>This cannot be undone. If you want the data back, re-upload the ' +
        'file it came from.</p>',
      confirmLabel: 'Remove them'
    }).then(function (yes) {
      if (!yes) return;

      button.disabled = true;
      setStatus('Removing ' + count(n) + ' orphaned responses…');

      return withTimeout(callServer('purgeOrphanedFeedback'), 120000, 'The cleanup')
        .then(function (result) {
          setStatus('Removed ' + count(result.removed) + ' orphaned response' +
                    (result.removed === 1 ? '' : 's') + ' — ' +
                    count(result.kept) + ' kept.', 'ok');
          return refreshAfterChange();
        })
        .catch(function (err) {
          button.disabled = false;
          onError(err);
          return refreshAfterChange().catch(function () {});
        });
    });
  }


  function loadUploads() {
    if (!state.boot || !state.boot.configured) return;
    renderOrphans();

    callServer('getUploadHistory').then(function (history) {
      const body = document.querySelector('#uploadTable tbody');
      if (!body) return;

      if (!history || !history.length) {
        body.innerHTML = '<tr><td colspan="8" class="empty">Nothing uploaded yet.</td></tr>';
        return;
      }

      renderMissingData(history);

      body.innerHTML = '';
      history.forEach(function (h) {
        const deleted = /^deleted/.test(h.notes || '');
        const tr = document.createElement('tr');

        tr.innerHTML =
          '<td>' + escapeHtml(String(h.uploadedAt).slice(0, 16).replace('T', ' ')) + '</td>' +
          '<td style="max-width:340px">' + escapeHtml(h.fileName) + '</td>' +
          '<td>' + escapeHtml(h.reportType) + '</td>' +
          '<td>' + escapeHtml(h.department) + '</td>' +
          '<td class="r">' + h.rowsInFile + '</td>' +
          '<td class="r">' + h.rowsKept + '</td>' +
          '<td>' + escapeHtml(h.dateFrom + ' → ' + h.dateTo) + '</td>' +
          '<td>' + (deleted
            ? '<span class="pill a">' + escapeHtml(h.notes) + '</span>'
            : rowActions(h.uploadId)) + '</td>';

        body.appendChild(tr);
      });

      wireRowActions();
    }).catch(onError);
  }


  /**
   * Says so when the history claims rows the database does not have.
   *
   * The two can disagree after a run is killed part-way: the log entry was
   * written and flushed at the start of the upload, the rows were not. Before
   * this, the only sign was a KPI screen that had gone blank while the history
   * still confidently listed 19,946 tickets, which reads as the dashboard
   * being broken rather than as the data being gone.
   */
  function renderMissingData(history) {
    const box = document.getElementById('uploadMissing');
    if (!box) return;

    const stats = (state.boot && state.boot.stats) || {};
    const claimed = history.filter(function (h) {
      return String(h.reportType || '').toUpperCase().indexOf('FEEDBACK') === -1 &&
             h.rowsKept > 0;
    });

    if (!claimed.length || (stats.tickets || 0) > 0) { box.hidden = true; return; }

    box.hidden = false;
    box.innerHTML =
      '<h3>' + claimed.length + ' ticket upload' + (claimed.length === 1 ? '' : 's') +
      ' logged, but no tickets are stored</h3>' +
      '<p>The history below says these uploads landed, and the TICKETS sheet ' +
      'is empty. That happens when a run is stopped part-way: the log entry ' +
      'is written when the upload starts, the rows only as it finishes.</p>' +
      '<p>KPI 1 has nothing to report until the exports are uploaded again. ' +
      'Delete the ' + claimed.length + ' row' + (claimed.length === 1 ? '' : 's') +
      ' below and re-upload the files — the history entries describe data ' +
      'that no longer exists, so leaving them only makes this harder to read.</p>';
  }


  function rowActions(uploadId) {
    const id = escapeHtml(uploadId);
    return '<div class="row-actions">' +
      '<button class="btn-open" data-open="' + id + '">Open Dashboard</button>' +
      '<button class="btn-icon is-primary" data-download="' + id + '" title="Download CSV">' +
        '<svg viewBox="0 0 16 16"><path d="M8 2v8M5 7l3 3 3-3M3 13h10"/></svg></button>' +
      '<button class="btn-icon is-danger" data-delete="' + id + '" title="Delete this upload">' +
        '<svg viewBox="0 0 16 16"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.6 9.5h6.8L12 4"/></svg></button>' +
      '</div>';
  }


  function wireRowActions() {
    document.querySelectorAll('[data-open]').forEach(function (button) {
      button.addEventListener('click', function () { openUpload(button.closest('tr')); });
    });

    document.querySelectorAll('[data-download]').forEach(function (button) {
      button.addEventListener('click', function () {
        button.disabled = true;
        callServer('getUploadCsv', button.dataset.download)
          .then(function (file) {
            downloadText(file.fileName, file.csv);
            button.disabled = false;
          })
          .catch(function (err) {
            button.disabled = false;
            onError(err);
          });
      });
    });

    document.querySelectorAll('[data-delete]').forEach(function (button) {
      button.addEventListener('click', function () { askThenDelete(button); });
    });
  }


  /**
   * Opens the dashboard an upload feeds, showing the whole of what it loaded.
   *
   * TWO THINGS THIS HAS TO GET RIGHT.
   *
   * Which KPI. The Type cell lists one entry per file, so a mixed drop reads
   * 'FEEDBACK | INDIVIDUAL | …'. Testing for the word FEEDBACK anywhere sent
   * every such upload to KPI 2. It now counts which kind the upload is mostly
   * made of, and ticket exports win a tie because that is the older, larger
   * pipeline.
   *
   * Which period. The Range cell holds 'YYYY-MM-DD → YYYY-MM-DD' and the code
   * took the first seven characters — the FIRST month of the range. An
   * overall export covering January to September therefore opened on January
   * and showed one nineth of itself, or nothing at all if January happened to
   * be thin. An upload that spans several months now opens on All months,
   * which is the only period that shows what was actually uploaded. A month
   * the dashboard does not list falls back to All months rather than landing
   * on an empty screen.
   *
   * This is what makes overall and section-wise exports equally openable: the
   * section files each cover one slice, the overall file covers the year, and
   * neither has to be treated differently.
   */
  function openUpload(row) {
    if (!row) return showView('kpi1');

    const types = row.children[2].textContent.toUpperCase().split('|');
    let feedback = 0;
    let tickets = 0;
    types.forEach(function (t) {
      if (t.indexOf('FEEDBACK') !== -1) feedback++;
      else if (t.trim()) tickets++;
    });

    const range = row.children[6].textContent.trim();
    const found = range.match(/(\d{4}-\d{2})-\d{2}[^\d]*(\d{4}-\d{2})?/);
    const from = found ? found[1] : '';
    const to = found && found[2] ? found[2] : from;
    // One month covered: open on it. More than one: open on all of them.
    const wanted = (from && from === to) ? from : ALL_MONTHS;

    if (feedback > tickets) {
      // KPI 2 reports by quarter. The filenames name it now, so they are asked
      // first — the session dates behind `from` and `to` are the unreliable
      // half of this, and an upload of files all named Q1-2026 should open on
      // Q1 2026 whatever Excel did to the dates inside them.
      const named = quartersInText(row.children[1].textContent);
      const fromQ = named.length ? named[0] : quarterForMonth(from);
      const toQ   = named.length ? named[named.length - 1] : quarterForMonth(to);
      setValue('kpi2Month', (fromQ && fromQ === toQ) ? fromQ : ALL_MONTHS);
      showView('kpi2');
      loadKpi2();
      return;
    }

    const months = (state.boot && state.boot.availableMonths) || [];
    state.month = (wanted !== ALL_MONTHS && months.indexOf(wanted) !== -1)
      ? wanted : ALL_MONTHS;
    syncMonthPicker();
    showView('kpi1');
  }


  /**
   * Confirms, deletes, and puts the table back in step with the database.
   *
   * The old version asked with window.confirm, then relied on the server
   * replying to refresh anything. deleteUpload could take minutes — long
   * enough to be killed — so the reply often never came, nothing on screen
   * moved, and the upload looked as though it had refused to be deleted.
   *
   * Now: the row is greyed out the moment work starts, removed from the table
   * as soon as the server confirms, and the history is re-read either way —
   * including after an error, because a failed call is exactly when the table
   * on screen is most likely to be lying.
   */
  function askThenDelete(button) {
    const id = button.dataset.delete;
    const row = button.closest('tr');

    const fileName = row ? row.children[1].textContent.trim() : '';
    const type     = row ? row.children[2].textContent.trim().toUpperCase() : '';
    const rows     = row ? row.children[5].textContent.trim() : '';
    const range    = row ? row.children[6].textContent.trim() : '';
    const feedback = type.indexOf('FEEDBACK') !== -1;
    const noun     = feedback ? 'training responses' : 'tickets';

    // One upload can carry forty-three files. Listing every name as the
    // headline buried the question and pushed the buttons off the screen, so
    // the count leads and the names go in a scroller underneath.
    const names = fileName.split('|').map(function (n) { return n.trim(); }).filter(Boolean);
    const heading = names.length > 1
      ? names.length + ' files'
      : (names[0] || id);

    confirmDialog({
      title: 'Delete this upload?',
      subtitle: id,
      target:
        '<span class="modal-target"><b>' + escapeHtml(heading) + '</b>' +
        '<span>' + escapeHtml(type.split('|')[0].trim() || '—') + ' · ' +
        escapeHtml(rows || '0') + ' stored · ' +
        escapeHtml(range || 'no date range') + '</span>' +
        (names.length > 1
          ? '<span class="modal-files">' +
            names.map(function (n) { return '<div>' + escapeHtml(n) + '</div>'; }).join('') +
            '</span>'
          : '') +
        '</span>',
      body:
        '<p>The <strong>' + noun + '</strong> that came only from this upload are ' +
        'removed, and it disappears from the history.</p>' +
        (feedback
          ? '<p>KPI 2 is scored live from the stored responses, so its figures ' +
            'change as soon as this finishes.</p>'
          : '<p>Tickets another upload also supplied are <strong>kept</strong> — ' +
            'only this upload\'s claim on them is dropped. KPI 1 is then ' +
            'recalculated, which takes a few seconds.</p>') +
        '<p>This cannot be undone.</p>',
      confirmLabel: 'Delete upload'
    }).then(function (yes) {
      if (!yes) return;

      if (row) row.classList.add('row-busy');
      button.disabled = true;
      setStatus('Deleting ' + heading + '…');

      return withTimeout(callServer('deleteUpload', id), 120000, 'The delete')
        .then(function (result) {
          // Drop the row immediately rather than waiting on the reload. The
          // answer to "did that work?" should not depend on a second round
          // trip that might itself be slow.
          if (row && row.parentNode) row.parentNode.removeChild(row);
          setStatus(describeDeletion(heading, result), 'ok');
          return refreshAfterChange();
        })
        .catch(function (err) {
          if (row) row.classList.remove('row-busy');
          button.disabled = false;
          onError(err);
          // Re-read regardless: the delete may well have landed even though
          // the reply did not, and a stale table is worse than a slow one.
          return refreshAfterChange().catch(function () {});
        });
    });
  }


  function describeDeletion(name, result) {
    const parts = [];
    if (result.removed)         parts.push(count(result.removed) + ' tickets removed');
    if (result.feedbackRemoved) parts.push(count(result.feedbackRemoved) + ' responses removed');
    if (!parts.length)          parts.push('no stored rows belonged to it');
    return 'Deleted ' + name + ' — ' + parts.join(', ') + '.';
  }


  // =========================================================================
  // CONFIRMATION DIALOG
  // =========================================================================

  /**
   * Asks the question and resolves true or false.
   *
   * window.confirm() headed its box with the googleusercontent sandbox
   * hostname, could not name the file being deleted, and gave Delete and
   * Cancel identical weight. This one names the target, spells out the
   * consequence, rests focus on Cancel, and takes Esc as no.
   *
   * @param {Object} opts { title, subtitle, body, target, confirmLabel, tone }
   * @return {Promise<boolean>}
   */
  function confirmDialog(opts) {
    const backdrop = document.getElementById('modalBackdrop');
    const box = document.getElementById('modal');
    if (!backdrop || !box) return Promise.resolve(window.confirm(opts.title));

    const danger = opts.tone !== 'info';

    box.className = 'modal' + (danger ? '' : ' is-info');
    document.getElementById('modalIcon').innerHTML = danger
      ? '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13"/>' +
        '<path d="M10 11v5M14 11v5"/></svg>'
      : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/>' +
        '<path d="M12 11v5M12 8h.01"/></svg>';

    document.getElementById('modalTitle').textContent = opts.title || 'Are you sure?';
    document.getElementById('modalSub').textContent = opts.subtitle || '';
    document.getElementById('modalBody').innerHTML =
      (opts.target || '') + (opts.body || '');

    const confirm = document.getElementById('modalConfirm');
    const cancel = document.getElementById('modalCancel');
    confirm.textContent = opts.confirmLabel || 'Delete';
    confirm.className = 'btn ' + (danger ? 'btn-danger' : 'btn-primary');
    confirm.disabled = false;

    backdrop.hidden = false;
    // Cancel takes focus, not Delete — Enter should not destroy anything.
    // Unless there is no Cancel, which is alertDialog's one-button form.
    (cancel.hidden ? confirm : cancel).focus();

    return new Promise(function (resolve) {
      function close(answer) {
        backdrop.hidden = true;
        confirm.removeEventListener('click', onYes);
        cancel.removeEventListener('click', onNo);
        backdrop.removeEventListener('mousedown', onOutside);
        document.removeEventListener('keydown', onKey);
        resolve(answer);
      }
      function onYes() { close(true); }
      function onNo() { close(false); }
      function onOutside(e) { if (e.target === backdrop) close(false); }
      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); close(false); }
        // Keep focus inside the dialog while it is open.
        if (e.key === 'Tab') {
          e.preventDefault();
          if (cancel.hidden) return confirm.focus();
          (document.activeElement === cancel ? confirm : cancel).focus();
        }
      }

      confirm.addEventListener('click', onYes);
      cancel.addEventListener('click', onNo);
      backdrop.addEventListener('mousedown', onOutside);
      document.addEventListener('keydown', onKey);
    });
  }


  /**
   * Says something, one button, nothing to decide.
   *
   * Same dialog with Cancel hidden, so the last window.alert — the browser box
   * headed with the sandbox hostname — is gone from the app too.
   */
  function alertDialog(opts) {
    const cancel = document.getElementById('modalCancel');
    if (cancel) cancel.hidden = true;

    return confirmDialog({
      title: opts.title,
      subtitle: opts.subtitle,
      body: opts.body,
      tone: 'info',
      confirmLabel: opts.confirmLabel || 'Got it'
    }).then(function (answer) {
      if (cancel) cancel.hidden = false;
      return answer;
    });
  }


  /**
   * Hands the browser a file to save.
   *
   * A Blob URL rather than a data: URI — data: URIs have length limits that a
   * few thousand ticket rows would blow straight past.
   */
  function downloadText(fileName, text) {
    try {
      const blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) {
      alertDialog({
        title: 'Could not start the download',
        body: '<p>' + escapeHtml(e.message) + '</p>'
      });
    }
  }


  // =========================================================================
  // KPI 1
  // =========================================================================

  /**
   * The month picker, with an "All months" option at the top.
   *
   * All months is a real aggregate, not an average of the monthly rates —
   * see getKpi1() in Kpi.gs for why those differ. The default stays the newest
   * single month, because the KPI itself is reported monthly; all-time is a
   * view you choose, not the one you land on.
   */
  function fillMonthPicker(months) {
    const picker = document.getElementById('monthPicker');
    if (!picker) return;

    if (!months || !months.length) {
      picker.innerHTML = '<option value="">No data loaded</option>';
      picker.disabled = true;
      return;
    }

    const valid = [ALL_MONTHS].concat(months);
    if (!state.month || valid.indexOf(state.month) === -1) state.month = months[0];

    picker.innerHTML = '';
    picker.disabled = false;

    const all = document.createElement('option');
    all.value = ALL_MONTHS;
    all.textContent = 'All months (' + months.length + ')';
    picker.appendChild(all);

    // A rule between the aggregate and the individual months, so the first
    // real month is not mistaken for part of the same group.
    const divider = document.createElement('option');
    divider.disabled = true;
    divider.textContent = '──────────';
    picker.appendChild(divider);

    months.forEach(function (month) {
      const option = document.createElement('option');
      option.value = month;
      option.textContent = formatMonth(month);
      picker.appendChild(option);
    });

    picker.value = state.month;
  }


  function syncMonthPicker() {
    const picker = document.getElementById('monthPicker');
    if (picker && picker.value !== state.month) picker.value = state.month;
    saveState();
  }


  function loadKpi1() {
    if (!state.boot || !state.boot.configured || !state.month) return;
    callServer('getKpi1', state.month).then(renderKpi1).catch(onError);
  }


  /**
   * Says why the screen is empty when the uploads say it should not be.
   *
   * "No data for this month" beside an upload history listing 19,946 tickets
   * reads as a broken dashboard. It is not: the tickets are not in the
   * database. Saying which of the two it is turns an unanswerable screen into
   * one instruction.
   */
  function renderKpi1Missing() {
    const box = document.getElementById('kpi1Missing');
    if (!box) return;

    const boot = state.boot || {};
    const stored = (boot.stats && boot.stats.tickets) || 0;
    const uploads = (boot.stats && boot.stats.ticketUploads) || 0;

    if (stored > 0 || !uploads) { box.hidden = true; return; }

    box.hidden = false;
    box.innerHTML =
      '<h3>No tickets are stored, though ' + uploads + ' ticket upload' +
      (uploads === 1 ? ' is' : 's are') + ' still listed</h3>' +
      '<p>The upload history has entries for ITSM exports, and the database ' +
      'holds no tickets at all — so there is nothing for this screen to ' +
      'report, on any month. That is the state left behind when a run is ' +
      'stopped part-way: the log entry is written as the upload starts, the ' +
      'rows only as it finishes.</p>' +
      '<p>Go to <b>Data Uploads</b>, delete the stale entries, and upload the ' +
      'ITSM exports again — the overall export, the section exports, or both.</p>';
  }


  function renderKpi1(k) {
    state.kpi = k;

    const basisBox = document.getElementById('kpi1Basis');
    const tiles = document.getElementById('kpi1Tiles');

    renderPeriod(k);
    renderCoverage();
    renderKpi1Missing();

    if (!k || !k.hasData) {
      basisBox.hidden = true;
      tiles.innerHTML = '<div class="tile tile-empty"><span>' +
        (k && k.allMonths ? 'No data loaded' : 'No data for this month') +
        '</span></div>';
      emptyTable('#kpi1Table tbody', 9, 'Upload an ITSM export to see results.');
      emptyTable('#kpi1Modules tbody', 9, 'Nothing to show yet.');
      emptyTable('#kpi1AllPeople tbody', 8, 'Nothing to show yet.');
      fillSectionFilters([]);
      // The org cards quote these figures, so they have to hear about an
      // empty period too — otherwise they keep showing the last one's.
      updateOrgFigures();
      return;
    }

    renderBasis(k, basisBox);
    renderTiles(k, tiles);
    drawRateChart(k);
    drawDelayChart(k);
    fillSectionFilters(k.departments);
    fillPersonFilters(k);

    // The options exist now, so a filter saved before the refresh can finally
    // be put back. Has to happen here, between building the dropdowns and
    // drawing the tables — any earlier and the <select> has nothing to match.
    applyPendingTo(['fSection', 'fModuleK1', 'fModuleK1Name', 'fAllScope',
                    'fAllPerson', 'fAllName']);

    applySectionFilter();
    applyModuleFilterK1();

    // The individuals table may be pinned to a quarter — restored from the URL
    // or left over from a previous month. applyScopeFilter fetches it when
    // needed and falls through to applyAllFilter either way.
    if (getValue('fAllScope')) applyScopeFilter(); else applyAllFilter();

    // The organisation stage quotes KPI 1's section figures, so it follows
    // the month picker rather than sitting on whatever was loaded first.
    updateOrgFigures();
  }


  /**
   * Warns when the month was scored from the wrong population.
   *
   * There is deliberately NO message for the healthy case. A banner that is on
   * screen every single time gets tuned out within a week, and then the one
   * month it turns into a warning gets tuned out with it. Silence means the
   * scope is right; the panel only speaks when something is off.
   */
  function renderBasis(k, box) {
    if (!k.basis || k.basis.source === 'DEPARTMENT') {
      box.hidden = true;
      return;
    }

    box.hidden = false;
    box.className = 'notice notice-warn';
    box.innerHTML =
      '<h3>Scored from the overall report</h3>' +
      '<p>' + (k.allMonths
        ? 'At least one month in this range has no section exports, so its '
        : 'No section exports loaded for this month, so its ') +
      'tickets were counted from the overall report — including work by ' +
      'individuals outside EAS (' + count(k.basis.total) + ' tickets in scope). ' +
      'Upload the section files for the accurate departmental figure.</p>';
  }


  /**
   * Says which period is on screen — but only for the all-months view.
   *
   * Policy TVL-KPI-001 measures this KPI monthly, so the all-time figure is an
   * overview, not the number that gets reported. Anyone reading a 100.00% off
   * this screen and putting it in a K-SOX pack needs to know which of the two
   * they are looking at, so the aggregate labels itself and the monthly view
   * stays silent.
   */
  /**
   * What the stored tickets cover, to the day.
   *
   * 'January 2026 – September 2026' does not say whether September is a whole
   * month or the first four days of one, and that decides whether the period's
   * rate means anything yet — an export taken mid-month scores a month that is
   * still running. The month picker says which slice you are reading; this
   * says how much there is to read, which is a different question and belongs
   * in a different line.
   *
   * Always on, and about the DATABASE rather than the view, so it does not
   * change when the month picker does.
   */
  function renderCoverage() {
    const box = document.getElementById('kpi1Coverage');
    if (!box) return;

    const boot = state.boot || {};
    const from = boot.ticketFrom;
    const to = boot.ticketTo;
    if (!from || !to) { box.hidden = true; return; }

    const tickets = (boot.stats && boot.stats.tickets) || 0;

    box.hidden = false;
    box.innerHTML =
      'Data loaded from <b class="part">' + escapeHtml(formatDay(from)) +
      '</b> to <b class="part">' + escapeHtml(formatDay(to)) + '</b>' +
      (tickets ? ' · <span class="part">' + count(tickets) + ' tickets</span>' : '');
  }


  /**
   * Says when KPI 1's stored figures were last worked out.
   *
   * A button with no state beside it is indistinguishable from an outstanding
   * task — which is exactly how this one read. Naming the last rebuild turns
   * "the rebuild option is still there, what do I do?" into a question the
   * card answers by itself.
   */
  function renderRebuildState(boot) {
    const box = document.getElementById('rebuildWhen');
    if (!box) return;

    const cache = (boot && boot.kpiCache) || {};
    const when = cache.computedAt ? new Date(cache.computedAt) : null;

    if (!when || isNaN(when.getTime())) {
      // No cache at all is the one case where there IS something to do.
      box.hidden = false;
      box.innerHTML = (boot && boot.stats && boot.stats.tickets)
        ? '<b>Not built yet.</b> Tickets are stored but not scored — press ' +
          'Rebuild now to work the figures out.'
        : '<b>Nothing to rebuild yet.</b> Upload an ITSM export first.';
      return;
    }

    box.hidden = false;
    box.innerHTML =
      'Figures last built <b class="part">' + escapeHtml(formatWhen(when)) +
      '</b>' + (cache.months
        ? ' · <span class="part">' + cache.months + ' month' +
          (cache.months === 1 ? '' : 's') + ' scored</span>'
        : '');
  }


  /** A Date as '8 September 2026, 14:32'. */
  function formatWhen(when) {
    const day = when.getFullYear() + '-' +
                String(when.getMonth() + 1).padStart(2, '0') + '-' +
                String(when.getDate()).padStart(2, '0');
    return formatDay(day) + ', ' +
           String(when.getHours()).padStart(2, '0') + ':' +
           String(when.getMinutes()).padStart(2, '0');
  }


  /** '2026-09-04' -> '4 September 2026'. */
  function formatDay(key) {
    const parts = String(key || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!parts) return String(key || '');

    const names = ['January', 'February', 'March', 'April', 'May', 'June',
                   'July', 'August', 'September', 'October', 'November', 'December'];
    const month = names[Number(parts[2]) - 1] || parts[2];
    return Number(parts[3]) + ' ' + month + ' ' + parts[1];
  }


  function renderPeriod(k) {
    const box = document.getElementById('kpi1Period');
    if (!box) return;

    if (!k || !k.allMonths) { box.hidden = true; return; }

    const months = (state.boot && state.boot.availableMonths) || [];
    const span = months.length
      ? formatMonth(months[months.length - 1]) + ' – ' + formatMonth(months[0])
      : '';

    box.hidden = false;
    box.innerHTML =
      '<b>All months</b>' +
      (span ? '<span>' + escapeHtml(span) + '</span>' : '') +
      '<span>' + (k.monthsCovered || months.length) + ' months combined · ' +
      'an aggregate, not the monthly reported figure</span>';
  }


  /**
   * Line-art icons for the tiles, as SVG path data.
   *
   * Inline rather than an icon font or a CDN sprite: Apps Script serves one
   * HTML document and the CSP here blocks most external hosts, so anything
   * fetched at runtime is a request that can fail. These cannot.
   */
  const TILE_ICONS = {
    target: '<circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.6"/>' +
            '<path d="M8 .8v1.6M8 13.6v1.6M.8 8h1.6M13.6 8h1.6"/>',
    trend:  '<path d="M2 11.2l3.7-3.7 2.6 2.6L14 4.4"/><path d="M10.6 4.4H14V7.8"/>',
    shield: '<path d="M8 1.4l5 2v3.9c0 3.1-2.1 5.7-5 7.2-2.9-1.5-5-4.1-5-7.2V3.4z"/>' +
            '<path d="M5.9 8.1l1.5 1.5 2.8-3"/>',
    inbox:  '<path d="M2 9.4h3.1l1 1.9h3.8l1-1.9H14"/>' +
            '<path d="M2 9.4l1.7-6a1.1 1.1 0 0 1 1-.8h6.6a1.1 1.1 0 0 1 1 .8l1.7 6v3.1a1.1 1.1 0 0 1-1.1 1.1H3.1A1.1 1.1 0 0 1 2 12.5z"/>',
    check:  '<circle cx="8" cy="8" r="6.1"/><path d="M5.3 8.2l1.9 1.9 3.5-3.8"/>',
    clock:  '<circle cx="8" cy="8" r="6.1"/><path d="M8 4.3V8.2l2.5 1.6"/>'
  };


  /**
   * The six headline figures.
   *
   * Order matches the reading order of the KPI itself: the rate, how that
   * rate scores against target, how much room is left, then the three counts
   * the rate is computed from.
   *
   * `tone` is a colour family, not decoration. The first three carry a state
   * and take the reserved status hues; the last three are plain counts with
   * no good or bad about them, so they take neutral families that can never
   * be mistaken for a band.
   */
  function renderTiles(k, container) {
    const t = k.total;
    const band = bandClass(t.band);          // 'g' | 'a' | 'r'

    // At a 99.50% target, N completed tickets buy a fixed number of delays.
    // headroom is successful - ceil(target% x completed), so delayed +
    // headroom is that permitted count — no extra server field needed.
    const allowed = t.delayed + t.headroom;
    const usedPct = allowed > 0 ? Math.min(100, (t.delayed / allowed) * 100)
                                : (t.delayed > 0 ? 100 : 0);

    let headroomNote;
    if (t.headroom > 0) {
      headroomNote = t.delayed + ' of ' + allowed + ' permitted delay' +
                     (allowed === 1 ? '' : 's') + ' used';
    } else if (t.headroom === 0) {
      headroomNote = 'on the edge — one more delay drops the band';
    } else {
      headroomNote = Math.abs(t.headroom) + ' fewer delays needed to reach target';
    }

    // Kept short on purpose: this note has to fit one line, or the tallest
    // tile stretches all six.
    const gap = round2(t.rate - k.target);
    const gapText = (gap >= 0 ? '+' : '−') + fmt(Math.abs(gap)) + ' pts';

    const headroomTone = t.headroom > 0 ? 'g' : (t.headroom === 0 ? 'a' : 'r');

    container.innerHTML =
      tile({
        label: 'Success Rate', icon: 'target', tone: band,
        value: fmt(t.rate) + '%',
        note: '<span class="pill ' + band + '">' + escapeHtml(t.band) + '</span>'
      }) +
      tile({
        label: 'KPI Achievement', icon: 'trend', tone: band,
        value: fmt(t.achievement) + '%',
        note: escapeHtml('target ' + k.target + '% · ' + gapText)
      }) +
      tile({
        label: 'Headroom', icon: 'shield', tone: headroomTone,
        value: (t.headroom > 0 ? '+' : '') + t.headroom,
        note: escapeHtml(headroomNote),
        // A hairline of the delay budget, drawn to scale. The number above
        // says how much room is left; this says how much of it has gone.
        bar: allowed > 0 ? usedPct : null
      }) +
      tile({
        label: 'Received', icon: 'inbox', tone: 'blue',
        value: count(t.received),
        note: k.allMonths ? 'tickets across all months' : 'tickets this month'
      }) +
      tile({
        label: 'Completed', icon: 'check', tone: 'teal',
        value: count(t.completed),
        note: count(Math.max(0, t.received - t.completed)) + ' still open'
      }) +
      tile({
        label: 'Delayed', icon: 'clock', tone: t.delayed ? 'a' : 'g',
        value: count(t.delayed),
