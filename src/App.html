    const head = document.querySelector('#cmpSections thead tr');
    head.innerHTML = '<th>' + escapeHtml(sectionLabel) + '</th>' +
      c.periods.map(function (m) {
        return '<th class="r">' + escapeHtml(formatPeriod(m)) + '</th>';
      }).join('');

    const sectionBody = document.querySelector('#cmpSections tbody');
    sectionBody.innerHTML = '';

    if (!c.sections.length) {
      sectionBody.innerHTML = '<tr><td colspan="' + (c.periods.length + 1) +
        '" class="empty">No ' + escapeHtml(sectionLabel.toLowerCase()) +
        ' data in the selected ' + escapeHtml(c.periodLabelPlural || 'months') +
        '.</td></tr>';
      return;
    }

    c.sections.forEach(function (section) {
      const tr = document.createElement('tr');
      let html = '<td>' + escapeHtml(section) + '</td>';

      c.periods.forEach(function (period) {
        const entry = (c.bySection[section] || {})[period];
        html += entry
          ? '<td class="r">' + fmt(entry.rate) + '% ' + pill(entry.band) + '</td>'
          : '<td class="r muted">—</td>';
      });

      tr.innerHTML = html;
      sectionBody.appendChild(tr);
    });
  }


  // =========================================================================
  // SETTINGS
  // =========================================================================

  function fillSettings(boot) {
    const body = document.querySelector('#settingsTable tbody');
    if (body) {
      body.innerHTML = '';
      (boot.kpiList || []).forEach(function (kpi) {
        const row = document.createElement('tr');
        row.innerHTML =
          '<td>' + escapeHtml(kpi.name) + '</td>' +
          '<td style="font-size:11.5px;color:var(--text-dim)">' + escapeHtml(kpi.formula || '') + '</td>' +
          '<td>&ge; ' + kpi.target + kpi.unit + '</td>' +
          '<td>' + kpi.yellowFloor + '&ndash;' + kpi.target + kpi.unit + '</td>' +
          '<td>&lt; ' + kpi.yellowFloor + kpi.unit + '</td>' +
          '<td>' + escapeHtml(kpi.slaLayer) + '</td>' +
          '<td>' + (kpi.active
            ? '<span class="pill g">LIVE</span>'
            : '<span class="pill a">PENDING</span>') + '</td>';
        body.appendChild(row);
      });
    }

    renderOrg(boot);
    fillKpiSelector(boot);
    renderRebuildState(boot);

    // What is actually in the database, per KPI, beside what the history
    // claims. When the two disagree this is the screen that says so plainly
    // instead of leaving it to be inferred from an empty dashboard.
    const info = document.getElementById('dbInfo');
    if (info) {
      const stats = boot.stats || {};
      const months = (boot.availableMonths || []).length;
      const fMonths = (boot.feedbackMonths || []).length;
      const warn = function (bad, text) {
        return bad ? '<span style="color:var(--red);font-weight:600">' + text + '</span>' : text;
      };

      info.innerHTML =
        '<dt>Version</dt><dd>' + escapeHtml(boot.appVersion) + '</dd>' +
        '<dt>Sections</dt><dd>' + boot.departments.length + '</dd>' +
        '<dt>KPI 1 · tickets stored</dt><dd>' +
          warn(!stats.tickets && stats.ticketUploads, count(stats.tickets || 0)) + '</dd>' +
        '<dt>KPI 1 · months</dt><dd>' + months + '</dd>' +
        '<dt>KPI 1 · uploads logged</dt><dd>' + count(stats.ticketUploads || 0) + '</dd>' +
        '<dt>KPI 2 · responses stored</dt><dd>' +
          warn(!stats.feedback && stats.feedbackUploads, count(stats.feedback || 0)) + '</dd>' +
        '<dt>KPI 2 · quarters</dt><dd>' +
          ((boot.feedbackQuarters || []).length + ' (' + fMonths + ' months)') + '</dd>' +
        '<dt>KPI 2 · uploads logged</dt><dd>' + count(stats.feedbackUploads || 0) + '</dd>' +
        (boot.orphanedFeedback
          ? '<dt>Orphaned responses</dt><dd>' +
            warn(true, count(boot.orphanedFeedback)) + '</dd>' : '');
    }
  }


  // =========================================================================
  // HELPERS
  // =========================================================================

  function show(id) { const el = document.getElementById(id); if (el) el.hidden = false; }
  function hide(id) { const el = document.getElementById(id); if (el) el.hidden = true; }

  function bind(id, event, handler) {
    const el = document.getElementById(id);
    if (el) el.addEventListener(event, handler);
  }

  function getValue(id) {
    const el = document.getElementById(id);
    return el ? (el.value || '') : '';
  }

  function setValue(id, value) {
    const el = document.getElementById(id);
    if (el) el.value = value;
  }

  function setText(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  /**
   * A numeric table cell.
   *
   * Zeros are dimmed. In a healthy month almost every Delayed column is zero,
   * and a wall of full-strength zeros makes the two rows that matter harder to
   * find, not easier.
   */
  function num(value) {
    return '<td class="r' + (Number(value) === 0 ? ' zero' : '') + '">' +
           count(value) + '</td>';
  }


  /**
   * A whole number with thousands separators: 2640 -> "2,640".
   *
   * en-US is pinned rather than left to the viewer's locale. The figures on
   * screen get read out in meetings against the ITSM's own reports, which
   * print 2,640 — a browser set to a locale that groups differently would
   * quietly disagree with the source.
   */
  function count(value) {
    const n = Number(value);
    return isFinite(n) ? n.toLocaleString('en-US') : String(value);
  }


  function setCount(id, shown, total, noun) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = shown === total
      ? total + ' ' + noun
      : shown + ' of ' + total + ' ' + noun;
  }

  function fillRows(selector, rows, toHtml) {
    const body = document.querySelector(selector);
    if (!body) return;
    body.innerHTML = '';
    rows.forEach(function (row) {
      const tr = document.createElement('tr');
      tr.innerHTML = toHtml(row);
      body.appendChild(tr);
    });
  }

  function setLive(isLive) {
    const dot = document.getElementById('liveDot');
    const text = document.getElementById('liveText');
    if (dot) dot.classList.toggle('is-busy', !isLive);
    if (text) text.textContent = isLive ? 'Live' : 'Error';
  }

  function pill(band) {
    return '<span class="pill ' + bandClass(band) + '">' + escapeHtml(band) + '</span>';
  }

  function bandClass(band) {
    if (band === 'GREEN') return 'g';
    if (band === 'YELLOW') return 'a';
    if (band === 'RED') return 'r';
    return '';
  }

  /** Two decimals, matching how the policy states its thresholds. */
  function fmt(n) {
    return (Math.round((Number(n) || 0) * 100) / 100).toFixed(2);
  }

  function emptyTable(selector, columns, message) {
    const body = document.querySelector(selector);
    if (body) {
      body.innerHTML = '<tr><td colspan="' + columns + '" class="empty">' +
                       escapeHtml(message) + '</td></tr>';
    }
  }

  /**
   * Fills the By Individuals period dropdown.
   *
   * Only quarters that actually contain a loaded month are offered. Listing
   * Q4 when October has not been uploaded would promise data that is not
   * there and hand back an empty table, which reads as a bug.
   */
  function fillScopeFilter(months) {
    const select = document.getElementById('fAllScope');
    if (!select) return;

    const seen = [];
    (months || []).forEach(function (m) {
      const q = quarterOf(m);
      if (q && seen.indexOf(q) === -1) seen.push(q);
    });
    seen.sort().reverse();          // newest quarter first

    const previous = select.value;
    select.innerHTML = '<option value="">Follow the page</option>';

    if (months && months.length > 1) {
      const all = document.createElement('option');
      all.value = ALL_MONTHS;
      all.textContent = 'All months';
      select.appendChild(all);
    }

    seen.forEach(function (q) {
      const option = document.createElement('option');
      option.value = q;
      option.textContent = quarterLabel(q);
      select.appendChild(option);
    });

    select.value = previous;
    if (select.value !== previous) select.value = '';
  }


  /**
   * KPI 2's month picker.
   *
   * Its own list, not KPI 1's: training runs on its own calendar, and a month
   * full of tickets need not have had a session in it. Defaults to All months
   * — unlike KPI 1, where the policy reports monthly, training feedback is
   * most often read cumulatively.
   */
  /**
   * KPI 2's period picker — quarters, not months.
   *
   * Training runs a few times a quarter, so a month is the wrong unit to read
   * it in: most months are empty and the ones that are not carry a rate over a
   * handful of responses. The quarters offered are the ones the data actually
   * has, and which months make up a quarter is settled on the server by
   * CONFIG.QUARTER_START_MONTH — the picker only shows what it is told.
   */
  function fillFeedbackQuarters(quarters) {
    const select = document.getElementById('kpi2Month');
    if (!select) return;

    const list = quarters || [];
    const previous = select.value;

    select.innerHTML = '';
    select.disabled = !list.length;

    if (!list.length) {
      select.innerHTML = '<option value="">No feedback loaded</option>';
      return;
    }

    const all = document.createElement('option');
    all.value = ALL_MONTHS;
    all.textContent = 'All quarters (' + list.length + ')';
    select.appendChild(all);

    const divider = document.createElement('option');
    divider.disabled = true;
    divider.textContent = '──────────';
    select.appendChild(divider);

    list.forEach(function (q) {
      const option = document.createElement('option');
      option.value = q.key;
      option.textContent = q.label;
      // The months behind the label, for the tooltip — 'Quarter 1 (2026)'
      // says nothing about which months it covers until you hover it. Falls
      // back to the quarter's own three months when every session in it was
      // placed by its filename rather than by a usable session date.
      const span = (q.months || []).length ? q.months : (q.covers || []);
      option.title = q.label + ' · ' + span.map(formatMonth).join(', ');
      select.appendChild(option);
    });

    const valid = [ALL_MONTHS].concat(list.map(function (q) { return q.key; }));
    select.value = previous && valid.indexOf(previous) !== -1 ? previous : ALL_MONTHS;
  }


  /** The quarter a month falls in, as the server labelled it. */
  function quarterForMonth(month) {
    const list = (state.boot && state.boot.feedbackQuarters) || [];
    for (let i = 0; i < list.length; i++) {
      if ((list[i].months || []).indexOf(month) !== -1) return list[i].key;
    }
    return '';
  }


  /**
   * Every distinct quarter named in a blob of filenames, in time order.
   *
   * Mirrors quarterFromFileName in Config.gs — deliberately, because this one
   * reads the filename cell of a history row and the server never sees it. The
   * conventions are one line each and the test suite checks both against the
   * same list of real filenames.
   *
   *   'CEPZ_Q1-2026_YPL_PP, DEPZ_Q1-2026_All Plant' -> ['2026-Q1']
   *
   * @param {string} text
   * @return {string[]} 'YYYY-Qn'
   */
  function quartersInText(text) {
    const seen = {};
    const out = [];

    String(text || '').replace(
      /(?:^|[^a-z0-9])q\s*([1-4])\s*[-_. \/]\s*(\d{4}|\d{2})(?!\d)/gi,
      function (whole, q, year) { push(year, q); return whole; });

    String(text || '').replace(
      /(?:^|[^0-9])(\d{4}|\d{2})\s*[-_. \/]?\s*q\s*([1-4])(?!\d)/gi,
      function (whole, year, q) { push(year, q); return whole; });

    function push(year, q) {
      let y = Number(year);
      if (!isFinite(y) || !y) return;
      if (y < 100) y += 2000;
      if (y < 2000 || y > 2099) return;
      const key = y + '-Q' + Number(q);
      if (!seen[key]) { seen[key] = true; out.push(key); }
    }

    return out.sort();
  }


  /** '2026-08' -> '2026-Q3'. Q1 Jan-Mar, Q2 Apr-Jun, Q3 Jul-Sep, Q4 Oct-Dec. */
  function quarterOf(month) {
    const parts = String(month || '').match(/^(\d{4})-(\d{2})$/);
    if (!parts) return '';
    return parts[1] + '-Q' + (Math.floor((Number(parts[2]) - 1) / 3) + 1);
  }


  /** '2026-Q3' -> 'Q3 2026 · Jul–Sep'. */
  function quarterLabel(key) {
    const parts = String(key || '').match(/^(\d{4})-Q([1-4])$/);
    if (!parts) return String(key);
    const spans = ['Jan–Mar', 'Apr–Jun', 'Jul–Sep', 'Oct–Dec'];
    return 'Q' + parts[2] + ' ' + parts[1] + ' · ' + spans[Number(parts[2]) - 1];
  }


  /**
   * Re-scopes the By Individuals table, and nothing else.
   *
   * A quarter is three months summed, which is exactly what getKpi1 already
   * does for 'ALL' — so the same call serves, with a quarter key instead of
   * the sentinel. The result is kept apart from state.kpi on purpose: the
   * tiles, both charts and the other two tables carry on showing the month
   * chosen at the top of the page.
   */
  function applyScopeFilter() {
    const scope = getValue('fAllScope');

    if (!scope) {
      state.scopePeople = null;
      state.scopeKey = '';
      applyAllFilter();
      saveState();
      return;
    }

    if (state.scopeKey === scope && state.scopePeople) {
      applyAllFilter();
      saveState();
      return;
    }

    callServer('getKpi1', scope).then(function (k) {
      state.scopeKey = scope;
      state.scopePeople = (k && k.hasData) ? k : null;
      applyAllFilter();
      saveState();
    }).catch(onError);
  }


  /** 'Jan 26' — short enough that nine months fit across one axis. */
  function shortMonth(key) {
    const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const parts = String(key).split('-');
    const index = parseInt(parts[1], 10) - 1;
    if (!names[index]) return String(key);
    return names[index] + ' ' + String(parts[0]).slice(2);
  }


  function formatMonth(key) {
    if (key === ALL_MONTHS) return 'All months';

    const names = ['January', 'February', 'March', 'April', 'May', 'June',
                   'July', 'August', 'September', 'October', 'November', 'December'];
    const parts = String(key).split('-');
    const index = parseInt(parts[1], 10) - 1;
    return (names[index] || key) + ' ' + parts[0];
  }

  /** Date -> 'YYYY-MM-DD HH:MM:SS', matching how the ITSM writes them. */
  function formatDate(d) {
    function pad(n) { return String(n).padStart(2, '0'); }
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
           ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  /**
   * Escapes text before it goes into innerHTML.
   *
   * Ticket titles and requestor names come from the ITSM, which means they can
   * contain < and & and quotes. Without this a stray character breaks the
   * layout, and untrusted text in innerHTML is how script injection happens.
   */
  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /**
   * Is this value effectively empty?
   *
   * The trim is the whole point. Some Completion Date cells in the ITSM export
   * hold a single space. Testing only for '' treats that space as real, the
   * merge keeps it, and the genuine date from the other report never replaces
   * it — one ticket silently becomes incomplete.
   */
  function isBlank(value) {
    return value === null || value === undefined || String(value).trim() === '';
  }

})();
</script>
