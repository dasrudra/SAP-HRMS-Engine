        note: count(t.successful) + ' completed on time'
      });
  }


  /**
   * One tile.
   *
   * `note` is inserted as HTML so a caller can pass a pill; every caller that
   * passes plain text escapes it first.
   */
  function tile(o) {
    return '<div class="tile t-' + o.tone + '">' +
             '<div class="tile-top">' +
               '<span class="tile-ico" aria-hidden="true">' +
                 '<svg viewBox="0 0 16 16">' + TILE_ICONS[o.icon] + '</svg>' +
               '</span>' +
               '<span class="tile-label">' + escapeHtml(o.label) + '</span>' +
             '</div>' +
             '<div class="tile-value">' + o.value + '</div>' +
             '<div class="tile-note">' + o.note + '</div>' +
             (typeof o.bar === 'number'
               ? '<div class="tile-bar"><i style="width:' + o.bar.toFixed(1) + '%"></i></div>'
               : '') +
           '</div>';
  }


  // =========================================================================
  // KPI 2 — TRAINING FEEDBACK
  // =========================================================================

  function loadKpi2() {
    if (!state.boot || !state.boot.configured) return;

    renderOrphans();

    const months = state.boot.feedbackQuarters || [];
    if (!months.length) {
      show('kpi2Empty');
      hide('kpi2Unknown');
      document.getElementById('kpi2Tiles').innerHTML =
        '<div class="tile tile-empty"><span>No feedback uploaded yet</span></div>';
      return;
    }
    hide('kpi2Empty');

    const scope = getValue('kpi2Month') || ALL_MONTHS;
    callServer('getKpi2', scope).then(renderKpi2).catch(onError);
  }


  function renderKpi2(k) {
    state.kpi2 = k;

    const tiles = document.getElementById('kpi2Tiles');
    if (!k || !k.hasData) {
      tiles.innerHTML = '<div class="tile tile-empty"><span>No feedback for this period</span></div>';
      emptyTable('#kpi2Questions tbody', 7, 'Nothing to show yet.');
      emptyTable('#kpi2Modules tbody', 10, 'Nothing to show yet.');
      emptyTable('#kpi2Zones tbody', 10, 'Nothing to show yet.');
      hide('kpi2Unassigned');
      hide('kpi2Undated');
      hide('kpi2Unknown');
      return;
    }

    renderKpi2Period(k);
    renderKpi2Unassigned(k);
    renderKpi2Undated(k);
    renderKpi2Unknown(k);
    renderKpi2Tiles(k, tiles);
    drawFeedbackModuleChart(k);
    drawFeedbackMixChart(k);
    renderKpi2Questions(k);
    fillSelect('fModule', 'All modules', k.modules.map(function (m) { return m.name; }));
    fillSelect('fZone', 'All zones', (k.zones || []).map(function (z) { return z.name; }));
    applyPendingTo(['fModule', 'fZone']);
    applyModuleFilter();
    applyZoneFilter();
  }


  /**
   * The chip under the heading, naming the period on screen.
   *
   * It appeared only for the all-periods view before. A quarter needs it more:
   * 'Quarter 1 (2026)' does not say which months it covers, and that is the
   * first thing anyone reading the figure wants to know.
   */
  function renderKpi2Period(k) {
    const box = document.getElementById('kpi2Period');
    if (!box) return;

    const quarters = (state.boot && state.boot.feedbackQuarters) || [];

    if (k.allMonths) {
      box.hidden = false;
      box.innerHTML =
        '<b>All quarters</b>' +
        '<span>' + quarters.length + ' quarter' + (quarters.length === 1 ? '' : 's') +
        ' · ' + k.monthsCovered + ' month' + (k.monthsCovered === 1 ? '' : 's') +
        ' with training · ' + count(k.total.respondents) + ' attendees · ' +
        count(k.total.responses) + ' responses</span>';
      return;
    }

    const here = quarters.filter(function (q) { return q.key === k.scope; })[0];
    if (!here) { box.hidden = true; return; }

    // The months with training in them, or — when every session in the quarter
    // was placed by its filename and no session date inside the quarter
    // survived — the three months the quarter is.
    const span = (here.months || []).length ? here.months : (here.covers || []);

    box.hidden = false;
    box.innerHTML =
      '<b>' + escapeHtml(here.label) + '</b>' +
      '<span>' + span.map(formatMonth).join(' · ') +
      ' · ' + count(k.total.respondents) + ' attendees · ' +
      count(k.total.responses) + ' responses</span>';
  }


  /**
   * Names the files behind the '(unassigned)' module.
   *
   * The module is read from the filename, so a file called only after its
   * trainer — 'Trainee Feedback– Mamun.xlsx', 'Trainee Feedback–Rubel.xlsx' —
   * has nothing to match on. They pool into one '(unassigned)' row, which
   * tells you the size of the problem and nothing about its cause. Listing
   * them turns it into something fixable: rename the file and re-upload, or
   * add the wording to TRAINING_MODULES.
   */
  function renderKpi2Unassigned(k) {
    const box = document.getElementById('kpi2Unassigned');
    if (!box) return;

    const files = k.unassignedFiles || [];
    if (!files.length) { box.hidden = true; return; }

    const people = files.reduce(function (a, f) { return a + f.respondents; }, 0);

    box.hidden = false;
    box.innerHTML =
      '<h3>' + files.length + ' file' + (files.length === 1 ? '' : 's') +
      ' could not be matched to a module</h3>' +
      '<p>Their ' + count(people) + ' response' + (people === 1 ? '' : 's') +
      ' are counted in the KPI, but grouped under <code>(unassigned)</code> ' +
      'because the filename does not name a module. Rename the file and ' +
      're-upload it, or add the wording to <code>TRAINING_MODULES</code> in ' +
      '<code>Config.gs</code> — the module is resolved at scoring time, so ' +
      'editing the list and reloading fixes it with nothing to re-upload.</p>' +
      '<p>' + firstFew(files, function (f) {
        return '<code>' + escapeHtml(f.fileName) + '</code> ×' + f.respondents;
      }, ' &nbsp; ') + '</p>';
  }


  /**
   * Names the first few of a list and counts the rest.
   *
   * A notice that lists forty-three filenames is not more informative than one
   * that lists eight and says so — it just pushes the figures off the screen.
   * Eight is enough to recognise the pattern, which is what these notices are
   * for: you fix the naming, not the individual file.
   */
  function firstFew(list, render, joiner) {
    const LIMIT = 8;
    const shown = list.slice(0, LIMIT).map(render).join(joiner);
    const rest = list.length - LIMIT;
    return rest > 0
      ? shown + joiner + '<span class="muted">…and ' + rest + ' more</span>'
      : shown;
  }


  /**
   * Names the files whose quarter had to be guessed from the session date.
   *
   * The team's naming convention — Zone_Quarter-Year, as in
   * 'Trainee Feedback- CEPZ_Q1-2026_YPL_PP - Jafar' — is what decides which
   * quarter a session belongs to now. A file named the old way still works: it
   * falls back to the session date, exactly as before. But the session date is
   * the source that has already been wrong once, at scale, so a file leaning
   * on it should say so rather than quietly landing in whichever quarter the
   * spreadsheet happened to produce.
   */
  function renderKpi2Undated(k) {
    const box = document.getElementById('kpi2Undated');
    if (!box) return;

    const files = k.undatedFiles || [];
    if (!files.length) { box.hidden = true; return; }

    const people = files.reduce(function (a, f) { return a + f.respondents; }, 0);

    box.hidden = false;
    box.innerHTML =
      '<h3>' + files.length + ' file' + (files.length === 1 ? '' : 's') +
      ' name' + (files.length === 1 ? 's' : '') + ' no quarter</h3>' +
      '<p>Their ' + count(people) + ' response' + (people === 1 ? '' : 's') +
      ' are counted in full. The quarter came from the session date inside the ' +
      'file rather than from its name — check it reads right, and from the next ' +
      'session name the file <code>Zone_Q1-2026_…</code> so the period is stated ' +
      'rather than inferred.</p>' +
      '<p>' + firstFew(files, function (f) {
        return '<code>' + escapeHtml(f.fileName) + '</code> ×' + f.respondents +
               (f.quarterLabel ? ' → ' + escapeHtml(f.quarterLabel) : ' → no quarter');
      }, '<br>') + '</p>';
  }


  /**
   * Warns about answers the classification does not recognise.
   *
   * The forms have been reworded between batches before — 'Very helpful' and
   * 'Confident' only appear in some. A new wording that silently counted as
   * positive would move the KPI with nobody noticing, so unknowns are counted
   * against the rate AND named here.
   */
  function renderKpi2Unknown(k) {
    const box = document.getElementById('kpi2Unknown');
    if (!box) return;

    if (!k.unknownAnswers || !k.unknownAnswers.length) { box.hidden = true; return; }

    box.hidden = false;
    box.innerHTML =
      '<h3>' + k.unknownAnswers.length + ' answer wording' +
      (k.unknownAnswers.length === 1 ? '' : 's') + ' not recognised</h3>' +
      '<p>These are counted as applicable but not positive, so they lower the ' +
      'rate rather than inflating it. Add them to <code>FEEDBACK_ANSWERS</code> ' +
      'in <code>Config.gs</code> under the right tier and reload:<br>' +
      k.unknownAnswers.map(function (u) {
        return '<code>' + escapeHtml(u.answer) + '</code> ×' + u.count;
      }).join(' &nbsp; ') + '</p>';
  }


  function renderKpi2Tiles(k, container) {
    const t = k.total;
    const band = bandClass(t.band);

    const gap = round2(t.rate - k.target);
    const gapText = (gap >= 0 ? '+' : '−') + fmt(Math.abs(gap)) + ' pts';

    const nonPositive = t.average + t.poor + t.unknown +
                        (t.noResponse && k.countsNonResponses !== false ? 0 : 0);

    container.innerHTML =
      tile({ label: 'Success Rate', icon: 'target', tone: band,
             value: fmt(t.rate) + '%',
             note: '<span class="pill ' + band + '">' + escapeHtml(t.band) + '</span>' }) +
      tile({ label: 'KPI Achievement', icon: 'trend', tone: band,
             value: fmt(t.achievement) + '%',
             note: escapeHtml('target ' + k.target + '% · ' + gapText) }) +
      tile({ label: 'Headroom', icon: 'shield',
             tone: t.headroom > 0 ? 'g' : (t.headroom === 0 ? 'a' : 'r'),
             value: (t.headroom > 0 ? '+' : '') + t.headroom,
             note: t.headroom > 0
               ? escapeHtml(t.headroom + ' more non-positive answers before the band drops')
               : (t.headroom === 0 ? 'on the edge' : 'below target') }) +
      tile({ label: 'Attendees', icon: 'inbox', tone: 'blue',
             value: count(t.respondents),
             note: count(k.sessions.length) + ' training session' +
                   (k.sessions.length === 1 ? '' : 's') }) +
      tile({ label: 'Positive', icon: 'check', tone: 'teal',
             value: count(t.positive),
             note: 'of ' + count(t.applicable) + ' applicable responses' }) +
      tile({ label: 'Not Positive', icon: 'clock',
             tone: (t.average + t.poor) ? 'a' : 'g',
             value: count(t.average + t.poor),
             note: count(t.average) + ' average · ' + count(t.poor) + ' poor' });
  }


  function renderKpi2Questions(k) {
    fillRows('#kpi2Questions tbody', k.questions, function (q) {
      return '<td class="name">' + escapeHtml(q.name) + '</td>' +
             num(q.responses) + num(q.positive) + num(q.average) + num(q.poor) +
             '<td class="r">' + fmt(q.rate) + '%</td>' +
             '<td>' + pill(q.band) + '</td>';
    });
  }


  function applyModuleFilter() {
    const k = state.kpi2;
    if (!k || !k.hasData) return;

    const wanted = getValue('fModule');
    const rows = wanted ? k.modules.filter(function (m) { return m.name === wanted; })
                        : k.modules;

    setCount('cModule', rows.length, k.modules.length, 'modules');
    if (!rows.length) return emptyTable('#kpi2Modules tbody', 10, 'No modules match.');

    fillRows('#kpi2Modules tbody', rows, function (m) {
      return '<td class="name">' + escapeHtml(m.name) + '</td>' +
             num(m.respondents) + num(m.responses) + num(m.positive) +
             // The two tiers underneath the rate. num() greys a zero, so a
             // module with no Poor answers recedes and the ones with some
             // stand out — which is the whole reason for the column.
             num(m.average) + num(m.poor) +
             '<td class="r">' + fmt(m.rate) + '%</td>' +
             '<td class="r">' + fmt(m.achievement) + '%</td>' +
             '<td>' + pill(m.band) + '</td>' +
             '<td class="r">' + (m.headroom > 0 ? '+' : '') + m.headroom + '</td>';
    });
  }


  /**
   * Training satisfaction by plant zone — KEPZ, CEPZ, DEPZ.
   *
   * A zone that ran no training in the period still gets a row, at zero and
   * banded NO DATA. Dropping it would make "nobody trained at DEPZ this
   * quarter" look identical to "DEPZ was not asked about", and those are very
   * different facts.
   */
  function applyZoneFilter() {
    const k = state.kpi2;
    if (!k || !k.hasData) return;

    const all = k.zones || [];
    const wanted = getValue('fZone');
    const rows = wanted ? all.filter(function (z) { return z.name === wanted; }) : all;

    setCount('cZone', rows.length, all.length, 'zones');
    if (!rows.length) return emptyTable('#kpi2Zones tbody', 10, 'No zones match.');

    fillRows('#kpi2Zones tbody', rows, function (z) {
      const dead = !z.respondents;
      return '<td class="name">' + escapeHtml(z.name) + '</td>' +
             num(z.sessions) + num(z.respondents) + num(z.responses) + num(z.positive) +
             num(z.average) + num(z.poor) +
             '<td class="r">' + (dead ? '—' : fmt(z.rate) + '%') + '</td>' +
             '<td class="r">' + (dead ? '—' : fmt(z.achievement) + '%') + '</td>' +
             '<td>' + pill(z.band) + '</td>';
    });
  }


  /**
   * The headline chart, banded like KPI 1's section chart.
   *
   * WHAT IT PLOTS DEPENDS ON THE FILTER, AND SO IT SHOULD
   * On a single quarter it is satisfaction by module: eight bars answering
   * "which training landed and which did not, this quarter". On All quarters
   * that same chart pools every quarter into one bar per module and throws
   * away the only thing the all-quarters view is for — whether the KPI is
   * moving. So All quarters plots one bar per quarter instead, in time order,
   * and the trend is readable at a glance.
   *
   * The module breakdown is not lost on the all-quarters view: the By module
   * table underneath still carries it, pooled across the whole period.
   */
  function drawFeedbackModuleChart(k) {
    const byQuarter = !!k.allMonths;
    const rows = byQuarter ? (k.quarters || []) : (k.modules || []);

    const title = document.getElementById('kpi2ModuleTitle');
    if (title) {
      title.textContent = byQuarter ? 'Satisfaction by quarter'
                                    : 'Satisfaction by module';
    }

    if (!rows.length) {
      chartMessage('chartFeedbackModule',
        '<p>No ' + (byQuarter ? 'quarters' : 'modules') + ' to plot.</p>');
      return;
    }
    chartMessage('chartFeedbackModule', null);

    const lowest = Math.min.apply(null, rows.map(function (m) { return m.rate; })
                                            .concat([k.target]));
    const floor = Math.max(0, Math.floor((lowest - 1) / 5) * 5);

    const note = document.getElementById('kpi2ModuleNote');
    if (note) {
      note.textContent = (byQuarter
        ? 'Every quarter loaded, in order. '
        : '') + 'Against the ' + k.target + '% target. Axis starts at ' +
        floor + '%.';
    }

    drawChart('chartFeedbackModule', {
      type: 'bar',
      data: {
        labels: rows.map(function (m) { return m.name; }),
        datasets: [Object.assign({
          label: 'Satisfaction',
          data: rows.map(function (m) { return round2(m.rate); }),
          backgroundColor: rows.map(function (m) { return bandColour(m.band); })
        }, BAR)]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 24, right: 74 } },
        scales: {
          y: Object.assign({ min: floor, max: 100.6 }, gridStyle()),
          x: categoryAxis()
        },
        plugins: {
          legend: { display: false },
          tooltip: tooltipStyle({
            label: function (item) {
              const m = rows[item.dataIndex];
              const lines = [fmt(m.rate) + '% · ' + m.band,
                             m.positive + ' positive of ' + m.applicable + ' applicable',
                             m.respondents + ' attendees'];
              if (byQuarter && m.sessions) {
                lines.push(m.sessions + ' session' + (m.sessions === 1 ? '' : 's'));
              }
              return lines;
            }
          }),
          targetLine: { value: k.target, label: 'Target ' + k.target + '%' },
          valueLabels: { enabled: true, decimals: 2, suffix: '%' }
        }
      },
      plugins: [targetLinePlugin, valueLabelPlugin]
    });
  }


  /**
   * The response mix, as a doughnut.
   *
   * Part-to-whole across four tiers, which is exactly what a doughnut is for —
   * and the numerator/denominator split is the thing this KPI turns on.
   */
  function drawFeedbackMixChart(k) {
    const t = k.total;
    const slices = [
      { label: 'Positive', value: t.positive,   colour: bandColour('GREEN') },
      { label: 'Average',  value: t.average,    colour: bandColour('YELLOW') },
      { label: 'Poor',     value: t.poor,       colour: bandColour('RED') },
      { label: 'No response', value: t.noResponse, colour: '#8496a8' },
      { label: 'Unrecognised', value: t.unknown, colour: '#4a3aa7' }
    ].filter(function (s) { return s.value > 0; });

    if (!slices.length) {
      chartMessage('chartFeedbackMix', '<p>No responses to plot.</p>');
      return;
    }
    chartMessage('chartFeedbackMix', null);

    drawChart('chartFeedbackMix', {
      type: 'doughnut',
      data: {
        labels: slices.map(function (s) { return s.label; }),
        datasets: [{
          data: slices.map(function (s) { return s.value; }),
          backgroundColor: slices.map(function (s) { return s.colour; }),
          borderColor: '#ffffff',
          borderWidth: 2          // 2px surface gap between segments
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '58%',
        plugins: {
          legend: {
            position: 'right',
            labels: { boxWidth: 9, boxHeight: 9, usePointStyle: true, padding: 12,
                      pointStyle: 'circle', color: '#5a6b7d', font: AXIS_FONT }
          },
          tooltip: tooltipStyle({
            label: function (item) {
              const share = t.responses ? (item.raw / t.responses) * 100 : 0;
              return item.label + ': ' + count(item.raw) + ' (' + fmt(share) + '%)';
            }
          })
        }
      }
    });
  }


  // ---- filters: each table owns its own ----

  /**
   * Every handler here redraws its table AND saves.
   *
   * The save is what makes a filter survive refresh. applySectionFilter and
   * friends deliberately do NOT save themselves — they are also called during
   * restore and after every render, and saving from there would write the
   * state back before it had finished being read.
   */
  function wireFilters() {
    bind('fSection', 'change', function () { applySectionFilter(); saveState(); });
    bind('fSectionReset', 'click', function () {
      setValue('fSection', ''); applySectionFilter(); saveState();
    });

    bind('rebuildKpi1', 'click', rebuildKpi1);
    bind('fModuleK1', 'change', function () { applyModuleFilterK1(); saveState(); });
    bind('fModuleK1Name', 'input', function () { applyModuleFilterK1(); saveState(); });
    bind('fModuleK1Reset', 'click', function () {
      setValue('fModuleK1', ''); setValue('fModuleK1Name', '');
      applyModuleFilterK1(); saveState();
    });

    // ---- KPI 2 ----
    bind('kpi2Month', 'change', function () { loadKpi2(); saveState(); });
    bind('refreshKpi2', 'click', function () { state.kpi2 = null; loadKpi2(); });
    bind('fModule', 'change', function () { applyModuleFilter(); saveState(); });
    bind('fModuleReset', 'click', function () {
      setValue('fModule', ''); applyModuleFilter(); saveState();
    });
    bind('fZone', 'change', function () { applyZoneFilter(); saveState(); });
    bind('fZoneReset', 'click', function () {
      setValue('fZone', ''); applyZoneFilter(); saveState();
    });

    bind('fAllScope', 'change', applyScopeFilter);
    bind('fAllPerson', 'change', function () { applyAllFilter(); saveState(); });
    bind('fAllName', 'input', function () { applyAllFilter(); saveState(); });
    bind('fAllReset', 'click', function () {
      setValue('fAllPerson', ''); setValue('fAllName', ''); setValue('fAllScope', '');
      applyScopeFilter();          // clears the period and redraws
    });
  }


  /** The section table filters by section. */
  function fillSectionFilters(sections) {
    fillSelect('fSection', 'All sections',
      sections.map(function (s) { return s.name; }));
  }


  /**
   * The individuals table filters by person; the module table by module. Both
   * dropdowns list only what is actually in their table for the period on
   * screen, so a choice can never select nothing.
   */
  function fillPersonFilters(k) {
    const everyone = k.people.map(function (p) { return p.name; }).sort();
    fillSelect('fAllPerson', 'All individuals', everyone);

    fillSelect('fModuleK1', 'All modules',
      (k.modules || []).map(function (m) { return m.name; }));
  }


  /** Rebuilds a dropdown, keeping the current choice when it still exists. */
  function fillSelect(id, allLabel, values) {
    const select = document.getElementById(id);
    if (!select) return;

    const previous = select.value;
    select.innerHTML = '<option value="">' + escapeHtml(allLabel) + '</option>';

    values.forEach(function (value) {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    });

    select.value = previous;
    if (select.value !== previous) select.value = '';
  }


  function applySectionFilter() {
    const k = state.kpi;
    if (!k || !k.hasData) return;

    const useSections = k.departments.length > 0;
    const all = useSections ? k.departments : k.parts;

    document.getElementById('kpi1BreakdownHead').textContent =
      useSections ? 'By section' : 'By service / part';
    document.getElementById('kpi1BreakdownCol').textContent =
      useSections ? 'Section' : 'Service / Part';

    const wanted = getValue('fSection');
    const rows = wanted ? all.filter(function (r) { return r.name === wanted; }) : all;

    setCount('cSection', rows.length, all.length, useSections ? 'sections' : 'parts');

    if (!rows.length) return emptyTable('#kpi1Table tbody', 9, 'No rows match.');

    fillRows('#kpi1Table tbody', rows, function (r) {
      return '<td class="name">' + escapeHtml(r.name) + '</td>' +
             num(r.received) + num(r.completed) + num(r.delayed) + num(r.successful) +
             '<td class="r">' + fmt(r.rate) + '%</td>' +
             '<td class="r">' + fmt(r.achievement) + '%</td>' +
             '<td>' + pill(r.band) + '</td>' +
             '<td class="r">' + (r.headroom > 0 ? '+' : '') + r.headroom + '</td>';
    });
  }


  /**
   * Re-scores every stored ticket against the current Config.
   *
   * KPI 1 is precomputed, so which section and which module a ticket is filed
   * under is decided when the cache is built. Editing PERSON_MODULES or the
   * roster therefore changes nothing until this runs — and before it existed,
   * the only way to apply such an edit was to re-upload the exports.
   */
  function rebuildKpi1() {
    // Two places offer this — Settings, and the By module table when it finds
    // the stored figures predate modules. Whichever was pressed, both are
    // disabled while it runs.
    const buttons = ['rebuildKpi1', 'rebuildFromModules']
      .map(function (id) { return document.getElementById(id); })
      .filter(Boolean);
    const status = document.getElementById('rebuildStatus');
    if (!buttons.length) return;

    // Remembered so the label goes back to whatever each button said — the two
    // are worded differently for where they sit.
    const labels = buttons.map(function (b) { return b.textContent; });
    buttons.forEach(function (b) { b.disabled = true; b.textContent = 'Rebuilding…'; });
    if (status) status.textContent = 'Rebuilding…';

    // Whatever happens, the buttons go back to being buttons.
    //
    // This used to run only on failure, on the assumption that a success
    // redrew them. That is true of the one inside the By module table, which
    // refreshAfterChange re-renders — and false of the one in Settings, which
    // is static markup. So a successful rebuild left it reading "Rebuilding…"
    // and disabled for the rest of the session, beside a status line saying
    // the rebuild had finished. Two contradictory statements, and the one in
    // the bigger type was the wrong one.
    function restore() {
      buttons.forEach(function (b, i) {
        b.disabled = false;
        b.textContent = labels[i];
      });
    }

    withTimeout(callServer('recomputeAfterUpload'), 300000, 'The rebuild')
      .then(function (result) {
        const months = (result && result.months) || [];
        const done = 'Rebuilt ' + months.length + ' month' +
                     (months.length === 1 ? '' : 's') + '.';
        if (status) status.textContent = done;
        return refreshAfterChange();
      })
      .then(restore)
      .catch(function (err) {
        restore();
        if (status) status.textContent = '';
        onError(err);
      });
  }


  /**
   * Tickets by SAP module.
   *
   * Replaces the old "Individuals carrying the delays" table. That one listed
   * the people with a delay or a band below green — which the By individuals
   * table underneath already shows, with its own Delayed column and a filter
   * of its own. Two tables answering one question is one table too many.
   *
   * This answers a question nothing else on the page did: which part of SAP
   * the work sits in. The module comes from the ITSM's Part column when that
   * names one EAS reports on, and otherwise from whoever handled the ticket —
   * see moduleForTicket. The names match KPI 2's, so MM means the same thing
   * on both screens.
   */
  function applyModuleFilterK1() {
    const k = state.kpi;
    if (!k || !k.hasData) return;

    const all = k.modules || [];
    const wanted = getValue('fModuleK1');
    const term = getValue('fModuleK1Name').trim().toLowerCase();

    const rows = all.filter(function (m) {
      if (wanted && m.name !== wanted) return false;
      if (term && m.name.toLowerCase().indexOf(term) === -1) return false;
      return true;
    });

    setCount('cModuleK1', rows.length, all.length, 'modules');

    // Tickets on screen but not one module row: the stored figures were built
    // before modules existed, so there is nothing to group. Saying "no module
    // information" left no way to tell that from "this month had no tickets",
    // and no hint that one button fixes it. Offer the button here, where the
    // gap is actually visible.
    if (!all.length) {
      const body = document.querySelector('#kpi1Modules tbody');
      if (body) {
        body.innerHTML =
          '<tr><td colspan="9" class="empty">' +
          '<b>The stored figures were built before modules were added.</b><br>' +
          'There are ' + count(k.total.completed) + ' tickets in this period, ' +
          'but none of them has been filed under a module yet. Rebuilding ' +
          're-scores every stored ticket — nothing is uploaded or deleted.' +
          '<br><button class="btn btn-primary" id="rebuildFromModules" ' +
          'style="margin-top:12px">↻ Rebuild KPI 1 figures</button>' +
          '</td></tr>';
        bind('rebuildFromModules', 'click', rebuildKpi1);
      }
      return;
    }

    if (!rows.length) {
      return emptyTable('#kpi1Modules tbody', 9, 'No modules match the filters.');
    }

    fillRows('#kpi1Modules tbody', rows, function (m) {
      return '<td class="name">' + escapeHtml(m.name) + '</td>' +
             num(m.received) + num(m.completed) + num(m.delayed) + num(m.successful) +
             '<td class="r">' + fmt(m.rate) + '%</td>' +
             '<td class="r">' + fmt(m.achievement) + '%</td>' +
             '<td>' + pill(m.band) + '</td>' +
             '<td class="r">' + (m.headroom > 0 ? '+' : '') + m.headroom + '</td>';
    });
  }


  /**
   * Everyone, busiest first.
   *
   * The only table on the page that can be looking at a different period from
   * everything around it — state.scopePeople holds a quarter when one is
   * chosen, and state.kpi is the page's month otherwise.
   */
  function applyAllFilter() {
    const k = state.scopePeople || state.kpi;
    if (!k || !k.hasData) {
      if (state.scopePeople === null && getValue('fAllScope')) {
        // A quarter was picked and it holds nothing.
        setCount('cAll', 0, 0, 'individuals');
        return emptyTable('#kpi1AllPeople tbody', 8,
          'No tickets in ' + quarterLabel(getValue('fAllScope')) + '.');
      }
      return;
    }

    const rows = filterPeople(k.people, 'fAllPerson', 'fAllName')
                   .sort(function (a, b) { return b.received - a.received; });

    setCount('cAll', rows.length, k.people.length, 'individuals');

    if (!rows.length) {
      return emptyTable('#kpi1AllPeople tbody', 8, 'No individuals match the filters.');
    }

    fillRows('#kpi1AllPeople tbody', rows, function (p) {
      return '<td class="name">' + escapeHtml(p.name) + '</td>' +
             '<td>' + escapeHtml(p.department) + '</td>' +
             num(p.received) + num(p.completed) + num(p.delayed) + num(p.successful) +
             '<td class="r">' + fmt(p.rate) + '%</td>' +
             '<td>' + pill(p.band) + '</td>';
    });
  }


  /**
   * The dropdown picks one exact individual; the box does partial matching.
   * They AND together, so choosing a name and typing something that does not
   * match it correctly yields nothing.
   */
  function filterPeople(people, personId, nameId) {
    const exact = getValue(personId);
    const term = getValue(nameId).trim().toLowerCase();

    return people.filter(function (p) {
      if (exact && p.name !== exact) return false;
      if (term && p.name.toLowerCase().indexOf(term) === -1) return false;
      return true;
    });
  }


  // =========================================================================
  // CHARTS
  // =========================================================================
  //
  // Two small inline Chart.js plugins rather than pulling in two more CDN
  // dependencies for a target line and value labels.

  /** Draws a solid reference line with a label, e.g. the 99.50% target. */
  const targetLinePlugin = {
    id: 'targetLine',
    afterDatasetsDraw: function (chart, args, opts) {
      if (!opts || typeof opts.value !== 'number') return;

      // The combo chart has two y scales, so the caller names the one the
      // target belongs to. Everything else has a single 'y' and says nothing.
      const y = chart.scales[opts.scaleId || 'y'];
      if (!y || opts.value < y.min || opts.value > y.max) return;

      const ctx = chart.ctx;
      const at = y.getPixelForValue(opts.value);
      const left = chart.chartArea.left;
      const right = chart.chartArea.right;

      ctx.save();
      ctx.strokeStyle = opts.color || '#1e3a5f';
      ctx.lineWidth = 1.5;                     // solid: dashes read as noise
      ctx.beginPath();
      ctx.moveTo(left, at);
      ctx.lineTo(right, at);
      ctx.stroke();

      if (opts.label) {
        // Drawn in the gutter reserved by layout.padding.right, so the badge
        // can never sit on top of a bar. Overlapping the data would be worse
        // than having no label at all.
        ctx.font = '700 9.5px -apple-system, "Segoe UI", Roboto, sans-serif';
        const width = ctx.measureText(opts.label).width + 14;
        ctx.fillStyle = opts.color || '#1e3a5f';
        ctx.beginPath();
        ctx.roundRect(right + 8, at - 9, width, 18, 9);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(opts.label, right + 8 + width / 2, at);
      }
      ctx.restore();
    }
  };

  /**
   * Prints each value above its bar.
   *
   * Not decoration — the aqua series sits below 3:1 contrast on white, so the
   * palette's relief rule requires visible labels or a table view. We ship both.
   */
  const valueLabelPlugin = {
    id: 'valueLabels',
    afterDatasetsDraw: function (chart, args, opts) {
      if (!opts || !opts.enabled) return;
      const ctx = chart.ctx;
      const decimals = opts.decimals || 0;
      const suffix = opts.suffix || '';

      ctx.save();
      // Text tokens, never the series colour: a label wearing the mark's hue
      // is unreadable the moment that hue is a light one.
      ctx.font = '700 10.5px -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = '#14202e';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';

      chart.data.datasets.forEach(function (dataset, i) {
        const meta = chart.getDatasetMeta(i);
        if (meta.hidden) return;
        meta.data.forEach(function (bar, j) {
          const value = dataset.data[j];
          if (value === null || value === undefined) return;
          ctx.fillText(Number(value).toFixed(decimals) + suffix, bar.x, bar.y - 4);
        });
      });
      ctx.restore();
    }
  };


  const charts = {};

  /** Replaces a chart, destroying the old one so canvases are not leaked. */
  function drawChart(canvasId, config) {
    const canvas = document.getElementById(canvasId);
    if (!canvas || typeof Chart === 'undefined') return;

    if (charts[canvasId]) charts[canvasId].destroy();
    charts[canvasId] = new Chart(canvas.getContext('2d'), config);
  }


  /**
   * Fill colours for chart marks.
   *
   * Yellow is a true yellow here, not the dark amber the text pills use.
   * #b45309 has to be dark enough to read as text on a pale chip; as a large
   * solid fill it just looks brown. A filled arc has no such constraint, and
   * these are the reserved status hues — they always ship with a label, which
   * every chart here does.
   */
  function bandColour(band) {
    if (band === 'GREEN') return '#0ca30c';
    if (band === 'YELLOW') return '#fab219';
    if (band === 'RED') return '#d03b3b';
    return '#8496a8';
  }

  const SERIES = ['#2a78d6', '#eb6834', '#1baf7a', '#4a3aa7'];

  /**
   * Mark specs, applied to every bar in the app.
   *
   * 24px is a cap, not a width: a bar that fills its slot reads as a solid
   * block of colour rather than as a measurement, and four sections across a
   * wide card were rendering 64px slabs. The leftover space is deliberate.
   */
  const BAR = {
    borderRadius: { topLeft: 4, topRight: 4, bottomLeft: 0, bottomRight: 0 },
    borderSkipped: false,
    maxBarThickness: 24
  };

  const AXIS_FONT = { size: 11, family: '-apple-system, "Segoe UI", Roboto, sans-serif' };

  /** Shared axis/grid styling — hairline and recessive, so the data reads first. */
  function gridStyle() {
    return {
      border: { display: false },
      grid: { color: '#eaeff5', drawTicks: false, lineWidth: 1 },
      ticks: { color: '#7b8b9d', font: AXIS_FONT, padding: 8 }
    };
  }

  /** X axis: no grid at all — the bars sit on the baseline, that is enough. */
  function categoryAxis() {
    return {
      border: { display: false },
      grid: { display: false },
      ticks: { color: '#5a6b7d', font: AXIS_FONT, padding: 6 }
    };
  }

  /** Tooltip styling, shared so every chart behaves the same on hover. */
  function tooltipStyle(callbacks) {
    return {
      backgroundColor: '#14202e',
      titleFont: { size: 12, weight: '600' },
      bodyFont: { size: 12 },
      padding: 10,
      cornerRadius: 6,
      displayColors: false,
      callbacks: callbacks
    };
  }


  /**
   * Shows a message in place of a chart.
   *
   * Needed because an axis auto-scaled to all-zero data draws 0.1 … 1.0 ticks
   * for a count that can only be a whole number. It looks broken, and it says
   * nothing — where "no delays at all" is the best news the month has.
   */
  function chartMessage(canvasId, html) {
    const box = document.getElementById(canvasId + 'Empty');
    const canvas = document.getElementById(canvasId);

    if (html) {
      if (charts[canvasId]) { charts[canvasId].destroy(); delete charts[canvasId]; }
      if (canvas) canvas.hidden = true;
      if (box) { box.innerHTML = html; box.hidden = false; }
      return true;
    }

    if (canvas) canvas.hidden = false;
    if (box) box.hidden = true;
    return false;
  }


  /**
   * Success rate by section.
   *
   * The y-axis does NOT start at zero. Every section sits between 98 and 100,
   * so a zero baseline renders four identical bars carrying no information.
   * The window is stated in the subtitle and every bar is labelled with its
   * exact value, so the compression is disclosed rather than hidden.
   */
  function drawRateChart(k) {
    const rows = k.departments.length ? k.departments : k.parts;
    const note = document.getElementById('chartRateNote');

    if (!rows.length) {
      const noneMsg = k.allMonths ? 'No section data loaded.'
                                  : 'No section data for this month.';
      chartMessage('chartRate',
        '<p>' + noneMsg + ' Upload the section exports to see the breakdown.</p>');
      if (note) note.textContent = noneMsg;
      return;
    }
    chartMessage('chartRate', null);

    const lowest = Math.min.apply(null, rows.map(function (r) { return r.rate; })
                                             .concat([k.target]));
    const floor = Math.max(0, Math.floor(lowest) - 1);

    if (note) {
      note.textContent = 'Against the ' + k.target + '% target. Axis starts at ' +
                         floor + '% — the sections sit close together, so the ' +
                         'differences are small by design.';
    }

    drawChart('chartRate', {
      type: 'bar',
      data: {
        labels: rows.map(function (r) { return shortLabel(r.name); }),
        datasets: [Object.assign({
          label: 'Success rate',
          data: rows.map(function (r) { return round2(r.rate); }),
          backgroundColor: rows.map(function (r) { return bandColour(r.band); })
        }, BAR)]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 24, right: 74 } },   // gutter for the target badge
        scales: {
          y: Object.assign({ min: floor, max: 100.4 }, gridStyle()),
          x: categoryAxis()
        },
        plugins: {
          legend: { display: false },          // one series — the title names it
          tooltip: tooltipStyle({
            label: function (item) {
              const row = rows[item.dataIndex];
              return [
                'Success rate: ' + fmt(row.rate) + '%',
                'Band: ' + row.band,
                'Completed: ' + row.completed + ' · delayed: ' + row.delayed
              ];
            }
          }),
          targetLine: { value: k.target, label: 'Target ' + k.target + '%' },
          valueLabels: { enabled: true, decimals: 2, suffix: '%' }
        }
      },
      plugins: [targetLinePlugin, valueLabelPlugin]
    });
  }


  /** Delayed tickets by section — a genuine count, so a zero baseline. */
  function drawDelayChart(k) {
    const rows = k.departments.length ? k.departments : k.parts;

    if (!rows.length) {
      chartMessage('chartDelay', '<p>' +
        (k.allMonths ? 'No section data loaded.' : 'No section data for this month.') +
        '</p>');
      return;
    }

    // Every section at zero. Plotting that draws four invisible bars under a
    // fractional axis; saying it plainly is both truer and better news.
    const worst = Math.max.apply(null, rows.map(function (r) { return r.delayed; }));
    if (worst === 0) {
      chartMessage('chartDelay',
        '<div class="big">0</div>' +
        '<p>No ticket in any section was completed past its due date ' +
        (k.allMonths ? 'in any month loaded' : 'this month') + '.</p>');
      return;
    }
    chartMessage('chartDelay', null);

    drawChart('chartDelay', {
      type: 'bar',
      data: {
        labels: rows.map(function (r) { return shortLabel(r.name); }),
        datasets: [Object.assign({
          label: 'Delayed tickets',
          data: rows.map(function (r) { return r.delayed; }),
          backgroundColor: SERIES[0]
        }, BAR)]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 24 } },
        scales: {
          // suggestedMax keeps a lone delay from filling the card, and
          // stepSize 1 stops Chart.js subdividing a count into halves.
          y: Object.assign({
            beginAtZero: true,
            suggestedMax: Math.max(4, worst + 1),
            ticks: { precision: 0, stepSize: 1, color: '#7b8b9d', font: AXIS_FONT, padding: 8 }
          }, { border: { display: false }, grid: { color: '#eaeff5', drawTicks: false } }),
          x: categoryAxis()
        },
        plugins: {
          legend: { display: false },
          tooltip: tooltipStyle({
            label: function (item) {
              const row = rows[item.dataIndex];
              return row.delayed + ' delayed of ' + row.completed + ' completed';
            }
          }),
          valueLabels: { enabled: true, decimals: 0 }
        }
      },
      plugins: [valueLabelPlugin]
    });
  }


  /** Volume bars. */
  const TREND_BAR = '#2a78d6';
  /** The rate line, on its own axis. */
  const TREND_LINE = '#eb6834';


  /**
   * EAS overall across every month uploaded: volume as bars, rate as a line.
   *
   * TWO SCALES, ONE PLOT — the one thing to be careful about here. Tickets
   * completed runs in the thousands and the success rate sits between 98 and
   * 100, so they cannot share an axis. The risk of a dual axis is that the two
   * scales are aligned arbitrarily and the chart appears to show a
   * relationship — "volume went up, the rate fell" — that is an artefact of
   * where the axes were put, not something in the data.
   *
   * Two things hold it honest. The rate axis is anchored to the 99.50% target
   * rule, so the line is read against a fixed policy threshold rather than
   * against the bars. And each axis is titled in its series' own colour, so
   * which mark belongs to which scale is never in question.
   *
   * Never governed by the month pickers: narrowing the comparison to three
   * months should not hide the other six.
   */
  function loadTrend() {
    const periods = comparePeriodList();
    const card = document.getElementById('cmpTrendCard');
    const kpi = selectedKpi();
    const id = (kpi && kpi.id) || 'KPI1';

    if (periods.length < 2) {
      if (card) card.hidden = true;
      return;
    }

    // Cached per KPI. One shared slot meant switching to KPI 2 redrew KPI 1's
    // trend from the cache without ever asking the server.
    if (state.trend && state.trend.kpi === id) { drawTrendChart(state.trend); return; }

    // Oldest first: a trend reads left to right.
    callServer(comparisonEndpoint(id), periods.slice().sort())
      .then(function (c) { state.trend = c; drawTrendChart(c); })
      .catch(onError);
  }


  /** Which server function scores this KPI across months? */
  function comparisonEndpoint(kpiId) {
    return kpiId === 'KPI2' ? 'getKpi2Comparison' : 'getKpiComparison';
  }


  /**
   * The periods the Comparison screen may offer, for the KPI in hand.
   *
   * KPI 1 compares MONTHS: tickets arrive daily, so a month is a full reading.
   * KPI 2 compares QUARTERS, like the rest of its screen — a module is trained
   * once or twice a quarter, so month by month is mostly empty columns and the
   * rest carry a rate over a handful of responses. Comparing two of those
   * compares noise.
   *
   * They are different lists, and offering ticket months for a training
   * comparison produced four columns of "No data".
   */
  function comparePeriodList() {
    const boot = state.boot || {};
    if (comparePeriodKind() === 'QUARTER') {
      return (boot.feedbackQuarters || []).map(function (q) { return q.key; });
    }
    return boot.availableMonths || [];
  }


  /**
   * What one column of the comparison is, for the KPI selected right now.
   *
   * Read from the selector rather than from the last result, because the
   * pickers and their labels have to be right BEFORE anything is compared —
   * and after a KPI switch the result on screen belongs to the old one.
   */
  function comparePeriodKind() {
    const kpi = selectedKpi();
    return (kpi && kpi.id === 'KPI2') ? 'QUARTER' : 'MONTH';
  }


  /** 'Quarter' / 'Month', for whatever is selected. */
  function comparePeriodWord(plural) {
    const quarter = comparePeriodKind() === 'QUARTER';
    return quarter ? (plural ? 'quarters' : 'quarter')
                   : (plural ? 'months' : 'month');
  }


  /**
   * '2026-Q1' -> 'Quarter 1 (2026)', '2026-08' -> 'August 2026'.
   *
   * One formatter for both, so every heading, header cell, legend and tooltip
   * on the Comparison screen reads correctly whichever KPI produced it.
   */
  function formatPeriod(key) {
    const text = String(key || '');
    if (!/^\d{4}-Q[1-4]$/.test(text)) return formatMonth(text);

    // The server already labels the quarters it knows about; matching it
    // exactly keeps the comparison and the KPI 2 picker saying the same words.
    const known = ((state.boot && state.boot.feedbackQuarters) || [])
      .filter(function (q) { return q.key === text; })[0];
    return known ? known.label
                 : 'Quarter ' + text.slice(6) + ' (' + text.slice(0, 4) + ')';
  }


  /** The same, short enough for a chart axis: 'Q1 2026' or 'Aug 2026'. */
  function shortPeriod(key) {
    const text = String(key || '');
    return /^\d{4}-Q[1-4]$/.test(text)
      ? 'Q' + text.slice(6) + ' ' + text.slice(0, 4)
      : shortMonth(text);
  }


  function drawTrendChart(c) {
    const card = document.getElementById('cmpTrendCard');
    if (!card) return;

    if (!c || !c.periods.length) { card.hidden = true; return; }
    card.hidden = false;

    const months = c.periods.slice().sort();
    const labels = months.map(shortPeriod);
    const word = c.periodLabelPlural || 'months';

    // Whichever count this KPI treats as its volume — tickets completed for
    // KPI 1, attendees trained for KPI 2.
    const volumeKey = c.volumeKey || 'completed';
    const volumeLabel = c.volumeLabel || 'Tickets completed';

    const completed = months.map(function (m) {
      const t = c.totals[m];
      return t ? (t[volumeKey] || 0) : 0;
    });
    const rates = months.map(function (m) {
      const t = c.totals[m];
      return t && t[volumeKey] ? round2(t.rate) : null;
    });

    // Window the rate axis. On a 0-100 scale the line would sit flat against
    // the ceiling every month and the shape would vanish.
    let lowest = c.target;
    rates.forEach(function (r) { if (r !== null) lowest = Math.min(lowest, r); });
    const floor = Math.max(0, Math.floor((lowest - 0.3) * 2) / 2);

    const title = document.getElementById('cmpTrendTitle');
    if (title) {
      title.textContent = (c.name || 'Success rate') + ' over time — every ' +
        (c.periodLabel || 'Month').toLowerCase();
    }

    const note = document.getElementById('cmpTrendNote');
    if (note) {
      note.textContent = months.length + ' ' + word + ', ' + shortPeriod(months[0]) + ' to ' +
        shortPeriod(months[months.length - 1]) +
        '. Bars are ' + volumeLabel.toLowerCase() + ' (left axis); the line is the ' +
        'success rate against the ' + c.target + '% target (right axis, starting at ' +
        floor + '%).';
    }

    drawChart('chartTrend', {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          {
            type: 'line',
            label: 'Success rate',
            data: rates,
            yAxisID: 'yRate',
            borderColor: TREND_LINE,
            backgroundColor: TREND_LINE,
            borderWidth: 2.5,
            pointRadius: 4,
            pointHoverRadius: 7,
            pointBackgroundColor: TREND_LINE,
            pointBorderColor: '#ffffff',
            pointBorderWidth: 2,      // 2px surface ring keeps points legible
            tension: 0,               // a monthly rate is a discrete reading
            order: 0                  // drawn over the bars
          },
          {
            type: 'bar',
            label: volumeLabel,
            data: completed,
            yAxisID: 'yVolume',
            backgroundColor: TREND_BAR,
            borderRadius: { topLeft: 4, topRight: 4, bottomLeft: 0, bottomRight: 0 },
            borderSkipped: false,
            maxBarThickness: 34,
            order: 1
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        // Room on the right for the target badge AND the rate axis title.
        layout: { padding: { top: 18, right: 104 } },
        interaction: { mode: 'index', intersect: false },
        scales: {
          // Volume on the left, from zero — a count must never be truncated.
          yVolume: Object.assign({
            position: 'left',
            beginAtZero: true,
            title: { display: true, text: volumeLabel,
                     color: TREND_BAR, font: { size: 11, weight: '600' } }
          }, gridStyle()),
          // Rate on the right, windowed, with no grid of its own — two sets of
          // horizontal lines across one plot is noise.
          yRate: Object.assign({}, gridStyle(), {
            position: 'right',
            min: floor,
            max: 100.4,
            grid: { drawOnChartArea: false },
            // No rotated title on this one. It was being overlapped by the
            // target badge, and it says nothing the other four cues do not:
            // the ticks, the line, the badge and the subtitle are all orange
            // and all name the rate.
            ticks: { color: TREND_LINE, font: AXIS_FONT, padding: 6,
                     callback: function (v) { return v + '%'; } }
          }),
          x: categoryAxis()
        },
        plugins: {
          legend: {
            position: 'bottom',
            labels: { boxWidth: 9, boxHeight: 9, usePointStyle: true, padding: 16,
                      pointStyle: 'circle', color: '#5a6b7d', font: AXIS_FONT }
          },
          tooltip: Object.assign(tooltipStyle({
            label: function (item) {
              if (item.dataset.yAxisID === 'yRate') {
                return item.raw === null ? 'Success rate: no data'
                                         : 'Success rate: ' + fmt(item.raw) + '%';
              }
              return volumeLabel + ': ' + count(item.raw);
            }
          }), { displayColors: true, usePointStyle: true }),
          // Drawn in the LINE's colour, not the usual navy. On a two-scale
          // plot a neutral rule reads as if it belonged to the left axis —
          // a volume threshold at 1,050 tickets, which it is not. Wearing the
          // rate's colour it can only be read against the rate.
          targetLine: { value: c.target, label: 'Target ' + c.target + '%',
                        scaleId: 'yRate', color: TREND_LINE }
        }
      },
      plugins: [targetLinePlugin]
    });
  }


  /** Grouped bars: sections across, one colour per month. */  /** Grouped bars: sections across, one colour per month. */
  function drawCompareChart(c) {
    const card = document.getElementById('cmpChartCard');
    if (!c.sections.length) {
      if (card) card.hidden = true;
      return;
    }
    if (card) card.hidden = false;

    const labels = ['EAS overall'].concat(c.sections.map(shortLabel));

    let lowest = c.target;
    c.periods.forEach(function (period) {
      const total = c.totals[period];
      if (total) lowest = Math.min(lowest, total.rate);
      c.sections.forEach(function (section) {
        const entry = (c.bySection[section] || {})[period];
        if (entry) lowest = Math.min(lowest, entry.rate);
      });
    });
    const floor = Math.max(0, Math.floor(lowest) - 1);

    const note = document.getElementById('cmpChartNote');
    if (note) {
      note.textContent = 'Against the ' + c.target + '% target. Axis starts at ' +
                         floor + '%.';
    }

    const datasets = c.periods.map(function (period, index) {
      const total = c.totals[period];
      const data = [total ? round2(total.rate) : null].concat(
        c.sections.map(function (section) {
          const entry = (c.bySection[section] || {})[period];
          return entry ? round2(entry.rate) : null;
        })
      );

      // Colour follows the period, never its position in the sorted result —
      // dropping one must not repaint the ones that remain.
      return Object.assign({
        label: formatPeriod(period),
        data: data,
        backgroundColor: SERIES[index % SERIES.length],
        // The months of one section belong together, so they sit side by side
        // with a hairline of surface between them; the air goes BETWEEN the
        // sections instead. Left at the defaults the pair drifts apart and
        // reads as two unrelated bars.
        categoryPercentage: 0.55,
        barPercentage: 0.9
      }, BAR, { maxBarThickness: 22 });
    });

    drawChart('chartCompare', {
      type: 'bar',
      data: { labels: labels, datasets: datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 22, right: 74 } },   // gutter for the target badge
        scales: {
          y: Object.assign({ min: floor, max: 100.4 }, gridStyle()),
          x: categoryAxis()
        },
        plugins: {
          // Two or more series, so a legend is required.
          legend: {
            position: 'bottom',
            labels: { boxWidth: 8, boxHeight: 8, usePointStyle: true, padding: 16,
                      pointStyle: 'circle', color: '#5a6b7d', font: AXIS_FONT }
          },
          tooltip: Object.assign(tooltipStyle({
            label: function (item) {
              return item.dataset.label + ': ' +
                     (item.raw === null ? 'no data' : fmt(item.raw) + '%');
            }
          }), { displayColors: true, usePointStyle: true }),
          targetLine: { value: c.target, label: 'Target ' + c.target + '%' },
          valueLabels: { enabled: false }      // too dense with 4 months x 5 groups
        }
      },
      plugins: [targetLinePlugin]
    });
  }


  /**
   * The EAS organisation, as a stage you can open a section of.
   *
   * WHAT THIS REPLACED, AND WHY
   * Four threshold rings used to sit here. They restated the KPI thresholds
   * table directly underneath them — same targets, same bands, same numbers —
   * so the page said one thing twice and neither copy said anything the other
   * did not. This says something the dashboard could not say at all: who EAS
   * is, and how each section is doing against KPI 1 right now.
   *
   * Sections first, people on demand. Thirty-seven names laid out at once is a
   * directory, not a chart — you cannot see the shape of the team through it.
   * Four cards you can read in a glance, each opening to its own people, is
   * the same information with the structure left visible.
   */
  function renderOrg(boot) {
    const stage = document.getElementById('orgStage');
    const rows = document.getElementById('orgRows');
    if (!stage || !rows) return;

    const org = (boot && boot.org) || null;
    if (!org || !org.sections || !org.sections.length) {
      stage.hidden = true;
      return;
    }
    stage.hidden = false;

    setText('orgTitle', org.name);
    const lead = document.getElementById('orgLead');
    if (lead && org.head) {
      lead.hidden = false;
      lead.innerHTML =
        '<span class="org-avatar">' + escapeHtml(initials(org.head)) + '</span>' +
        '<b>' + escapeHtml(org.head) + '</b>' +
        '<span>Head of ' + escapeHtml(org.short || 'EAS') + '</span>';
    }

    rows.innerHTML = '';
    org.sections.forEach(function (section) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'org-card';
      card.dataset.section = section.name;
      card.innerHTML = orgCardBody(section);
      card.addEventListener('click', function () { openOrgSection(section.name); });
      rows.appendChild(card);
    });

    closeOrgSection();
    updateOrgFigures();
  }


  function orgCardBody(section) {
    const figure = orgFigureFor(section.name);

    return '<div class="org-card-top">' +
        '<span class="org-avatar">' + escapeHtml(initials(section.label)) + '</span>' +
        '<h3>' + escapeHtml(section.label) + '</h3>' +
      '</div>' +
      (section.modules
        ? '<span class="org-modules">' + escapeHtml(section.modules) + '</span>' : '') +
      '<div class="org-head-name"><b>' + escapeHtml(section.head || '—') + '</b>' +
        (section.interim
          ? '<br><span class="org-interim">also heads ' +
            escapeHtml((state.boot && state.boot.org && state.boot.org.short) || 'EAS') +
            '</span>'
          : '') +
      '</div>' +
      '<div class="org-card-foot">' +
        '<span>' + section.size + ' ' + (section.size === 1 ? 'person' : 'people') + '</span>' +
        (figure
          ? '<span class="org-rate" style="color:' + bandColour(figure.band) + '">' +
            fmt(figure.rate) + '%</span>'
          : '<span class="org-rate is-none">no figure</span>') +
      '</div>';
  }


  /**
   * A section's KPI 1 figures for whatever period KPI 1 is showing.
   *
   * Read from state.kpi rather than fetched: the figure is the one on the KPI 1
   * screen, and two screens quoting different numbers for the same section is
   * worse than one screen quoting none. Null until KPI 1 has loaded, which is
   * why the cards are rebuilt by updateOrgFigures when it does.
   */
  function orgFigureFor(name) {
    const k = state.kpi;
    if (!k || !k.hasData || !k.departments) return null;

    const rows = k.departments.filter(function (d) { return d.name === name; });
    return rows.length ? rows[0] : null;
  }


  /**
   * Repaints the figures on the cards once KPI 1 has data.
   *
   * The stage is built from the bootstrap, before any month has loaded, so
   * every card would read "no figure" forever without this. Rewrites the card
   * bodies only — the open section, the rail and the glass are untouched.
   */
  function updateOrgFigures() {
    const org = (state.boot && state.boot.org) || null;
    if (!org) return;

    org.sections.forEach(function (section) {
      const card = document.querySelector('.org-card[data-section="' +
        cssEscape(section.name) + '"]');
      if (card) card.innerHTML = orgCardBody(section);
    });

    // The open panel quotes the same figures, so it has to move with them.
    if (state.orgOpen) renderOrgDetail(state.orgOpen);
  }


  /** Opens a section — or closes it, if it was already the open one. */
  function openOrgSection(name) {
    if (state.orgOpen === name) return closeOrgSection();

    state.orgOpen = name;
    const stage = document.getElementById('orgStage');
    if (stage) stage.classList.add('is-open');

    document.querySelectorAll('.org-card').forEach(function (card) {
      card.classList.toggle('is-active', card.dataset.section === name);
    });

    const close = document.getElementById('orgClose');
    if (close) close.hidden = false;

    renderOrgDetail(name);
    dimBehindOrg(true);
  }


  function closeOrgSection() {
    state.orgOpen = '';

    const stage = document.getElementById('orgStage');
    if (stage) stage.classList.remove('is-open');

    document.querySelectorAll('.org-card').forEach(function (card) {
      card.classList.remove('is-active');
    });

    const close = document.getElementById('orgClose');
    if (close) close.hidden = true;

    const detail = document.getElementById('orgDetail');
    if (detail) { detail.hidden = true; detail.innerHTML = ''; }

    const org = (state.boot && state.boot.org) || null;
    setText('orgSub', org
      ? org.sections.length + ' sections · ' + org.headcount +
        ' people · select a section to see who is in it'
      : '');

    dimBehindOrg(false);
  }


  /**
   * Puts everything else on the Settings screen behind glass.
   *
   * Blur and opacity only, so nothing is unmounted and nothing moves — closing
   * the section brings the tables back exactly where they were, with no reflow
   * and nothing to re-render.
   */
  function dimBehindOrg(on) {
    const view = document.getElementById('view-settings');
    if (!view) return;

    Array.prototype.forEach.call(view.children, function (child) {
      if (child.id === 'orgStage') return;
      child.classList.toggle('org-dimmed', Boolean(on));
    });
  }


  function renderOrgDetail(name) {
    const box = document.getElementById('orgDetail');
    const org = (state.boot && state.boot.org) || null;
    if (!box || !org) return;

    const section = org.sections.filter(function (s) { return s.name === name; })[0];
    if (!section) { box.hidden = true; return; }

    setText('orgSub', section.size + ' people · ' +
      (section.modules ? section.modules + ' · ' : '') +
      'select another section, or close to see all four');

    const figure = orgFigureFor(section.name);
    const period = state.month === ALL_MONTHS
      ? 'all months loaded'
      : formatMonth(state.month || '');

    const figures = figure
      ? '<div class="org-figures">' +
          orgFigure('Success rate', fmt(figure.rate) + '%', figure.band + ' · ' + period) +
          orgFigure('Received', count(figure.received), 'tickets raised') +
          orgFigure('Completed', count(figure.completed), figure.delayed + ' delayed') +
          orgFigure('Achievement', fmt(figure.achievement) + '%',
                    'against the ' + (state.kpi ? state.kpi.target : 99.5) + '% target') +
        '</div>'
      : '<div class="org-figures">' +
          orgFigure('Success rate', '—', 'KPI 1 has nothing for this period') +
        '</div>';

    // The head leads the list, marked — he is the answer to "who do I ask",
    // and hunting for him in an alphabetical run of nine names is a task.
    const people = [];
    if (section.head) {
      people.push({ name: section.head, head: true });
    }
    section.members.forEach(function (person) {
      people.push({ name: person, head: false });
    });

    box.hidden = false;
    box.innerHTML =
      '<div class="org-detail-head">' +
        '<h3>' + escapeHtml(section.label) + '</h3>' +
        (section.modules
          ? '<span class="org-modules">' + escapeHtml(section.modules) + '</span>' : '') +
      '</div>' +
      figures +
      '<p class="org-people-label">The team — ' + people.length + '</p>' +
      '<div class="org-people">' +
        people.map(function (person, i) {
          return '<span class="org-person' + (person.head ? ' is-head' : '') +
                 '" style="--i:' + Math.min(i, 9) + '">' +
                 '<span class="org-avatar">' + escapeHtml(initials(person.name)) + '</span>' +
                 escapeHtml(person.name) +
                 (person.head ? ' · head' : '') +
                 '</span>';
        }).join('') +
      '</div>';
  }


  function orgFigure(label, value, note) {
    return '<div class="org-figure">' +
      '<span>' + escapeHtml(label) + '</span>' +
      '<strong>' + value + '</strong>' +
      '<small>' + escapeHtml(note) + '</small>' +
      '</div>';
  }


  /**
   * 'Md. Abdullah Al Mamun' -> 'AM'. Two letters, skipping the honorifics and
   * initials that start half the names on this team and would otherwise make
   * a dozen avatars read 'MD'.
   */
  function initials(name) {
    const words = String(name || '').replace(/[^A-Za-z& ]/g, ' ').split(/\s+/)
      .filter(function (w) {
        if (!w) return false;
        const lower = w.toLowerCase();
        return lower !== 'md' && lower !== 'mohammad' && lower !== 'muhammad' &&
               lower !== 'mohd' && lower !== 'syed' && lower !== 'and' && w !== '&' &&
               w.length > 1;
      });

    if (!words.length) return String(name || '?').slice(0, 2).toUpperCase();
    if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return (words[0][0] + words[words.length - 1][0]).toUpperCase();
  }


  /** CSS.escape, for the browsers that have it and a safe fallback for the rest. */
  function cssEscape(value) {
    const text = String(value == null ? '' : value);
    return (window.CSS && window.CSS.escape) ? window.CSS.escape(text)
                                             : text.replace(/["\\]/g, '\\$&');
  }



  /** 'Manufacturing Applications' -> 'Manufacturing', so axis labels fit. */
  function shortLabel(name) {
    return String(name).replace(/\s+Applications$/, '');
  }

  function round2(n) {
    return Math.round((Number(n) || 0) * 100) / 100;
  }


  // =========================================================================
  // COMPARISON
  // =========================================================================

  const CMP_SELECTS = ['cmpM1', 'cmpM2', 'cmpM3', 'cmpM4'];


  /**
   * Fills the "which KPI" dropdown.
   *
   * KPIs without an ingest pipeline are listed but disabled, so it is obvious
   * they exist and equally obvious why they cannot be compared yet.
   */
  function fillKpiSelector(boot) {
    const select = document.getElementById('cmpKpi');
    if (!select) return;

    const previous = select.value;
    select.innerHTML = '';

    (boot.kpiList || []).forEach(function (kpi) {
      const option = document.createElement('option');
      option.value = kpi.id;
      option.textContent = kpi.name + (kpi.active ? '' : '  — awaiting data');
      select.appendChild(option);
    });

    const active = (boot.kpiList || []).filter(function (k) { return k.active; });
    select.value = previous || (active[0] ? active[0].id : '');
    if (!select.value && active[0]) select.value = active[0].id;
  }


  function selectedKpi() {
    const id = getValue('cmpKpi');
    const list = (state.boot && state.boot.kpiList) || [];
    for (let i = 0; i < list.length; i++) {
      if (list[i].id === id) return list[i];
    }
    return list[0] || null;
  }



  function wireCompare() {
    bind('cmpRun', 'click', runComparison);

    // Switching KPI re-points the whole screen, not just the next Compare.
    // The month lists differ per KPI, the trend is per KPI, and any results
    // already on screen belong to the KPI you just navigated away from.
    bind('cmpKpi', 'change', function () {
      // Clear the old KPI's results before anything else. If the new KPI has
      // too few months to compare, the screen must go empty rather than leave
      // the previous KPI's figures sitting under the new KPI's name.
      hideComparisonResults();
      state.compare = null;
      state.trend = null;

      fillComparePeriods(comparePeriodList());
      loadTrend();
      if (state.compareRan) runComparison();
      saveState();
    });

    // Changing a month without pressing Run still gets saved, so a refresh
    // mid-selection does not throw the choices away.
    CMP_SELECTS.forEach(function (id) { bind(id, 'change', saveState); });

    bind('cmpClear', 'click', function () {
      CMP_SELECTS.forEach(function (id, index) {
        // The first two are required, so clearing resets them to the two most
        // recent months rather than to nothing.
        setValue(id, index < 2 ? defaultPeriodFor(index) : '');
      });
      hideComparisonResults();

      // Put the prompt back. showComparisonPending() rewrites this box, so
      // without this you would clear the results and be left staring at a
      // stale "no data yet" warning.
      const empty = document.getElementById('cmpEmpty');
      empty.hidden = false;
      empty.className = 'notice notice-info';
      empty.innerHTML =
        '<h3>Nothing compared yet</h3>' +
        '<p>Choose two or more ' + comparePeriodWord(true) +
        ' above and press Compare Dashboards.</p>';

      // state.trend is deliberately untouched: Clear resets the comparison,
      // and the trend is not part of it.
      state.compare = null;
      state.compareRan = false;
      saveState();
    });
  }


  function defaultPeriodFor(index) {
    return comparePeriodList()[index] || '';
  }


  function fillComparePeriods(periods) {
    const list = periods || [];
    const word = comparePeriodWord(false);

    // The labels above the boxes have to move with them. Leaving them reading
    // "First Month" over a list of quarters is the same class of mistake as
    // the screen once showing KPI 1's figures under KPI 2's name.
    relabelComparePickers();

    // No two boxes may end up on the same period. Switching KPI used to do
    // exactly that: the first box lost its month (not in the new list) and
    // fell back to the newest, which the second box was already holding — so
    // both read August, the two collapsed to one, and Compare refused to run
    // while the tables sat there still showing the previous KPI.
    const taken = {};

    CMP_SELECTS.forEach(function (id, index) {
      const select = document.getElementById(id);
      if (!select) return;

      const previous = select.value;
      const optional = index >= 2;

      select.innerHTML = optional
        ? '<option value="">— none —</option>'
        : '<option value="">— select a ' + word + ' —</option>';

      list.forEach(function (period) {
        const option = document.createElement('option');
        option.value = period;
        option.textContent = formatPeriod(period);
        select.appendChild(option);
      });

      select.disabled = !list.length;

      let value = '';
      if (previous && list.indexOf(previous) !== -1 && !taken[previous]) {
        value = previous;                        // keep what was chosen
      } else if (!optional) {
        // Newest first, skipping anything an earlier box already holds.
        for (let i = 0; i < list.length; i++) {
          if (!taken[list[i]]) { value = list[i]; break; }
        }
      }

      select.value = value;
      if (value) taken[value] = true;
    });
  }


  /**
   * Retitles the whole picker for the KPI in hand — Month or Quarter.
   *
   * The page heading and the four field labels are the only places the unit is
   * spelled out before anything has been compared, so they are the only places
   * that can mislead you into picking the wrong thing.
   */
  function relabelComparePickers() {
    const one = comparePeriodWord(false);
    const many = comparePeriodWord(true);
    const Title = one.charAt(0).toUpperCase() + one.slice(1);

    setText('cmpHeading', Title + ' Comparison');
    setText('cmpSubhead',
      'Compare two to four ' + many + ' side by side. Pick the KPI first — ' +
      'the ' + many + ', tables and charts below all follow it.');

    ['First', 'Second', 'Third', 'Fourth'].forEach(function (nth, index) {
      const label = document.getElementById('cmpM' + (index + 1) + 'Label');
      if (!label) return;
      label.innerHTML = nth + ' ' + Title +
        (index >= 2 ? ' <span class="muted">(optional)</span>' : '');
    });
  }


  function runComparison() {
    const picked = [];

    CMP_SELECTS.forEach(function (id) {
      const value = getValue(id);
      // Selecting the same month twice would produce duplicate columns, so
      // ignore repeats rather than rendering them.
      if (value && picked.indexOf(value) === -1) picked.push(value);
    });

    const one = comparePeriodWord(false);
    const many = comparePeriodWord(true);

    if (picked.length < 2) {
      const kpiNow = selectedKpi();
      const have = comparePeriodList().length;

      // Put the prompt back, so the screen explains itself once the dialog is
      // dismissed rather than showing nothing at all.
      hideComparisonResults();
      const box = document.getElementById('cmpEmpty');
      box.hidden = false;
      box.className = 'notice notice-warn';
      box.innerHTML =
        '<h3>Not enough ' + many + ' for ' +
        escapeHtml((kpiNow && kpiNow.name) || 'this KPI') + '</h3>' +
        '<p>' + (have < 2
          ? 'It has data for ' + (have === 1 ? 'one ' + one : 'no ' + many) +
            ' so far. Upload another period and it can be compared.'
          : 'Pick two different ' + many + ' above, then press Compare Dashboards.') +
        '</p>';

      return alertDialog({
        title: 'Two ' + many + ' are needed',
        body: have < 2
          ? '<p><strong>' + escapeHtml((kpiNow && kpiNow.name) || 'This KPI') +
            '</strong> has data for ' +
            (have === 1 ? 'only one ' + one : 'no ' + many) +
            ' so far, so there is nothing to compare it against yet.</p>' +
            '<p>Upload another period and it will appear here.</p>'
          : '<p>Pick two different ' + many + ' in the boxes above, then press ' +
            'Compare Dashboards.</p>'
      });
    }
    if (picked.length > MAX_COMPARE) {
      return alertDialog({
        title: 'Too many ' + many,
        body: '<p>Up to ' + MAX_COMPARE + ' ' + many + ' can be compared at once. ' +
              'Clear one of the optional boxes and try again.</p>'
      });
    }

    const kpi = selectedKpi();

    // Remembered so a refresh lands back on the results rather than on the
    // empty prompt. Saved before the server call, not after, so it survives
    // even if you reload while the comparison is still loading.
    state.compareRan = true;
    saveState();

    // Every KPI is selectable — a disabled option tells you nothing about why.
    // Picking one without data shows an explanation instead.
    if (kpi && !kpi.active) return showComparisonPending(kpi);

    // Route by the KPI actually chosen. This used to call KPI 1's endpoint
    // unconditionally, so selecting Training Satisfaction re-rendered ticket
    // figures under a training heading.
    callServer(comparisonEndpoint(kpi && kpi.id), picked)
      .then(renderComparison).catch(onError);
  }


  /** Takes the comparison results off screen. The trend is not part of them. */
  function hideComparisonResults() {
    ['cmpChartCard', 'cmpOverallCard', 'cmpSectionCard'].forEach(hide);
  }


  /** Explains why a KPI cannot be compared yet, in place of the results. */
  function showComparisonPending(kpi) {
    const empty = document.getElementById('cmpEmpty');
    hideComparisonResults();

    empty.hidden = false;
    empty.className = 'notice notice-warn';
    empty.innerHTML =
      '<h3>' + escapeHtml(kpi.name) + ' has no data yet</h3>' +
      '<p>Its definition is loaded — target &ge; ' + kpi.target + kpi.unit +
      ', ' + escapeHtml(kpi.slaLayer) + ' — but nothing has been uploaded ' +
      'against it, so there is nothing to compare. Formula: ' +
      escapeHtml(kpi.formula || '') + '</p>';
  }


  /**
   * Paints the comparison for whichever KPI produced it.
   *
   * Nothing here knows what a ticket is. The result object names its own
   * count columns in `measures` and its own breakdown in `sectionLabel`, so
   * KPI 1 and KPI 2 share one render path and KPI 3 will need no changes at
   * all — only a comparison endpoint that fills the same fields in.
   */
  function renderComparison(c) {
    const empty = document.getElementById('cmpEmpty');
    empty.className = 'notice notice-info';
    document.getElementById('cmpChartCard').hidden = false;

    state.compare = c;

    document.getElementById('cmpEmpty').hidden = true;
    document.getElementById('cmpOverallCard').hidden = false;
    document.getElementById('cmpSectionCard').hidden = false;

    const measures = c.measures || [
      { key: 'received',   label: 'Received' },
      { key: 'completed',  label: 'Completed' },
      { key: 'delayed',    label: 'Delayed' },
      { key: 'successful', label: 'Successful' }
    ];
    const sectionLabel = c.sectionLabel || 'Section';
    const periodLabel = c.periodLabel || 'Month';
    const period = periodLabel.toLowerCase();
    const shortName = c.kpi === 'KPI2' ? 'KPI 2' : (c.kpi === 'KPI1' ? 'KPI 1' : (c.kpi || ''));

    setText('cmpOverallTitle', shortName + ' — overall by ' + period +
      ' · Change is percentage points against the ' + period + ' above');
    setText('cmpSectionTitle', shortName + ' — success rate by ' + sectionLabel.toLowerCase());
    setText('cmpChartTitle', 'Success rate by ' + sectionLabel.toLowerCase() + ' and ' + period);

    drawCompareChart(c);

    // ---- overall, one row per period, with period-on-period change ----
    const overallHead = document.querySelector('#cmpOverall thead tr');
    overallHead.innerHTML =
      '<th>' + escapeHtml(periodLabel) + '</th>' +
      measures.map(function (m) {
        return '<th class="r">' + escapeHtml(m.label) + '</th>';
      }).join('') +
      '<th class="r">Success Rate</th><th class="r">Achievement</th>' +
      '<th>Band</th><th class="r">Headroom</th>' +
      // Spelled out in the header's tooltip and in the card title, because
      // "▲ 0.38" is unreadable without knowing what it is 0.38 OF — it is
      // percentage POINTS of success rate against the row above, not a
      // percentage change and not a change in ticket volume.
      '<th class="r" title="Success rate against the ' + period +
        ' above, in percentage points. ' +
        'A rate of 99.09% followed by 99.47% shows as ▲ 0.38.">Change</th>';

    const body = document.querySelector('#cmpOverall tbody');
    body.innerHTML = '';

    let previous = null;
    c.periods.forEach(function (period) {
      const t = c.totals[period];
      const tr = document.createElement('tr');

      if (!t) {
        tr.innerHTML = '<td>' + escapeHtml(formatPeriod(period)) + '</td>' +
                       '<td colspan="' + (measures.length + 5) +
                       '" class="empty">No data</td>';
        body.appendChild(tr);
        return;
      }

      let change = '—';
      if (previous !== null) {
        const delta = t.rate - previous;
        const arrow = delta > 0 ? '▲' : (delta < 0 ? '▼' : '=');
        const colour = delta > 0 ? 'var(--green)' : (delta < 0 ? 'var(--red)' : 'var(--text-mut)');
        change = '<span style="color:' + colour + '">' + arrow + ' ' +
                 fmt(Math.abs(delta)) + '</span>';
      }
      previous = t.rate;

      tr.innerHTML =
        '<td class="name">' + escapeHtml(formatPeriod(period)) + '</td>' +
        measures.map(function (m) { return num(t[m.key]); }).join('') +
        '<td class="r">' + fmt(t.rate) + '%</td>' +
        '<td class="r">' + fmt(t.achievement) + '%</td>' +
        '<td>' + pill(t.band) + '</td>' +
        '<td class="r">' + (t.headroom > 0 ? '+' : '') + t.headroom + '</td>' +
        '<td class="r">' + change + '</td>';
      body.appendChild(tr);
    });

    // ---- sections (or modules) down the side, periods across the top ----
