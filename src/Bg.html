<!--
  Bg.html - the sign-in picture, and nothing else.
  ================================================

  3200 x 1362, so it is scaled DOWN on a 1920 screen rather than stretched up.

  WHY IT IS WIDER THAN THE PHOTOGRAPH, AND WHY THAT MATTERS
  The photograph is 16:9. A browser window never is - once the tab strip and
  address bar are off the top, an ordinary one is about 2.1:1. Fitting a 16:9
  picture into that shape left a band down each side; filling it instead cut
  the top off the masthead. Neither was acceptable.

  So the canvas was extended sideways to 2.35:1. That is wide enough that
  FILLING an ordinary window only ever crops into the extension and never into
  the photograph - no bands at any edge, and nothing of the picture lost.

  HOW THE EXTENSION IS MADE, AND WHY IT IS NOT A DARK FADE
  A thin strip of each edge is stretched across the new space and blurred, so
  each side carries on in ITS OWN colour: the sunset side stays warm, the city
  side stays blue, the sky stays sky. An earlier version faded every edge to
  navy, which put a dark band over a light sky and looked like a mistake,
  because it was one.

  The blur is ramped - nearly sharp where it meets the photograph, fully soft
  by the outer edge - and cross-faded over the join, because a blurred column
  sitting next to a sharp one is itself a visible line. The slight darkening at
  the extreme edge multiplies the colour rather than mixing towards one, so it
  loses a little light without shifting hue.

  WHY IT IS ITS OWN FILE, IN BASE64, ASSEMBLED IN SCRIPT
  It is one photograph written out as text - about 4,000 lines. Apps Script
  cannot serve an image file of its own, and a link to one hosted elsewhere can
  be blocked or taken down on the very page where a broken image is the first
  thing anybody sees. A CSS url() cannot be split across lines, so as a
  stylesheet this would be one 380,000-character line; joined from short lines
  here it stays ordinary text that an editor and a paste can both cope with.

  TO CHANGE THE PICTURE: replace this whole file. Nothing else moves.
-->
