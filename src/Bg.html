  Bg.html - the sign-in picture, and nothing else.
  ================================================

  3200 x 1488, so it is scaled DOWN on a 1920 screen rather than stretched up.

  WHY IT IS WIDER THAN THE PHOTOGRAPH
  The photograph is 16:9. A browser window never is - once the tab strip and
  address bar are off the top, an ordinary one is about 2.1:1. Fitting a 16:9
  picture into that left a dark band down each side. So the canvas was
  extended sideways to 2.15:1: a thin strip of each edge stretched across the
  new space, blurred hard, and faded into the page colour. The picture reaches
  the edges of the window and dissolves rather than stopping at a border.

  WHY 'contain' AND NOT 'cover'
  cover fills by cropping whatever does not fit, which was cutting the top off
  the EAS mark and the whole RESOLVE row. contain never crops. At 2.15:1 it
  now fills the width of an ordinary window anyway, and the thin bands it
  leaves above and below on a 16:9 screen are faded into the page colour like
  the sides.

  WHY IT IS ITS OWN FILE
  It is one photograph written out as text - about 4,500 lines of base64.
  Kept in Styles.html it would bury the stylesheet.

  WHY IT IS BASE64 AND NOT A LINK
  An Apps Script web app cannot serve an image file of its own, and a link to
  one hosted elsewhere can be blocked, moved or taken down - on the sign-in
  page, where a broken image is the first thing anybody sees.

  WHY IT IS ASSEMBLED IN SCRIPT RATHER THAN WRITTEN AS CSS
  A CSS url() cannot be split across lines, so as a stylesheet this would be
  one 400,000-character line. Joined from short lines here, it stays ordinary
  text that an editor and a paste can both cope with.

  TO CHANGE THE PICTURE: replace this whole file. Nothing else moves.
-->
