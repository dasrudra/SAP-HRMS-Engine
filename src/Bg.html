  Bg.html - the sign-in picture, and nothing else.
  ================================================

  2880 x 1621, so it is still being scaled DOWN on a 1920 screen rather than
  stretched up. Stretched up was the first attempt and it looked soft.

  WHY IT IS ITS OWN FILE
  It is one photograph written out as text - about 5,000 lines of base64.
  Kept in Styles.html it would bury the stylesheet; kept here it is a file you
  paste once and never open again.

  WHY IT IS BASE64 AND NOT A LINK
  An Apps Script web app cannot serve an image file of its own, and a link to
  one hosted elsewhere can be blocked, moved or taken down - on the sign-in
  page, where a broken image is the first thing anybody sees. Written into the
  page, it cannot fail separately from the page.

  WHY IT IS ASSEMBLED IN SCRIPT RATHER THAN WRITTEN AS CSS
  A CSS url() cannot be split across lines, so as a stylesheet this would be a
  single half-million-character line. Joined from short lines here, the file
  stays ordinary text that an editor and a paste can both cope with.

  WHY 'contain' AND NOT 'cover'
  cover fills the window by cropping whichever dimension does not fit, and a
  browser window is always wider than 16:9 once its toolbars are taken off -
  so cover was cutting the top off the masthead and the first item off the
  left-hand list. contain never crops. The cost is a band at the sides on a
  wide window, which is why every edge of the picture is faded into the same
  navy the page is painted in: the band and the picture end in one colour and
  there is no seam to see.

  TO CHANGE THE PICTURE: replace this whole file. Nothing else moves.
-->
