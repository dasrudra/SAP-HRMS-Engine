  Bg.html - the sign-in picture, and nothing else.

  WHY IT IS ITS OWN FILE
  It is one 128 KB photograph written out as text, which is about 1,800 lines
  of base64. Kept in Styles.html it would bury the stylesheet; kept here it is
  a file you paste once and never open again. Nothing else in the project
  needs to know it exists.

  WHY IT IS BASE64 AND NOT A LINK
  An Apps Script web app cannot serve an image file of its own, and a link to
  one hosted elsewhere is a link that can be blocked, moved or taken down -
  and this one would be loading on the sign-in page, where a broken image is
  the first thing anybody sees. Written into the page, it cannot fail
  separately from the page.

  WHY IT IS ASSEMBLED IN SCRIPT RATHER THAN WRITTEN AS CSS
  A CSS url() cannot be split across lines, so as a stylesheet this would be a
  single 175,000-character line. Every editor struggles with that and so does
  anyone trying to paste it. Joined from short lines here, the file stays
  ordinary text. The sign-in card is hidden until the server answers, so the
  background is always in place before anything is shown.

  TO CHANGE THE PICTURE: replace this whole file. Nothing else moves.
-->
