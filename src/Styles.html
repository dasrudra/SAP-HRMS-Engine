<!--
  Styles.html — all CSS, inlined by include('Styles') in Index.html.

  Colours deliberately match the SAP & HRMS Database Center so that when these
  screens are grafted in as two new sidebar items, they look native rather than
  bolted on. Everything is a CSS variable, so a rebrand is one block of edits.

  DESIGN NOTES
  Six headline tiles, then the charts, then the tables — broad to detailed.
  Each tile carries a colour FAMILY (a wash, a tinted icon chip, a rule that
  draws on hover) rather than a flat accent stripe. The tone is meaning: the
  four figures that have a state take the reserved status hues, the two that
  are plain counts take blue and teal so they can never be read as a band.
-->
<style>
  :root {
    /* ---- brand (shared with the Database Center) ---- */
    --navy-900: #16233c;   /* sidebar */
    --navy-800: #1b2e4d;
    --navy-700: #1e3a5f;   /* top bar, table headers */
    --navy-500: #2c5282;
    --blue-500: #2563eb;   /* primary action */
    --blue-600: #1d4ed8;
    --blue-050: #eff6ff;

    /* Layout widths, kept here because two rules have to agree about them:
       the sidebar's own width and how much the content cap grows when the
       sidebar is minimised. */
    --sidebar-w: 214px;
    --sidebar-w-min: 58px;
    --content-max: 1680px;

    /* ---- surfaces & ink ---- */
    --page:      #f2f5f9;
    --surface:   #ffffff;
    --surface-2: #f7f9fc;   /* filter rows, table headers on light tables */
    --border:    #e2e8f1;
    --border-str:#cfdae8;
    --text:      #14202e;
    --text-dim:  #5a6b7d;
    --text-mut:  #8496a8;

    /*
      Status colours. Fixed set — never themed, never reused as a series hue.
      Validated against white: worst adjacent CVD ΔE 11.3, normal-vision 27.6.
      The yellow sits at 1.83:1, deliberately: a status colour here never
      carries meaning alone, it always ships beside a GREEN/YELLOW/RED pill and
      a printed number, which is the relief the contrast warning asks for.
    */
    --green:    #0ca30c;
    --green-ink:#046804;
    --green-bg: #e4f7e4;
    --amber:    #fab219;
    --amber-ink:#8a5d00;
    --amber-bg: #fef4dc;
    --red:      #d03b3b;
    --red-ink:  #a01f1f;
    --red-bg:   #fdeaea;

    --radius:    10px;
    --radius-sm: 7px;
    --shadow:    0 1px 2px rgba(20,32,46,.05), 0 6px 18px -12px rgba(20,32,46,.28);
    --shadow-lg: 0 1px 3px rgba(20,32,46,.06), 0 14px 34px -18px rgba(20,32,46,.34);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  /*
    The `hidden` attribute must beat any class that sets `display`.
    Without this, `.loader { display: grid }` keeps the spinner on screen even
    after JavaScript sets el.hidden = true — a class selector outranks the
    browser's built-in [hidden] rule.
  */
  [hidden] { display: none !important; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--page);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .app { display: flex; min-height: 100vh; }

  /* ---------------- sidebar ---------------- */
  /*
    Sticky, not static — the nav stays put while a long table scrolls past it.
    `align-self: flex-start` is required: a flex item stretches to the row's
    full height by default, which leaves nothing for sticky to slide within.
  */
  .sidebar {
    width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
    background: linear-gradient(180deg, var(--navy-900) 0%, #111c31 100%);
    transition: width .16s ease, flex-basis .16s ease;
  }
  .sidebar-inner {
    position: sticky; top: 0;
    height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .app.is-collapsed .sidebar {
    width: var(--sidebar-w-min); flex-basis: var(--sidebar-w-min);
  }
  .app.is-collapsed .brand-text,
  .app.is-collapsed .nav-group-label,
  .app.is-collapsed .nav-item span.nav-text { display: none; }
  .app.is-collapsed .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
  .app.is-collapsed .brand { justify-content: center; padding-left: 0; padding-right: 0; }
  .app.is-collapsed .nav-item.is-active::before { display: none; }

  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 16px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    position: relative;
  }
  .collapse-btn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px;
    display: grid; place-items: center;
    background: rgba(255,255,255,.08); border: 0; border-radius: 5px;
    color: #c2d1e4; cursor: pointer; padding: 0;
    transition: background .12s, color .12s;
  }
  .collapse-btn:hover { background: rgba(255,255,255,.2); color: #fff; }
  .collapse-btn:focus-visible { outline: 2px solid #7cb1ff; outline-offset: 1px; }
  .app.is-collapsed .collapse-btn { position: static; transform: none; margin: 0 auto; }
  .app.is-collapsed .collapse-btn svg { transform: rotate(180deg); }
  .brand-mark {
    width: 32px; height: 32px; flex: 0 0 32px;
    display: grid; place-items: center;
    background: var(--blue-500); color: #fff;
    border-radius: 7px;
    font-size: 11px; font-weight: 800; letter-spacing: .04em;
    box-shadow: 0 2px 10px -2px rgba(37,99,235,.7);
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
  .brand-text strong { color: #fff; font-size: 13px; letter-spacing: -.005em; }
  .brand-text span { color: #8fa3bd; font-size: 11px; }

  .nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
  .nav-group-label {
    font-size: 9.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase;
    color: #6c82a1; padding: 12px 10px 6px;
  }
  .nav-group-label:first-child { padding-top: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    width: 100%; padding: 10px 12px;
    background: transparent; border: 0; border-radius: 7px;
    color: #bccbe0; font-family: inherit; font-size: 13px; text-align: left;
    cursor: pointer; transition: background .12s, color .12s;
    position: relative;
  }
  .nav-item:hover { background: rgba(255,255,255,.09); color: #fff; }
  .nav-item:hover svg { transform: scale(1.08); }
  .nav-item svg { transition: transform .14s ease; }
  .nav-item.is-active {
    background: rgba(37,99,235,.9); color: #fff; font-weight: 600;
    box-shadow: 0 3px 12px -4px rgba(37,99,235,.9);
  }
  /* A left accent bar reads as "you are here" even at a glance. */
  .nav-item.is-active::before {
    content: ''; position: absolute; left: -10px; top: 8px; bottom: 8px;
    width: 3px; border-radius: 0 3px 3px 0; background: #7cb1ff;
  }
  .nav-item:focus-visible { outline: 2px solid #7cb1ff; outline-offset: 1px; }
  .nav-item svg { width: 16px; height: 16px; flex: 0 0 16px; stroke: currentColor; fill: none;
                  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------------- top bar ---------------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    background: var(--navy-700); color: #fff;
    padding: 11px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    box-shadow: 0 1px 0 rgba(255,255,255,.06) inset;
  }
  .topbar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .topbar-label { color: #93aeca; font-size: 10px; letter-spacing: .12em; font-weight: 600; }
  .topbar-left strong { font-size: 13px; font-weight: 600; }
  .topbar-right { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #cfe0f2; }
  .topbar-sep { width: 1px; height: 15px; background: rgba(255,255,255,.18); }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #35d07f;
    box-shadow: 0 0 0 3px rgba(53,208,127,.22);
  }
  .dot.is-busy { background: var(--amber); box-shadow: 0 0 0 3px rgba(250,178,25,.22); }
  .badge {
    background: rgba(255,255,255,.14); color: #fff;
    padding: 3px 9px; border-radius: 5px;
    font-size: 10px; font-weight: 700; letter-spacing: .07em;
  }

  /*
    The reading width is capped so a table row never runs the whole span of an
    ultrawide monitor — but the cap was ABSOLUTE, so minimising the sidebar
    handed its 156px back to the margin rather than to the content, and the
    page just grew a gap on the right. Collapsing the sidebar now widens the
    cap by exactly what the sidebar gave up, so the space goes where the
    gesture asked for it.
  */
  .content {
    padding: 24px; flex: 1; width: 100%;
    max-width: var(--content-max);
    transition: max-width .16s ease;
  }
  .app.is-collapsed .content {
    max-width: calc(var(--content-max) + var(--sidebar-w) - var(--sidebar-w-min));
  }

  /* ---------------- page header ---------------- */
  .page-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 18px;
  }
  .page-head h1 {
    margin: 0 0 5px; font-size: 22px; font-weight: 700; letter-spacing: -.02em;
  }
  .sub { margin: 0; color: var(--text-dim); font-size: 12.5px; max-width: 74ch; line-height: 1.5; }
  .page-actions { display: flex; align-items: center; gap: 8px; }

  /*
    Shown only when the all-months aggregate is on screen. The policy measures
    this KPI monthly, so an all-time figure is a useful overview but is NOT the
    number that gets reported — the screen has to say which one you are
    looking at.
  */
  .period-note {
    display: inline-flex; align-items: center; gap: 8px;
    margin: 10px 0 0; padding: 6px 12px 6px 10px;
    background: var(--blue-050); border: 1px solid #cfe0f8;
    border-radius: 999px;
    font-size: 12px; color: var(--navy-700);
  }
  .period-note b { font-weight: 700; }
  .period-note span { color: var(--text-dim); }

  /* What the database holds, to the day. Deliberately quieter than the
     period chip beside it: that one describes the figures on screen, this
     one describes the data behind them, and the reader should not have to
     work out which is which. */
  .coverage-note {
    margin: 8px 0 0; font-size: 12px; color: var(--text-dim);
  }
  .coverage-note b { font-weight: 650; color: var(--navy-700); }
  .coverage-note .part { white-space: nowrap; }

  /* ---------------- headline tiles ---------------- */
  /*
    Six figures across the top. Each carries a colour FAMILY rather than a
    flat accent: a soft wash in the corner, a tinted icon chip, and a rule
    that draws itself across the top on hover.

    The tone is meaning, not decoration. Success Rate, KPI Achievement,
    Headroom and Delayed take the reserved status hues because those four
    have a state. Received and Completed are plain counts with no good or bad
    about them, so they take blue and teal — families that can never be
    mistaken for a band.
  */
  .tiles {
    display: grid; gap: 12px; margin-bottom: 16px;
    grid-template-columns: repeat(auto-fit, minmax(176px, 1fr));
  }

  .tile {
    position: relative; overflow: hidden; isolation: isolate;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 15px 16px 16px;
    box-shadow: var(--shadow);
    transition: transform .2s cubic-bezier(.4,0,.2,1),
                box-shadow .2s ease, border-color .2s ease;
  }

  /* The wash. Sits behind the content via z-index, hence `isolation`. */
  .tile::after {
    content: ''; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(145deg, var(--tone-wash) 0%, transparent 68%);
    opacity: .85; transition: opacity .2s ease;
  }
  /* The top rule, drawn left-to-right on hover. */
  .tile::before {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: var(--tone); z-index: 1;
    transform: scaleX(0); transform-origin: left;
    transition: transform .26s cubic-bezier(.4,0,.2,1);
  }
  .tile:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg);
    border-color: var(--tone-edge);
  }
  .tile:hover::before { transform: scaleX(1); }
  .tile:hover::after  { opacity: 1; }

  .tile-top { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; }
  .tile-ico {
    width: 27px; height: 27px; flex: 0 0 27px; border-radius: 8px;
    display: grid; place-items: center;
    background: var(--tone-chip); color: var(--tone-ink);
    transition: transform .2s cubic-bezier(.4,0,.2,1), box-shadow .2s ease;
  }
  .tile:hover .tile-ico {
    transform: scale(1.09) rotate(-5deg);
    box-shadow: 0 3px 10px -3px var(--tone);
  }
  .tile-ico svg {
    width: 15px; height: 15px; fill: none; stroke: currentColor;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  .tile-label {
    font-size: 10px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--text-dim);
  }
  /*
    Proportional figures, not tabular: at 27px `tabular-nums` gives every
    digit the width of a zero and a number like 558 reads loose. Tabular is
    for columns that must line up, which these are not.
  */
  .tile-value {
    font-size: 27px; font-weight: 700; letter-spacing: -.03em; line-height: 1.06;
    font-variant-numeric: proportional-nums;
  }
  .tile-note {
    font-size: 11.5px; color: var(--text-dim); margin-top: 7px;
    line-height: 1.35; min-height: 16px;
  }
  /* Only Headroom carries one: the delay budget, drawn to scale. */
  .tile-bar {
    margin-top: 11px; height: 4px; border-radius: 999px;
    background: rgba(20,32,46,.09); overflow: hidden;
  }
  .tile-bar i {
    display: block; height: 100%; border-radius: 999px;
    background: var(--tone);
    transition: width .45s cubic-bezier(.4,0,.2,1);
  }

  /* ---- tone families ---- */
  .tile.t-g {
    --tone: #0ca30c; --tone-ink: #046804;
    --tone-wash: #e9f8e9; --tone-chip: #d4f2d4; --tone-edge: #a5e0a5;
  }
  .tile.t-a {
    --tone: #eda100; --tone-ink: #8a5d00;
    --tone-wash: #fef6e4; --tone-chip: #fdeac2; --tone-edge: #f3ce85;
  }
  .tile.t-r {
    --tone: #d03b3b; --tone-ink: #a01f1f;
    --tone-wash: #fdeeee; --tone-chip: #fadada; --tone-edge: #efb0b0;
  }
  .tile.t-blue {
    --tone: #2a78d6; --tone-ink: #1a4f92;
    --tone-wash: #eaf3fd; --tone-chip: #d5e7fa; --tone-edge: #a5c8ef;
  }
  .tile.t-teal {
    --tone: #1baf7a; --tone-ink: #0d7050;
    --tone-wash: #e7f8f2; --tone-chip: #cdf0e3; --tone-edge: #96ddc2;
  }

  .tile-empty {
    grid-column: 1 / -1; color: var(--text-mut);
    display: grid; place-items: center; min-height: 88px;
    --tone: var(--border-str); --tone-wash: transparent;
    --tone-chip: var(--surface-2); --tone-edge: var(--border-str);
  }
  .tile-empty:hover { transform: none; }

  /* ---------------- charts ---------------- */
  /*
    Series colours are validated for colour-vision deficiency against white:
    worst adjacent pair CVD ΔE 9.2 against a >=8 target, normal-vision 27.6.
    Aqua sits at 2.82:1, below the 3:1 bar — the relief rule applies, so every
    chart ships direct value labels and a table alongside it.
  */
  :root {
    --series-1: #2a78d6;   /* blue    */
    --series-2: #eb6834;   /* orange  */
    --series-3: #1baf7a;   /* aqua    */
    --series-4: #4a3aa7;   /* violet  */
    --grid-line: #eaeff5;
    --axis-text: #7b8b9d;
    --target-line: #1e3a5f;
  }

  .chart-row {
    display: grid; gap: 14px; margin-bottom: 14px;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  }
  .chart-card { padding: 0; }
  .chart-head {
    padding: 16px 20px 0;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .chart-head h2 {
    margin: 0 0 3px; font-size: 14.5px; font-weight: 700; letter-spacing: -.012em;
  }
  .chart-head p { margin: 0; font-size: 11.5px; color: var(--text-dim); line-height: 1.45; }
  /* Height includes the x-axis band, so labels are never clipped into a
     nested scrollbar. */
  .chart-box { padding: 12px 18px 18px; height: 268px; position: relative; }
  .chart-box-tall { height: 348px; }
  .chart-box canvas { width: 100% !important; height: 100% !important; }

  /*
    Zero state. An axis auto-scaled to all-zero data draws 0.1 … 1.0 ticks for
    counts that can only be whole numbers, which looks broken and says nothing.
    When there is genuinely nothing to plot, say so instead.
  */
  .chart-empty {
    position: absolute; inset: 12px 18px 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center;
    border: 1px dashed var(--border-str); border-radius: var(--radius-sm);
    background: linear-gradient(180deg, #fbfdff 0%, var(--surface-2) 100%);
  }
  .chart-empty .big {
    font-size: 30px; font-weight: 700; letter-spacing: -.02em; color: var(--green-ink);
  }
  .chart-empty p { margin: 0; font-size: 12.5px; color: var(--text-dim); max-width: 34ch; line-height: 1.5; }

  /* ---------------- the organisation stage ---------------- */
  /*
    A dark stage for the one thing on this page that is about people rather
    than thresholds. Dark on purpose: everything else here is a white card, so
    the stage reads as a different KIND of thing at a glance, and a light card
    would have made it one more table to scan past.

    Four section cards; click one and it opens. The others fall back to a rail
    down the side, still live so you can move between sections without closing,
    and the cards below the stage go to glass. Every motion is transform and
    opacity, which the compositor can do on its own — no layout is recalculated
    mid-animation, so it stays smooth on a laptop driving an external monitor.
  */
  .org-stage {
    position: relative; overflow: hidden;
    border-radius: var(--radius);
    background:
      radial-gradient(900px 420px at 18% -10%, rgba(37,99,235,.30), transparent 62%),
      radial-gradient(760px 420px at 88% 8%, rgba(12,163,12,.16), transparent 60%),
      linear-gradient(180deg, #16233c 0%, #0e1830 100%);
    box-shadow: var(--shadow-lg);
    padding: 22px 24px 26px;
    margin-bottom: 18px;
    color: #e8eef8;
  }
  /* A slow sheen across the top edge, so the stage is not a flat rectangle. */
  .org-stage::before {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(124,177,255,.75), transparent);
  }

  .org-stage-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; margin-bottom: 18px; position: relative; z-index: 2;
  }
  .org-stage-head h2 {
    margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; color: #fff;
  }
  .org-stage-head p {
    margin: 4px 0 0; font-size: 12.5px; color: #93a9c9; line-height: 1.5;
  }
  .org-close {
    flex: 0 0 auto;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18);
    color: #dce7f7; border-radius: 999px; padding: 7px 15px;
    font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    transition: background .14s ease, color .14s ease, transform .14s ease;
  }
  .org-close:hover { background: rgba(255,255,255,.2); color: #fff; transform: translateY(-1px); }
  .org-close:focus-visible { outline: 2px solid #7cb1ff; outline-offset: 2px; }

  /* The EAS lead, above the sections — the root of the chart. */
  .org-lead {
    display: inline-flex; align-items: center; gap: 11px;
    padding: 9px 16px 9px 10px; margin-bottom: 16px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 999px;
    position: relative; z-index: 2;
  }
  .org-lead .org-avatar { width: 30px; height: 30px; flex: 0 0 30px; font-size: 11px; }
  .org-lead b { font-size: 13px; color: #fff; font-weight: 650; }
  .org-lead span { font-size: 11.5px; color: #93a9c9; }

  /* The four sections. A grid, so opening one is a column-template change
     the browser can animate rather than a reflow of absolute positions. */
  .org-rows {
    display: grid; gap: 14px; position: relative; z-index: 2;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    transition: grid-template-columns .28s ease;
  }
  .org-stage.is-open .org-rows {
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .org-card {
    text-align: left; font-family: inherit; cursor: pointer;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: var(--radius);
    padding: 16px 16px 14px;
    color: inherit;
    display: flex; flex-direction: column; gap: 10px;
    transition: transform .22s ease, background .22s ease, border-color .22s ease,
                box-shadow .22s ease, opacity .22s ease, filter .22s ease;
  }
  .org-card:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,.1);
    border-color: rgba(124,177,255,.5);
    box-shadow: 0 18px 40px -22px rgba(0,0,0,.9), 0 0 0 1px rgba(124,177,255,.18) inset;
  }
  .org-card:focus-visible { outline: 2px solid #7cb1ff; outline-offset: 2px; }

  /* The one you opened: lit, lifted, and holding its accent. */
  .org-card.is-active {
    background: linear-gradient(160deg, rgba(37,99,235,.42), rgba(37,99,235,.12));
    border-color: rgba(124,177,255,.72);
    box-shadow: 0 0 0 1px rgba(124,177,255,.3) inset,
                0 22px 50px -26px rgba(37,99,235,.95);
  }
  /* The ones you did not: pushed back, not hidden — the video keeps them in
     shot, and being able to switch sections without closing is the point. */
  .org-stage.is-open .org-card:not(.is-active) {
    opacity: .42; filter: saturate(.45); transform: scale(.965);
  }
  .org-stage.is-open .org-card:not(.is-active):hover {
    opacity: .85; filter: none; transform: scale(.985) translateY(-2px);
  }

  .org-card-top { display: flex; align-items: center; gap: 10px; }
  .org-avatar {
    width: 34px; height: 34px; flex: 0 0 34px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 700; letter-spacing: .02em; color: #fff;
    background: linear-gradient(150deg, #2563eb, #1b3f8f);
    box-shadow: 0 4px 14px -6px rgba(37,99,235,.9);
  }
  .org-card h3 {
    margin: 0; font-size: 13.5px; font-weight: 650; color: #fff; line-height: 1.3;
  }
  .org-modules {
    display: inline-block; align-self: flex-start;
    padding: 2px 9px; border-radius: 999px;
    background: rgba(124,177,255,.16); border: 1px solid rgba(124,177,255,.3);
    font-size: 10px; font-weight: 700; letter-spacing: .06em; color: #a9c9ff;
  }
  .org-head-name { font-size: 12px; color: #b9cbe4; line-height: 1.45; }
  .org-head-name b { color: #e8eef8; font-weight: 600; }
  .org-interim {
    font-size: 10px; color: #f3c969; font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase;
  }
  .org-card-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: auto; padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,.1);
    font-size: 11.5px; color: #93a9c9;
  }
  .org-rate { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
  .org-rate.is-none { color: #7e91ab; font-weight: 600; font-size: 12px; }

  /* The opened section's people and figures. */
  .org-detail {
    margin-top: 16px; position: relative; z-index: 2;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: var(--radius);
    padding: 18px 20px 20px;
    animation: orgRise .3s ease both;
  }
  @keyframes orgRise {
    from { opacity: 0; transform: translateY(10px) scale(.99); }
    to   { opacity: 1; transform: none; }
  }
  .org-detail-head {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 14px;
    margin-bottom: 14px;
  }
  .org-detail-head h3 { margin: 0; font-size: 15px; font-weight: 700; color: #fff; }
  .org-detail-head .org-modules { align-self: center; }

  .org-figures {
    display: grid; gap: 10px; margin-bottom: 16px;
    grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
  }
  .org-figure {
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
    border-radius: var(--radius-sm); padding: 11px 13px;
  }
  .org-figure span {
    display: block; font-size: 9.5px; font-weight: 700; letter-spacing: .11em;
    text-transform: uppercase; color: #7f95b4; margin-bottom: 4px;
  }
  .org-figure strong {
    font-size: 17px; font-weight: 700; letter-spacing: -.01em; color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .org-figure small { display: block; margin-top: 3px; font-size: 10.5px; color: #8fa5c2; }

  /* The formula, set in the mono face so the division reads as arithmetic. */
  .kpi-formula {
    margin: 0 0 16px; padding: 11px 14px;
    background: rgba(0,0,0,.24); border: 1px solid rgba(255,255,255,.1);
    border-radius: var(--radius-sm);
    font-family: var(--mono); font-size: 12.5px; color: #cfe0f8;
  }
  .kpi-note { margin: 0; font-size: 12.5px; color: #b9cbe4; line-height: 1.6; }
  .kpi-note b { font-variant-numeric: tabular-nums; }

  /*
    The three bands as one scale rather than three cells of a table row. Read
    top to bottom they are a continuum — which is the thing a row of separate
    Target / Yellow / Red columns could not show.
  */
  .band-scale { display: grid; gap: 7px; margin-bottom: 16px; }
  .band-row {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 13px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.09);
    border-left: 3px solid var(--band);
    border-radius: var(--radius-sm);
    font-size: 12.5px; color: #b9cbe4;
  }
  .band-row i {
    width: 9px; height: 9px; flex: 0 0 9px; border-radius: 2px;
    background: var(--band);
  }
  .band-row b {
    color: #fff; font-weight: 650; font-variant-numeric: tabular-nums;
    min-width: 120px;
  }
  .band-row small { color: #8fa5c2; font-size: 11.5px; }

  .org-people-label {
    font-size: 9.5px; font-weight: 700; letter-spacing: .11em;
    text-transform: uppercase; color: #7f95b4; margin: 0 0 9px;
  }
  .org-people {
    display: grid; gap: 8px;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  }
  .org-person {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 11px 7px 8px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 999px;
    font-size: 12px; color: #d7e2f2;
    /* Each name arrives just after the one before it, so the section fills in
       rather than appearing all at once. Capped at nine steps so a large
       section does not take a second and a half to finish. */
    animation: orgRise .26s ease both;
    animation-delay: calc(var(--i) * 28ms);
  }
  .org-person .org-avatar {
    width: 24px; height: 24px; flex: 0 0 24px; font-size: 9.5px;
    background: linear-gradient(150deg, #3f6fd8, #24417e);
    box-shadow: none;
  }
  .org-person.is-head {
    background: rgba(124,177,255,.16); border-color: rgba(124,177,255,.34);
    color: #fff; font-weight: 600;
  }
  .org-person.is-head .org-avatar {
    background: linear-gradient(150deg, #2563eb, #14337a);
  }

  /*
    Glass. Everything else on the screen goes back while a section is open —
    which is what "the background tables fade" asks for, done with blur and
    opacity so nothing moves and nothing is unmounted.
  */
  .org-dimmed {
    filter: blur(3px) saturate(.6); opacity: .4;
    pointer-events: none; user-select: none;
    transition: filter .3s ease, opacity .3s ease;
  }

  @media (prefers-reduced-motion: reduce) {
    .org-card, .org-rows, .org-close, .content { transition: none; }
    .org-detail, .org-person { animation: none; }
  }

  /* ---------------- comparison picker ---------------- */
  .cmp-picker { padding: 20px 22px 22px; }
  .cmp-grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  }
  .cmp-field { display: flex; flex-direction: column; gap: 6px; }
  .cmp-field label {
    font-size: 11px; font-weight: 700; color: var(--navy-700);
    letter-spacing: .05em; text-transform: uppercase;
  }
  .cmp-field .muted { font-weight: 400; text-transform: none; letter-spacing: 0; }
  .cmp-field .select { width: 100%; padding: 10px 12px; }
  .cmp-actions {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 20px;
  }
  .btn-lg { padding: 11px 26px; font-size: 14px; font-weight: 700; border-radius: 8px; }

  /* ---------------- upload row actions ---------------- */
  .row-actions { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .btn-open {
    background: var(--navy-700); color: #fff; border: 0;
    padding: 7px 14px; border-radius: 6px;
    font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
    transition: background .12s;
  }
  .btn-open:hover { background: var(--navy-500); box-shadow: 0 3px 10px -3px rgba(30,58,95,.7); }
  .btn-open:active { transform: translateY(1px); }
  .btn-icon {
    width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    border: 1px solid var(--border-str); background: var(--surface); color: var(--text-dim);
    padding: 0; transition: background .12s, border-color .12s, color .12s;
  }
  .btn-icon svg { width: 14px; height: 14px; stroke: currentColor; fill: none;
                  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .btn-icon.is-primary { background: var(--blue-500); border-color: var(--blue-500); color: #fff; }
  .btn-icon:hover { transform: translateY(-1px); box-shadow: 0 3px 8px -2px rgba(20,32,46,.28); }
  .btn-icon:active { transform: translateY(0); }
  .btn-icon.is-primary:hover { background: var(--blue-600); }
  .btn-icon.is-danger:hover { border-color: var(--red); color: var(--red); background: var(--red-bg); }
  .btn-open:focus-visible, .btn-icon:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 2px; }

  /* ---------------- controls ---------------- */
  .select, .btn {
    font-family: inherit; font-size: 13px; font-weight: 500;
    padding: 8px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-str); background: var(--surface); color: var(--text);
    cursor: pointer;
    transition: border-color .14s, background .14s, box-shadow .14s, transform .08s;
  }
  .select:hover, .btn:hover {
    border-color: #9db3cd;
    box-shadow: 0 1px 3px rgba(20,32,46,.08);
  }
  /* A soft ring rather than a hard outline — same job, less shouting. */
  .select:focus-visible, .btn:focus-visible {
    outline: none;
    border-color: var(--blue-500);
    box-shadow: 0 0 0 3px rgba(37,99,235,.18);
  }
  .btn:active { transform: translateY(1px); }

  /*
    Custom dropdown arrow. The browser's own arrow is drawn by the OS and
    looks like a 2005 form control next to everything else here. The chevron
    is a data: URI so it costs no request and cannot be blocked by the CSP.
  */
  select.select {
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
    padding-right: 32px;
    background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%235a6b7d' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 6.5L8 10.5l4-4'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 14px 14px;
  }
  select.select:disabled {
    background-color: var(--surface-2); color: var(--text-mut); cursor: not-allowed;
  }

  .btn-ghost:hover { background: var(--blue-050); border-color: var(--blue-500); color: var(--navy-700); }
  .btn-primary {
    background: linear-gradient(180deg, #2f6ef0 0%, var(--blue-500) 100%);
    border-color: var(--blue-500); color: #fff; font-weight: 600;
    box-shadow: 0 2px 8px -2px rgba(37,99,235,.55);
  }
  .btn-primary:hover {
    background: linear-gradient(180deg, var(--blue-500) 0%, var(--blue-600) 100%);
    border-color: var(--blue-600);
    box-shadow: 0 4px 14px -3px rgba(37,99,235,.6);
  }

  /* ---------------- per-table filter row ---------------- */
  /*
    Each table owns its filter instead of one bar governing the page, so
    narrowing the individuals list does not silently change what the section
    table above it is showing.
  */
  .table-filter {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .table-filter .select { min-width: 150px; padding: 6px 10px; font-size: 12.5px; }
  .table-filter input.select { min-width: 190px; cursor: text; }
  .table-filter .btn { padding: 6px 10px; font-size: 12.5px; }
  .table-filter .filter-count { margin-left: auto; font-size: 11.5px; color: var(--text-mut); }

  /* ---------------- cards & tables ---------------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 14px;
    overflow: hidden;
    transition: box-shadow .18s ease, border-color .18s ease, transform .18s ease;
  }
  .card:hover {
    box-shadow: var(--shadow-lg);
    border-color: var(--border-str);
  }
  /* Only the charts lift. Lifting a long table under the cursor is motion
     sickness, not delight. */
  .chart-card:hover { transform: translateY(-2px); }

  .card-head {
    padding: 13px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 10.5px; font-weight: 700; letter-spacing: .11em;
    text-transform: uppercase; color: var(--navy-700);
    background: var(--surface);
    display: flex; align-items: center; gap: 9px;
    transition: background .14s ease, color .14s ease;
  }
  /* The table's own name answers the cursor. Every other target on these
     screens does — rows, pills, buttons, chart bars — and a title that sits
     dead under the pointer reads as a part of the page that is switched off.
     Background and ink both move, so it still carries in a screenshot and for
     anyone who cannot separate the two tints. */
  .card-head:hover { background: var(--blue-050); color: var(--blue-600); }
  /* A short accent rule in front of the label — reads as a section marker
     without adding another line of text. */
  .card-head::before {
    content: ''; width: 3px; height: 13px; border-radius: 2px;
    background: var(--blue-500); flex: 0 0 3px;
    transition: height .14s ease;
  }
  .card-head:hover::before { height: 17px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    background: var(--navy-700); color: #fff;
    text-align: left; padding: 10px 16px; white-space: nowrap;
    font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    position: sticky; top: 0; z-index: 1;
  }
  th.r, td.r { text-align: right; }
  tbody td {
    padding: 10px 16px; border-top: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  tbody tr { transition: background .12s ease; }
  tbody tr:nth-child(even) td { background: #fafcfe; }
  tbody tr:hover td { background: var(--blue-050); }
  /* Tracking a 9-column row is much easier with a marker at its start. */
  tbody tr td:first-child { position: relative; }
  tbody tr td:first-child::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--blue-500);
    transform: scaleY(0); transform-origin: center;
    transition: transform .16s ease;
  }
  tbody tr:hover td:first-child::before { transform: scaleY(1); }
  /* A column of zeros should recede — the non-zero values are the signal. */
  td.zero { color: var(--text-mut); }
  td.empty { text-align: center; color: var(--text-mut); padding: 30px; font-style: italic; background: var(--surface) !important; }
  td.name { font-weight: 600; }

  .pill {
    display: inline-block; padding: 3px 9px; border-radius: 999px;
    font-size: 10px; font-weight: 700; letter-spacing: .05em;
    border: 1px solid transparent;
    transition: box-shadow .14s ease;
  }
  tbody tr:hover .pill { box-shadow: 0 1px 4px rgba(20,32,46,.14); }
  .pill.g { background: var(--green-bg); color: var(--green-ink); }
  .pill.a { background: var(--amber-bg); color: var(--amber-ink); }
  .pill.r { background: var(--red-bg);   color: var(--red-ink); }

  /* ---------------- notices ---------------- */
  .notice {
    border: 1px solid var(--border); border-left: 4px solid var(--blue-500);
    background: var(--surface); border-radius: var(--radius);
    padding: 16px 20px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .notice h3 { margin: 0 0 6px; font-size: 14.5px; }
  .notice p { margin: 0; color: var(--text-dim); font-size: 13px; max-width: 78ch; line-height: 1.55; }
  .notice code {
    font-family: var(--mono); font-size: 12px;
    background: var(--blue-050); padding: 1px 5px; border-radius: 3px; color: var(--navy-700);
  }
  .notice-warn  { border-left-color: var(--amber); }
  .notice-error { border-left-color: var(--red); }
  .notice-info  { border-left-color: var(--navy-500); }

  /* ---------------- dropzone ---------------- */
  .dropzone {
    margin: 16px; padding: 36px 20px;
    border: 2px dashed var(--border-str); border-radius: var(--radius);
    text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .dropzone:hover, .dropzone.is-over {
    border-color: var(--blue-500); background: var(--blue-050);
    box-shadow: inset 0 0 0 4px rgba(37,99,235,.05);
  }
  .dropzone:hover .dropzone-ico, .dropzone.is-over .dropzone-ico { transform: translateY(-3px); }
  .dropzone-ico { transition: transform .18s ease; }
  .dropzone-ico { font-size: 26px; color: var(--blue-500); margin-bottom: 6px; }
  .dropzone p { margin: 2px 0; font-size: 13px; }
  .muted { color: var(--text-mut); font-size: 12px; }
  .upload-status { margin: 0 16px 16px; font-size: 13px; }

  /* ---------------- misc ---------------- */
  .loader { display: grid; place-items: center; padding: 80px 0; gap: 14px; color: var(--text-dim); }
  .spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--blue-500);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /*
    Views fade up as they appear. Small enough that it registers as
    responsiveness rather than as an animation you have to wait for.
  */
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  .view:not([hidden]) { animation: riseIn .22s ease both; }

  /*
    Scrollbars. The OS default is a wide grey slab that fights the palette;
    these match the page. Firefox takes the two-value form, WebKit the
    pseudo-elements — both are ignored where unsupported.
  */
  * { scrollbar-width: thin; scrollbar-color: #c3d1e0 transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: #c3d1e0; border-radius: 999px;
    border: 3px solid transparent; background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: #9db3cd; background-clip: content-box; }
  .sidebar-inner { scrollbar-color: #33456a transparent; }
  .sidebar-inner::-webkit-scrollbar-thumb { background: #33456a; background-clip: content-box; }

  /*
    One switch turns every bit of motion off. Anyone who has asked their OS
    for reduced motion has asked for a reason, and a KPI dashboard is not the
    place to argue with them.
  */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
      scroll-behavior: auto !important;
    }
    .spinner { animation-duration: 2.4s !important; animation-iteration-count: infinite !important; }
    .chart-card:hover { transform: none; }
  }

  /* A card whose body is prose and one action, rather than a table. */
  .notice-inline { padding: 16px 18px 18px; }
  .notice-inline p {
    margin: 0 0 14px; font-size: 13px; color: var(--text-dim);
    line-height: 1.6; max-width: 78ch;
  }
  .notice-inline code {
    font-family: var(--mono); font-size: 12px;
    background: var(--blue-050); padding: 1px 5px; border-radius: 3px; color: var(--navy-700);
  }
  .notice-inline .filter-count { margin-left: 12px; }

  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 9px 20px; margin: 0; padding: 18px; font-size: 13px; }
  .kv dt { color: var(--text-mut); }
  .kv dd { margin: 0; font-family: var(--mono); font-size: 12px; word-break: break-all; }

  /* ---------------- confirmation dialog ---------------- */
  /*
    Replaces window.confirm(). The browser's version put the sandbox hostname
    in the heading, could not show WHAT was being deleted, and gave the
    destructive answer the same weight as the safe one. Here the file being
    removed is named, the consequence is spelled out, and Cancel is the
    resting focus.
  */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    background: rgba(16, 26, 41, .52);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    animation: fadeIn .16s ease both;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(10px) scale(.97); }
    to   { opacity: 1; transform: none; }
  }

  /*
    Laid out as a column with a scrolling middle, so the dialog can never grow
    taller than the window. A 43-file upload pushed the heading off the top and
    Cancel and Delete off the bottom, leaving no way to answer the question.
  */
  .modal {
    width: 100%; max-width: 500px;
    max-height: calc(100vh - 40px);
    display: flex; flex-direction: column;
    background: var(--surface); border-radius: 14px;
    box-shadow: 0 24px 60px -14px rgba(12, 20, 33, .45),
                0 2px 6px rgba(12, 20, 33, .12);
    animation: popIn .2s cubic-bezier(.16,1,.3,1) both;
    overflow: hidden;
  }

  .modal-head {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 22px 24px 0;
  }
  .modal-icon {
    flex: 0 0 42px; width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: var(--red-bg); color: var(--red-ink);
  }
  .modal-icon svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7;
                    stroke-linecap: round; stroke-linejoin: round; }
  .modal.is-info .modal-icon { background: var(--blue-050); color: var(--blue-600); }

  .modal h2 { margin: 2px 0 0; font-size: 16.5px; letter-spacing: -.01em; }
  .modal-sub { margin: 4px 0 0; font-size: 12.5px; color: var(--text-mut); font-family: var(--mono); }
  .modal-sub:empty { display: none; }

  /* The only part that scrolls. The heading and the buttons stay put. */
  .modal-head { flex: 0 0 auto; }
  .modal-body {
    flex: 1 1 auto; overflow-y: auto;
    padding: 16px 24px 4px; font-size: 13.2px; color: var(--text-dim); line-height: 1.6;
  }
  .modal-body p { margin: 0 0 10px; }
  .modal-body p:last-child { margin-bottom: 0; }
  .modal-body strong { color: var(--text); font-weight: 600; }

  /* What is about to go, named. The whole point of not using window.confirm. */
  .modal-target {
