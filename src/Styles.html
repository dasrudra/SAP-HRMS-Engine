<!--
  Styles.html — all CSS, inlined by include('Styles') in Index.html.

  Colours deliberately match the SAP & HRMS Database Center so that when these
  screens are grafted in as two new sidebar items, they look native rather than
  bolted on. Everything is a CSS variable, so a rebrand is one block of edits.

  DESIGN NOTES
  The page has ONE hero figure — the success rate — and everything else is
  sized below it. Six identical tiles gave "Received" the same weight as the
  number the KPI is actually about; a reader had to hunt for the point. The
  hero panel states the point, the stat strip supports it, the charts break it
  down and the tables carry the detail.
-->
<style>
  :root {
    /* ---- brand (shared with the Database Center) ---- */
    --navy-900: #16233c;   /* sidebar */
    --navy-800: #1b2e4d;
    --navy-700: #1e3a5f;   /* top bar, table headers */
    --navy-500: #2c5282;
    --blue-500: #2563eb;   /* primary action */
    --blue-600: #1d4ed8;
    --blue-050: #eff6ff;

    /* ---- surfaces & ink ---- */
    --page:      #f2f5f9;
    --surface:   #ffffff;
    --surface-2: #f7f9fc;   /* filter rows, table headers on light tables */
    --border:    #e2e8f1;
    --border-str:#cfdae8;
    --text:      #14202e;
    --text-dim:  #5a6b7d;
    --text-mut:  #8496a8;

    /*
      Status colours. Fixed set — never themed, never reused as a series hue.
      Validated against white: worst adjacent CVD ΔE 11.3, normal-vision 27.6.
      The yellow sits at 1.83:1, deliberately: a status colour here never
      carries meaning alone, it always ships beside a GREEN/YELLOW/RED pill and
      a printed number, which is the relief the contrast warning asks for.
    */
    --green:    #0ca30c;
    --green-ink:#046804;
    --green-bg: #e4f7e4;
    --amber:    #fab219;
    --amber-ink:#8a5d00;
    --amber-bg: #fef4dc;
    --red:      #d03b3b;
    --red-ink:  #a01f1f;
    --red-bg:   #fdeaea;

    --radius:    10px;
    --radius-sm: 7px;
    --shadow:    0 1px 2px rgba(20,32,46,.05), 0 6px 18px -12px rgba(20,32,46,.28);
    --shadow-lg: 0 1px 3px rgba(20,32,46,.06), 0 14px 34px -18px rgba(20,32,46,.34);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  /*
    The `hidden` attribute must beat any class that sets `display`.
    Without this, `.loader { display: grid }` keeps the spinner on screen even
    after JavaScript sets el.hidden = true — a class selector outranks the
    browser's built-in [hidden] rule.
  */
  [hidden] { display: none !important; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--page);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .app { display: flex; min-height: 100vh; }

  /* ---------------- sidebar ---------------- */
  /*
    Sticky, not static — the nav stays put while a long table scrolls past it.
    `align-self: flex-start` is required: a flex item stretches to the row's
    full height by default, which leaves nothing for sticky to slide within.
  */
  .sidebar {
    width: 214px; flex: 0 0 214px;
    background: linear-gradient(180deg, var(--navy-900) 0%, #111c31 100%);
    transition: width .16s ease, flex-basis .16s ease;
  }
  .sidebar-inner {
    position: sticky; top: 0;
    height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .app.is-collapsed .sidebar { width: 58px; flex-basis: 58px; }
  .app.is-collapsed .brand-text,
  .app.is-collapsed .nav-group-label,
  .app.is-collapsed .nav-item span.nav-text { display: none; }
  .app.is-collapsed .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
  .app.is-collapsed .brand { justify-content: center; padding-left: 0; padding-right: 0; }
  .app.is-collapsed .nav-item.is-active::before { display: none; }

  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 16px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    position: relative;
  }
  .collapse-btn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px;
    display: grid; place-items: center;
    background: rgba(255,255,255,.08); border: 0; border-radius: 5px;
    color: #c2d1e4; cursor: pointer; padding: 0;
    transition: background .12s, color .12s;
  }
  .collapse-btn:hover { background: rgba(255,255,255,.2); color: #fff; }
  .collapse-btn:focus-visible { outline: 2px solid #7cb1ff; outline-offset: 1px; }
  .app.is-collapsed .collapse-btn { position: static; transform: none; margin: 0 auto; }
  .app.is-collapsed .collapse-btn svg { transform: rotate(180deg); }
  .brand-mark {
    width: 32px; height: 32px; flex: 0 0 32px;
    display: grid; place-items: center;
    background: var(--blue-500); color: #fff;
    border-radius: 7px;
    font-size: 11px; font-weight: 800; letter-spacing: .04em;
    box-shadow: 0 2px 10px -2px rgba(37,99,235,.7);
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
  .brand-text strong { color: #fff; font-size: 13px; letter-spacing: -.005em; }
  .brand-text span { color: #8fa3bd; font-size: 11px; }

  .nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
  .nav-group-label {
    font-size: 9.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase;
    color: #6c82a1; padding: 12px 10px 6px;
  }
  .nav-group-label:first-child { padding-top: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    width: 100%; padding: 10px 12px;
    background: transparent; border: 0; border-radius: 7px;
    color: #bccbe0; font-family: inherit; font-size: 13px; text-align: left;
    cursor: pointer; transition: background .12s, color .12s;
    position: relative;
  }
  .nav-item:hover { background: rgba(255,255,255,.09); color: #fff; }
  .nav-item:hover svg { transform: scale(1.08); }
  .nav-item svg { transition: transform .14s ease; }
  .nav-item.is-active {
    background: rgba(37,99,235,.9); color: #fff; font-weight: 600;
    box-shadow: 0 3px 12px -4px rgba(37,99,235,.9);
  }
  /* A left accent bar reads as "you are here" even at a glance. */
  .nav-item.is-active::before {
    content: ''; position: absolute; left: -10px; top: 8px; bottom: 8px;
    width: 3px; border-radius: 0 3px 3px 0; background: #7cb1ff;
  }
  .nav-item:focus-visible { outline: 2px solid #7cb1ff; outline-offset: 1px; }
  .nav-item svg { width: 16px; height: 16px; flex: 0 0 16px; stroke: currentColor; fill: none;
                  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------------- top bar ---------------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    background: var(--navy-700); color: #fff;
    padding: 11px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    box-shadow: 0 1px 0 rgba(255,255,255,.06) inset;
  }
  .topbar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .topbar-label { color: #93aeca; font-size: 10px; letter-spacing: .12em; font-weight: 600; }
  .topbar-left strong { font-size: 13px; font-weight: 600; }
  .topbar-right { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #cfe0f2; }
  .topbar-sep { width: 1px; height: 15px; background: rgba(255,255,255,.18); }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #35d07f;
    box-shadow: 0 0 0 3px rgba(53,208,127,.22);
  }
  .dot.is-busy { background: var(--amber); box-shadow: 0 0 0 3px rgba(250,178,25,.22); }
  .badge {
    background: rgba(255,255,255,.14); color: #fff;
    padding: 3px 9px; border-radius: 5px;
    font-size: 10px; font-weight: 700; letter-spacing: .07em;
  }

  .content { padding: 24px; flex: 1; max-width: 1680px; width: 100%; }

  /* ---------------- page header ---------------- */
  .page-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 18px;
  }
  .page-head h1 {
    margin: 0 0 5px; font-size: 22px; font-weight: 700; letter-spacing: -.02em;
  }
  .sub { margin: 0; color: var(--text-dim); font-size: 12.5px; max-width: 74ch; line-height: 1.5; }
  .page-actions { display: flex; align-items: center; gap: 8px; }

  /* ---------------- hero panel ---------------- */
  /*
    Exactly one hero figure per view. It answers "did we hit the target?"
    before the reader has to parse anything else; the meter underneath shows
    how much room is left, which a bare percentage cannot.
  */
  .hero {
    display: grid; gap: 0;
    grid-template-columns: minmax(300px, 1.15fr) minmax(280px, 1fr);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    margin-bottom: 14px;
    overflow: hidden;
  }
  .hero-main {
    padding: 22px 26px 24px; position: relative;
    background: linear-gradient(135deg, #ffffff 0%, #fbfcfe 55%, #f6f9fd 100%);
  }
  /* A 3px band-coloured spine — the state of the KPI, readable at any zoom. */
  .hero-main::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--hero-accent, var(--text-mut));
  }
  .hero-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: .11em;
    text-transform: uppercase; color: var(--text-mut);
  }
  .hero-figure-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 6px 0 2px; }
  /*
    Proportional figures, not tabular: at 52px `tabular-nums` gives every digit
    the width of a zero and the number reads loose. Tabular is for columns.
  */
  .hero-figure {
    font-size: 52px; font-weight: 700; line-height: 1; letter-spacing: -.035em;
    font-variant-numeric: proportional-nums;
  }
  .hero-sub { font-size: 12.5px; color: var(--text-dim); margin: 8px 0 0; }
  .hero-sub b { color: var(--text); font-variant-numeric: tabular-nums; }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: .06em;
  }
  .chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .chip.g { background: var(--green-bg); color: var(--green-ink); }
  .chip.a { background: var(--amber-bg); color: var(--amber-ink); }
  .chip.r { background: var(--red-bg);   color: var(--red-ink); }
  .chip.n { background: #eef2f7;         color: var(--text-dim); }

  /*
    Meter. The fill carries severity; the track is a light step of the same
    family so the state reads across the whole bar. The target notch is the
    only thing that makes the fill mean something.
  */
  .meter { margin-top: 20px; }
  .meter-head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    margin-bottom: 7px;
  }
  .meter-head span:first-child {
    font-size: 10px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--text-mut);
  }
  .meter-head span:last-child {
    font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .meter-track {
    position: relative; height: 8px; border-radius: 999px;
    background: #e6ecf4; overflow: hidden;
  }
  .meter-fill {
    height: 100%; border-radius: 999px;
    background: var(--hero-accent, var(--text-mut));
    transition: width .35s cubic-bezier(.4,0,.2,1);
  }
  .meter-scale {
    display: flex; justify-content: space-between;
    margin-top: 7px; font-size: 11px; color: var(--text-mut);
    font-variant-numeric: tabular-nums;
  }

  .hero-side {
    border-left: 1px solid var(--border);
    background: var(--surface-2);
    display: grid; grid-template-columns: 1fr 1fr;
  }
  .hero-cell {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    transition: background .14s ease;
  }
  .hero-cell:hover { background: #eef3fa; }
  .hero-cell:nth-child(odd) { border-right: 1px solid var(--border); }
  .hero-cell:nth-last-child(-n+2) { border-bottom: 0; }
  .hero-cell .k {
    font-size: 10px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--text-mut);
  }
  .hero-cell .v {
    font-size: 23px; font-weight: 700; letter-spacing: -.02em; margin-top: 5px;
    font-variant-numeric: proportional-nums;
  }
  .hero-cell .n { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; line-height: 1.35; }
  .hero-cell .v.g { color: var(--green-ink); }
  .hero-cell .v.a { color: var(--amber-ink); }
  .hero-cell .v.r { color: var(--red-ink); }

  @media (max-width: 980px) {
    .hero { grid-template-columns: 1fr; }
    .hero-side { border-left: 0; border-top: 1px solid var(--border); }
  }

  .hero-empty {
    grid-column: 1 / -1; padding: 40px; text-align: center; color: var(--text-mut);
  }

  /* ---------------- charts ---------------- */
  /*
    Series colours are validated for colour-vision deficiency against white:
    worst adjacent pair CVD ΔE 9.2 against a >=8 target, normal-vision 27.6.
    Aqua sits at 2.82:1, below the 3:1 bar — the relief rule applies, so every
    chart ships direct value labels and a table alongside it.
  */
  :root {
    --series-1: #2a78d6;   /* blue    */
    --series-2: #eb6834;   /* orange  */
    --series-3: #1baf7a;   /* aqua    */
    --series-4: #4a3aa7;   /* violet  */
    --grid-line: #eaeff5;
    --axis-text: #7b8b9d;
    --target-line: #1e3a5f;
  }

  .chart-row {
    display: grid; gap: 14px; margin-bottom: 14px;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  }
  .chart-card { padding: 0; }
  .chart-head {
    padding: 16px 20px 0;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .chart-head h2 {
    margin: 0 0 3px; font-size: 14.5px; font-weight: 700; letter-spacing: -.012em;
  }
  .chart-head p { margin: 0; font-size: 11.5px; color: var(--text-dim); line-height: 1.45; }
  /* Height includes the x-axis band, so labels are never clipped into a
     nested scrollbar. */
  .chart-box { padding: 12px 18px 18px; height: 268px; position: relative; }
  .chart-box-tall { height: 348px; }
  .chart-box canvas { width: 100% !important; height: 100% !important; }

  /*
    Zero state. An axis auto-scaled to all-zero data draws 0.1 … 1.0 ticks for
    counts that can only be whole numbers, which looks broken and says nothing.
    When there is genuinely nothing to plot, say so instead.
  */
  .chart-empty {
    position: absolute; inset: 12px 18px 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center;
    border: 1px dashed var(--border-str); border-radius: var(--radius-sm);
    background: linear-gradient(180deg, #fbfdff 0%, var(--surface-2) 100%);
  }
  .chart-empty .big {
    font-size: 30px; font-weight: 700; letter-spacing: -.02em; color: var(--green-ink);
  }
  .chart-empty p { margin: 0; font-size: 12.5px; color: var(--text-dim); max-width: 34ch; line-height: 1.5; }

  /* One threshold ring per KPI — four across on a wide screen. */
  .gauge-grid {
    display: grid; gap: 14px; padding: 16px 18px 18px;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  }
  .gauge-cell {
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 16px 14px; text-align: center; background: var(--surface-2);
  }
  .gauge-cell h3 { margin: 0 0 2px; font-size: 13px; font-weight: 700; }
  .gauge-cell .gauge-layer {
    font-size: 10.5px; color: var(--text-mut); display: block; margin-bottom: 10px;
  }
  .gauge-canvas { position: relative; height: 150px; }
  .gauge-centre {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .gauge-centre strong { font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .gauge-centre span { font-size: 10px; color: var(--text-mut); }
  .gauge-bands {
    margin-top: 12px; font-size: 11px; color: var(--text-dim);
    display: flex; flex-direction: column; gap: 4px;
  }
  .gauge-bands span { display: flex; align-items: center; gap: 7px; justify-content: center; }
  .gauge-bands i {
    width: 8px; height: 8px; border-radius: 2px; flex: 0 0 8px; font-style: normal;
  }
  .gauge-bands b { font-variant-numeric: tabular-nums; }

  /* ---------------- comparison picker ---------------- */
  .cmp-picker { padding: 20px 22px 22px; }
  .cmp-grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  }
  .cmp-field { display: flex; flex-direction: column; gap: 6px; }
  .cmp-field label {
    font-size: 11px; font-weight: 700; color: var(--navy-700);
    letter-spacing: .05em; text-transform: uppercase;
  }
  .cmp-field .muted { font-weight: 400; text-transform: none; letter-spacing: 0; }
  .cmp-field .select { width: 100%; padding: 10px 12px; }
  .cmp-actions {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 20px;
  }
  .btn-lg { padding: 11px 26px; font-size: 14px; font-weight: 700; border-radius: 8px; }

  /* ---------------- upload row actions ---------------- */
  .row-actions { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .btn-open {
    background: var(--navy-700); color: #fff; border: 0;
    padding: 7px 14px; border-radius: 6px;
    font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
    transition: background .12s;
  }
  .btn-open:hover { background: var(--navy-500); box-shadow: 0 3px 10px -3px rgba(30,58,95,.7); }
  .btn-open:active { transform: translateY(1px); }
  .btn-icon {
    width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    border: 1px solid var(--border-str); background: var(--surface); color: var(--text-dim);
    padding: 0; transition: background .12s, border-color .12s, color .12s;
  }
  .btn-icon svg { width: 14px; height: 14px; stroke: currentColor; fill: none;
                  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .btn-icon.is-primary { background: var(--blue-500); border-color: var(--blue-500); color: #fff; }
  .btn-icon:hover { transform: translateY(-1px); box-shadow: 0 3px 8px -2px rgba(20,32,46,.28); }
  .btn-icon:active { transform: translateY(0); }
  .btn-icon.is-primary:hover { background: var(--blue-600); }
  .btn-icon.is-danger:hover { border-color: var(--red); color: var(--red); background: var(--red-bg); }
  .btn-open:focus-visible, .btn-icon:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 2px; }

  /* ---------------- controls ---------------- */
  .select, .btn {
    font-family: inherit; font-size: 13px; font-weight: 500;
    padding: 8px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-str); background: var(--surface); color: var(--text);
    cursor: pointer;
    transition: border-color .14s, background .14s, box-shadow .14s, transform .08s;
  }
  .select:hover, .btn:hover {
    border-color: #9db3cd;
    box-shadow: 0 1px 3px rgba(20,32,46,.08);
  }
  /* A soft ring rather than a hard outline — same job, less shouting. */
  .select:focus-visible, .btn:focus-visible {
    outline: none;
    border-color: var(--blue-500);
    box-shadow: 0 0 0 3px rgba(37,99,235,.18);
  }
  .btn:active { transform: translateY(1px); }

  /*
    Custom dropdown arrow. The browser's own arrow is drawn by the OS and
    looks like a 2005 form control next to everything else here. The chevron
    is a data: URI so it costs no request and cannot be blocked by the CSP.
  */
  select.select {
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
    padding-right: 32px;
    background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%235a6b7d' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 6.5L8 10.5l4-4'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 14px 14px;
  }
  select.select:disabled {
    background-color: var(--surface-2); color: var(--text-mut); cursor: not-allowed;
  }

  .btn-ghost:hover { background: var(--blue-050); border-color: var(--blue-500); color: var(--navy-700); }
  .btn-primary {
    background: linear-gradient(180deg, #2f6ef0 0%, var(--blue-500) 100%);
    border-color: var(--blue-500); color: #fff; font-weight: 600;
    box-shadow: 0 2px 8px -2px rgba(37,99,235,.55);
  }
  .btn-primary:hover {
    background: linear-gradient(180deg, var(--blue-500) 0%, var(--blue-600) 100%);
    border-color: var(--blue-600);
    box-shadow: 0 4px 14px -3px rgba(37,99,235,.6);
  }

  /* ---------------- per-table filter row ---------------- */
  /*
    Each table owns its filter instead of one bar governing the page, so
    narrowing the individuals list does not silently change what the section
    table above it is showing.
  */
  .table-filter {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .table-filter .select { min-width: 150px; padding: 6px 10px; font-size: 12.5px; }
  .table-filter input.select { min-width: 190px; cursor: text; }
  .table-filter .btn { padding: 6px 10px; font-size: 12.5px; }
