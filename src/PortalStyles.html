<!--
  PortalStyles.html - the portal's own CSS, and only the portal's.
  ================================================================

  Blue and white. The colours are not new: the blues below are the variables
  already declared at the top of Styles.html and already used by the
  dashboard. Two stylesheets each holding their own idea of "our blue" drift
  apart the first time one of them is adjusted, and then the portal and the
  dashboard are visibly two products bolted together - which is exactly what
  this is meant not to look like.

  What is new is the SHAPE. The dashboard is a dark sidebar against a dense
  working surface, because it is a tool you keep open. The portal opens on a
  wash of blue with white type over it, because it is a front door.

  Loaded after Styles.html, so anything shared resolves the same way and
  anything here wins a tie.
-->
<style>

  /* =========================================================
     THE CARD SURFACE
     =========================================================
     A warm off-white, not white.

     White cards on this page sat on a pale blue background and all but
     disappeared into it - two near-white surfaces a few percent apart, with
     only a hairline border saying where one stopped. Going DARKER on the
     background would have fixed the contrast and lost the light, airy feel
     the page is built on, so the cards move instead.

     Cream rather than grey because the move is in temperature as well as
     lightness: against a cool blue background a warm surface separates at a
     glance, where a grey one of the same lightness still reads as "the same
     white, slightly off". It also stays out of the way of the only two
     tinted surfaces on the site that carry meaning - the amber drift notice
     and the band pills - which a grey-blue card family would have crowded.

     White is kept for controls sitting ON the dark sky, where it is the
     brightest thing available and that is the point: the open tab, the KPI
     Engine pill, the hero buttons, the EAS mark.
  */
  :root {
    --portal-card: #fcf8f1;
    --portal-card-edge: #ebe1d2;
    --portal-card-rule: #f2e9dc;
  }

  /* =========================================================
     THE SHELL
     ========================================================= */
  /*
    A fixed app shell, not a scrolling document: the bar stays at the top and
    the footer at the bottom while only the middle moves. Inside the Blogger
    page this app is an iframe pinned to the whole window, so "the viewport"
    here really is the whole window.

    WHERE IT SITS IN THE STACK, which is the part worth writing down:
       portal shell       1   <- this
       sign-in screen   200   covers the portal, which is what a sign-out
                              has to do
       messenger bar    300   reachable from the portal, as it is everywhere
       confirm dialog  1000   stays the only thing on screen while it is up
  */
  .portal {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column;
    background: #eef4fc;
    overflow: hidden;
  }

  /* =========================================================
     THE SKY
     =========================================================
     Four soft radial blobs over a deep blue, which is how the gradient in
     the reference is built: no single linear ramp makes that shape. They are
     placed off the edges on purpose - a blob whose centre is visible reads as
     a spotlight, and one whose centre is outside the box reads as light.

     Darkened twice, on request. There is a floor, and it is the glass: a
     frosted panel is only legible as glass while there is light behind it
     for the blur to pick up. Past this the navigation pill and the section
     cards stop reading as glass and start reading as grey boxes.

     The cards were brightened at the same time to hold their contrast
     against it - a film that reads as glass over a mid blue reads as haze
     over this one, so the two have to move together.

     Height comes from data-page, set by applyShell(). A hero's worth on Home,
     a header band on every other page, and the transition makes walking
     between them a movement rather than a jump.
  */
  .portal-sky {
    position: absolute; top: 0; left: 0; right: 0;
    height: 232px;
    z-index: 0;
    pointer-events: none;
    /*
      DEEPER THAN IT WAS, EVERY LAYER.

      Each of the five was taken down roughly a quarter: the blue
      highlight from #27508f to #1d3d70, the teal from #0d6076 to #0a4a5c,
      the violet from #271a6e to #1d1355, and the base gradient's three
      stops with them. The hue of each is unchanged - this is the same
      sky with the lamp turned down, not a different one.

      It matters more than it did. Three screens now put translucent glass
      over this (the team chart, Learnings and Knowledge Share), and the
      lighter the sky the less a pane can lift off it. The panes were
      raised to clear the old sky by measurement; taking the sky down
      widens the gap rather than closing it, so those measurements still
      hold and learn-ui-test re-checks them against whatever this is.
    */
    background:
      radial-gradient(90% 120% at 12% 8%,   #1d3d70 0%, rgba(29, 61, 112, 0) 60%),
      radial-gradient(70% 110% at 88% 0%,   #0a4a5c 0%, rgba(10, 74, 92, 0) 55%),
      radial-gradient(80% 130% at 72% 100%, #1d1355 0%, rgba(29, 19, 85, 0) 62%),
      radial-gradient(120% 140% at 30% 110%, #040f30 0%, rgba(4, 15, 48, 0) 70%),
      linear-gradient(135deg, #020a1e 0%, #061a40 48%, #0b2a5e 100%);
    /* Only the bottom corners, so it meets the window squarely at the top. */
    border-radius: 0 0 26px 26px;
    transition: height .32s cubic-bezier(.4, 0, .2, 1);
  }
  .portal[data-page="home"] .portal-sky { height: 672px; }

  /*
    The team page needs the blue to reach past the four section cards,
    because those cards ARE glass - a glass card over a white page is a grey
    card. Everything below them, once a section is opened, is on the light
    surface and is solid white.

    MEASURED, NOT GUESSED. This was 700px, which was right for the cards as
    they were and wrong the day the heads' contact details moved onto them:
    the cards grew about fifty pixels and the blue stopped halfway down
    their footers. A number here has to be kept in step with content it
    cannot see, which it will not be. renderTeam() measures the bottom of
    the card row and sets --team-sky; the figure below is the fallback for
    the instant before it does.
  */
  .portal[data-page="team"] .portal-sky { height: var(--team-sky, 760px); }

  /*
    The Links page is blue all the way down, not for effect but because every
    bar on it is glass - and glass over the light surface is a grey box. A
    fixed height would have been a guess at how many links there will ever
    be, and the first one past the edge would have been the one that looked
    broken.
  */
  .portal[data-page="links"] .portal-sky { height: 100%; border-radius: 0; }

  /*
    The two layers above it. Transparent backgrounds, so the sky shows
    through, and a stacking context above it so they are not painted under.
  */
  .portal-top, .portal-body { position: relative; z-index: 1; }


  /* =========================================================
     THE TOP BAR
     ========================================================= */
  .portal-top {
    flex: 0 0 auto;
    display: flex; align-items: center;
    padding: 0 22px;
    height: 72px;
    background: none;
    border: 0;
  }

  /* The mark, and the mailbox under it. */
  .portal-ident {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
  }

  .portal-mail {
    /* Indented past the mark - 34px of tile plus the 11px gap - so it lines
       up under the company line rather than under the EAS square. */
    margin-left: 45px;
    display: inline-flex; align-items: center; gap: 6px;
    /* Larger than the company line above it, on request: it is the address
       people are meant to write to, not a footnote about the company. */
    font-size: 12.5px; font-weight: 600;
    color: rgba(255, 255, 255, .92);
    text-decoration: none;
    padding: 3px 10px 3px 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .10);
    border: 1px solid rgba(255, 255, 255, .16);
    transition: color .15s ease, background .15s ease, box-shadow .15s ease;
  }
    .portal-mail svg { width: 13px; height: 13px; }

  .portal-mail:hover {
    color: #fff;
    background: rgba(255, 255, 255, .20);
    box-shadow: 0 0 14px rgba(150, 200, 255, .45);
  }
  .portal-mail:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .portal-brand {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 11px;
    padding: 0; border: 0; background: none;
    cursor: pointer; text-align: left;
    font: inherit; color: inherit;
    border-radius: 8px;
  }
  .portal-brand:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  .portal-brand-text { display: flex; flex-direction: column; line-height: 1.25; }
  .portal-brand-text strong {
    font-size: 13.5px; font-weight: 700; color: #fff;
    letter-spacing: -.01em; white-space: nowrap;
  }
  .portal-brand-text span {
    font-size: 10.5px; color: rgba(255, 255, 255, .72); white-space: nowrap;
  }

  /*
    The mark is drawn by Styles.html for the dark sidebar, where a solid blue
    tile on near-black reads well. On the sky it is blue on blue, so it goes
    white with the blue inside it.
  */
  .portal-top .brand-mark {
    background: #fff; color: var(--blue-600);
    box-shadow: 0 2px 10px rgba(4, 18, 50, .22);
  }


  /* =========================================================
     THE TABS - centred, and made of glass
     =========================================================
     Centred by taking them out of the flex row entirely. Left in it, the row
     would centre them between the mark and the identity strip, which are not
     the same width - so they would sit visibly off-centre and move sideways
     whenever somebody with a longer name signed in.

     The glass is a real backdrop blur of the sky behind it. That is why the
     sky has to be a painted element and not a background on the scroll box:
     there must be something underneath for the filter to work on.
  */
  /*
    THE ROW THE PILL SITS ON, which exists only so the pill can be centred
    twice over.

    On a wide window it is taken out of the flex row and pinned to the middle
    of the bar: centred between the window's edges, not between the mark and
    the identity strip, which are different widths and would push it visibly
    off-centre - and would shift it sideways whenever somebody with a longer
    name signed in.

    On a narrower one it becomes a full-width row of its own. The width is
    what forces the wrap: a flex item allowed to shrink will shrink instead
    of wrapping, which is how the first attempt ended up with the pill
    squeezed onto the same line as everything else and hanging off the right
    edge. The pill inside stays its own size and is centred by this.
  */
  .portal-navwrap {
    position: absolute; left: 50%; transform: translateX(-50%);
    display: flex; justify-content: center;
    max-width: calc(100% - 620px);
  }

  .portal-nav {
    display: flex; align-items: center; gap: 2px;
    max-width: 100%;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; -ms-overflow-style: none;
    /* Wider at the ends than the top: at border-radius 999px the pill's
       corners curve in across the full height, so a first or last tab with
       only the vertical padding sits against the curve rather than inside
       it. */
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .13);
    border: 1px solid rgba(255, 255, 255, .24);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    backdrop-filter: blur(16px) saturate(150%);
    box-shadow:
      0 8px 28px rgba(5, 20, 56, .22),
      inset 0 1px 0 rgba(255, 255, 255, .34);
  }
  .portal-nav::-webkit-scrollbar { height: 0; width: 0; }

  .portal-tab {
    flex: 0 0 auto;
    position: relative;
    padding: 8px 13px;
    border: 0; background: none;
    /* Longhands, not the font shorthand: `inherit` is illegal as the family
       inside it and takes the whole declaration down with it. See the note
       on .portal-cta for what that cost. */
    font-family: inherit; font-size: 13px; line-height: 1; font-weight: 600;
    color: rgba(255, 255, 255, .80);
    white-space: nowrap;
    border-radius: 999px;
    cursor: pointer;
    transition: color .16s ease, background .16s ease, box-shadow .16s ease;
  }

  /*
    THE GLOW, which is the hover state asked for. Kept to a halo plus a lift
    in brightness - no movement. Ten tabs this close together, each nudging
    itself on hover, is a row that twitches as the pointer crosses it.
  */
  .portal-tab:hover {
    color: #fff;
    background: rgba(255, 255, 255, .18);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, .30),
      0 0 18px rgba(150, 200, 255, .55),
      inset 0 1px 0 rgba(255, 255, 255, .35);
  }
  .portal-tab:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /*
    The open tab is marked by FILL AND WEIGHT, not by colour alone - the same
    rule the band pills follow elsewhere in this project, and the reason none
    of this depends on telling two blues apart.
  */
  .portal-tab.is-on {
    color: var(--navy-900);
    background: #fff;
    box-shadow: 0 2px 10px rgba(5, 20, 56, .20);
  }

  /* The one tab that leaves the portal: white on the glass, so it reads as a
     button among labels rather than another label. */
  /* ---------- who is signed in ---------- */
  .portal-who {
    flex: 0 0 auto; margin-left: auto;
    display: flex; align-items: center; gap: 10px;
  }
  .portal-who-name {
    font-size: 12.5px; font-weight: 600; color: rgba(255, 255, 255, .92);
    max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .portal-signout {
    padding: 6px 13px;
    border: 1px solid rgba(255, 255, 255, .34); border-radius: 999px;
    background: rgba(255, 255, 255, .12);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: #fff;
    /* Longhands, not the font shorthand: `inherit` is illegal as the family
       inside it and takes the whole declaration down with it. See the note
       on .portal-cta for what that cost. */
    font-family: inherit; font-size: 12px; line-height: 1; font-weight: 600;
    cursor: pointer;
    transition: background .16s ease, box-shadow .16s ease;
  }
  .portal-signout:hover {
    background: rgba(255, 255, 255, .22);
    box-shadow: 0 0 16px rgba(150, 200, 255, .5);
  }
  .portal-signout:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /*
    AWAY, in the portal bar. The same glass as Back and Sign out either side
    of it - a third pill in a row of two that looked different would read as
    belonging to the page rather than to the bar - but dimmer than Sign out
    while it is off, because it is the least consequential of the three.

    Pressed, it goes amber and matches the dot two elements to its left. That
    pairing is doing real work: it is the only thing on screen that explains
    why the glow stopped.
  */
  .portal-away {
    padding: 6px 13px;
    border: 1px solid rgba(255, 255, 255, .22); border-radius: 999px;
    background: rgba(255, 255, 255, .07);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: rgba(255, 255, 255, .86);
    /* Longhands, not the font shorthand: `inherit` is illegal as the family
       inside it and takes the whole declaration down with it. See the note
       on .portal-cta for what that cost. */
    font-family: inherit; font-size: 12px; line-height: 1; font-weight: 600;
    cursor: pointer;
    transition: background .16s ease, box-shadow .16s ease,
                border-color .16s ease, color .16s ease;
  }
  .portal-away:hover {
    background: rgba(255, 255, 255, .18); color: #fff;
    box-shadow: 0 0 16px rgba(150, 200, 255, .42);
  }
  .portal-away:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .portal-away[aria-pressed="true"] {
    background: rgba(240, 173, 60, .24);
    border-color: rgba(240, 173, 60, .60);
    color: #ffe0b0;
  }
  .portal-away[aria-pressed="true"]:hover {
    background: rgba(240, 173, 60, .34);
    box-shadow: 0 0 16px rgba(240, 173, 60, .45);
  }


  /* =========================================================
     THE PAGES
     ========================================================= */
  /*
    The bottom padding is for the messenger bubble. It sits bottom-right on
    every screen, portal included - it is outside both shells in Index.html
    precisely so that it does - and it is taller than the 46px footer, so
    without this the last line of a long page ends up underneath it.
  */
  .portal-body {
    flex: 1 1 auto;
    overflow-y: auto;
    scroll-padding-bottom: 90px;
    background: none;
  }

  .portal-page { max-width: 1180px; margin: 0 auto; padding: 18px 28px 96px; }

  /* On a content page the title sits on the sky, so it is white there. */
  .portal-page-title {
    margin: 10px 0 26px;
    font-size: 32px; font-weight: 700; letter-spacing: -.025em;
    color: #fff;
    text-shadow: 0 1px 14px rgba(6, 22, 60, .3);
  }

  /* ---------- the hero ----------
     TIGHTER THAN IT WAS, SO THE PAGE ENDS WHERE THE SCREEN DOES. The hero
     and the five cards under it are one thought - the team, and the four
     figures it is measured on - and on a 1920x1080 screen the cards ran
     about sixty pixels past the fold, so the thought was cut in half and
     the first thing anybody did on the front page was scroll.

     The space came off the parts with the most of it: 44px of padding
     above a 58px headline, then 20 under it, then 32 under the standfirst,
     then 88 before the cards. Nothing here is small now and nothing was
     load-bearing. */
  .portal-hero { padding: 26px 0 6px; text-align: center; }

  .portal-hero-title {
    margin: 0 auto 12px;
    font-size: 50px; line-height: 1.05; font-weight: 800;
    letter-spacing: -.04em;
    color: #fff;
    text-shadow: 0 2px 30px rgba(6, 22, 60, .32);
    max-width: 14ch;
  }

  .portal-hero-sub {
    margin: 0 auto 20px;
    max-width: 58ch;
    font-size: 16px; line-height: 1.62;
    color: rgba(255, 255, 255, .86);
  }

  /*
    TWO COLUMNS, SHARED BY BOTH ROWS.

    These were two centred flex rows, which meant each row sized itself to
    its own two labels and centred the result. "Open the KPI Engine" and
    "Open SAP UserHub" are not the same width as "Open RMG PA Report" and
    "Open Groupware & ITSM", so the gap down the middle stepped sideways
    between the rows - four buttons that look like they were placed by hand
    and not quite straight.

    A grid of two fixed-width columns fixes the column edges once, and both
    rows use them, so the gutter is a single straight line and all four
    buttons are the same width. The buttons stretch to the cell rather than
    hugging their labels, which is what makes them match.

    Below 560px there is not room for two, so it becomes one column and the
    buttons stack - still all one width.
  */
  .portal-hero-actions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 248px));
    justify-content: center;
    gap: 12px;
  }
  @media (max-width: 560px) {
    .portal-hero-actions { grid-template-columns: minmax(0, 290px); }
  }
  /*
    The second line of buttons. Its own row rather than four buttons wrapping
    in one, because wrapping would put three on the first line and one alone
    on the second at most widths - and which two sit together is the point:
    the pair above are the two systems this portal is about.
  */
  .portal-hero-actions.is-more { margin-top: 12px; }

  /*
    Both hero buttons wear this, and one of them is an anchor because it
    leaves the app.

    text-decoration and display are here FOR that anchor. A button is
    inline-block and never underlined; an anchor is inline and underlined by
    default, so without these two lines the SAP button came out underlined
    and a hair's breadth off the height of the one beside it. Styling a
    control by class rather than by tag means the class has to say everything
    the tag would otherwise have assumed.

    The translucent "ghost" variant is gone. It had one user - the second
    hero button - and that button now matches the first, so the rules would
    have been dead CSS waiting to be wondered about.
  */
  .portal-cta {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 13px 26px;
    border: 1px solid transparent; border-radius: 999px;
    background: #fff; color: var(--blue-600);
    /* LONGHANDS, AND NOT THE font SHORTHAND, which is how this spent months
       doing nothing at all. It read `font: 600 14px/1 inherit`, and `inherit`
       is not a legal family INSIDE the shorthand - only as the whole value -
       so the browser threw the entire declaration away. Nothing here was
       applied: no size, no weight, no line-height. The three links fell back
       to the page's 14px because an anchor inherits, and the KPI Engine
       button fell back to the UA default, which is 13.3px ARIAL - a different
       typeface and a different size from the three pills beside it, at weight
       400. It passed the test next door because that one compares the
       underline, the height and the background, and the padding happened to
       round both to the same 45px.

       BOLD, not semibold, now that a weight reaches the screen at all. Four
       of these sit on a photographic blue hero where 600 read as a caption.
       700 is a real weight in every family in the stack, so it is drawn
       rather than faked by smearing the strokes, and the letter-spacing is
       what stops bold 14px from closing up. */
    font-family: inherit; font-size: 14px; line-height: 1; font-weight: 700;
    letter-spacing: .012em; cursor: pointer;
    text-decoration: none;
    box-shadow: 0 6px 22px rgba(5, 20, 56, .26);
    transition: box-shadow .16s ease, transform .16s ease;
  }
  .portal-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(5, 20, 56, .34), 0 0 26px rgba(150, 200, 255, .62);
  }
  .portal-cta:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }


  /* =========================================================
     THE CARDS
     =========================================================
     White, and deliberately overlapping the bottom of the sky the way the
     cards in the reference overlap their panel. That overlap is what stops
     the hero reading as a coloured box with a list under it.
  */
  /* =========================================================
     THE HOME CARDS
     =========================================================
     A COLLAGE, NOT A ROW. Four columns, but the cards inside them are
     different heights and sit at different offsets - a tall one carrying the
     chart people come for, a column of two beside it, two more to the right.
     Four equal rectangles in a line reads as a dashboard template; this
     reads as somebody having chosen what belongs on a front page.

     The offsets are margin-top rather than transform, because every card
     lifts on hover and two transforms on one element means the hover has to
     know what the stagger was.
  */
  .portal-tiles {
    display: grid;
    grid-template-columns: 1.45fr 1.05fr 1fr 1.05fr;
    gap: 16px;
    /*
      STRETCH, AND NO OFFSETS. The cards were staggered - each column
      starting a little lower than the last - which is what the reference
      design does and which looked like a layout that had slipped. Every
      column now starts on the same line and ends on the same line: the
      three that span both rows are pulled to the full height, and the
      middle column reaches it by stacking two.
    */
    align-items: stretch;
    /* Enough that the hero finishes before the cards start and the two do
       not read as one block - and no more than that, because every pixel
       here is a pixel of the last card hanging below the fold. */
    margin-top: 38px;
  }

  /*
    A SHORTER WINDOW, which is most laptops.

    The front page is one thought - the team, and the four figures it is
    measured on - and it only works if the whole thought is on the screen.
    The measurements above fit a 1920x1080 monitor with room over and run
    off the bottom of a 1440x900 laptop, so the same space comes off again
    where there is less of it to begin with.

    Keyed on HEIGHT, which is the thing that is short. Keyed on width too,
    only to leave the phone layout further down alone: it stacks, and
    nothing about it is trying to fit in one screen.

    The headline shrinks here and nowhere else. It is the one measurement
    on this page that can be given up without the page looking squeezed,
    because at 50px it is already shouting.
  */
  @media (min-width: 1100px) and (max-height: 899px) {
    .portal-hero { padding-top: 10px; }
    .portal-hero-title { font-size: 37px; margin-bottom: 8px; }
    .portal-hero-sub { margin-bottom: 10px; font-size: 15px; line-height: 1.55; }
    .portal-hero-actions.is-more { margin-top: 10px; }
    .portal-tiles { margin-top: 16px; }
    .ptile { padding: 10px 15px 10px; }
  }

  .ptile-compare { grid-column: 1; grid-row: 1 / span 2; }
  .ptile-itsm    { grid-column: 2; grid-row: 1; }
  .ptile-faq     { grid-column: 2; grid-row: 2; }
  .ptile-kpi2    { grid-column: 3; grid-row: 1 / span 2; }
  .ptile-layers  { grid-column: 4; grid-row: 1 / span 2; }

  .ptile {
    display: flex; flex-direction: column;
    padding: 14px 18px 13px;
    background: var(--portal-card);
    border: 1px solid rgba(255, 255, 255, .7);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(8, 26, 66, .14), 0 2px 6px rgba(8, 26, 66, .07);
    transition: transform .2s cubic-bezier(.3, 0, .2, 1), box-shadow .2s ease;
  }
  .ptile:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 46px rgba(8, 26, 66, .20), 0 3px 10px rgba(8, 26, 66, .10);
  }

  /* ---------- the head every card shares ---------- */
  .ptile-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 8px; margin-bottom: 10px;
  }
  .ptile-label {
    display: block;
    font-size: 11px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; color: var(--text-mut);
  }
  .ptile-sub {
    display: block; margin-top: 2px;
    font-size: 11.5px; color: var(--text-dim);
  }
  .ptile-trend {
    flex: 0 0 auto;
    font-size: 11px; font-weight: 700;
    padding: 3px 7px; border-radius: 999px;
    background: var(--green-bg); color: var(--green-ink);
  }
  /* KPI 2 is not in the approved policy. Said here as it is said on every
     other screen that shows it, rather than left to be assumed. */
  .ptile-chip {
    flex: 0 0 auto;
    font-size: 10px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase;
    padding: 3px 7px; border-radius: 999px;
    background: rgba(37, 99, 235, .10); color: var(--blue-600);
  }

  /* ---------- the figure ---------- */
  .ptile-figure { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .ptile-value {
    font-size: 30px; font-weight: 700; letter-spacing: -.025em;
    color: var(--navy-900); line-height: 1.1;
  }
  .ptile-value.is-sm { font-size: 24px; }
  .ptile-unit { font-size: 16px; font-weight: 600; color: var(--text-dim); }
  .ptile-against { font-size: 11.5px; color: var(--text-mut); }

  /* ---------- legends and axes ---------- */
  .ptile-legend {
    display: flex; flex-wrap: wrap; gap: 14px;
    margin: 12px 0 2px;
    font-size: 11px; color: var(--text-dim);
  }
  .ptile-legend.is-stack { flex-direction: column; gap: 6px; margin: 14px 0 auto; }
  .ptile-key { display: inline-flex; align-items: center; gap: 6px; }
  .ptile-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .ptile-dot.is-now  { background: var(--blue-600); }
  .ptile-dot.is-was  { background: #9fb3cd; }
  .ptile-dot.is-rest { background: #e6ecf6; border: 1px solid #d3dfee; }

  /*
    overflow:visible because a line chart's last point sits ON the right edge
    of its viewBox, so the dot marking it was being sliced in half. Moving
    the data inwards instead would leave the area fill short of the edge,
    which looks like missing data rather than like a margin.
  */
  /*
    SIZED BY RATIO, NOT BY HEIGHT. An SVG with a viewBox keeps its own
    proportions: give it a box taller than those and it draws at the width
    and centres, leaving the rest blank. The comparison card had 159 empty
    pixels down the middle of it that way, and raising the CSS height only
    made the gap bigger. Each ratio below matches its viewBox, so the box is
    exactly the drawing.

    auto on the top margin: when the card is stretched taller than its
    contents - which it is, because all four columns end on one line - the
    slack falls between the figure and the chart rather than under the axis,
    where it would read as the card having been left unfinished.
  */
  .ptile-chart {
    display: block; width: 100%; height: auto;
    aspect-ratio: 220 / 56;
    margin: auto 0 6px;
    overflow: visible;
  }
  .ptile-chart.is-tall { aspect-ratio: 300 / 230; margin: 0 0 6px; }

  /*
    The chart and its month labels, as one block, centred in whatever height
    is left over. Banking the slack above the chart instead left a visible
    hole between the legend and the plot; split in two it reads as margin.
  */
  .ptile-plot { margin: auto 0; }

  .ptile-axis {
    display: flex; justify-content: space-between;
    font-size: 10px; color: var(--text-mut); letter-spacing: .02em;
  }

  .ptile-eyebrow {
    font-size: 10px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--text-mut);
    margin-bottom: 8px;
  }
  .ptile-foot {
    margin: auto 0 0; padding-top: 10px;
    font-size: 11px; line-height: 1.45; color: var(--text-mut);
  }
  .ptile-foot b { color: var(--navy-700); }

  /* ---------- the Help and FAQ card: a portrait of the panel ---------- */
  /*
    Built to look like the Messages panel rather than to be it - the real one
    is a bubble in the corner of every page. So it carries the panel's own
    furniture: the navy bar with the avatar and the collapse chevron, the
    COMMON QUESTIONS line, and threads showing who last spoke and when.

    It fills whatever height the card has left, because this card shares a
    column with the ITSM chart above it and the two together have to match
    the cards either side.
  */
  .msgr-demo {
    flex: 1;
    display: flex; flex-direction: column;
    border-radius: 11px; overflow: hidden;
    border: 1px solid rgba(8, 26, 66, .10);
    box-shadow: 0 4px 14px rgba(8, 26, 66, .08);
    background: #fff;
  }

  .msgr-demo-bar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px;
    background: var(--navy-800, #13306b); color: #fff;
  }
  .msgr-demo-face {
    flex: 0 0 auto;
    width: 19px; height: 19px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, .20); color: rgba(255, 255, 255, .92);
  }
  .msgr-demo-title { flex: 1; font-size: 11.5px; font-weight: 700; }

  .msgr-demo-body {
    flex: 1;
    display: flex; flex-direction: column; gap: 6px;
    padding: 8px 10px 9px;
  }
  .msgr-demo-eyebrow {
    display: flex; align-items: center; gap: 4px;
    font-size: 9.5px; font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase; color: var(--text-mut);
  }

  .msgr-demo-row {
    padding-top: 6px;
    border-top: 1px solid rgba(8, 26, 66, .07);
  }
  .msgr-demo-row:first-of-type { border-top: 0; padding-top: 0; }
  .msgr-demo-top {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  }
  .msgr-demo-top b { font-size: 11.5px; color: var(--navy-900); }
  .msgr-demo-when {
    flex: 0 0 auto; font-size: 9.5px; color: var(--text-mut);
  }
  .msgr-demo-row p {
    margin: 2px 0 0;
    font-size: 10.5px; line-height: 1.4; color: var(--text-mut);
    /* One line, cut with an ellipsis, exactly as the real list does it. */
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .msgr-demo-row p i { font-style: normal; font-weight: 600; color: var(--blue-600); }

  /* ---------- the KPI 2 ring ---------- */
  /*
    auto on the top here and auto on the legend's bottom: between them the
    ring and its key are pushed to the middle as one block. The ring alone
    had auto on all sides and the legend had auto on top, so the two fought
    and settled with the ring high and the key on the floor.
  */
  .ring-wrap {
    margin: auto auto 0; padding: 6px 0;
    width: 100%; max-width: 224px;
  }
  .ring { display: block; width: 100%; height: auto; }
  .ring-value {
    font-size: 26px; font-weight: 700; fill: var(--navy-900);
    letter-spacing: -.02em;
  }
  .ring-note { font-size: 11px; fill: #7d8da4; }

  /* ---------- the service layers ---------- */
  .layer-stack {
    display: flex; flex-direction: column; gap: 9px;
    /* Centred rather than pinned to the top, so a stretched card
       does not carry all its empty space in one lump underneath. */
    flex: 1; justify-content: center;
  }
  .layer-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 11px; border-radius: 11px;
    background: rgba(37, 99, 235, .055);
    border: 1px solid rgba(37, 99, 235, .10);
    transition: background .15s ease, border-color .15s ease;
  }
  .layer-row:hover {
    background: rgba(37, 99, 235, .10);
    border-color: rgba(37, 99, 235, .22);
  }
  .layer-no {
    flex: 0 0 auto;
    width: 22px; height: 22px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    background: var(--blue-600); color: #fff;
    font-size: 11.5px; font-weight: 700;
  }
  .layer-text { min-width: 0; }
  .layer-text b {
    display: block;
    font-size: 12px; line-height: 1.3; color: var(--navy-900);
  }
  .layer-kpis {
    display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px;
  }
  .layer-kpi {
    padding: 2px 6px; border-radius: 6px;
    background: rgba(8, 26, 66, .06);
    font-size: 10px; font-weight: 600; color: var(--text-dim);
  }
  /*
    The one measure that is not in the approved policy, marked as it is
    everywhere else rather than sitting silently beside three that are. Its
    own tag, and unbreakable: as text on the end of the name it wrapped to a
    second line and read as another KPI.
  */
  .layer-flag {
    padding: 2px 6px; border-radius: 6px;
    border: 1px solid rgba(8, 26, 66, .12);
    font-size: 9.5px; font-weight: 600; letter-spacing: .04em;
    color: var(--text-mut); white-space: nowrap;
  }

  /* =========================================================
     THE EAS TEAM PAGE
     =========================================================
     A page of thirty-seven people, so the thing that matters is scanning:
     finding one person fast, and seeing who leads a section without reading
     every card. Cards rather than a table because each one carries a face, a
     role and three ways to reach somebody - a table of that is six columns
     wide and unreadable on anything but a desktop.
  */
  .portal-page-head { margin: 10px 0 30px; }
  .portal-page-head .portal-page-title { margin: 0 0 6px; }
  .portal-page-sub {
    margin: 0; font-size: 13.5px;
    color: rgba(255, 255, 255, .80);
  }

  /* =========================================================
     THE SWITCH: directory or chart
     =========================================================
     Two buttons on the blue, so they are glass like everything else up
     here. The pressed one is solid white - not a border, not a tint: on a
     photographic background the only state that reads at a glance is the
     one that stops being transparent.
  */
  .team-switch {
    display: inline-flex; gap: 6px;
    margin: 0 0 22px;
    padding: 5px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .22);
    background: rgba(255, 255, 255, .10);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    backdrop-filter: blur(16px) saturate(160%);
    box-shadow:
      0 10px 28px rgba(2, 10, 32, .34),
      inset 0 1px 0 rgba(255, 255, 255, .26);
  }

  .team-switch-btn {
    position: relative;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 18px;
    border: 1px solid transparent; border-radius: 999px;
    background: none; color: rgba(255, 255, 255, .80);
    font-family: inherit; font-size: 13px; line-height: 1; font-weight: 700;
    letter-spacing: .012em; cursor: pointer;
    transition: color .18s ease, background .18s ease,
                box-shadow .18s ease, transform .18s ease;
  }
  .team-switch-btn svg { opacity: .9; }

  /*
    THE GLOW IS ON HOVER AND ON THE PRESSED ONE, and it is a shadow rather
    than a filter: a filter on a button inside a backdrop-filtered bar
    makes the browser rasterise the lot, and the bar behind it stops
    blurring the sky.
  */
  .team-switch-btn:hover {
    color: #fff;
    background: rgba(255, 255, 255, .14);
    box-shadow: 0 0 20px rgba(150, 200, 255, .36);
    transform: translateY(-1px);
  }
  .team-switch-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .team-switch-btn.is-on {
    background: #fff; color: var(--blue-600);
    border-color: rgba(255, 255, 255, .9);
    box-shadow:
      0 8px 20px rgba(2, 10, 32, .30),
      0 0 26px rgba(150, 200, 255, .50),
      inset 0 1px 0 rgba(255, 255, 255, .9);
    transform: translateY(-1px);
  }
  .team-switch-btn.is-on svg { opacity: 1; }


  /* =========================================================
     THE ORGANOGRAM
     =========================================================
     Everybody at once: a face, a name and a title, arranged the way the
     department is. Nothing opens and nothing is hidden, because a shape
     cannot be read a quarter at a time.

     The connectors are drawn with pseudo-elements rather than an SVG. An
     SVG would have to be told where every box ended up, which means
     measuring the layout in JavaScript and redrawing it on every resize;
     a border that hangs off the element it belongs to simply follows it.
  */
  .og { display: flex; flex-direction: column; align-items: center; }

  .og-root { display: flex; flex-direction: column; align-items: center; }

  .og-crown {
    padding: 7px 16px; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .26);
    background: rgba(255, 255, 255, .12);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    color: #fff;
    font-size: 11px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase;
  }

  /* The line between one rung and the next. */
  .og-drop {
    display: block; width: 2px; height: 22px;
    background: linear-gradient(180deg,
      rgba(255, 255, 255, .42), rgba(255, 255, 255, .16));
  }

  /* =======================
     a person, anywhere on the chart
     =======================
     DARK, NOT CREAM. The person cards were the directory's cream card
     reused, and thirty-six of them on a navy chart read as thirty-six
     sticky notes - the eye went to the paper rather than to the faces.
     Here they are cut out of the same dark the chart is made of: a lifted
     pane rather than a card laid on top, with a lit top edge and a hair of
     the column's accent down the left so the shape says which branch it
     belongs to without a line being drawn to it.
  */
  .og-person {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 11px;
    padding: 9px 13px 9px 12px;
    border-radius: 13px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .115) 0%,
                              rgba(255, 255, 255, .045) 100%);
    border: 1px solid rgba(255, 255, 255, .14);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    backdrop-filter: blur(14px) saturate(150%);
    box-shadow:
      0 6px 18px rgba(2, 10, 32, .30),
      inset 0 1px 0 rgba(255, 255, 255, .22);
    transition: transform .18s cubic-bezier(.3, 0, .2, 1),
                box-shadow .18s ease, border-color .18s ease, background .18s ease;
  }
  /* The accent, as a hairline down the leading edge. */
  .og-person::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: var(--accent);
    opacity: .55;
    transition: opacity .18s ease;
  }
  .og-person:hover {
    transform: translateY(-2px);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .17) 0%,
                              rgba(255, 255, 255, .075) 100%);
    border-color: rgba(255, 255, 255, .26);
    box-shadow:
      0 16px 34px rgba(2, 10, 32, .42),
      0 0 24px -6px var(--accent),
      inset 0 1px 0 rgba(255, 255, 255, .34);
  }
  .og-person:hover::before { opacity: 1; }

  .og-person .team-face { width: 46px; height: 46px; }
  .og-person .team-face.is-initials {
    font-size: 13px;
    background: rgba(255, 255, 255, .92); color: var(--blue-600);
    border-color: transparent;
  }

  .og-person-who { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .og-person-who strong {
    font-size: 12.5px; font-weight: 700; color: #fff;
    line-height: 1.25; letter-spacing: .006em;
  }
  /*
    The designation, and the presence dot with it. A flex row rather than
    the dot trailing the text, so a long designation wraps around the dot
    rather than carrying it onto a line of its own.
  */
  .og-title {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    font-size: 11px; color: rgba(255, 255, 255, .64);
  }

  /*
    THE EMPLOYEE ID, quietest thing on the card. It is what somebody types
    into SAP, so it has to be legible and exact - which is the one argument
    for a tabular figure here, where a 1 beside a 7 is read rather than
    skimmed - and it is not what anybody is scanning the chart for, so it
    sits under everything else at the lowest contrast that is still plainly
    readable.
  */
  .og-id {
    margin-top: 2px;
    font-size: 10px; font-weight: 600; letter-spacing: .055em;
    font-variant-numeric: tabular-nums;
    color: rgba(255, 255, 255, .42);
  }
  .og-lead .og-id { font-size: 10.5px; color: rgba(255, 255, 255, .50); }
  .og-flag {
    font-size: 9px; font-weight: 800; letter-spacing: .07em;
    text-transform: uppercase; color: var(--accent);
  }

  /* The head of the department, on the blue and larger. */
  .og-lead {
    gap: 13px; padding: 13px 20px 13px 14px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .19) 0%, rgba(255, 255, 255, .075) 100%);
    border-color: rgba(255, 255, 255, .26);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    backdrop-filter: blur(20px) saturate(160%);
    box-shadow:
      0 18px 44px rgba(2, 10, 32, .40),
      inset 0 1px 0 rgba(255, 255, 255, .32);
  }
  .og-lead .team-face { width: 64px; height: 64px; }
  .og-lead .team-face.is-initials { font-size: 19px; }
  .og-lead .og-person-who strong { font-size: 15px; color: #fff; }
  .og-lead .og-title { font-size: 12px; color: rgba(255, 255, 255, .76); }
  .og-lead .og-flag { color: rgba(255, 255, 255, .86); }
  .og-lead:hover { transform: none; border-color: rgba(255, 255, 255, .38); }

  /* =======================
     the four sections
     ======================= */
  .og-cols {
    position: relative;
    display: grid; grid-template-columns: repeat(var(--og-cols, 4), 1fr);
    gap: 16px; width: 100%;
    padding-top: 22px;
  }
  /*
    The bar the columns hang from. Inset by HALF A COLUMN at each end, so it
    runs from the first drop to the last rather than out past them into
    space - which is what it did when the inset was written as a flat
    12.5%: right for four columns, and the chart has as many columns as
    the department has sections. renderOrganogram sets --og-cols.
  */
  .og-cols::before {
    content: ''; position: absolute; top: 0; height: 2px;
    left: calc(50% / var(--og-cols, 4));
    right: calc(50% / var(--og-cols, 4));
    background: rgba(255, 255, 255, .28);
  }
  .og-col { position: relative; display: flex; flex-direction: column; gap: 12px; }
  /* Each column's own drop, from the bar down to its heading. */
  .og-col::before {
    content: ''; position: absolute; top: -22px; left: 50%;
    width: 2px; height: 22px; margin-left: -1px;
    background: rgba(255, 255, 255, .28);
  }

  /*
    A COLUMN, not a row, since the group mailbox went under the name.

    The name and the count stay on one line together - that is what
    .og-section-top is - and the address sits beneath them on its own.
    Putting the address on the same line would have meant four bars whose
    titles wrap to two lines at the width a column actually gets, which is
    a worse trade than one extra line that every column pays equally.
  */
  .og-section {
    display: flex; flex-direction: column; gap: 7px;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, .22);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .17) 0%, rgba(255, 255, 255, .07) 100%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    backdrop-filter: blur(16px) saturate(160%);
    box-shadow:
      0 10px 26px rgba(2, 10, 32, .32),
      inset 0 1px 0 rgba(255, 255, 255, .28);
  }
  .og-section-top {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .og-section-name {
    font-size: 10.5px; font-weight: 800; letter-spacing: .07em;
    text-transform: uppercase; color: #fff; line-height: 1.3;
  }
  .og-section-count {
    flex: none; min-width: 22px; padding: 2px 7px; border-radius: 999px;
    background: rgba(255, 255, 255, .18);
    font-size: 10.5px; font-weight: 700; color: #fff; text-align: center;
  }

  /*
    The section's group mailbox.

    Lower-case and not upper, unlike the name above it: an email address
    IS lower-case, and setting one in capitals makes people doubt whether
    it is the real address. Separated from the name by a hairline rather
    than by space alone, so the bar reads as two facts about the section
    and not as a heading that happens to wrap.

    An address does not shorten gracefully - there is no word to drop - so
    it is allowed to run to the full width of the bar and is clipped with
    an ellipsis only if the column is narrower than the address, which at
    four columns it is not.
  */
  .og-section-mail {
    display: flex; align-items: center; gap: 5px;
    margin-top: 1px; padding-top: 7px;
    border-top: 1px solid rgba(255, 255, 255, .16);
    font-size: 10.5px; font-weight: 600; letter-spacing: .01em;
    color: rgba(255, 255, 255, .78);
    text-decoration: none; min-width: 0;
    transition: color .15s ease;
  }
  .og-section-mail svg { flex: none; opacity: .75; }
  .og-section-mail span {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .og-section-mail:hover { color: var(--accent, #4cc9f0); }
  .og-section-mail:hover svg { opacity: 1; }

  /* The accent each column carries, the same four as the directory. */
  .og-col[data-accent="0"] { --accent: #4cc9f0; }
  .og-col[data-accent="1"] { --accent: #5b9cf8; }
  .og-col[data-accent="2"] { --accent: #7b86f0; }
  .og-col[data-accent="3"] { --accent: #9d7bef; }
  .og-section { border-top: 2px solid var(--accent); }

  /* =======================
     the modules under a section
     ======================= */
  .og-modules { display: flex; flex-direction: column; gap: 10px; }

  /*
    The module a group of people work in. Barely there on purpose: it is a
    label with a boundary, and the cards inside it are the content. Made
    any heavier it competes with them and the column reads as panels
    rather than as people.
  */
  .og-module {
    display: flex; flex-direction: column; gap: 7px;
    padding: 9px 9px 10px;
    border-radius: 14px;
    background:
      linear-gradient(180deg, rgba(8, 20, 54, .30) 0%, rgba(8, 20, 54, .14) 100%);
    border: 1px solid rgba(255, 255, 255, .10);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07);
  }
  .og-module-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 0 3px;
  }
  .og-module-name {
    font-size: 10.5px; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; color: var(--accent);
  }
  .og-module-count {
    font-size: 10px; font-weight: 700; color: rgba(255, 255, 255, .55);
  }
  .og-people { display: flex; flex-direction: column; gap: 7px; }

  /*
    The head of a section. A brighter pane and a full-strength accent edge
    rather than a ring: on a column of eleven cards the eye finds the one
    that is lit before it finds the one that is outlined.
  */
  .og-person.is-head {
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .20) 0%,
                              rgba(255, 255, 255, .085) 100%);
    border-color: rgba(255, 255, 255, .30);
    box-shadow:
      0 10px 26px rgba(2, 10, 32, .40),
      inset 0 1px 0 rgba(255, 255, 255, .34);
  }
  .og-person.is-head::before { opacity: 1; width: 3px; }
  .og-person.is-head .og-person-who strong { font-size: 13px; }

  /*
    NARROWER THAN A DESKTOP and the four columns stop being four. Two, then
    one - the chart still reads top to bottom, it just folds.
  */
  @media (max-width: 1080px) {
    .og-cols { grid-template-columns: repeat(2, 1fr); row-gap: 26px; }
    .og-cols::before { left: 25%; right: 25%; }
    .og-col:nth-child(n+3)::before { display: none; }
  }
  /* The chart's own bottom margin, so the blue finishes below it rather
     than against it. */
  .og { padding-bottom: 8px; }
  @media (max-width: 680px) {
    .og-cols { grid-template-columns: 1fr; }
    .og-cols::before { display: none; }
    .og-col::before { display: none; }
  }


  /* =========================================================
     THE DEPARTMENT HEAD
     =========================================================
     Above the sections and in the middle, which is where the organogram has
     him. Glass, because he sits on the blue.
  */
  .team-lead-wrap {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 0;
  }

  /*
    THE CARD AT THE TOP OF THE CHART KEEPS ITS SIZE. It was briefly narrowed
    to one column on a misreading of "match the section card" - the ask was
    the other way round, and the cards below came up to meet this one.
  */
  .team-lead {
    position: relative;
    width: min(380px, 100%);
    display: flex; flex-direction: column; gap: 11px;
    padding: 18px 20px 16px;
    border-radius: 18px;
    overflow: hidden;
    /* The same frosted-glass build as the section cards: a gradient sheen
       rather than a flat film, and a lit lip along the top edge. */
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .19) 0%, rgba(255, 255, 255, .075) 100%);
    border: 1px solid rgba(255, 255, 255, .24);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    backdrop-filter: blur(20px) saturate(160%);
    box-shadow:
      0 18px 48px rgba(2, 10, 32, .42),
      inset 0 1px 0 rgba(255, 255, 255, .34);
    transition: box-shadow .2s ease, transform .2s ease, background .2s ease;
  }
  .team-lead::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .85), transparent);
  }
  .team-lead:hover {
    transform: translateY(-3px);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .26) 0%, rgba(255, 255, 255, .12) 100%);
    box-shadow:
      0 26px 60px rgba(2, 10, 32, .50),
      0 0 34px rgba(150, 200, 255, .38),
      inset 0 1px 0 rgba(255, 255, 255, .46);
  }

  .team-lead-flag {
    align-self: flex-start;
    font-size: 10px; font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(255, 255, 255, .92); color: var(--blue-600);
  }
  .team-lead .team-who strong { color: #fff; font-size: 15px; }
  .team-lead .team-role { color: rgba(255, 255, 255, .80); }
  .team-lead .team-face.is-initials {
    background: rgba(255, 255, 255, .92); color: var(--blue-600);
    border-color: transparent;
  }
  .team-lead .team-lines { border-top-color: rgba(255, 255, 255, .22); }
  .team-lead .team-line { color: rgba(255, 255, 255, .84); }
  .team-lead .team-line svg { color: rgba(255, 255, 255, .62); }
  .team-lead a.team-line:hover { color: #fff; }
  .team-lead a.team-line:hover svg { color: #fff; }

  /* The line down to the sections. Drawn, because four cards under a fifth
     is a row of five without it. */
  .team-stem {
    width: 2px; height: 30px;
    background: linear-gradient(rgba(255, 255, 255, .55), rgba(255, 255, 255, .16));
    border-radius: 2px;
  }


  /* =========================================================
     THE FOUR SECTIONS
     ========================================================= */
  /*
    The column geometry, declared once. The head card above sizes itself to
    one of these columns, and a gap changed here and not there would leave
    it a few pixels wider than the card it is supposed to match - the kind
    of difference nobody can name and everybody can see.
  */
  #teamBody { --team-cols: 4; --team-gap: 16px; }

  /*
    STRETCH, so the four cards end on the same line. They hold different
    numbers of contact rows - not everybody has an extension - and at
    natural height that came out as four cards of three different lengths
    sitting in a row, which reads as a layout that has slipped. The footer
    is pushed down by margin-top: auto, so the chevrons line up too.
  */
  .team-sections {
    display: grid;
    grid-template-columns: repeat(var(--team-cols), 1fr);
    gap: var(--team-gap);
    align-items: stretch;
  }

  /*
    An opened section spans the whole row rather than widening its own
    column. Eleven cards inside a quarter-width column is a single file of
    cards a mile long; across the row they lay out four at a time like every
    other grid on this site.
  */
  .team-sec { display: contents; }
  .team-sec-card { grid-row: 1; }
  .team-sec-body { grid-column: 1 / -1; grid-row: 2; }
  .team-sec:nth-child(1) .team-sec-card { grid-column: 1; }
  .team-sec:nth-child(2) .team-sec-card { grid-column: 2; }
  .team-sec:nth-child(3) .team-sec-card { grid-column: 3; }
  .team-sec:nth-child(4) .team-sec-card { grid-column: 4; }

  /*
    A SECTION CARD.

    Frosted dark glass rather than a white film. A flat rgba(255,255,255,.12)
    over a deep blue comes out as a milky grey rectangle - it lightens the
    background without looking like a material. Two things fix that and both
    are how real glass behaves: the sheen is a GRADIENT, brighter at the top
    edge where light would catch it, and there is a hairline of pure white
    along that edge (the inset shadow) to stand for the lit lip of the pane.

    Each card carries an --accent, set below. It is the only per-card colour
    and it stays inside the blue family on purpose: the organogram uses green
    and orange, which would read as status here, where this project has spent
    a lot of effort making green and amber mean exactly one thing.
  */
  .team-sec-card {
    position: relative;
    display: flex; flex-direction: column; gap: 12px;
    width: 100%; text-align: left;
    padding: 17px 16px 13px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, .20);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .17) 0%, rgba(255, 255, 255, .065) 100%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    backdrop-filter: blur(18px) saturate(160%);
    box-shadow:
      0 12px 34px rgba(2, 10, 32, .38),
      inset 0 1px 0 rgba(255, 255, 255, .30);
    /* Not a button any more - see teamSectionCard(). The head's email and
       extension live on this card now, and a link inside a button is not a
       link anybody can press. The footer row is the control. */
    font: inherit;
    transition: transform .2s cubic-bezier(.3, 0, .2, 1),
                background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }

  /* The accent, as a hairline along the top edge. */
  .team-sec-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: .75;
    transition: opacity .2s ease;
  }

  /*
    Two variables and not one, because the glow is an rgba and the line is a
    hex. color-mix() would derive the second from the first in one line, and
    it is new enough that a browser without it drops the WHOLE box-shadow
    declaration it appears in - so the hover would lose its shadow entirely
    rather than just its tint. Not a trade worth one line.
  */
  .team-sec:nth-child(1) .team-sec-card { --accent: #4cc9f0; --glow: rgba(76, 201, 240, .42); }
  .team-sec:nth-child(2) .team-sec-card { --accent: #5b9cf8; --glow: rgba(91, 156, 248, .42); }
  .team-sec:nth-child(3) .team-sec-card { --accent: #7b86f0; --glow: rgba(123, 134, 240, .42); }
  .team-sec:nth-child(4) .team-sec-card { --accent: #9d7bef; --glow: rgba(157, 123, 239, .42); }

  .team-sec-card:hover {
    transform: translateY(-4px);
    border-color: rgba(255, 255, 255, .34);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .25) 0%, rgba(255, 255, 255, .11) 100%);
    /* The halo takes the card's own accent, so the four do not all glow the
       same colour - and it is the one place the accent is bright enough to
       be read as a choice rather than a line. */
    box-shadow:
      0 22px 52px rgba(2, 10, 32, .46),
      0 0 30px var(--glow),
      inset 0 1px 0 rgba(255, 255, 255, .44);
  }
  .team-sec-card:hover::before { opacity: 1; }
  .team-sec-open:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* Open: a solid card, because what is under it is solid too. */
  .team-sec.is-open .team-sec-card {
    transform: none;
    background: var(--portal-card);
    border-color: transparent;
    box-shadow: 0 16px 42px rgba(2, 10, 32, .34);
  }
  .team-sec.is-open .team-sec-card::before { opacity: 1; }

  .team-sec-name {
    font-size: 11px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, .82);
  }
  .team-sec.is-open .team-sec-name { color: var(--blue-600); }

  .team-sec-person { display: flex; align-items: center; gap: 11px; }
  /* Room for the pill in the corner, so a long section name does not run
     under it. */
  .team-sec-name { padding-right: 44px; }
  /* flex: 1 so the name takes whatever the face leaves, rather than
     shrinking to its longest unbreakable word and wrapping the rest. */
  .team-sec-who {
    display: flex; flex-direction: column; gap: 2px;
    flex: 1; min-width: 0;
  }
  .team-sec-who strong {
    font-size: 13.5px; font-weight: 700; color: #fff; line-height: 1.25;
  }
  .team-sec-role { font-size: 11px; color: rgba(255, 255, 255, .74); }
  /*
    The designation and module, under the organogram role. A second line
    rather than more words on the first: "Section Head, Interim - Senior
    Manager - MM" is four facts in one breath, and the one somebody is
    scanning for is the first.
  */
  .team-sec-sub {
    display: block; margin-top: 2px;
    font-size: 10.5px; color: rgba(255, 255, 255, .58);
  }
  .team-sec.is-open .team-sec-who strong { color: var(--navy-900); }
  .team-sec.is-open .team-sec-role { color: var(--text-dim); }
  .team-sec.is-open .team-sec-sub { color: var(--text-mut); }

  /* The summary card's face is the same size as every other one; only its
     colours differ, because it sits on the blue rather than on a card. */
  /*
    THE HEAD'S CONTACT LINES, on the glass. .team-lines is written for the
    cream person cards below, where the ink is dark; up here it sits on the
    blue and has to be light until the section is opened and the card turns
    cream like the rest.
  */
  .team-sec-card .team-lines {
    margin-top: 0; padding-top: 10px;
    border-top-color: rgba(255, 255, 255, .22);
  }
  .team-sec-card .team-line { color: rgba(255, 255, 255, .80); }
  .team-sec-card .team-line svg { color: rgba(255, 255, 255, .55); }
  .team-sec-card a.team-line:hover { color: #fff; }
  .team-sec-card a.team-line:hover svg { color: #fff; }
  .team-sec.is-open .team-sec-card .team-lines {
    border-top-color: var(--portal-card-rule);
  }
  .team-sec.is-open .team-sec-card .team-line { color: var(--text-dim); }
  .team-sec.is-open .team-sec-card .team-line svg { color: var(--text-mut); }
  .team-sec.is-open .team-sec-card a.team-line:hover { color: var(--blue-600); }

  /*
    The blood pill on the glass, where the cream card's red is invisible -
    and OUT OF THE NAME ROW. These cards are a quarter of the row wide; an
    88px face and a 45px pill either side of the name left ninety pixels
    for "Senior Manager - MM", which wrapped onto three lines. Lifted to
    the corner it costs the name nothing, and it is the same corner it
    occupies on the person cards below.
  */
  .team-sec-card .team-blood {
    position: absolute; top: 14px; right: 14px; margin: 0;
    background: rgba(255, 255, 255, .16);
    border-color: rgba(255, 255, 255, .34);
    color: #ffd9d9;
  }
  .team-sec.is-open .team-sec-card .team-blood {
    background: var(--red-bg); border-color: #f3cfcf; color: var(--red-ink);
  }

  .team-sec-card .team-face.is-initials {
    background: rgba(255, 255, 255, .92); color: var(--blue-600);
    border-color: transparent;
  }

  /*
    THE CONTROL. It was the whole card; it is this row. A button carrying a
    section name, a face, a designation and three contact links is a button
    with links inside it, which is neither valid nor pressable - so the card
    went back to being a card and the row that already said "9 members" and
    carried the chevron took the job it was always describing.
  */
  .team-sec-open {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; margin-top: auto;
    padding: 10px 0 0;
    border: 0; border-top: 1px solid rgba(255, 255, 255, .22);
    background: none; text-align: left;
    font: inherit; font-size: 11px; color: rgba(255, 255, 255, .78);
    cursor: pointer;
  }
  .team-sec-open:hover { color: #fff; }
  .team-sec.is-open .team-sec-open:hover { color: var(--navy-900); }
  .team-sec.is-open .team-sec-open {
    border-top-color: var(--portal-card-rule); color: var(--text-dim);
  }
  .team-sec-open svg { transition: transform .2s ease; }
  .team-sec.is-open .team-sec-open svg { transform: rotate(180deg); }

  .team-sec-body { padding: 16px 0 4px; }


  /* =========================================================
     THE PEOPLE INSIDE A SECTION
     =========================================================
     Solid white: they sit below the blue, and a glass card over the light
     surface is a grey card.
  */
  /*
    WIDER CARDS, FEWER PER ROW. The email address is the only thing on one
    of these long enough to matter, and at 248px it was the thing being
    cut - a thirty-character address trailing off into an ellipsis on a
    card whose whole job is letting somebody reach that person. 300px fits
    the longest address this team has with room over, and on a 1400px
    screen it still lays out four across.
  */
  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  .team-card {
    display: flex; flex-direction: column; gap: 12px;
    padding: 18px 18px 16px;
    background: var(--portal-card);
    border: 1px solid var(--portal-card-edge); border-radius: 14px;
    box-shadow: 0 2px 10px rgba(8, 26, 66, .07);
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .team-card:hover {
    transform: translateY(-2px);
    border-color: #ddcfb8;
    box-shadow: 0 12px 30px rgba(8, 26, 66, .16);
  }

  .team-card-top { display: flex; align-items: center; gap: 13px; }

  /*
    THE PHOTOGRAPH. 76px, up from 56 and before that 42 - and the reason to
    keep going is that the real photographs arrived and settled the
    argument. At 56 these are passport stamps: the face is there, you can
    tell it is a person, you cannot tell WHICH person without reading the
    name underneath. That is the one job a photograph on a directory has.

    A circle makes it smaller than it looks, too. A 76px circle shows the
    area of a 60px square, so the box has to run ahead of the face you want
    to see inside it.

    The size lives here and the two cards below override it, one up and one
    down: the person card is the one being looked at, the summary card
    carries four other things besides, and the lead card is the hero.
  */
  .team-face {
    flex: 0 0 auto;
    width: 88px; height: 88px;
    border-radius: 50%;
    object-fit: cover;
    /*
      CROPPED TOWARDS THE HEAD, NOT THE MIDDLE.

      These are standing portraits - most of them show somebody from the
      waist or chest up - and a square crop taken from the centre of one of
      those is mostly shirt. The face ends up occupying perhaps a third of
      the circle, so a 76px avatar was showing a 25px face, and no amount
      of resolution fixes that: the pixels were being spent on a tie.

      30% rather than the top, because a photograph already framed tight on
      the head would lose its chin to an aggressive crop. 30 is far enough
      to lift a full-length portrait onto the face and near enough the
      middle to leave a headshot alone.
    */
    object-position: center 30%;
    background: var(--blue-050);
  }
  .team-face.is-initials {
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; letter-spacing: .02em;
    color: var(--blue-600);
    border: 1px solid #d8e5f8;
  }
  /*
    ONE FACE SIZE ON THE WHOLE PAGE. The head card, the four section cards
    and the person cards inside them all draw at 88px now. Three sizes was
    a hierarchy nobody had asked for, and the smallest of them - 58px on
    the four cards everybody looks at first - was the one being squinted
    at. The rule above carries all three; there is nothing to override.
  */

  .team-who { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .team-who strong {
    font-size: 15px; font-weight: 700; color: var(--navy-900);
    line-height: 1.25;
  }

  /*
    BLOOD GROUP. Pushed to the far end of the header row, away from the name
    and the designation, because it is not part of either - it is the one
    thing on this card that somebody reads in a hurry, and only ever once.
    Red, which is the only colour it could be, and quiet enough at rest that
    a wall of cards does not read as a wall of warnings.
  */
  .team-blood {
    flex: 0 0 auto; margin-left: auto; align-self: flex-start;
    padding: 3px 9px; border-radius: 999px;
    background: var(--red-bg); border: 1px solid #f3cfcf;
    color: var(--red-ink);
    font-size: 11.5px; font-weight: 800; letter-spacing: .02em;
    line-height: 1.3; white-space: nowrap;
  }
  .team-lead .team-blood {
    background: rgba(255, 255, 255, .16); border-color: rgba(255, 255, 255, .34);
    color: #ffd9d9;
  }
  /*
    What this person is ON THE CHART - Section Head, and whether that is
    interim. Above the designation and in the card's accent, because it is
    the thing the organogram exists to show; the designation underneath is
    what they are everywhere else.
  */
  .team-flag {
    display: block; margin-bottom: 1px;
    font-size: 10px; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; color: var(--blue-600);
  }
  .team-lead .team-flag { color: rgba(255, 255, 255, .82); }
  .team-role { font-size: 12.5px; color: var(--text-dim); }

  .team-lines {
    display: flex; flex-direction: column; gap: 7px;
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--portal-card-rule);
  }

  .team-line {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: var(--text-dim);
    text-decoration: none;
    /*
      The address is the long one - some of these run past twenty characters -
      so it is the part allowed to be cut. Wrapping instead would make every
      card in the row as tall as the longest address in it.
    */
    min-width: 0;
  }
  .team-line span {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .team-line svg { flex: 0 0 auto; color: var(--text-mut); }
  a.team-line:hover { color: var(--blue-600); }
  a.team-line:hover svg { color: var(--blue-500); }
  a.team-line:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 2px; }

  /* The roster disagreement note - admins only, and it says why it matters. */
  .team-drift {
    margin-top: 26px;
    padding: 14px 16px;
    background: var(--amber-bg);
    border: 1px solid #f4dfae; border-radius: 12px;
    font-size: 12px; line-height: 1.6; color: var(--amber-ink);
  }
  .team-drift div { margin-top: 6px; }

  /* =========================================================
     THE BACK BUTTON
     ========================================================= */
  .portal-back {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 12px 6px 9px;
    border: 1px solid rgba(255, 255, 255, .28); border-radius: 999px;
    background: rgba(255, 255, 255, .10);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: rgba(255, 255, 255, .90);
    /* Longhands, not the font shorthand: `inherit` is illegal as the family
       inside it and takes the whole declaration down with it. See the note
       on .portal-cta for what that cost. */
    font-family: inherit; font-size: 12px; line-height: 1; font-weight: 600;
    cursor: pointer;
    transition: background .16s ease, box-shadow .16s ease, transform .16s ease;
  }
  .portal-back:hover {
    background: rgba(255, 255, 255, .20);
    box-shadow: 0 0 16px rgba(150, 200, 255, .45);
    /* Leftwards, because that is the direction the button means. */
    transform: translateX(-2px);
  }
  .portal-back:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }


  /* =========================================================
     THE LINKS PAGE
     =========================================================
     One card now, built to take a list: the stack behind it is drawn with
     two pseudo-elements rather than with real empty cards, so a second link
     added later lands beside this one instead of having to displace a prop.
  */
  /*
    THE LINKS PAGE.

    One bar per system, the full width of the page. It began as a narrow card
    with a paragraph in it and a stack of panes drawn behind; both are gone.
    The paragraph repeated the line under the heading once per link, and the
    stack was scenery - it implied cards that were not there, which is a
    strange thing to draw on a page whose whole job is to be an honest list.

    GLASS, with the cream down to a trace. It has been walked down twice -
    solid cream, then cream at a fifth - and this is the end of that road:
    enough warmth left that the bar is not icy next to the cream cards on
    the other pages, not enough to read as a surface of its own.

    What replaces it is more glass, not more colour: a deeper blur, a
    stronger lit lip along the top edge, and a halo on hover. Those are what
    make a pane look like a pane; tint only ever made it look like paper.
  */
  .link-stack {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .link-card {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 16px;
    padding: 18px 22px;
    border-radius: 16px;
    text-decoration: none;
    border: 1px solid rgba(255, 255, 255, .26);
    /* A trace of warmth - 255,251,244 rather than pure white - and that is
       all the cream there is left in it. */
    background:
      linear-gradient(180deg, rgba(255, 251, 244, .15) 0%, rgba(255, 251, 244, .05) 100%);
    -webkit-backdrop-filter: blur(26px) saturate(185%);
    backdrop-filter: blur(26px) saturate(185%);
    box-shadow:
      0 16px 42px rgba(2, 10, 32, .36),
      inset 0 1px 0 rgba(255, 255, 255, .40);
    transition: transform .2s cubic-bezier(.3, 0, .2, 1),
                background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }

  /* The lit lip along the top edge, as on every other glass panel here. */
  .link-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .95), transparent);
    opacity: .8; transition: opacity .2s ease;
  }
  .link-card:hover {
    transform: translateY(-3px);
    border-color: rgba(255, 255, 255, .48);
    background:
      linear-gradient(180deg, rgba(255, 251, 244, .24) 0%, rgba(255, 251, 244, .09) 100%);
    box-shadow:
      0 28px 62px rgba(2, 10, 32, .48),
      0 0 46px rgba(130, 190, 255, .60),
      inset 0 1px 0 rgba(255, 255, 255, .58);
  }
  .link-card:hover::before { opacity: 1; }
  .link-card:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }

  .link-card-mark {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    width: 42px; height: 42px;
    border-radius: 12px;
    background: rgba(255, 255, 255, .93);
    color: var(--blue-600);
    box-shadow: 0 2px 10px rgba(2, 10, 32, .22);
  }
  .link-card-mark svg { width: 20px; height: 20px; }

  .link-card-text { display: flex; min-width: 0; }
  .link-card-text strong {
    font-size: 16px; font-weight: 700; color: #fff; letter-spacing: -.01em;
  }

  .link-card-go {
    flex: 0 0 auto; margin-left: auto;
    color: rgba(255, 255, 255, .60);
    transition: color .16s ease, transform .16s ease;
  }
  .link-card-go svg { width: 17px; height: 17px; display: block; }
  .link-card:hover .link-card-go {
    color: #fff;
    transform: translate(3px, -3px);
  }

  /* ---------- the waiting pages ---------- */
  .portal-empty {
    padding: 34px 30px;
    background: var(--portal-card);
    border: 1px solid rgba(255, 255, 255, .7); border-radius: 16px;
    box-shadow: 0 10px 30px rgba(8, 26, 66, .14);
    max-width: 68ch;
  }
  .portal-empty h2 {
    margin: 0 0 9px;
    font-size: 17px; font-weight: 700; color: var(--navy-700);
  }
  .portal-empty p {
    margin: 0; font-size: 13.5px; line-height: 1.65; color: var(--text-dim);
  }

  .portal-phase-note {
    margin: 26px 0 0;
    font-size: 12px; line-height: 1.6; color: var(--text-dim);
    text-align: center;
  }
  .portal-phase-note b { color: var(--navy-700); }

  /* ---------- footer ---------- */
  /*
    The right-hand padding is the messenger bubble's footprint - about 290px
    wide, 20px off the edge. Without it the second half of the footer sits
    underneath the bubble and reads as a rendering fault.
  */
  .portal-foot {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 330px 0 24px; height: 46px;
    background: var(--portal-card);
    border-top: 1px solid var(--portal-card-edge);
    font-size: 11.5px; color: var(--text-dim);
    position: relative; z-index: 1;
  }
  .portal-foot-dim { color: var(--text-mut); }


  /* =========================================================
     THE WRITTEN PAGES - About us, Partners
     =========================================================
     One head and two card grids, shared so the two pages read as the same
     kind of page: a small pill, a heading that breaks over two lines, and
     the paragraph set beside it rather than under it.

     Everything here is glass on the blue, so the sky runs the whole height
     the way it does on Links - glass over the light surface is a grey box,
     and a fixed height would be a guess at how long the page will ever be.
  */
  /*
    BOTH OF THESE RUN BLUE ALL THE WAY DOWN, because every card on them is
    glass and glass over the light surface is a grey box.

    About us was tried the other way - a band behind the heading and white
    below - and put back. It is noted here because the reasoning for the
    break was sound and somebody will have it again: on white the pillars
    cannot be glass, so they become solid cream with dark type, and at that
    point the two content pages are built from two different materials and
    stop looking like one site. A fixed height would also be a guess at how
    long the page will ever be, and the first card past the edge is the one
    that looks broken.
  */
  .portal[data-page="about"] .portal-sky,
  .portal[data-page="partners"] .portal-sky { height: 100%; border-radius: 0; }

  /*
    LEARNINGS IS THE SAME CASE, and it is not optional there.

    Every surface on that page is glass: the search bar, the chips, the
    document cards, the tree and the reading pane. Glass over the light
    page surface is not a lighter pane - it is a GREY SLAB, and the first
    screenshot of the finished page showed exactly that: a row of grey
    rectangles with chips on them that had all but vanished.

    100% rather than a measured height like the team page uses. There the
    sky has to stop, because the people underneath are solid cards that
    want the light surface; here there is nothing below the glass to want
    anything, so there is no measurement to get wrong.
  */
  .portal[data-page="learnings"] .portal-sky,
  .portal[data-page="knowledge"] .portal-sky { height: 100%; border-radius: 0; }

  /* ---------- the shared head ---------- */
  .pcontent-head { padding: 26px 0 34px; }

  .pcontent-pill {
    display: inline-block; margin-bottom: 18px;
    padding: 6px 15px; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .26);
    background: rgba(255, 255, 255, .11);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    font-size: 10.5px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: rgba(255, 255, 255, .88);
  }

  /*
    Heading left, paragraph right. The gap is wide and the paragraph narrow
    on purpose: a lede that runs the full width of a 1180px page is a line
    the eye loses its place in, and the empty middle is what makes the
    heading look deliberate rather than merely left-aligned.
  */
  .pcontent-headline {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px);
    gap: 24px 60px; align-items: end;
  }
  .pcontent-title {
    margin: 0;
    font-size: 46px; line-height: 1.08; font-weight: 700;
    letter-spacing: -.03em; color: #fff;
    text-shadow: 0 2px 20px rgba(4, 16, 46, .4);
  }
  .pcontent-lede {
    margin: 0 0 6px; font-size: 13.5px; line-height: 1.65;
    color: rgba(255, 255, 255, .78);
  }

  /* ---------- the glass card both grids use ---------- */
  /*
    The same recipe as a team section card - gradient sheen, lit top lip,
    accent halo on hover - rather than a second idea about what glass looks
    like on this site.
  */
  .pillar, .zone {
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    padding: 20px 19px 18px;
    border-radius: 18px;
