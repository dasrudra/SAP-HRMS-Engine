<!--
  PortalStyles.html - the portal's own CSS, and only the portal's.
  ================================================================

  Blue and white. The colours are not new: the blues below are the variables
  already declared at the top of Styles.html and already used by the
  dashboard. Two stylesheets each holding their own idea of "our blue" drift
  apart the first time one of them is adjusted, and then the portal and the
  dashboard are visibly two products bolted together - which is exactly what
  this is meant not to look like.

  What is new is the SHAPE. The dashboard is a dark sidebar against a dense
  working surface, because it is a tool you keep open. The portal opens on a
  wash of blue with white type over it, because it is a front door.

  Loaded after Styles.html, so anything shared resolves the same way and
  anything here wins a tie.
-->
<style>

  /* =========================================================
     THE CARD SURFACE
     =========================================================
     A warm off-white, not white.

     White cards on this page sat on a pale blue background and all but
     disappeared into it - two near-white surfaces a few percent apart, with
     only a hairline border saying where one stopped. Going DARKER on the
     background would have fixed the contrast and lost the light, airy feel
     the page is built on, so the cards move instead.

     Cream rather than grey because the move is in temperature as well as
     lightness: against a cool blue background a warm surface separates at a
     glance, where a grey one of the same lightness still reads as "the same
     white, slightly off". It also stays out of the way of the only two
     tinted surfaces on the site that carry meaning - the amber drift notice
     and the band pills - which a grey-blue card family would have crowded.

     White is kept for controls sitting ON the dark sky, where it is the
     brightest thing available and that is the point: the open tab, the KPI
     Engine pill, the hero buttons, the EAS mark.
  */
  :root {
    --portal-card: #fcf8f1;
    --portal-card-edge: #ebe1d2;
    --portal-card-rule: #f2e9dc;
  }

  /* =========================================================
     THE SHELL
     ========================================================= */
  /*
    A fixed app shell, not a scrolling document: the bar stays at the top and
    the footer at the bottom while only the middle moves. Inside the Blogger
    page this app is an iframe pinned to the whole window, so "the viewport"
    here really is the whole window.

    WHERE IT SITS IN THE STACK, which is the part worth writing down:
       portal shell       1   <- this
       sign-in screen   200   covers the portal, which is what a sign-out
                              has to do
       messenger bar    300   reachable from the portal, as it is everywhere
       confirm dialog  1000   stays the only thing on screen while it is up
  */
  .portal {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column;
    background: #eef4fc;
    overflow: hidden;
  }

  /* =========================================================
     THE SKY
     =========================================================
     Four soft radial blobs over a deep blue, which is how the gradient in
     the reference is built: no single linear ramp makes that shape. They are
     placed off the edges on purpose - a blob whose centre is visible reads as
     a spotlight, and one whose centre is outside the box reads as light.

     Darkened twice, on request. There is a floor, and it is the glass: a
     frosted panel is only legible as glass while there is light behind it
     for the blur to pick up. Past this the navigation pill and the section
     cards stop reading as glass and start reading as grey boxes.

     The cards were brightened at the same time to hold their contrast
     against it - a film that reads as glass over a mid blue reads as haze
     over this one, so the two have to move together.

     Height comes from data-page, set by applyShell(). A hero's worth on Home,
     a header band on every other page, and the transition makes walking
     between them a movement rather than a jump.
  */
  .portal-sky {
    position: absolute; top: 0; left: 0; right: 0;
    height: 232px;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(90% 120% at 12% 8%,   #27508f 0%, rgba(39, 80, 143, 0) 60%),
      radial-gradient(70% 110% at 88% 0%,   #0d6076 0%, rgba(13, 96, 118, 0) 55%),
      radial-gradient(80% 130% at 72% 100%, #271a6e 0%, rgba(39, 26, 110, 0) 62%),
      radial-gradient(120% 140% at 30% 110%, #071a4c 0%, rgba(7, 26, 76, 0) 70%),
      linear-gradient(135deg, #04112c 0%, #0a2558 48%, #113b7c 100%);
    /* Only the bottom corners, so it meets the window squarely at the top. */
    border-radius: 0 0 26px 26px;
    transition: height .32s cubic-bezier(.4, 0, .2, 1);
  }
  .portal[data-page="home"] .portal-sky { height: 620px; }

  /*
    The team page needs the blue to reach past the four section cards,
    because those cards ARE glass - a glass card over a white page is a grey
    card. Everything below them, once a section is opened, is on the light
    surface and is solid white.
  */
  .portal[data-page="team"] .portal-sky { height: 700px; }

  /*
    The Links page is blue all the way down, not for effect but because every
    bar on it is glass - and glass over the light surface is a grey box. A
    fixed height would have been a guess at how many links there will ever
    be, and the first one past the edge would have been the one that looked
    broken.
  */
  .portal[data-page="links"] .portal-sky { height: 100%; border-radius: 0; }

  /*
    The two layers above it. Transparent backgrounds, so the sky shows
    through, and a stacking context above it so they are not painted under.
  */
  .portal-top, .portal-body { position: relative; z-index: 1; }


  /* =========================================================
     THE TOP BAR
     ========================================================= */
  .portal-top {
    flex: 0 0 auto;
    display: flex; align-items: center;
    padding: 0 22px;
    height: 72px;
    background: none;
    border: 0;
  }

  /* The mark, and the mailbox under it. */
  .portal-ident {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
  }

  .portal-mail {
    /* Indented past the mark - 34px of tile plus the 11px gap - so it lines
       up under the company line rather than under the EAS square. */
    margin-left: 45px;
    display: inline-flex; align-items: center; gap: 6px;
    /* Larger than the company line above it, on request: it is the address
       people are meant to write to, not a footnote about the company. */
    font-size: 12.5px; font-weight: 600;
    color: rgba(255, 255, 255, .92);
    text-decoration: none;
    padding: 3px 10px 3px 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .10);
    border: 1px solid rgba(255, 255, 255, .16);
    transition: color .15s ease, background .15s ease, box-shadow .15s ease;
  }
    .portal-mail svg { width: 13px; height: 13px; }

  .portal-mail:hover {
    color: #fff;
    background: rgba(255, 255, 255, .20);
    box-shadow: 0 0 14px rgba(150, 200, 255, .45);
  }
  .portal-mail:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .portal-brand {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 11px;
    padding: 0; border: 0; background: none;
    cursor: pointer; text-align: left;
    font: inherit; color: inherit;
    border-radius: 8px;
  }
  .portal-brand:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  .portal-brand-text { display: flex; flex-direction: column; line-height: 1.25; }
  .portal-brand-text strong {
    font-size: 13.5px; font-weight: 700; color: #fff;
    letter-spacing: -.01em; white-space: nowrap;
  }
  .portal-brand-text span {
    font-size: 10.5px; color: rgba(255, 255, 255, .72); white-space: nowrap;
  }

  /*
    The mark is drawn by Styles.html for the dark sidebar, where a solid blue
    tile on near-black reads well. On the sky it is blue on blue, so it goes
    white with the blue inside it.
  */
  .portal-top .brand-mark {
    background: #fff; color: var(--blue-600);
    box-shadow: 0 2px 10px rgba(4, 18, 50, .22);
  }


  /* =========================================================
     THE TABS - centred, and made of glass
     =========================================================
     Centred by taking them out of the flex row entirely. Left in it, the row
     would centre them between the mark and the identity strip, which are not
     the same width - so they would sit visibly off-centre and move sideways
     whenever somebody with a longer name signed in.

     The glass is a real backdrop blur of the sky behind it. That is why the
     sky has to be a painted element and not a background on the scroll box:
     there must be something underneath for the filter to work on.
  */
  /*
    THE ROW THE PILL SITS ON, which exists only so the pill can be centred
    twice over.

    On a wide window it is taken out of the flex row and pinned to the middle
    of the bar: centred between the window's edges, not between the mark and
    the identity strip, which are different widths and would push it visibly
    off-centre - and would shift it sideways whenever somebody with a longer
    name signed in.

    On a narrower one it becomes a full-width row of its own. The width is
    what forces the wrap: a flex item allowed to shrink will shrink instead
    of wrapping, which is how the first attempt ended up with the pill
    squeezed onto the same line as everything else and hanging off the right
    edge. The pill inside stays its own size and is centred by this.
  */
  .portal-navwrap {
    position: absolute; left: 50%; transform: translateX(-50%);
    display: flex; justify-content: center;
    max-width: calc(100% - 620px);
  }

  .portal-nav {
    display: flex; align-items: center; gap: 2px;
    max-width: 100%;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; -ms-overflow-style: none;
    /* Wider at the ends than the top: at border-radius 999px the pill's
       corners curve in across the full height, so a first or last tab with
       only the vertical padding sits against the curve rather than inside
       it. */
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .13);
    border: 1px solid rgba(255, 255, 255, .24);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    backdrop-filter: blur(16px) saturate(150%);
    box-shadow:
      0 8px 28px rgba(5, 20, 56, .22),
      inset 0 1px 0 rgba(255, 255, 255, .34);
  }
  .portal-nav::-webkit-scrollbar { height: 0; width: 0; }

  .portal-tab {
    flex: 0 0 auto;
    position: relative;
    padding: 8px 13px;
    border: 0; background: none;
    font: 600 13px/1 inherit;
    color: rgba(255, 255, 255, .80);
    white-space: nowrap;
    border-radius: 999px;
    cursor: pointer;
    transition: color .16s ease, background .16s ease, box-shadow .16s ease;
  }

  /*
    THE GLOW, which is the hover state asked for. Kept to a halo plus a lift
    in brightness - no movement. Ten tabs this close together, each nudging
    itself on hover, is a row that twitches as the pointer crosses it.
  */
  .portal-tab:hover {
    color: #fff;
    background: rgba(255, 255, 255, .18);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, .30),
      0 0 18px rgba(150, 200, 255, .55),
      inset 0 1px 0 rgba(255, 255, 255, .35);
  }
  .portal-tab:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /*
    The open tab is marked by FILL AND WEIGHT, not by colour alone - the same
    rule the band pills follow elsewhere in this project, and the reason none
    of this depends on telling two blues apart.
  */
  .portal-tab.is-on {
    color: var(--navy-900);
    background: #fff;
    box-shadow: 0 2px 10px rgba(5, 20, 56, .20);
  }

  /* The one tab that leaves the portal: white on the glass, so it reads as a
     button among labels rather than another label. */
  .portal-tab.is-engine {
    margin: 0 4px;
    padding: 8px 15px;
    background: #fff; color: var(--blue-600);
    box-shadow: 0 2px 12px rgba(5, 20, 56, .26);
  }
  .portal-tab.is-engine:hover {
    background: #fff; color: var(--blue-600);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .5), 0 0 22px rgba(150, 200, 255, .8);
  }

  /* ---------- who is signed in ---------- */
  .portal-who {
    flex: 0 0 auto; margin-left: auto;
    display: flex; align-items: center; gap: 10px;
  }
  .portal-who-name {
    font-size: 12.5px; font-weight: 600; color: rgba(255, 255, 255, .92);
    max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .portal-signout {
    padding: 6px 13px;
    border: 1px solid rgba(255, 255, 255, .34); border-radius: 999px;
    background: rgba(255, 255, 255, .12);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: #fff;
    font: 600 12px/1 inherit; cursor: pointer;
    transition: background .16s ease, box-shadow .16s ease;
  }
  .portal-signout:hover {
    background: rgba(255, 255, 255, .22);
    box-shadow: 0 0 16px rgba(150, 200, 255, .5);
  }
  .portal-signout:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }


  /* =========================================================
     THE PAGES
     ========================================================= */
  /*
    The bottom padding is for the messenger bubble. It sits bottom-right on
    every screen, portal included - it is outside both shells in Index.html
    precisely so that it does - and it is taller than the 46px footer, so
    without this the last line of a long page ends up underneath it.
  */
  .portal-body {
    flex: 1 1 auto;
    overflow-y: auto;
    scroll-padding-bottom: 90px;
    background: none;
  }

  .portal-page { max-width: 1180px; margin: 0 auto; padding: 18px 28px 96px; }

  /* On a content page the title sits on the sky, so it is white there. */
  .portal-page-title {
    margin: 10px 0 26px;
    font-size: 32px; font-weight: 700; letter-spacing: -.025em;
    color: #fff;
    text-shadow: 0 1px 14px rgba(6, 22, 60, .3);
  }

  /* ---------- the hero ---------- */
  .portal-hero { padding: 44px 0 10px; text-align: center; }

  .portal-hero-title {
    margin: 0 auto 20px;
    font-size: 58px; line-height: 1.04; font-weight: 800;
    letter-spacing: -.04em;
    color: #fff;
    text-shadow: 0 2px 30px rgba(6, 22, 60, .32);
    max-width: 14ch;
  }

  .portal-hero-sub {
    margin: 0 auto 32px;
    max-width: 58ch;
    font-size: 16px; line-height: 1.62;
    color: rgba(255, 255, 255, .86);
  }

  .portal-hero-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

  /*
    Both hero buttons wear this, and one of them is an anchor because it
    leaves the app.

    text-decoration and display are here FOR that anchor. A button is
    inline-block and never underlined; an anchor is inline and underlined by
    default, so without these two lines the SAP button came out underlined
    and a hair's breadth off the height of the one beside it. Styling a
    control by class rather than by tag means the class has to say everything
    the tag would otherwise have assumed.

    The translucent "ghost" variant is gone. It had one user - the second
    hero button - and that button now matches the first, so the rules would
    have been dead CSS waiting to be wondered about.
  */
  .portal-cta {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 13px 26px;
    border: 1px solid transparent; border-radius: 999px;
    background: #fff; color: var(--blue-600);
    font: 600 14px/1 inherit; cursor: pointer;
    text-decoration: none;
    box-shadow: 0 6px 22px rgba(5, 20, 56, .26);
    transition: box-shadow .16s ease, transform .16s ease;
  }
  .portal-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(5, 20, 56, .34), 0 0 26px rgba(150, 200, 255, .62);
  }
  .portal-cta:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }


  /* =========================================================
     THE CARDS
     =========================================================
     White, and deliberately overlapping the bottom of the sky the way the
     cards in the reference overlap their panel. That overlap is what stops
     the hero reading as a coloured box with a list under it.
  */
  .portal-tiles {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-top: 52px;
  }

  .portal-tile {
    display: flex; flex-direction: column;
    min-height: 186px;
    padding: 16px 18px 15px;
    background: var(--portal-card);
    border: 1px solid rgba(255, 255, 255, .7);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(8, 26, 66, .14), 0 2px 6px rgba(8, 26, 66, .07);
  }

  .portal-tile-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 8px;
  }
  .portal-tile-label {
    font-size: 11px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; color: var(--text-mut);
  }
  .portal-tile-trend {
    font-size: 11px; font-weight: 700;
    padding: 3px 7px; border-radius: 999px;
    background: var(--green-bg); color: var(--green-ink);
  }

  .portal-tile-value {
    font-size: 27px; font-weight: 700; letter-spacing: -.025em;
    color: var(--navy-900); line-height: 1.1;
  }
  .portal-tile-unit { font-size: 16px; font-weight: 600; color: var(--text-dim); }

  /*
    overflow:visible because the line chart's last point sits ON the right
    edge of its viewBox, so the dot marking it was being sliced in half by
    the SVG viewport. Moving the data inwards instead would have left the
    area fill short of the edge, which looks like missing data.
  */
  .portal-chart {
    display: block; width: 100%; height: 74px; margin: auto 0 6px;
    overflow: visible;
  }

  .portal-tile-note { font-size: 11px; color: var(--text-mut); }

  /* ---------- the donut ---------- */
  .portal-donut {
    position: relative;
    margin: auto; width: 108px; height: 108px;
    display: flex; align-items: center; justify-content: center;
  }
  .portal-donut svg { width: 100%; height: 100%; }
  .portal-donut-mid {
    position: absolute;
    font-size: 23px; font-weight: 700; letter-spacing: -.02em;
    color: var(--navy-900);
  }
  .portal-donut-mid small { font-size: 12px; font-weight: 600; color: var(--text-dim); }

  /* ---------- the activity list ---------- */
  .portal-feed {
    margin: 4px 0 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 9px;
  }
  .portal-feed li {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 12px; line-height: 1.4; color: var(--text-dim);
  }
  /*
    One colour, because the list stopped being a status feed. Green, amber
    and grey said "done, waiting, idle"; against a list of capabilities they
    would be saying something about each one, and there is nothing for them
    to say.
  */
  .portal-dot {
    flex: 0 0 auto; width: 6px; height: 6px; margin-top: 5px;
    border-radius: 50%; background: var(--blue-500);
  }


  /* =========================================================
     THE EAS TEAM PAGE
     =========================================================
     A page of thirty-seven people, so the thing that matters is scanning:
     finding one person fast, and seeing who leads a section without reading
     every card. Cards rather than a table because each one carries a face, a
     role and three ways to reach somebody - a table of that is six columns
     wide and unreadable on anything but a desktop.
  */
  .portal-page-head { margin: 10px 0 30px; }
  .portal-page-head .portal-page-title { margin: 0 0 6px; }
  .portal-page-sub {
    margin: 0; font-size: 13.5px;
    color: rgba(255, 255, 255, .80);
  }

  /* =========================================================
     THE DEPARTMENT HEAD
     =========================================================
     Above the sections and in the middle, which is where the organogram has
     him. Glass, because he sits on the blue.
  */
  .team-lead-wrap {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 0;
  }

  .team-lead {
    position: relative;
    width: min(380px, 100%);
    display: flex; flex-direction: column; gap: 11px;
    padding: 18px 20px 16px;
    border-radius: 18px;
    overflow: hidden;
    /* The same frosted-glass build as the section cards: a gradient sheen
       rather than a flat film, and a lit lip along the top edge. */
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .19) 0%, rgba(255, 255, 255, .075) 100%);
    border: 1px solid rgba(255, 255, 255, .24);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    backdrop-filter: blur(20px) saturate(160%);
    box-shadow:
      0 18px 48px rgba(2, 10, 32, .42),
      inset 0 1px 0 rgba(255, 255, 255, .34);
    transition: box-shadow .2s ease, transform .2s ease, background .2s ease;
  }
  .team-lead::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .85), transparent);
  }
  .team-lead:hover {
    transform: translateY(-3px);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .26) 0%, rgba(255, 255, 255, .12) 100%);
    box-shadow:
      0 26px 60px rgba(2, 10, 32, .50),
      0 0 34px rgba(150, 200, 255, .38),
      inset 0 1px 0 rgba(255, 255, 255, .46);
  }

  .team-lead-flag {
    align-self: flex-start;
    font-size: 10px; font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(255, 255, 255, .92); color: var(--blue-600);
  }
  .team-lead .team-who strong { color: #fff; font-size: 15px; }
  .team-lead .team-role { color: rgba(255, 255, 255, .80); }
  .team-lead .team-face.is-initials {
    background: rgba(255, 255, 255, .92); color: var(--blue-600);
    border-color: transparent;
  }
  .team-lead .team-lines { border-top-color: rgba(255, 255, 255, .22); }
  .team-lead .team-line { color: rgba(255, 255, 255, .84); }
  .team-lead .team-line svg { color: rgba(255, 255, 255, .62); }
  .team-lead a.team-line:hover { color: #fff; }
  .team-lead a.team-line:hover svg { color: #fff; }

  /* The line down to the sections. Drawn, because four cards under a fifth
     is a row of five without it. */
  .team-stem {
    width: 2px; height: 30px;
    background: linear-gradient(rgba(255, 255, 255, .55), rgba(255, 255, 255, .16));
    border-radius: 2px;
  }


  /* =========================================================
     THE FOUR SECTIONS
     ========================================================= */
  .team-sections {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    align-items: start;
  }

  /*
    An opened section spans the whole row rather than widening its own
    column. Eleven cards inside a quarter-width column is a single file of
    cards a mile long; across the row they lay out four at a time like every
    other grid on this site.
  */
  .team-sec { display: contents; }
  .team-sec-card { grid-row: 1; }
  .team-sec-body { grid-column: 1 / -1; grid-row: 2; }
  .team-sec:nth-child(1) .team-sec-card { grid-column: 1; }
  .team-sec:nth-child(2) .team-sec-card { grid-column: 2; }
  .team-sec:nth-child(3) .team-sec-card { grid-column: 3; }
  .team-sec:nth-child(4) .team-sec-card { grid-column: 4; }

  /*
    A SECTION CARD.

    Frosted dark glass rather than a white film. A flat rgba(255,255,255,.12)
    over a deep blue comes out as a milky grey rectangle - it lightens the
    background without looking like a material. Two things fix that and both
    are how real glass behaves: the sheen is a GRADIENT, brighter at the top
    edge where light would catch it, and there is a hairline of pure white
    along that edge (the inset shadow) to stand for the lit lip of the pane.

    Each card carries an --accent, set below. It is the only per-card colour
    and it stays inside the blue family on purpose: the organogram uses green
    and orange, which would read as status here, where this project has spent
    a lot of effort making green and amber mean exactly one thing.
  */
  .team-sec-card {
    position: relative;
    display: flex; flex-direction: column; gap: 12px;
    width: 100%; text-align: left;
    padding: 17px 16px 13px;
    border-radius: 16px;
    overflow: hidden;
