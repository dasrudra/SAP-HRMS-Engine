<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summary - TVL-EAS</title>
<!--
  THE SUMMARY SCREEN.

  Ported from the view-settings section of src/Index.html and from
  fillSettings / renderKpiTable / kpiRowBody / bandBar / achievementCell /
  renderRebuildState / backupRows in src/App.html. Same three cards, same
  columns, same words.

  The internal name is still `settings`, as it is in the original, so every
  saved link with ?view=settings keeps working. Only what people read says
  Summary.

  WHAT THIS SCREEN IS FOR, in two sentences from the original's own
  comments. The thresholds table answers a comparison - "which targets are
  tight, which are loose, which are live" - which is why it is a table and
  not four cards. The Database card is the one place that says what is
  ACTUALLY stored beside what the upload history CLAIMS, so that when the
  two disagree somebody is told plainly rather than inferring it from an
  empty dashboard.
-->
<link rel="stylesheet" href="app.css">
<script src="shell.js"></script>
<!--
  No chart is drawn on this screen. It is here for bandColour, so that the
  three band colours have exactly one definition in the whole application -
  see the note on bandColour below. kpi-charts.js touches Chart.js only
  inside drawChart, so loading it without the Chart.js script is safe.
-->
<script src="kpi-charts.js"></script>
<style>
  body { background: var(--bg); }
  /* Only while the shell is not around it - see uploads.html. */
  body > .page { max-width: 1320px; margin: 0 auto; padding: 28px 20px 60px; }
  .signin { max-width: 400px; margin: 60px auto; }
  .signin label { display: block; font-size: 12px; color: var(--text-dim);
                  margin: 14px 0 4px; }
  .signin input { width: 100%; padding: 9px 11px; border: 1px solid var(--line);
                  border-radius: 8px; font: inherit; background: var(--card);
                  color: var(--text); }
  .signin .btn { margin-top: 18px; width: 100%; }
  .signin .why { color: var(--red); font-size: 13px; margin: 12px 0 0;
                 min-height: 18px; }
</style>
</head>
<body>

<section class="card signin" id="signinCard" hidden>
  <div class="card-head">Sign in</div>
  <label for="employeeId">Employee ID</label>
  <input id="employeeId" autocomplete="username" inputmode="numeric">
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password">
  <p class="why" id="signinWhy"></p>
  <button class="btn btn-primary" id="signinGo">Sign in</button>
</section>


<div class="page" id="page" hidden>

  <section class="view" id="view-settings">
    <div class="page-head">
      <div>
        <h1>Summary</h1>
        <p class="sub">
          The team, and every indicator's target, bands and achievement
          in one place.
        </p>
      </div>
    </div>

    <!--
      THE THRESHOLDS, as a table.

      A card per KPI put one indicator's numbers together but hid the other
      three behind a click, and the question this section actually answers
      is a comparison: which targets are tight, which are loose, which are
      live. That is a table. What it gained over the plain seven-column
      version is the BANDS COLUMN - red, yellow and green drawn as one bar
      across the whole 0-100 the percentage lives on, which says the thing
      three separate number cells never could: nearly the entire range is a
      breach, and the window you have to land in is a sliver at the top.
      The exact figures are printed under the bar, because the thinnest
      slivers are held to a minimum width to stay visible at all.
    -->
    <div class="card card-blue">
      <div class="card-head" data-report="settingsTable">
        KPI thresholds
        <!--
          The policy itself, beside the heading of the table it defines.
          It says the document's TITLE rather than its reference number,
          because "TVL-KPI-001 v1.0" is the one string on the screen that
          means nothing to anybody who has not read the document it names.
          The reference and the version go on the hover.
        -->
        <a class="head-doc-main" id="kpiPolicyDoc"
           target="_blank" rel="noopener noreferrer" hidden></a>
        <span class="head-note" id="kpiTableNote"></span>
      </div>
      <div class="table-wrap">
        <table id="settingsTable" class="thr-table">
          <thead>
            <tr>
              <th class="thr-no">#</th>
              <th>Indicator</th>
              <th class="r">Target</th>
              <th>Performance bands</th>
              <th>SLA layer</th>
              <!--
                KPI Achievement. It was a tile on each indicator's own page,
                next to the success rate, saying nearly the same thing
                twice. One column across all four is the comparison it was
                always for - and 100% means on target whatever the target
                is, so the column reads straight down.
              -->
              <th class="r thr-ach">KPI Achievement</th>
              <!--
                Reading now sits next to KPI Achievement on purpose: the two
                are the same measurement said two ways, so reading across
                from the rate to the achievement is one glance rather than a
                jump over the Definition button.
              -->
              <th class="r">Reading now</th>
              <th class="thr-doc">Definition</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="8" class="empty">Loading&#x2026;</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-head">Database</div>
      <dl class="kv" id="dbInfo"></dl>
    </div>

    <!--
      THE REBUILD BUTTON IS GONE, AND THAT IS THE GOOD NEWS.

      In Apps Script KPI 1 is precomputed into a KPI_MONTHLY tab, because
      scoring twenty thousand spreadsheet rows on every page load is too
      slow. The cost of a cache is that it can be stale, and this card
      existed to fix that: edit the roster and nothing changes until the
      figures are worked out again.

      PORT-INVENTORY records the decision and the measurement - a GROUP BY
      over an indexed table scored 25,808 tickets across 11 months in 200ms
      - so there is no cache here, nothing to recompute, and nothing that
      can go stale. The card stays to say so, because somebody who used the
      old screen will come looking for the button and deserves to be told
      where it went rather than finding a gap.

      STILL ADMIN-ONLY, as the original card was. It is the same audience:
      the people who could press the button are the people who would go
      looking for it. A viewer never had it and is not now shown the
      explanation of a control they never saw.
    -->
    <div class="card" id="rebuildCard" data-admin-only>
      <div class="card-head">Rebuilding KPI 1</div>
      <div class="notice-inline">
        <p id="rebuildWhy"></p>
        <p class="coverage-note" id="rebuildWhen" hidden></p>
      </div>
    </div>
  </section>

</div>


<script>
(function () {
  'use strict';

  const TOKEN_STORE = 'easToken';
  const ALL = 'ALL';

  const state = { token: '', user: null, boot: null, kpi: null, kpi2: null };


  /** Every call, with the dot in the top bar told about it. */
  async function api(method, path, body) {
    try {
      return await request(method, path, body);
    } catch (err) {
      if (String(err && err.message) !== 'signed out') easShell.setLive(false);
      throw err;
    }
  }

  async function request(method, path, body) {
    const opts = { method: method, headers: {} };
    if (state.token) opts.headers.Authorization = 'Bearer ' + state.token;
    if (body !== undefined) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    const res = await fetch(path, opts);
    if (res.status === 401) {
      signedOut('Your session has ended.');
      throw new Error('signed out');
    }
    let data = null;
    try { data = await res.json(); } catch (e) { /* not JSON */ }
    if (!res.ok || !data || data.ok === false) {
      throw new Error((data && data.error) ||
                      ('the server answered ' + res.status));
    }
    return data;
  }

  const get = function (path) { return api('GET', path); };


  // =======================================================================
  // SIGNING IN
  // =======================================================================

  function signedOut(why) {
    state.token = '';
    state.user = null;
    state.boot = null;
    try { sessionStorage.removeItem(TOKEN_STORE); } catch (e) { /* fine */ }
    document.getElementById('page').hidden = true;
    easShell.signedOut();
    document.getElementById('signinCard').hidden = false;
    document.getElementById('signinWhy').textContent = why || '';
  }

  async function signIn() {
    const button = document.getElementById('signinGo');
    const why = document.getElementById('signinWhy');
    why.textContent = '';
    button.disabled = true;
    try {
      const out = await api('POST', '/api/login', {
        employee_id: document.getElementById('employeeId').value.trim(),
        password: document.getElementById('password').value
      });
      state.token = out.token;
      state.user = out.user;
      try { sessionStorage.setItem(TOKEN_STORE, out.token); } catch (e) { /* fine */ }
      document.getElementById('password').value = '';
      await start();
    } catch (err) {
      why.textContent = err.message;
    } finally {
      button.disabled = false;
    }
  }


  async function start() {
    const boot = await get('/api/summary/boot');
    state.boot = boot;

    document.getElementById('signinCard').hidden = true;
    easShell.signedIn({
      role: boot.role,
      username: boot.username ||
                (state.user ? state.user.employee_id : boot.role),
      appName: boot.appName,
      appVersion: boot.appVersion,
      mustChange: boot.mustChange
    });
    document.getElementById('page').hidden = false;

    applyRole();

    // Drawn from the boot straight away, so the screen is useful before the
    // two readings arrive.
    renderKpiTable(boot);
    renderDatabase(boot);
    renderRebuild(boot);

    await loadReadings();
  }


  /**
   * What a viewer does not see.
   *
   * SCOPED TO #page, not the document, for the reason uploads.html gives:
   * the shell is outside #page and has its own role handling, and a
   * document-wide sweep would reach into it.
   */
  function applyRole() {
    const admin = Boolean(state.boot && state.boot.canAdmin);
    document.getElementById('page')
      .querySelectorAll('[data-admin-only]').forEach(function (el) {
        el.hidden = !admin;
      });
  }


  /**
   * The two live indicators' current figures, for the Reading now column.
   *
   * In the original these are already in memory, because the KPI screens
   * are the same page. Here they are not, so the screen asks - over all
   * periods, which is what "Reading now" means on a screen with no period
   * picker on it.
   *
   * NEITHER CALL IS ALLOWED TO TAKE THE SCREEN DOWN. An indicator whose
   * figures cannot be read shows a dash in two columns; the targets, the
   * bands and the database card are all still worth having.
   */
  async function loadReadings() {
    /*
      KPI 1 IS ASKED FOR IN THE STANDARD THE TOGGLE IS ON, not the default.
      Without it the figure comes back scored against the policy's 90% while
      the row beside it prints the EAS target of 99.50%, and App.html names
      that exact failure: "97.50% shown in red against a target of 90%".
      The row takes its target from activeDefinition, so the two have to be
      asked the same question.
    */
    const [one, two] = await Promise.all([
      get('/api/kpi1?month=' + ALL + '&standard=' +
          encodeURIComponent(currentStandard()))
        .catch(function () { return null; }),
      get('/api/kpi2?scope=' + ALL).catch(function () { return null; })
    ]);
    state.kpi = one;
    state.kpi2 = two;
    updateKpiTable();
  }


  /**
   * Repaints the readings, which are the only cells that move.
   *
   * The table is built from the bootstrap, before either indicator has
   * been read, so every live KPI would say "no period loaded" forever
   * without this. Row by row rather than a fresh table: rebuilding would
   * throw away and redraw the bands, the layer and the Definition button,
   * none of which can have changed, and would take the policy button with
   * them.
   */
  function updateKpiTable() {
    ((state.boot && state.boot.kpiList) || []).forEach(function (kpi) {
      const row = document.querySelector('#settingsTable tbody tr[data-key="' +
        cssEscape(kpi.id) + '"]');
      if (row) row.innerHTML = kpiRowBody(kpi);
    });
  }


  // =======================================================================
  // THE THRESHOLDS TABLE
  // =======================================================================

  function renderKpiTable(boot) {
    const body = document.querySelector('#settingsTable tbody');
    if (!body) return;

    const list = (boot && boot.kpiList) || [];
    body.innerHTML = '';

    list.forEach(function (kpi) {
      const row = document.createElement('tr');
      row.className = 'thr-row';
      row.dataset.key = kpi.id;
      row.innerHTML = kpiRowBody(kpi);
      body.appendChild(row);
    });

    const live = list.filter(function (k) { return k.active; }).length;
    setText('kpiTableNote', list.length + ' indicators \u00b7 ' + live +
      ' live \u00b7 ' + (list.length - live) + ' awaiting a pipeline');

    renderPolicyDoc(boot);
  }


  /**
   * The approved policy, as a button beside the thresholds heading.
   *
   * CALLED WITH THE DOCUMENT'S TITLE ON IT, not its reference number. The
   * table is a list of targets, and the question a reader has is "who
   * decided these" - which "Key Performance Indicator (KPI) Policy"
   * answers and "TVL-KPI-001 v1.0" does not. The reference and the version
   * go on the hover, where somebody checking which revision they are
   * looking at will find them.
   *
   * THE SPREADSHEET LAYER IS GONE. In Apps Script the address came from
   * kpiLinks.POLICY first - the KPI_CONFIG tab's Document Link cell - so
   * that a dead link could be corrected without a deployment, and from
   * Config.gs only as the value a fresh install starts with. There is no
   * KPI_CONFIG tab here, and the reason for the layer went with it:
   * api/kpi-config.js is edited and the server restarted, which is a
   * minute's work and waits on nobody. The ORDER of preference is kept all
   * the same, in docTarget below, so a table of overrides can be added
   * later without a line changing on this screen.
   */
  function renderPolicyDoc(boot) {
    const el = document.getElementById('kpiPolicyDoc');
    if (!el) return;

    const p = (boot && boot.kpiPolicy) || {};
    const url = linkOf(p.url);

    // No address, no button. A document control that opens nothing is
    // worse than no control: it is a thing people press once.
    if (!url || !p.title) { el.hidden = true; return; }

    el.href = url;
    el.innerHTML =
      '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" ' +
        'stroke="currentColor" stroke-width="1.7" stroke-linecap="round" ' +
        'stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M6.5 2.5h7l5 5v12a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 ' +
          '5.5 19.5v-15.5A1.5 1.5 0 0 1 7 2.5z"/>' +
        '<path d="M13.5 2.5v5h5"/><path d="M8.5 13h7M8.5 16h4.5"/>' +
      '</svg>' +
      '<span>' + escapeHtml(p.title) + '</span>';

    el.title = [
      p.title,
      p.id ? p.id + (p.version ? ' v' + p.version : '') : '',
      p.effective ? 'effective ' + p.effective : ''
    ].filter(Boolean).join(' \u00b7 ');

    el.hidden = false;
  }


  /**
   * One indicator's row.
   *
   * KPI 1 is shown AS IT IS BEING SCORED - through activeDefinition, so the
   * row agrees with whichever standard the KPI 1 screen is set to rather
   * than always printing the policy's.
   */
  function kpiRowBody(raw) {
    const kpi = activeDefinition(raw);
    const actual = currentValueFor(kpi);
    const band = actual === null ? '' : bandOf(actual, kpi);

    // 'Layer 3: Service Requests' with an L3 badge beside it reads the
    // layer twice. The badge carries the number, the text carries the name.
    const layerName = String(kpi.slaLayer || '')
      .replace(/^Layer\s*\d+\s*:\s*/, '');

    return '<td class="thr-no"><span class="thr-badge' +
        (kpi.active ? ' is-live' : '') + '">' +
        escapeHtml(kpiNumber(kpi.id)) + '</span></td>' +

      '<td class="thr-what">' +
        '<span class="thr-name">' + escapeHtml(kpi.name) +
          (kpi.active ? '<span class="pill g">LIVE</span>'
                      : '<span class="pill a">PENDING</span>') +
          /*
            AN INTERNAL MEASURE IS MARKED. Three of these are the approved
            policy's; this one is the team's own. An unmarked measure
            sitting beside three approved indicators is the table claiming
            something about it that is not true.
          */
          (kpi.policy === false
            ? '<span class="pill i" title="' + escapeHtml(internalNote()) +
              '">INTERNAL</span>'
            : '') +
        '</span>' +
        '<span class="thr-formula">' +
          escapeHtml(kpi.formula || '\u2014') + '</span>' +
      '</td>' +

      '<td class="r"><span class="thr-target">' + kpi.target +
        '<i>' + escapeHtml(kpi.unit) + '</i></span></td>' +

      '<td class="thr-bands">' + bandBar(kpi) + '</td>' +

      '<td class="thr-layer" title="' + escapeHtml(kpi.slaLayer || '') + '">' +
        '<span class="thr-lyr">L' +
        escapeHtml(String(kpi.layer || '?')) + '</span> ' +
        escapeHtml(layerName) +
      '</td>' +

      '<td class="r thr-ach">' + achievementCell(kpi) + '</td>' +

      '<td class="r thr-now">' +
        (actual === null
          ? '<span class="thr-read is-none">' +
            (kpi.active ? 'no period loaded' : 'awaiting data') + '</span>'
          : '<span class="thr-read" style="color:' + bandColour(band) + '">' +
              fmt(actual) + escapeHtml(kpi.unit) + '</span>' +
            '<small>' + escapeHtml(kpiPeriodLabel(kpi)) + '</small>') +
      '</td>' +

      '<td class="thr-doc">' + policyLink(kpi) + '</td>';
  }


  /**
   * The three bands as one bar, plus the numbers under it.
   *
   * Drawn in proportion across the whole 0-100 scale the percentage lives
   * on, which is what makes the widths mean something: on every one of
   * these indicators nearly the entire range is a breach and the window you
   * have to land in is a sliver at the top, and that is the thing worth
   * seeing before any number is read. Each segment gets a floor of a few
   * pixels so none of them vanishes - a band you cannot see reads as a band
   * that does not exist - which does cost the thinnest slivers their exact
   * width. The figures are printed underneath, so nothing rests on the
   * drawing.
   */
  function bandBar(kpi) {
    const red = Math.max(0, kpi.yellowFloor);
    const amber = Math.max(0, kpi.target - kpi.yellowFloor);
    const green = Math.max(0, 100 - kpi.target);

    const seg = function (cls, grow, label) {
      return '<span class="thr-seg ' + cls + '" style="flex-grow:' + grow +
        '" title="' + escapeHtml(label) + '"></span>';
    };

    const top = round2(kpi.target - 0.01);

    return '<span class="thr-bar">' +
        seg('r', red, 'Red \u00b7 below ' + kpi.yellowFloor + kpi.unit) +
        seg('a', amber, 'Yellow \u00b7 ' + kpi.yellowFloor + ' to ' + top +
            kpi.unit) +
        seg('g', green, 'Green \u00b7 ' + kpi.target + kpi.unit + ' and above') +
      '</span>' +
      '<span class="thr-chips">' +
        '<b class="thr-chip g">&ge; ' + kpi.target + kpi.unit + '</b>' +
        '<b class="thr-chip a">' + kpi.yellowFloor + ' \u2013 ' + top +
          kpi.unit + '</b>' +
        '<b class="thr-chip r">&lt; ' + kpi.yellowFloor + kpi.unit + '</b>' +
      '</span>';
  }


  function achievementCell(kpi) {
    const achievement = currentAchievementFor(kpi);
    const actual = currentValueFor(kpi);

    if (achievement === null || actual === null) {
      return '<span class="thr-ach-none">\u2014</span>';
    }

    return '<span class="thr-ach-val" style="color:' +
             bandColour(bandOf(actual, kpi)) + '">' + fmt(achievement) +
             '%</span>' +
           '<small>100% = on target</small>';
  }


  /**
   * Which document this indicator's Definition button opens, and what to
   * call it. Three places are tried, best first.
   *
   *   1  policyUrl, this indicator's own definition sheet
   *   2  the approved policy PDF, which defines all three policy KPIs
   *   3  the Drive folder they all live in
   *
   * Apps Script tried four, the KPI_CONFIG tab's Document Link cell first;
   * see renderPolicyDoc on where that one went. The folder stays last
   * because opening the right PLACE beats a dead button, and a folder's
   * address survives the files inside it being replaced - which is exactly
   * what happens when a PDF is corrected and re-uploaded.
   *
   * KPI 1's two standards come from two different documents, which is why
   * this reads policyUrl off the ACTIVE definition rather than off the KPI:
   * the row is scored against one of them and must cite that one.
   */
  function docTarget(kpi) {
    const p = (state.boot && state.boot.kpiPolicy) || {};
    const name = p.id ? p.id + ' v' + (p.version || '')
                      : 'the approved KPI policy';

    const own = linkOf(kpi.policyUrl);
    if (own) {
      return { url: own, label: 'PDF',
               what: 'Open the definition document for ' + kpi.name };
    }
    const policyDoc = linkOf(p.url);
    if (policyDoc) {
      return { url: policyDoc, label: 'PDF',
               what: 'Open ' + name + ', which defines ' + kpi.name };
    }
    const folder = linkOf(p.folderUrl);
    if (folder) {
      return { url: folder, label: 'Folder',
               what: kpi.name + ' has no document of its own linked yet. ' +
                     'Opens the folder in Drive where the KPI documents ' +
                     'are kept.' };
    }
    return null;
  }


  /**
   * The button to the definition document for one indicator.
   *
   * WITH NOTHING TO OPEN AT ALL the button is still drawn, greyed, saying
   * so. Leaving the cell empty would read as "this indicator has no
   * definition document", which is the opposite of true - it has one,
   * nobody has linked it yet.
   */
  function policyLink(kpi) {
    const target = docTarget(kpi);

    if (!target) {
      return '<span class="doc-btn is-off" title="No document linked yet ' +
        '\u2014 set policyUrl for this indicator in api/kpi-config.js">' +
        'Not linked</span>';
    }

    return '<a class="doc-btn' +
      (target.label === 'Folder' ? ' is-folder' : '') +
      '" href="' + escapeHtml(target.url) + '" ' +
      'target="_blank" rel="noopener noreferrer" ' +
      'title="' + escapeHtml(target.what) + '">' +
      '<svg viewBox="0 0 16 16" aria-hidden="true">' +
        (target.label === 'Folder'
          ? '<path d="M1.8 4.1a1 1 0 0 1 1-1h3.1l1.4 1.6h6.9a1 1 0 0 1 1 1v6' +
            '.9a1 1 0 0 1-1 1H2.8a1 1 0 0 1-1-1z"/>'
          : '<path d="M9.4 1.9H4.2a1.2 1.2 0 0 0-1.2 1.2v9.8a1.2 1.2 0 0 0 1' +
            '.2 1.2h7.6a1.2 1.2 0 0 0 1.2-1.2V5.5z"/>' +
            '<path d="M9.4 1.9v3.6H13"/>') +
      '</svg>' + target.label + '</a>';
  }


  /**
   * An address, or nothing.
   *
   * Anything that is not plainly http(s) is refused. The original refused
   * them twice - once in readKpiConfigLinks on the server, once on the
   * value that became an href - and this is the lock that mattered, since
   * it is the one next to the assignment.
   */
  function linkOf(value) {
    const url = String(value == null ? '' : value).trim();
    return /^https?:\/\//i.test(url) ? url : '';
  }


  // =======================================================================
  // WHAT THE FIGURES SAY RIGHT NOW
  // =======================================================================

  /**
   * KPI 1 as it is being scored, which is not always the policy's standard.
   *
   * The KPI 1 screen's toggle is remembered in sessionStorage, and this
   * screen reads the same key - so the target in this table and the figure
   * on that screen cannot disagree.
   */
  function activeDefinition(kpi) {
    if (!kpi || kpi.id !== 'KPI1') return kpi;
    const list = (state.boot && state.boot.kpi1Standards) || [];
    return list.filter(function (k) {
      return k.standard === currentStandard();
    })[0] || kpi;
  }

  function currentStandard() {
    try {
      const saved = JSON.parse(sessionStorage.getItem('easKpi1Filters') || '{}');
      return saved.fKpi1Standard || 'COMPANY';
    } catch (e) {
      return 'COMPANY';
    }
  }

  /**
   * Read from the server's own figure rather than recomputed from the rate,
   * so this column and that indicator's screen can never round differently.
   */
  function currentAchievementFor(kpi) {
    if (kpi.id === 'KPI1' && state.kpi && state.kpi.hasData && state.kpi.total) {
      return state.kpi.total.achievement;
    }
    if (kpi.id === 'KPI2' && state.kpi2 && state.kpi2.hasData &&
        state.kpi2.total) {
      return state.kpi2.total.achievement;
    }
    return null;
  }

  function currentValueFor(kpi) {
    if (kpi.id === 'KPI1' && state.kpi && state.kpi.hasData && state.kpi.total) {
      return state.kpi.total.rate;
    }
    if (kpi.id === 'KPI2' && state.kpi2 && state.kpi2.hasData &&
        state.kpi2.total) {
      return state.kpi2.total.rate;
    }
    return null;
  }

  /** Which band a reading falls in, for a KPI's own thresholds. */
  function bandOf(value, kpi) {
    if (value >= kpi.target) return 'GREEN';
    return value >= kpi.yellowFloor ? 'YELLOW' : 'RED';
  }

  /**
   * The band colours, taken from the chart layer rather than written out.
   *
   * NOT A SECOND COPY. kpi-charts.js owns them, for the reason its own
   * header gives - "three copies of a colour is three chances for one chart
   * to disagree with another about what GREEN means" - and this screen
   * paints the same three bands as figures and chips. It loads that file
   * for this one function and draws no chart at all.
   *
   * These are deliberately hex and not the stylesheet's --green / --amber,
   * because the yellow is not the same yellow: App.html notes that the
   * amber the text pills use "has to be dark enough to read as text on a
   * pale chip; as a large solid fill it just looks brown", so a true yellow
   * is used wherever the colour is the whole signal. In this table it is.
   */
  function bandColour(band) {
    const charts = window.kpiCharts;
    return charts ? charts.bandColour(band) : '#8496a8';
  }

  /**
   * What period the Reading now column is over.
   *
   * The original read this off the KPI screens' own period controls,
   * because the table shared a page with them. There are no controls here -
   * the screen asks for every period on purpose, since a figure on a page
   * with no period picker on it can only honestly mean "overall".
   */
  function kpiPeriodLabel(kpi) {
    return kpi.id === 'KPI2' ? 'all quarters' : 'all months';
  }

  /** 'KPI1' -> '1', for the badge at the start of the row. */
  function kpiNumber(id) {
    const found = String(id || '').match(/(\d+)/);
    return found ? found[1] : String(id || '?').slice(0, 2);
  }

  /**
   * What the INTERNAL mark means, in one sentence, naming the document it
   * is not in. Built from the bootstrap rather than written out, so a new
   * version of the policy changes this wherever it appears by changing one
   * file.
   */
  function internalNote() {
    const p = (state.boot && state.boot.kpiPolicy) || {};
    const doc = [p.id, p.version ? 'v' + p.version : '']
      .filter(Boolean).join(' ');
    return 'Measured by the EAS team for its own use. It is not one of the ' +
      'three indicators in ' + (doc || 'the approved KPI policy') +
      ' and is not reported against it.';
  }


  // =======================================================================
  // THE DATABASE CARD
  // =======================================================================

  /**
   * What is ACTUALLY stored, beside what the upload history CLAIMS.
   *
   * App.html: "When the two disagree this is the screen that says so
   * plainly instead of leaving it to be inferred from an empty dashboard."
   * So uploads logged with nothing stored is printed in red rather than
   * left for somebody to notice.
   */
  /**
   * Uploads logged with nothing stored, which is the disagreement this card
   * exists to show. It is the state a failed import leaves behind: the run
   * is in the log, the rows never landed, and every dashboard is empty with
   * no explanation anywhere.
   *
   * ZERO AND ZERO IS NOT THAT. It is a fresh install, and marking it would
   * put a red zero on the screen on day one - which teaches people that the
   * red does not mean anything, and then it does not.
   */
  function nothingStored(stored, logged) {
    return !Number(stored) && Number(logged) > 0;
  }


  function renderDatabase(boot) {
    const info = document.getElementById('dbInfo');
    if (!info) return;

    const stats = boot.stats || {};
    const months = (boot.availableMonths || []).length;
    const fMonths = (boot.feedbackMonths || []).length;
    const quarters = (boot.feedbackQuarters || []).length;

    const warn = function (bad, text) {
      return bad
        ? '<span style="color:var(--red);font-weight:600">' + text + '</span>'
        : text;
    };

    info.innerHTML =
      '<dt>Version</dt><dd>' + escapeHtml(boot.appVersion || '') + '</dd>' +
      '<dt>Sections</dt><dd>' + (boot.sections || []).length + '</dd>' +
      '<dt>KPI 1 \u00b7 tickets stored</dt><dd>' +
        warn(nothingStored(stats.tickets, stats.ticketUploads),
             count(stats.tickets || 0)) + '</dd>' +
      '<dt>KPI 1 \u00b7 months</dt><dd>' + months + '</dd>' +
      '<dt>KPI 1 \u00b7 uploads logged</dt><dd>' +
        count(stats.ticketUploads || 0) + '</dd>' +
      '<dt>KPI 2 \u00b7 responses stored</dt><dd>' +
        warn(nothingStored(stats.feedback, stats.feedbackUploads),
             count(stats.feedback || 0)) + '</dd>' +
      '<dt>KPI 2 \u00b7 quarters</dt><dd>' +
        quarters + ' (' + fMonths + ' month' + (fMonths === 1 ? '' : 's') +
        ')</dd>' +
      '<dt>KPI 2 \u00b7 uploads logged</dt><dd>' +
        count(stats.feedbackUploads || 0) + '</dd>' +
      (boot.orphanedFeedback
        ? '<dt>Orphaned responses</dt><dd>' +
          warn(true, count(boot.orphanedFeedback)) + '</dd>'
        : '') +
      backupRows(boot.backup, warn);
  }


  /**
   * How the backups are doing.
   *
   * `on` IS DECLARED, NOT DETECTED, and the Backups row says what that
   * means: nothing here can ask Windows Task Scheduler whether the nightly
   * task exists, so BACKUP_SCHEDULED in api/.env is set by hand once it has
   * been created. Claiming a nightly backup that is not happening is
   * exactly what this row then complains about.
   */
  function backupRows(backup, warn) {
    if (!backup) {
      return '<dt>Backups</dt><dd>' +
             warn(true, 'Cannot be read \u2014 see api/backup.js') + '</dd>';
    }

    const when = backup.last ? whenText(backup.last) : 'none yet';

    return '<dt>Backups</dt><dd>' +
             (backup.on
               ? count(backup.count) + ' kept, daily'
               : warn(true, 'Not switched on \u2014 see BACKUP_SCHEDULED in ' +
                            'api/.env')) +
           '</dd>' +
           '<dt>Last backup</dt><dd>' +
             (backup.on && backup.stale
               ? warn(true, escapeHtml(when) + ' \u2014 overdue')
               : escapeHtml(when)) +
           '</dd>';
  }


  /**
   * Where the Rebuild button went.
   *
   * It is not missing, it is unnecessary, and those are different things to
   * be told. See the comment on the card above.
   */
  function renderRebuild(boot) {
    const stats = (boot && boot.stats) || {};
    setHtml('rebuildWhy',
      '<b>There is nothing to rebuild.</b> In the spreadsheet version KPI 1 ' +
      'is worked out once and stored, so an edit to the roster or the module ' +
      'map changed nothing until the figures were built again \u2014 and a ' +
      'month whose rebuild was missed showed stale numbers. This version ' +
      'scores the tickets directly on every read, so an edit shows up at ' +
      'once and no figure can go stale. KPI 2 always worked this way.');

    const box = document.getElementById('rebuildWhen');
    if (!box) return;
    box.hidden = false;
    box.innerHTML = stats.tickets
      ? 'Scored live from <b class="part">' + count(stats.tickets) +
        ' tickets</b> every time this screen or a dashboard is opened.'
      : 'Nothing is stored yet \u2014 upload an ITSM export and the figures ' +
        'appear immediately.';
  }


  // =======================================================================
  // SMALL THINGS
  // =======================================================================

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /** Two decimals, matching how the policy states its thresholds. */
  function fmt(n) {
    return (Math.round((Number(n) || 0) * 100) / 100).toFixed(2);
  }

  /** CSS.escape, for the browsers that have it, and a fallback for the rest. */
  function cssEscape(value) {
    const text = String(value == null ? '' : value);
    return (window.CSS && window.CSS.escape) ? window.CSS.escape(text)
                                             : text.replace(/["\\]/g, '\\$&');
  }

  function count(n) {
    return (Number(n) || 0).toLocaleString('en-US');
  }

  function round2(n) {
    return Math.round((Number(n) || 0) * 100) / 100;
  }

  function whenText(iso) {
    if (!iso) return '\u2014';
    const at = new Date(iso);
    if (isNaN(at.getTime())) return String(iso);
    const pad = function (x) { return (x < 10 ? '0' : '') + x; };
    return at.getFullYear() + '-' + pad(at.getMonth() + 1) + '-' +
           pad(at.getDate()) + ' ' + pad(at.getHours()) + ':' +
           pad(at.getMinutes());
  }

  function setText(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  function setHtml(id, html) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = html;
  }

  function bind(id, event, handler) {
    const el = document.getElementById(id);
    if (el) el.addEventListener(event, handler);
  }


  // =======================================================================
  // STARTUP
  // =======================================================================

  document.addEventListener('DOMContentLoaded', function () {
    easShell.mount({ view: 'settings' });

    bind('signinGo', 'click', function () { signIn(); });
    bind('password', 'keydown', function (e) { if (e.key === 'Enter') signIn(); });
    bind('employeeId', 'keydown', function (e) { if (e.key === 'Enter') signIn(); });
    bind('signOut', 'click', function () { signedOut(''); });

    try { state.token = sessionStorage.getItem(TOKEN_STORE) || ''; }
    catch (e) { state.token = ''; }

    if (!state.token) { signedOut(''); return; }

    start().catch(function (err) {
      if (String(err && err.message) === 'signed out') return;
      signedOut('Could not open the screen \u2014 ' +
                (err && err.message ? err.message : String(err)));
    });
  });


  // For the browser suite, which drives this page against the real server.
  window.__summaryScreen = {
    bandOf: bandOf,
    bandBar: bandBar,
    kpiNumber: kpiNumber,
    nothingStored: nothingStored,
    renderDatabase: renderDatabase,
    currentStandard: currentStandard,
    activeDefinition: activeDefinition,
    docTarget: docTarget,
    policyLink: policyLink,
    linkOf: linkOf,
    state: state
  };
}());
</script>
</body>
</html>
